<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Admin | 실시간 학습 리포트 시스템</title>
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'], jua: ['Jua', 'sans-serif'], nunito: ['Nunito', 'sans-serif'] },
                    colors: { bridge: { mint: '#91D3B4', charcoal: '#363431', bg: '#F9FAFB', gold: '#CBAE75' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: var(--bridge-bg); font-family: 'Pretendard', sans-serif; }
        .table-container { animation: fadeIn 0.6s var(--ease-silk); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 엑셀 느낌의 테이블 스타일 */
        th { background-color: #F3F4F6; color: #4B5563; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:hover { background-color: #F9FAFB; }
    </style>
</head>
<body class="text-bridge-charcoal">

    <nav class="bg-bridge-charcoal text-white h-[70px] flex items-center px-8 justify-between shadow-lg sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-black font-nunito">BRIDGE <span class="text-bridge-mint">HQ TOWER</span></h1>
        </div>
        <div class="flex items-center gap-6">
            <span id="admin-info" class="text-xs font-bold text-gray-400"></span>
            <button onclick="ExportEngine.toCSV()" class="bg-bridge-mint hover:bg-opacity-90 text-bridge-charcoal px-5 py-2 rounded-full text-xs font-black flex items-center gap-2 transition-all">
                <i class="fa-solid fa-file-excel"></i> 전체 리포트 다운로드
            </button>
            <button onclick="auth.signOut()" class="text-xs font-bold opacity-60 hover:opacity-100">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto p-8">
        <header class="mb-10">
            <h2 class="text-3xl font-black font-jua">실시간 원생별 학습 리포트</h2>
            <p class="text-gray-500 mt-2 font-medium">전국 가맹점에서 제출된 모든 데이터를 아이별, 날짜별로 자동 정렬합니다.</p>
        </header>

        <div class="bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden table-container">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="px-8 py-5 font-black">Student ID (아이디)</th>
                            <th class="px-6 py-5 font-black">작성일자</th>
                            <th class="px-6 py-5 font-black">요일</th>
                            <th class="px-6 py-5 font-black">진도 (Unit)</th>
                            <th class="px-6 py-5 font-black text-center">AI 그림 분석</th>
                            <th class="px-6 py-5 font-black">발음 정확도</th>
                            <th class="px-6 py-5 font-black">학습 내용 (Transcript)</th>
                        </tr>
                    </thead>
                    <tbody id="report-body" class="text-[14px]">
                        </tbody>
                </table>
            </div>
            
            <div id="no-data" class="hidden py-40 text-center text-gray-300">
                <i class="fa-solid fa-folder-open text-6xl mb-4"></i>
                <p class="font-bold">아직 제출된 학습 리포트가 없습니다.</p>
            </div>
        </div>
    </main>

    <script>
        // 1. 파이어베이스 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyACTwFv5V9eXKKaQODzZokBkwGk8mB8AAk",
            authDomain: "bridge-academy-6d6a9.firebaseapp.com",
            projectId: "bridge-academy-6d6a9",
            storageBucket: "bridge-academy-6d6a9.firebasestorage.app",
            messagingSenderId: "581314243350",
            appId: "1:581314243350:web:57897ed73d787eb02efe37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allDataForExport = []; // 엑셀 출력을 위한 전역 변수

        // 2. 인증 체크 및 시작
        auth.onAuthStateChanged(user => {
            if (!user) {
                location.href = 'login.html';
            } else {
                document.getElementById('admin-info').innerText = `Admin: ${user.email}`;
                loadRealtimeReport();
            }
        });

        // 3. 실시간 리포트 로드
        function loadRealtimeReport() {
            const tableBody = document.getElementById('report-body');
            const noData = document.getElementById('no-data');

            db.collection("student_drawings")
              .orderBy("timestamp", "desc")
              .onSnapshot(async (snapshot) => {
                  if (snapshot.empty) {
                      noData.classList.remove('hidden');
                      return;
                  }
                  noData.classList.add('hidden');
                  tableBody.innerHTML = '';
                  allDataForExport = [];

                  // 요일 배열 (한글)
                  const weekDays = ['일', '월', '화', '수', '목', '금', '토'];

                  // [KIBO 핵심 로직] UID를 읽기 쉬운 이름이나 ID로 변환하는 작업 포함
                  for (const doc of snapshot.docs) {
                      const data = doc.data();
                      
                      // 1. Student ID 정리 (UID가 아닌 이메일 앞자리 사용 권장)
                      // 만약 students 컬렉션에 이름 정보가 있다면 나중에 병합 가능합니다.
                      const rawID = data.studentID || "Unknown";
                      const cleanID = rawID.split('@')[0].toUpperCase();

                      // 2. 날짜 및 요일 계산
                      let dateStr = "-", dayStr = "-";
                      if (data.timestamp) {
                          const d = data.timestamp.toDate();
                          dateStr = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
                          dayStr = weekDays[d.getDay()] + "요일";
                      }

                      const confidence = data.confidence || 0;
                      
                      // 엑셀용 데이터 저장
                      allDataForExport.push({ cleanID, dateStr, dayStr, page: data.page, confidence, transcript: data.transcript });

                      // 테이블 행 추가
                      const tr = document.createElement('tr');
                      tr.className = "border-b border-gray-50";
                      tr.innerHTML = `
                          <td class="px-8 py-5 font-black text-blue-600">${cleanID}</td>
                          <td class="px-6 py-5 font-medium text-gray-500">${dateStr}</td>
                          <td class="px-6 py-5 font-bold text-gray-400">${dayStr}</td>
                          <td class="px-6 py-5 font-black"><span class="bg-gray-100 px-3 py-1 rounded-md text-[11px]">UNIT P.${data.page || '?'}</span></td>
                          <td class="px-6 py-5 text-center">
                              <img src="${data.image}" class="h-10 w-10 object-contain mx-auto rounded border border-gray-100 shadow-sm" onerror="this.style.display='none'">
                          </td>
                          <td class="px-6 py-5">
                              <div class="flex items-center gap-2">
                                  <div class="w-12 h-1 bg-gray-100 rounded-full overflow-hidden">
                                      <div class="h-full ${confidence > 80 ? 'bg-bridge-mint' : 'bg-yellow-400'}" style="width: ${confidence}%"></div>
                                  </div>
                                  <span class="font-black text-[12px]">${confidence}%</span>
                              </div>
                          </td>
                          <td class="px-6 py-5 text-gray-500 italic max-w-xs truncate" title="${data.transcript}">"${data.transcript || 'N/A'}"</td>
                      `;
                      tableBody.appendChild(tr);
                  }
              });
        }

        // 4. [기보 심사 필살기] 데이터 파일화 추출 엔진
        const ExportEngine = {
            toCSV() {
                if (allDataForExport.length === 0) return alert("추출할 데이터가 없습니다.");

                let csvContent = "\uFEFF"; // 한글 깨짐 방지 BOM
                csvContent += "Student ID,작성일자,요일,진도(Page),발음점수,학습내용\n";

                allDataForExport.forEach(row => {
                    csvContent += `${row.cleanID},${row.dateStr},${row.dayStr},${row.page},${row.confidence},"${row.transcript.replace(/"/g, '""')}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Bridge_Academy_Report_${new Date().toLocaleDateString()}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        };
    </script>
</body>
</html>
