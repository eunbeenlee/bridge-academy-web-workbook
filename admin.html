<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Academy | HQ Admin Control Tower</title>
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'], jua: ['Jua', 'sans-serif'], nunito: ['Nunito', 'sans-serif'] },
                    colors: { bridge: { mint: '#91D3B4', earth: '#7D756D', charcoal: '#363431', bg: '#F4F5F7', gold: '#CBAE75' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: var(--bridge-bg); font-family: 'Pretendard', sans-serif; }
        /* 스크롤바 숨기기 (깔끔한 UI) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #E2E8F0; border-radius: 10px; }
        
        .pulse-live {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .data-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 0.5s ease forwards;
        }
        .data-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-bridge-charcoal">

    <nav class="bg-bridge-charcoal text-white h-[70px] flex items-center px-8 justify-between shadow-lg sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-3 h-3 bg-red-500 rounded-full pulse-live"></div>
            <h1 class="text-xl font-black font-nunito tracking-wide">BRIDGE <span class="text-bridge-mint">HQ TOWER</span></h1>
            <span class="text-[11px] font-bold bg-white/10 px-3 py-1 rounded-full text-bridge-gold ml-2">실시간 통합 관제 시스템</span>
        </div>
        <div class="flex items-center gap-4 text-sm font-bold">
            <span id="admin-email" class="text-gray-300">관리자 확인 중...</span>
            <button onclick="auth.signOut()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-colors text-xs">로그아웃</button>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto p-8">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-bridge-mint/15 text-bridge-mint flex items-center justify-center text-2xl"><i class="fa-solid fa-users"></i></div>
                <div><p class="text-xs font-black text-gray-400 uppercase tracking-wider">오늘의 접속자</p><p class="text-2xl font-black font-nunito mt-1">128</p></div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-bridge-gold/15 text-bridge-gold flex items-center justify-center text-2xl"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <div><p class="text-xs font-black text-gray-400 uppercase tracking-wider">실시간 제출 데이터</p><p id="total-submissions" class="text-2xl font-black font-nunito mt-1">0</p></div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-blue-500/15 text-blue-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-robot"></i></div>
                <div><p class="text-xs font-black text-gray-400 uppercase tracking-wider">AI 분석 처리 건수</p><p class="text-2xl font-black font-nunito mt-1">4,209</p></div>
            </div>
            <div class="bg-bridge-mint rounded-2xl p-6 shadow-sm text-white flex items-center justify-between">
                <div><p class="text-xs font-black uppercase tracking-wider opacity-80">클라우드 서버 상태</p><p class="text-2xl font-black font-nunito mt-1">OPTIMAL</p></div>
                <i class="fa-solid fa-server text-4xl opacity-50"></i>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 min-h-[600px]">
            <div class="flex justify-between items-end mb-8 border-b border-gray-100 pb-4">
                <div>
                    <h2 class="text-2xl font-black text-bridge-charcoal font-jua">Live Submissions 피드</h2>
                    <p class="text-sm font-bold text-gray-400 mt-1">전국 가맹점에서 제출된 원생들의 그림과 음성 데이터가 실시간으로 동기화됩니다.</p>
                </div>
                <div class="flex items-center gap-2 text-xs font-bold text-bridge-mint bg-bridge-mint/10 px-4 py-2 rounded-full">
                    <i class="fa-solid fa-rotate fa-spin"></i> 실시간 연동 중
                </div>
            </div>

            <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-20 text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-gray-200"></i>
                    <p class="font-bold">클라우드 금고에서 실시간 데이터를 불러오는 중입니다...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. 파이어베이스 초기화
        const firebaseConfig = {
            apiKey: "AIzaSyACTwFv5V9eXKKaQODzZokBkwGk8mB8AAk",
            authDomain: "bridge-academy-6d6a9.firebaseapp.com",
            projectId: "bridge-academy-6d6a9",
            storageBucket: "bridge-academy-6d6a9.firebasestorage.app",
            messagingSenderId: "581314243350",
            appId: "1:581314243350:web:57897ed73d787eb02efe37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. 로그인 가드 (관리자만 볼 수 있게)
        auth.onAuthStateChanged(user => {
            if (!user) {
                alert("본사 관리자 로그인이 필요합니다.");
                location.href = 'login.html'; // 로그인 안되어있으면 로그인 창으로 튕김
            } else {
                document.getElementById('admin-email').innerText = `접속 계정: ${user.email}`;
                startRealtimeListener();
            }
        });

        // 3. [기보 핵심 기술] 실시간 데이터 리스너 (onSnapshot)
        function startRealtimeListener() {
            const container = document.getElementById('feed-container');
            const countEl = document.getElementById('total-submissions');

            // student_drawings 컬렉션의 데이터를 시간 역순(최신순)으로 실시간 감시
            db.collection("student_drawings")
              .orderBy("timestamp", "desc")
              .limit(20) // 최신 20개만 보여주기
              .onSnapshot((querySnapshot) => {
                  
                  if (querySnapshot.empty) {
                      container.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400"><p class="font-bold">아직 제출된 데이터가 없습니다.</p></div>`;
                      return;
                  }

                  // 화면 초기화
                  container.innerHTML = '';
                  countEl.innerText = querySnapshot.size; // 총 제출 건수 업데이트

                  // 실시간으로 들어온 데이터 카드 만들기
                  querySnapshot.forEach((doc) => {
                      const data = doc.data();
                      
                      // 시간 계산 로직
                      let timeString = "방금 전";
                      if (data.timestamp) {
                          const date = data.timestamp.toDate();
                          timeString = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}:${date.getSeconds().toString().padStart(2,'0')}`;
                      }

                      // 발음 정확도 시각화 처리
                      const sttScore = data.confidence || 0;
                      let scoreColor = "bg-green-500";
                      if (sttScore < 60) scoreColor = "bg-red-500";
                      else if (sttScore < 80) scoreColor = "bg-yellow-500";

                      // 카드 HTML 조립
                      const card = document.createElement('div');
                      card.className = "data-card bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm flex flex-col";
                      card.innerHTML = `
                          <div class="relative w-full h-48 bg-gray-50 border-b border-gray-100 flex items-center justify-center p-2">
                              ${data.image ? `<img src="${data.image}" class="max-w-full max-h-full object-contain drop-shadow-md rounded-lg" alt="학생 그림">` : '<i class="fa-solid fa-image text-gray-200 text-4xl"></i>'}
                              <div class="absolute top-3 right-3 bg-bridge-charcoal text-white text-[10px] font-black px-3 py-1 rounded-full shadow-md opacity-90">
                                  UNIT P.${data.page || '?'}
                              </div>
                          </div>
                          
                          <div class="p-5 flex-1 flex flex-col">
                              <div class="flex justify-between items-start mb-3">
                                  <div>
                                      <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Student ID</p>
                                      <p class="text-lg font-black text-bridge-charcoal font-nunito leading-tight">${data.studentID || 'Unknown'}</p>
                                  </div>
                                  <div class="text-right">
                                      <span class="text-[10px] font-bold text-gray-400"><i class="fa-regular fa-clock"></i> ${timeString}</span>
                                  </div>
                              </div>

                              <div class="mt-2 bg-bridge-bg p-3 rounded-xl border border-gray-100 flex-1">
                                  <p class="text-[10px] font-black text-bridge-gold uppercase tracking-widest mb-1"><i class="fa-solid fa-microphone-lines"></i> AI Voice Log</p>
                                  <p class="text-sm font-medium text-gray-600 italic leading-snug">"${data.transcript || '(음성 데이터 없음)'}"</p>
                              </div>

                              <div class="mt-4 flex items-center justify-between">
                                  <span class="text-xs font-black text-gray-500 uppercase tracking-wider">발음 정확도</span>
                                  <div class="flex items-center gap-2">
                                      <div class="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                          <div class="h-full ${scoreColor}" style="width: ${sttScore}%"></div>
                                      </div>
                                      <span class="text-xs font-black font-nunito ${sttScore >= 80 ? 'text-bridge-mint' : 'text-gray-500'}">${sttScore}%</span>
                                  </div>
                              </div>
                          </div>
                      `;
                      container.appendChild(card);
                  });
              });
        }
    </script>
</body>
</html>
