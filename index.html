<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Elite Heritage Campus</title>
    
    <!-- 
      ======================================================================
      [Premium Typography Engine]
      Playfair Display for Heritage/Luxury, Noto Sans for UI Precision
      ====================================================================== 
    -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Bridge Academy Premium Design System V35.0]
         * Absolute Single-Focus Theme Engine | Director Lee Yun-ji Edition
         * ======================================================================
         */

        :root {
            /* 1. Quadrant Series Identity Colors (Deepened for Luxury) */
            --bridge-green: #7BB891;    /* Series A: Foundation (Refined) */
            --bridge-gold: #C5A059;     /* Series B: Perspective (Signature) */
            --bridge-blue: #6A9CBE;     /* Series C: Exploration (Refined) */
            --bridge-charcoal: #2D2D34; /* Series D: Innovation & Heritage Base */
            
            /* 2. Universal Base Palette */
            --bridge-taupe: #A39B8E;
            --bridge-light-taupe: #EAE6DF;
            --bridge-bg: #F9FAF9;       /* Ultra-clean off-white background */
            --bridge-paper: #FFFFFF;
            --bridge-border: rgba(45, 45, 52, 0.06);
            --bridge-text-main: #1A1A1E;
            --bridge-text-muted: #888890;
            
            /* 3. Spatial Shadows & Depth Variables */
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.02);
            --shadow-float: 0 30px 60px rgba(0, 0, 0, 0.04);
            --shadow-massive: 0 50px 100px rgba(45, 45, 52, 0.08);
            --glow-gold: 0 15px 35px rgba(197, 160, 89, 0.25);
            
            /* 4. Motion Dynamics & Easing */
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-fast: all 0.3s var(--ease-smooth);
            --transition-slow: all 0.8s var(--ease-lux);
        }

        /* --------------------------------------------------
         * [Global Reset & Institutional Standards]
         * -------------------------------------------------- */
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        html { scroll-behavior: smooth; font-size: 16px; }
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bridge-bg); 
            color: var(--bridge-text-main); 
            line-height: 1.6; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        ::selection { background: var(--bridge-gold); color: #FFF; }

        /* --------------------------------------------------
         * [Gateway System] Elite Membership Protection UI
         * -------------------------------------------------- */
        #access-gateway {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: var(--bridge-charcoal); 
            z-index: 9999;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transition: transform 1.2s var(--ease-lux);
        }
        #access-gateway.unlocked { transform: translateY(-100%); pointer-events: none; }
        #access-gateway.hidden-gate { display: none; }
        
        .gateway-logo-svg {
            width: 120px;
            height: 120px;
            margin-bottom: 40px;
            fill: none;
            stroke: var(--bridge-gold);
            stroke-width: 1.5;
            opacity: 0;
            animation: luxFadeUp 1.2s forwards 0.3s;
        }
        
        .gateway-text { 
            color: var(--bridge-paper); 
            font-family: 'Playfair Display', serif; 
            font-size: 16px; 
            letter-spacing: 14px; 
            opacity: 0; 
            animation: luxFadeUp 1.2s forwards 0.6s; 
            text-transform: uppercase; 
        }
        
        .btn-enter-heritage {
            margin-top: 70px; 
            padding: 24px 90px; 
            background: transparent; 
            border: 1px solid rgba(197, 160, 89, 0.5);
            color: var(--bridge-gold); 
            font-weight: 500; 
            font-size: 13px;
            cursor: pointer; 
            border-radius: 100px;
            letter-spacing: 6px; 
            transition: var(--transition-fast); 
            opacity: 0; 
            animation: luxFadeUp 1.2s forwards 0.9s;
            text-transform: uppercase;
        }
        .btn-enter-heritage:hover { 
            background: var(--bridge-gold); 
            color: #FFF; 
            border-color: var(--bridge-gold);
            box-shadow: var(--glow-gold); 
            transform: translateY(-3px); 
        }

        @keyframes luxFadeUp { 
            0% { opacity: 0; transform: translateY(40px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        /* --------------------------------------------------
         * [Header Architecture] Institutional Branding
         * -------------------------------------------------- */
        header {
            width: 100%; 
            padding: 30px 6%; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1500; 
            border-bottom: 1px solid var(--bridge-border);
            transition: var(--transition-fast);
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 24px;
            cursor: pointer; 
        }
        
        /* Text-based fallback logo if image fails */
        .text-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--bridge-charcoal);
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .text-logo span { color: var(--bridge-green); font-style: italic; }
        
        .branch-divider { width: 1px; height: 24px; background: #E0E0E0; }
        .branch-text { font-size: 11px; font-weight: 700; letter-spacing: 4px; color: var(--bridge-text-muted); text-transform: uppercase; }

        .campus-badge { 
            font-size: 11px; 
            font-weight: 800; 
            letter-spacing: 5px; 
            color: var(--bridge-charcoal); 
            background: var(--bridge-light-taupe);
            padding: 12px 28px; 
            border-radius: 100px; 
            text-transform: uppercase; 
        }

        /* --------------------------------------------------
         * [Hero Stage] The Pinnacle of Inquiry
         * -------------------------------------------------- */
        .hero-stage { 
            padding: 160px 6% 120px; 
            text-align: center; 
            background: radial-gradient(ellipse at top, #FFFFFF 0%, transparent 80%); 
        }
        .hero-stage h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 96px; 
            font-weight: 900; 
            margin-bottom: 30px; 
            letter-spacing: -3px; 
            line-height: 1.05; 
            color: var(--bridge-charcoal); 
        }
        .hero-stage h1 span { color: var(--bridge-green); font-style: italic; }
        .hero-stage p { 
            font-size: 22px; 
            color: var(--bridge-text-muted); 
            font-weight: 300; 
            max-width: 800px; 
            margin: 0 auto 60px; 
            line-height: 1.8; 
        }

        /* --------------------------------------------------
         * [Filter Dock] Quadrant Navigation
         * -------------------------------------------------- */
        .filter-dock { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            margin-bottom: 100px; 
            position: sticky; 
            top: 100px; 
            z-index: 1000; 
            padding: 20px 6%; 
        }
        .filter-btn {
            padding: 18px 45px; 
            border-radius: 100px; 
            border: 1px solid var(--bridge-border);
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            font-weight: 700; 
            font-size: 12px; 
            letter-spacing: 4px; 
            cursor: pointer; 
            transition: var(--transition-fast); 
            box-shadow: var(--shadow-subtle); 
            color: var(--bridge-text-muted); 
            text-transform: uppercase;
        }
        .filter-btn:hover { color: var(--bridge-charcoal); border-color: var(--bridge-taupe); }
        .filter-btn.active { 
            background: var(--bridge-charcoal); 
            color: #FFFFFF; 
            border-color: var(--bridge-charcoal); 
            transform: scale(1.05); 
            box-shadow: var(--shadow-float); 
        }

        /* --------------------------------------------------
         * [ROADMAP STAGE & SEGMENTS]
         * -------------------------------------------------- */
        .roadmap-stage { padding: 0 6% 200px; max-width: 1800px; margin: 0 auto; }
        
        .month-segment { 
            margin-bottom: 250px; 
            opacity: 0; 
            transform: translateY(60px); 
            transition: var(--transition-slow); 
        }
        .month-segment.revealed { opacity: 1; transform: translateY(0); }
        
        .month-anchor { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            margin-bottom: 80px; 
            text-align: center;
        }
        .anchor-tag { 
            font-size: 13px; 
            font-weight: 800; 
            color: var(--bridge-gold); 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin-bottom: 20px;
        }
        .anchor-name { 
            font-family: 'Playfair Display', serif; 
            font-size: 72px; 
            font-weight: 900; 
            line-height: 1; 
            color: var(--bridge-charcoal); 
            letter-spacing: -1px; 
        }
        .anchor-line {
            width: 40px;
            height: 3px;
            background: var(--bridge-charcoal);
            margin-top: 30px;
        }

        /* --------------------------------------------------
         * [ABSOLUTE SINGLE-FOCUS THEME CARD] V35.0
         * - NO BOOK IMAGES AT ALL
         * - ONE MASSIVE CLICKABLE ROW
         * - MINIMAL TEXT LIST FOR BOOKS ON THE RIGHT
         * -------------------------------------------------- */
        .theme-heritage-card { 
            margin-bottom: 80px; 
            background: var(--bridge-paper); 
            border-radius: 40px; 
            box-shadow: var(--shadow-float); 
            border: 1px solid rgba(0,0,0,0.03); 
            position: relative; 
            overflow: hidden; 
            transition: var(--transition-slow);
            cursor: pointer; /* Entire element is a link */
            display: flex; 
            flex-direction: row;
            min-height: 480px;
            text-decoration: none; /* In case wrapped in anchor */
        }
        
        .theme-heritage-card:hover { 
            transform: translateY(-15px) scale(1.01); 
            box-shadow: var(--shadow-massive); 
        }
        
        /* Colored Accent Bar on the Left */
        .card-accent-bar {
            width: 20px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.5s var(--ease-lux);
        }
        .theme-heritage-card.series-A .card-accent-bar { background: var(--bridge-green); }
        .theme-heritage-card.series-B .card-accent-bar { background: var(--bridge-gold); }
        .theme-heritage-card.series-C .card-accent-bar { background: var(--bridge-blue); }
        .theme-heritage-card.series-D .card-accent-bar { background: var(--bridge-charcoal); }
        
        .theme-heritage-card:hover .card-accent-bar { width: 30px; }

        /* --- Left Section: Massive Theme Focus --- */
        .card-main-focus { 
            flex: 6.5; 
            padding: 80px 100px 80px 120px; /* Extra left padding for accent bar */
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            background: #FFF;
        }
        
        .theme-meta-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        .theme-unit-badge { 
            font-size: 12px; 
            font-weight: 900; 
            color: #FFF; 
            background: var(--bridge-charcoal);
            padding: 8px 16px;
            border-radius: 6px;
            text-transform: uppercase; 
            letter-spacing: 4px; 
        }
        .theme-series-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--bridge-text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .theme-h2-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 72px; 
            font-weight: 900; 
            margin-bottom: 30px; 
            color: var(--bridge-text-main); 
            letter-spacing: -2px; 
            line-height: 1.1; 
            transition: color 0.3s;
        }
        
        .theme-question-box { 
            font-size: 28px; 
            font-weight: 300; 
            color: var(--bridge-text-muted); 
            font-family: 'Playfair Display', serif;
            font-style: italic; 
            margin-bottom: 0; 
            line-height: 1.5; 
        }

        .lab-enter-cta { 
            margin-top: 60px; 
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            font-weight: 800;
            color: var(--bridge-charcoal);
            letter-spacing: 4px;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            transition: var(--transition-fast);
            width: max-content;
        }
        .lab-enter-cta svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: transform 0.4s var(--ease-lux);
        }
        .theme-heritage-card:hover .lab-enter-cta { color: var(--bridge-gold); border-bottom-color: var(--bridge-gold); }
        .theme-heritage-card:hover .lab-enter-cta svg { transform: translateX(10px); }

        /* --- Right Section: Clean Text-Only Reading List --- */
        .card-reading-side { 
            flex: 3.5;
            background: var(--bridge-bg); 
            padding: 80px 80px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            border-left: 1px solid var(--bridge-border);
            position: relative;
            z-index: 1;
        }
        .reading-list-title { 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--bridge-text-muted); 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin-bottom: 40px; 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .reading-list-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #E0E0E0;
        }
        
        .reading-item-list { 
            list-style: none; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .reading-item-list li { 
            font-family: 'Playfair Display', serif; 
            font-size: 20px; 
            font-weight: 500;
            color: var(--bridge-text-muted); 
            display: flex; 
            align-items: baseline; 
            gap: 20px;
            transition: var(--transition-fast);
        }
        .reading-item-list li span.num { 
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px; 
            font-weight: 900; 
            color: var(--bridge-charcoal); 
            opacity: 0.3; 
            letter-spacing: 2px;
        }
        /* Hover effect applies to the entire card, lighting up the text */
        .theme-heritage-card:hover .reading-item-list li { color: var(--bridge-text-main); transform: translateX(5px); }
        .theme-heritage-card:hover .reading-item-list li span.num { opacity: 1; color: var(--bridge-gold); }

        /* --------------------------------------------------
         * [AI Vision Engine UI] Built-in robust structure
         * -------------------------------------------------- */
        #vision-scanner-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
            z-index: 3000; flex-direction: column; align-items: center; justify-content: center; 
        }
        .viewport-frame { 
            width: 100%; max-width: 500px; height: 500px; border-radius: 40px; overflow: hidden; 
            border: 1px solid #EAEAEA; box-shadow: var(--shadow-massive); 
            position: relative; background: #000;
        }
        #v-feed { width: 100%; height: 100%; object-fit: cover; }
        .laser-beam { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--bridge-green); box-shadow: 0 0 20px var(--bridge-green); animation: scanBeam 2.5s ease-in-out infinite; }
        @keyframes scanBeam { 0%, 100% { top: 10%; opacity: 0; } 50% { top: 90%; opacity: 1; } }

        .v-controls { display: flex; gap: 20px; margin-top: 60px; }
        .btn-v-scan { padding: 24px 80px; border-radius: 100px; background: var(--bridge-charcoal); color: #FFF; border: none; font-weight: 800; cursor: pointer; letter-spacing: 4px; font-size: 14px; transition: var(--transition-fast); }
        .btn-v-scan:hover { background: var(--bridge-green); transform: translateY(-3px); }

        /* --------------------------------------------------
         * [Institutional Footer]
         * -------------------------------------------------- */
        footer { 
            background: var(--bridge-charcoal); 
            padding: 150px 6% 100px; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .elite-copy { 
            font-size: 12px; 
            color: rgba(255,255,255,0.3); 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            font-weight: 500; 
            margin-top: 60px;
        }

        /* --------------------------------------------------
         * [Responsive Matrix] Mobile & Tablet Polish
         * -------------------------------------------------- */
        @media (max-width: 1400px) {
            .theme-heritage-card { flex-direction: column; min-height: auto; }
            .card-main-focus { padding: 80px 60px 80px 80px; }
            .card-reading-side { border-left: none; border-top: 1px solid #EAEAEA; padding: 60px 80px; background: #FFF; }
            .theme-h2-title { font-size: 64px; }
        }
        @media (max-width: 768px) {
            header { padding: 20px 5%; }
            .text-logo { font-size: 20px; }
            .hero-stage { padding: 120px 5% 80px; }
            .hero-stage h1 { font-size: 48px; }
            .hero-stage p { font-size: 18px; }
            
            .filter-dock { overflow-x: auto; justify-content: flex-start; padding: 20px 5%; margin-bottom: 60px; }
            .filter-btn { padding: 16px 35px; white-space: nowrap; }
            
            .anchor-name { font-size: 48px; }
            
            .card-main-focus { padding: 60px 40px 60px 50px; }
            .card-reading-side { padding: 50px 50px; }
            .theme-h2-title { font-size: 42px; }
            .theme-question-box { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ======================================================================
         [GATEWAY] Absolute Membership Access
         ====================================================================== -->
    <div id="access-gateway">
        <!-- SVG Lock Icon for luxury feel -->
        <svg class="gateway-logo-svg" viewBox="0 0 24 24">
            <path d="M12 2L19 9L22 15L12 22L2 15L5 9L12 2Z" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
        <div class="gateway-text">PRIVATE MEMBERSHIP ACCESS</div>
        <button class="btn-enter-heritage" onclick="HeritageCore.unlock()">ENTER HERITAGE</button>
    </div>

    <!-- ======================================================================
         [HEADER] Institutional Identity
         ====================================================================== -->
    <header>
        <div class="brand-container" onclick="HeritageCore.refresh()">
            <div class="text-logo">Bridge<span>Academy</span></div>
            <div class="branch-divider"></div>
            <div class="branch-text">Heritage Campus</div>
        </div>
        <div class="campus-badge">QUADRANT 2026</div>
    </header>

    <!-- ======================================================================
         [MAIN APPLICATION ROOT]
         ====================================================================== -->
    <main id="campus-root" style="display: none;">
        
        <!-- Strategy Entrance -->
        <section class="hero-stage">
            <h1>Quadrants of <span>Excellence</span></h1>
            <p>Direct from North American Private Boarding Standards. Experience 24 Master Themes designed purely for profound intellectual inquiry.</p>
        </section>

        <!-- Quadrant Filters -->
        <nav class="filter-dock">
            <button id="q-all" class="filter-btn active" onclick="HeritageUI.filter('ALL')">Full Roadmap</button>
            <button id="q-A" class="filter-btn" onclick="HeritageUI.filter('A')">Series A: Foundation</button>
            <button id="q-B" class="filter-btn" onclick="HeritageUI.filter('B')">Series B: Perspective</button>
            <button id="q-C" class="filter-btn" onclick="HeritageUI.filter('C')">Series C: Exploration</button>
            <button id="q-D" class="filter-btn" onclick="HeritageUI.filter('D')">Series D: Innovation</button>
        </nav>

        <!-- Master Theme Container -->
        <section id="roadmap-master" class="roadmap-stage">
            <!-- JavaScript Engine Renders the Massive Focus Cards Here -->
        </section>
        
    </main>

    <!-- ======================================================================
         [FOOTER]
         ====================================================================== -->
    <footer>
        <div class="text-logo" style="color:#FFF; opacity:0.3; font-size:32px;">Bridge<span>Academy</span></div>
        <div class="elite-copy">© 2026 BRIDGE ACADEMY HERITAGE. ALL RIGHTS RESERVED.</div>
    </footer>

    <!-- ======================================================================
         [CORE MASTER ENGINE V35.0]
         Complete 24-Unit Data & Massive Card Logic
         ====================================================================== -->
    <script>
        /**
         * [Library Quadrant Database V35.0]
         * Perfect, robust data mapping for 24 Master Units.
         * The 'id' field strictly matches the GitHub folder names (e.g., A-1, B-2).
         */
        const QUADRANT_MASTER_DB = [
            // --- SERIES A: FOUNDATION (1-6) ---
            { month: "Jan", unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1", books: ["I Like Myself!", "The Color Monster", "My Five Senses", "The Family Book", "From Head to Toe"] },
            { month: "Feb", unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2", books: ["The Very Hungry Caterpillar", "The Very Busy Spider", "The Grouchy Ladybug", "Waiting for Wings", "The Honeybee"] },
            { month: "Mar", unit: "A3", series: "A", theme: "My Super Family", question: "우리 가족은 어떤 초능력이 있을까?", id: "A-3", books: ["My Mom", "My Dad", "Love You Forever", "Guess How Much I Love You", "Night Before Mother's Day"] },
            { month: "Apr", unit: "A4", series: "A", theme: "Under the Sea", question: "바다 밑에는 누가 살고 있을까?", id: "A-4", books: ["The Pout-Pout Fish", "Ocean Commotion", "The Rainbow Fish", "I'm the Biggest Thing", "Swimmy"] },
            { month: "May", unit: "A5", series: "A", theme: "Colors of Weather", question: "날씨에도 색깔이 있을까?", id: "A-5", books: ["Rain", "Little Raindrop", "Chance of Meatballs", "Elmer and Rainbow", "Worm Weather"] },
            { month: "Jun", unit: "A6", series: "A", theme: "Space Adventure", question: "달나라 소풍을 가면 무엇이 필요할까?", id: "A-6", books: ["No Place Like Space", "Roaring Rockets", "Catch a Star", "Moon for Me", "Blast Off!"] },

            // --- SERIES B: PERSPECTIVE (1-6) ---
            { month: "Jan", unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1", books: ["Me on the Map", "This Is How We Do It", "Whoever You Are", "Madeline", "We're All Wonders"] },
            { month: "Feb", unit: "B2", series: "B", theme: "How Things Grow", question: "아주 작은 씨앗은 어떻게 꽃이 될까?", id: "B-2", books: ["The Tiny Seed", "Butterfly Cycle", "Planting a Rainbow", "Seed is Sleepy", "In the Garden"] },
            { month: "Mar", unit: "B3", series: "B", theme: "Animal Homes", question: "동물들은 왜 각자 다른 집에 살까?", id: "B-3", books: ["A House for Me", "Welcome Home Bear", "Great Kapok Tree", "Over in Meadow", "Who Lives Here?"] },
            { month: "Apr", unit: "B4", series: "B", theme: "Water Wonders", question: "무거운 배는 어떻게 물에 뜰까?", id: "B-4", books: ["Who Sank Boat?", "Hey, Water!", "Drop Around World", "Water Princess", "All the Water"] },
            { month: "May", unit: "B5", series: "B", theme: "Inside My Body", question: "밥을 먹으면 배 속에서 무슨 일이 생길까?", id: "B-5", books: ["Amazing Body", "Look Inside Body", "Magic School Bus", "Hear Your Heart", "Parts"] },
            { month: "Jun", unit: "B6", series: "B", theme: "Little Inventors", question: "머릿속 아이디어를 어떻게 진짜로 만들까?", id: "B-6", books: ["Rosie Revere", "The Idea", "Magnificent Thing", "Iggy Peck", "Boxitects"] },

            // --- SERIES C: EXPLORATION (1-6) ---
            { month: "Jul", unit: "C1", series: "C", theme: "Dinos Rule!", question: "공룡들은 어떻게 친구가 되었을까?", id: "C-1", books: ["Dino Good Night?", "Dinosaurs", "Danny Dinosaur", "If Dinos Back", "Stomp!"] },
            { month: "Aug", unit: "C2", series: "C", theme: "Senses & Food", question: "맛있는 소리는 어떤 느낌일까?", id: "C-2", books: ["Alphabet", "Green Eggs", "Stone Soup", "Vegetable Soup", "Yummy Yucky"] },
            { month: "Sep", unit: "C3", series: "C", theme: "Helper Heroes", question: "우리 마을을 돕는 영웅은 누구일까?", id: "C-3", books: ["Jobs People Do", "Whose Hat?", "Fire Truck", "Dr De Soto", "Police Dog"] },
            { month: "Oct", unit: "C4", series: "C", theme: "How do we Go?", question: "하늘, 땅, 바다 어디든 갈 수 있다면?", id: "C-4", books: ["Go Dog Go", "Freight Train", "Pigeon Bus", "Little Engine", "Cars & Trucks"] },
            { month: "Nov", unit: "C5", series: "C", theme: "Wild Animals", question: "정글 속 동물들은 무엇을 좋아할까?", id: "C-5", books: ["Dear Zoo", "Brown Bear", "Walking Jungle", "Mixed Chameleon", "Polar Bear"] },
            { month: "Dec", unit: "C6", series: "C", theme: "Winter Warmth", question: "겨울은 왜 따뜻한 계절일까?", id: "C-6", books: ["Snowy Day", "Giving Tree", "Bear Christmas", "Little Tree", "Grinch"] },

            // --- SERIES D: INNOVATION (1-6) ---
            { month: "Jul", unit: "D1", series: "D", theme: "Earth & Beyond", question: "태양계 행성들은 왜 다르게 생겼을까?", id: "D-1", books: ["Moon Friend", "Our Stars", "Sun! One Billion", "Go to Moon", "First Space"] },
            { month: "Aug", unit: "D2", series: "D", theme: "Colors & Art", question: "색깔을 섞으면 어떤 감정이 될까?", id: "D-2", books: ["The Dot", "Mix It Up!", "Ish", "Oops!", "Swatch"] },
            { month: "Sep", unit: "D3", series: "D", theme: "Elite Friends", question: "진짜 좋은 친구란 어떤 걸까?", id: "D-3", books: ["Stick and Stone", "Amos McGee", "Enemy Pie", "PB Cupcake", "No Elephants"] },
            { month: "Oct", unit: "D4", series: "D", theme: "Time Travel", question: "세상은 어떻게 변했을까?", id: "D-4", books: ["Little House", "Window", "First the Egg", "Once Upon Time", "Street Time"] },
            { month: "Nov", unit: "D5", series: "D", theme: "Earth Heroes", question: "지구를 어떻게 지켜줄 수 있을까?", id: "D-5", books: ["Michael Recycle", "10 Things World", "The Lorax", "Compost Stew", "Here We Are"] },
            { month: "Dec", unit: "D6", series: "D", theme: "Festival Lights", question: "겨울을 어떻게 기념할까?", id: "D-6", books: ["Lights Winter", "Celebrate!", "Polar Express", "Sweden Light", "Seven Spools"] }
        ];

        const CONFIG = {
            MONTHS: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
            SERIES_MAP: { "A": "Foundation", "B": "Perspective", "C": "Exploration", "D": "Innovation" }
        };

        // ==========================================
        // 1. Core Logic & Session Management
        // ==========================================
        const HeritageCore = {
            init() {
                // Remove repeated gates during active session
                if (sessionStorage.getItem('bridge_access_v35') === 'granted') {
                    document.getElementById('access-gateway').classList.add('hidden-gate');
                    document.getElementById('campus-root').style.display = 'block';
                    HeritageUI.init();
                }
            },
            unlock() {
                sessionStorage.setItem('bridge_access_v35', 'granted');
                const gate = document.getElementById('access-gateway');
                const root = document.getElementById('campus-root');
                gate.classList.add('unlocked');
                root.style.display = 'block';
                setTimeout(() => {
                    HeritageUI.init();
                    gate.classList.add('hidden-gate');
                }, 1200);
            },
            refresh() { window.scrollTo(0,0); location.reload(); }
        };

        // ==========================================
        // 2. UI Engine: Render Massive Single-Focus Cards
        // ==========================================
        const HeritageUI = {
            currentFilter: 'ALL',

            init() {
                this.renderRoadmap();
                this.setupObserver();
            },

            filter(f) {
                this.currentFilter = f;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`q-${f}`).classList.add('active');
                this.renderRoadmap();
                setTimeout(() => this.setupObserver(), 50);
            },

            renderRoadmap() {
                const roadmap = document.getElementById('roadmap-master');
                roadmap.innerHTML = ""; 

                CONFIG.MONTHS.forEach(mName => {
                    // Filter themes by month
                    const themes = QUADRANT_MASTER_DB.filter(d => d.month === mName);
                    if (themes.length === 0) return;

                    // Create Month Segment
                    const segment = document.createElement('div');
                    segment.className = 'month-segment';
                    segment.innerHTML = `
                        <div class="month-anchor">
                            <span class="anchor-tag">INQUIRY CYCLE</span>
                            <h2 class="anchor-name">${mName.toUpperCase()}</h2>
                            <div class="anchor-line"></div>
                        </div>
                    `;

                    // Inject themes inside the month
                    themes.forEach(t => {
                        // Apply Series Filter
                        if (this.currentFilter !== 'ALL' && t.series !== this.currentFilter) return;
                        segment.appendChild(this.createThemeHeritageCard(t));
                    });

                    // Only append segment if it has content (cards) inside
                    if (segment.children.length > 1) {
                        roadmap.appendChild(segment);
                    }
                });
            },

            /**
             * V35.0 핵심 아키텍처: 
             * 기존의 5개 썸네일 박스 코드를 완전히 삭제하고, 오직 텍스트 리스트만 생성.
             * 카드 전체가 <a href> 처럼 작동하는 단일 클릭 요소로 설계됨.
             */
            createThemeHeritageCard(t) {
                const card = document.createElement('div');
                card.className = `theme-heritage-card series-${t.series}`;
                
                // [이동 로직] 카드 어디를 누르든 워크북으로 이동
                card.addEventListener('click', () => {
                    window.location.href = `workbook.html?id=${t.id}`;
                });
                
                const seriesName = CONFIG.SERIES_MAP[t.series];

                // 시각적 노이즈(이미지 태그) 완전 제거. 오직 텍스트 중심의 레이아웃.
                card.innerHTML = `
                    <div class="card-accent-bar"></div>
                    
                    <div class="card-main-focus">
                        <div class="theme-meta-row">
                            <span class="theme-unit-badge">UNIT ${t.id}</span>
                            <span class="theme-series-text">SERIES ${t.series} : ${seriesName}</span>
                        </div>
                        
                        <h2 class="theme-h2-title">${t.theme}</h2>
                        <div class="theme-question-box">"${t.question}"</div>
                        
                        <div class="lab-enter-cta">
                            Enter Master Inquiry Lab 
                            <svg viewBox="0 0 24 24"><path d="M5 12H19M19 12L12 5M19 12L12 19"/></svg>
                        </div>
                    </div>
                    
                    <div class="card-reading-side">
                        <span class="reading-list-title">Curated Reading List</span>
                        <ul class="reading-item-list">
                            ${t.books.map((b, idx) => `
                                <li>
                                    <span class="num">0${idx+1}</span>
                                    <span class="book-title">${b}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                return card;
            },

            // Reveal animation on scroll
            setupObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => { 
                        if (e.isIntersecting) {
                            e.target.classList.add('revealed'); 
                            observer.unobserve(e.target); // play once
                        }
                    });
                }, { threshold: 0.15, rootMargin: "0px 0px -100px 0px" });
                
                document.querySelectorAll('.month-segment').forEach(s => observer.observe(s));
            }
        };

        // Bootstrap the application on load
        document.addEventListener('DOMContentLoaded', () => HeritageCore.init());
        
    </script>
</body>
</html>
