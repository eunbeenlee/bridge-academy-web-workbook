<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Explorer Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ======================================================================
         * [CSS Reset & Variables]
         * ====================================================================== */
        :root {
            --br-green: #89BFA0; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #E8E6E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(137, 191, 160, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(203, 174, 117, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }

        /* ======================================================================
         * [Floating Background Shapes]
         * ====================================================================== */
        .bg-shape {
            position: fixed;
            z-index: -1;
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }
        .bg-shape.circle { width: 300px; height: 300px; border-radius: 50%; background: linear-gradient(135deg, var(--br-green), transparent); top: -100px; left: -100px; }
        .bg-shape.blob { width: 400px; height: 400px; background: linear-gradient(135deg, var(--br-blue), transparent); bottom: -150px; right: -100px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation-duration: 25s; }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* ======================================================================
         * [Navigation Bar (Glassmorphism)]
         * ====================================================================== */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 90px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5vw;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
        }

        /* 🚨 텍스트 로고를 이미지 로고 스타일로 변경 */
        .brand-logo { 
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%; /* 네비바 높이에 맞춤 */
        }
        
        /* 🚨 로고 이미지 리사이징 전략 */
        .brand-logo img {
            max-height: 40px; /* PC에서는 40px로 세련되게 크기 제한 */
            width: auto;      /* 비율 유지 */
            object-fit: contain; /* 영역 안에서 선명하게 유지 */
            display: block;
        }

        .brand-logo:hover { transform: scale(1.05); }

        .profile-widget {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #FFF;
            padding: 8px 20px 8px 8px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--br-border);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-widget:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        
        .avatar {
            width: 45px; height: 45px;
            background: var(--br-gold);
            color: #FFF;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 20px;
            border: 2px solid #FFF;
            box-shadow: 0 3px 10px rgba(203,174,117,0.4);
        }
        
        .profile-text { display: flex; flex-direction: column; }
        .p-name { font-size: 15px; font-weight: 900; color: var(--br-charcoal); }
        .p-role { font-size: 11px; color: var(--br-muted); font-weight: 700; letter-spacing: 1px; }

        /* ======================================================================
         * [Main Content Area]
         * ====================================================================== */
        .main-container {
            margin-top: 90px;
            padding: 40px 5vw 100px;
            max-width: 1400px;
            margin-left: auto; margin-right: auto;
        }

        /* Hero Section */
        .hero-section {
            margin-bottom: 50px;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 55px;
            font-weight: 900;
            color: var(--br-charcoal);
            line-height: 1.2;
            margin-bottom: 15px;
        }
        .hero-subtitle {
            font-size: 18px;
            color: var(--br-muted);
            font-weight: 500;
        }
        .highlight { color: var(--br-green); font-style: italic; }

        /* Badge Showcase */
        .badge-showcase {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--br-border);
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .showcase-title { font-size: 13px; font-weight: 900; color: var(--br-gold); letter-spacing: 2px; text-transform: uppercase; width: 120px; flex-shrink: 0; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
        .badge-item { 
            background: #FFF; padding: 10px 18px; border-radius: 50px; 
            font-size: 14px; font-weight: 900; color: var(--br-charcoal);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid var(--br-border);
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .badge-item:hover { transform: scale(1.1) rotate(3deg); border-color: var(--br-gold); }

        /* ======================================================================
         * [Learning Journey Grid]
         * ====================================================================== */
        .section-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 30px;
        }
        .section-title { font-size: 24px; font-weight: 900; color: var(--br-charcoal); }
        
        .journey-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .unit-card {
            background: #FFF;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            border: 1px solid var(--br-border);
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 250px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 0.8s forwards;
        }

        /* 3D Hover Effect */
        .unit-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(137,191,160,0.15);
            border-color: var(--br-green);
        }

        .card-deco {
            position: absolute; top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: linear-gradient(135deg, var(--br-ai), var(--br-green));
            border-radius: 50%; opacity: 0.2;
            transition: 0.4s;
        }
        .unit-card:hover .card-deco { transform: scale(1.5); opacity: 0.4; }

        .card-badge {
            background: var(--br-charcoal); color: #FFF;
            font-size: 11px; font-weight: 900; letter-spacing: 2px;
            padding: 6px 12px; border-radius: 8px;
            align-self: flex-start; margin-bottom: 20px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px; font-weight: 900; color: var(--br-charcoal);
            margin-bottom: 10px; line-height: 1.2; z-index: 2;
        }
        .card-desc { font-size: 14px; color: var(--br-muted); line-height: 1.5; z-index: 2; flex: 1; }

        .card-footer {
            margin-top: 25px; display: flex; justify-content: space-between; align-items: center; z-index: 2;
        }
        
        .btn-start {
            background: var(--br-green); color: #FFF;
            padding: 12px 25px; border-radius: 12px;
            font-weight: 900; font-size: 14px;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(137,191,160,0.3);
        }
        .unit-card:hover .btn-start { background: var(--br-charcoal); box-shadow: 0 5px 15px rgba(54,52,49,0.3); }

        .progress-circle {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--br-ai); display: flex; justify-content: center; align-items: center;
            font-size: 12px; font-weight: 900; color: var(--br-green); border: 2px solid var(--br-green);
        }

        .unit-card.locked {
            background: #F8F9FA; border-color: transparent; box-shadow: none; cursor: not-allowed;
        }
        .unit-card.locked .card-badge { background: var(--br-muted); }
        .unit-card.locked .card-title, .unit-card.locked .card-desc { opacity: 0.5; }
        .unit-card.locked:hover { transform: none; box-shadow: none; border-color: transparent; }
        .unit-card.locked .btn-start { background: var(--br-muted); box-shadow: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* ======================================================================
         * [Media Queries for Mobile Optimization]
         * ====================================================================== */
        @media (max-width: 800px) {
            .navbar { padding: 0 20px; height: 80px; }
            
            /* 🚨 모바일 해상도에서 로고 리사이징 */
            .brand-logo img {
                max-height: 35px; /* 모바일에서는 조금 더 작게 (35px) */
            }

            .profile-widget { padding: 5px 15px 5px 5px; }
            .avatar { width: 35px; height: 35px; font-size: 16px; }
            .p-role { display: none; } 
            
            .main-container { padding: 30px 20px 100px; margin-top: 80px; }
            .hero-title { font-size: 38px; }
            .hero-subtitle { font-size: 15px; }
            
            .badge-showcase { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; }
            
            .journey-grid { grid-template-columns: 1fr; gap: 20px; }
            .unit-card { min-height: auto; padding: 25px; }
            .card-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape circle"></div>
    <div class="bg-shape blob"></div>

    <nav class="navbar">
        <div class="brand-logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <img src="logo.png" alt="Bridge Academy Logo">
        </div>
        <div class="profile-widget" onclick="App.celebrate()">
            <div class="avatar" id="nav-avatar">?</div>
            <div class="profile-text">
                <span class="p-name" id="nav-name">New Explorer</span>
                <span class="p-role">Ready to Learn</span>
            </div>
        </div>
    </nav>

    <main class="main-container">
        
        <section class="hero-section">
            <h1 class="hero-title" id="hero-title">
                Ready for a <br><span class="highlight">Magical Adventure?</span>
            </h1>
            <p class="hero-subtitle" id="hero-subtitle">Select a workbook unit below to start exploring, drawing, and speaking!</p>
        </section>

        <section class="badge-showcase" id="badge-showcase" style="display: none;">
            <div class="showcase-title">🏆 My Trophies</div>
            <div class="badge-list" id="badge-list">
                </div>
        </section>

        <section>
            <div class="section-header">
                <h2 class="section-title">My Learning Journey</h2>
            </div>
            
            <div class="journey-grid" id="journey-grid">
                </div>
        </section>

    </main>

    <script>
        // ======================================================================
        // [Data & Configuration]
        // ======================================================================
        
        const CURRICULUM = [
            { id: "A-1", badge: "UNIT A-1", title: "All About Me", desc: "Explore your name, face, family, and favorite colors through magical drawings.", isLocked: false, color: "var(--br-green)" },
            { id: "A-2", badge: "UNIT A-2", title: "My Animal Friends", desc: "Learn about pets, jungle animals, and ocean creatures.", isLocked: false, color: "var(--br-gold)" },
            { id: "A-3", badge: "UNIT A-3", title: "Space Adventure", desc: "Blast off into space! Draw planets, stars, and meet aliens.", isLocked: true, color: "var(--br-blue)" },
            { id: "B-1", badge: "UNIT B-1", title: "Community Helpers", desc: "Who helps us in our city? Learn about doctors and firefighters.", isLocked: true, color: "var(--br-charcoal)" }
        ];

        // ======================================================================
        // [Application Logic]
        // ======================================================================
        const App = {
            studentData: { name: "", badges: [], currentPage: 1 },

            init() {
                this.loadStudentData();
                this.renderUI();
                this.renderGrid();
                
                setTimeout(() => {
                    if(this.studentData.name) this.celebrate(true);
                }, 800);
            },

            loadStudentData() {
                // workbook.html(V100.2)에서 저장한 데이터 스캔
                const savedData = localStorage.getItem(`br_v100_A-1`);
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        this.studentData.name = parsed.name || "";
                        this.studentData.badges = parsed.badges || [];
                        this.studentData.currentPage = parsed.page || 1;
                    } catch (e) {}
                }
            },

            renderUI() {
                if (this.studentData.name) {
                    const firstName = this.studentData.name.split(' ')[0];
                    document.getElementById('nav-name').innerText = this.studentData.name;
                    document.getElementById('nav-avatar').innerText = this.studentData.name.charAt(0).toUpperCase();
                    document.getElementById('hero-title').innerHTML = `Welcome back, <br><span class="highlight">${firstName}!</span>`;
                    document.getElementById('hero-subtitle').innerText = "Your magical canvas is waiting for you.";
                }

                if (this.studentData.badges && this.studentData.badges.length > 0) {
                    const showcase = document.getElementById('badge-showcase');
                    const badgeList = document.getElementById('badge-list');
                    showcase.style.display = 'flex';
                    badgeList.innerHTML = '';

                    const uniqueBadges = [...new Set(this.studentData.badges)];
                    uniqueBadges.forEach(badge => {
                        const bEl = document.createElement('div');
                        bEl.className = 'badge-item';
                        bEl.innerText = badge;
                        badgeList.appendChild(bEl);
                    });
                }
            },

            renderGrid() {
                const grid = document.getElementById('journey-grid');
                grid.innerHTML = '';

                CURRICULUM.forEach((unit, index) => {
                    const delay = index * 0.15;
                    const card = document.createElement('div');
                    card.className = `unit-card ${unit.isLocked ? 'locked' : ''}`;
                    card.style.animationDelay = `${delay}s`;
                    
                    let progressUI = '';
                    let btnText = 'START';
                    
                    if (unit.id === "A-1" && this.studentData.currentPage > 1) {
                        const progress = Math.round((this.studentData.currentPage / 17) * 100);
                        progressUI = `<div class="progress-circle">${progress}%</div>`;
                        btnText = 'CONTINUE';
                    } else if (unit.isLocked) {
                        btnText = '🔒 LOCKED';
                    }

                    card.innerHTML = `
                        <div class="card-deco" style="background: linear-gradient(135deg, transparent, ${unit.color});"></div>
                        <div class="card-badge">${unit.badge}</div>
                        <h3 class="card-title">${unit.title}</h3>
                        <p class="card-desc">${unit.desc}</p>
                        <div class="card-footer">
                            <button class="btn-start">${btnText}</button>
                            ${progressUI}
                        </div>
                    `;

                    if (!unit.isLocked) {
                        card.onclick = () => {
                            card.style.transform = 'scale(0.95)';
                            setTimeout(() => {
                                // workbook.html이 같은 폴더에 있다고 가정
                                window.location.href = `workbook.html?id=${unit.id}`;
                            }, 200);
                        };
                    }
                    grid.appendChild(card);
                });
            },

            celebrate(isSubtle = false) {
                if (window.confetti) {
                    confetti({
                        particleCount: isSubtle ? 30 : 100,
                        spread: isSubtle ? 50 : 100,
                        origin: { y: 0.1, x: 0.8 },
                        colors: ['#89BFA0', '#CBAE75', '#7CA6C1']
                    });
                }
            }
        };

        window.onload = () => { App.init(); };

    </script>
</body>
</html>
