<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Premium Private Explorer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bridge-green: #89BFA0;
            --bridge-gold: #CBAE75;
            --bridge-blue: #7CA6C1;
            --bridge-charcoal: #363431;
            --bridge-bg: #FCFBF9;
            --bridge-paper: #FFFFFF;
            --bridge-text-main: #2A2825;
            --bridge-text-muted: #8C8985;
            --bridge-border: #E8E6E1;
            --bridge-ai: #F4F8F5;
            
            --shadow-silk: 0 15px 35px rgba(54, 52, 49, 0.04);
            --shadow-hover: 0 25px 50px rgba(137, 191, 160, 0.12);
            --ease-silk: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* [CSS Reset & Base] */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bridge-bg); 
            color: var(--bridge-text-main); 
            line-height: 1.6; 
            overflow-x: hidden; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(137, 191, 160, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(203, 174, 117, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }

        /* [Creative Floating Elements for Kids] */
        .creative-float {
            position: fixed; z-index: -1; opacity: 0.15;
            font-family: 'Playfair Display', serif; font-weight: 900; color: var(--bridge-gold);
            animation: floatLetters 25s infinite ease-in-out alternate;
            user-select: none; pointer-events: none;
        }
        .cf-1 { font-size: 150px; top: 10%; left: 5%; animation-delay: 0s; color: var(--bridge-green); }
        .cf-2 { font-size: 200px; bottom: 15%; right: 5%; animation-delay: -5s; }
        .cf-3 { font-size: 100px; top: 40%; left: 80%; animation-delay: -10s; color: var(--bridge-blue); }
        .cf-4 { font-size: 120px; bottom: 10%; left: 20%; animation-delay: -15s; }
        
        @keyframes floatLetters { 
            0% { transform: translateY(0) rotate(0deg) scale(1); } 
            50% { transform: translateY(-30px) rotate(15deg) scale(1.1); } 
            100% { transform: translateY(0) rotate(-5deg) scale(1); } 
        }

        /* [Header & Optimized Logo System] */
        header {
            width: 100%; padding: 12px 5vw; 
            background: rgba(252, 251, 249, 0.9); 
            backdrop-filter: blur(25px); 
            position: sticky; top: 0; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(240, 239, 235, 0.8);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        
        .brand-logo-img {
            height: 60px; /* 로고 가시성 확보 */
            width: auto; object-fit: contain; cursor: pointer;
            transition: transform 0.5s var(--ease-silk); transform-origin: left center;
        }
        .brand-logo-img:hover { transform: scale(1.05); }
        
        .profile-widget {
            display: flex; align-items: center; gap: 15px;
            background: #FFF; padding: 6px 20px 6px 8px;
            border-radius: 50px; border: 1px solid var(--bridge-border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            cursor: pointer; transition: 0.4s var(--ease-silk);
        }
        .profile-widget:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(203,174,117,0.15); border-color: var(--bridge-gold); }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--bridge-border); color: var(--bridge-muted);
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 18px; border: 2px solid #FFF; transition: 0.3s;
        }
        .profile-widget.active .avatar { background: var(--bridge-gold); color: #FFF; box-shadow: 0 4px 15px rgba(203,174,117,0.4); }
        .profile-text { display: flex; flex-direction: column; justify-content: center; }
        .p-name { font-size: 14px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1.2; }
        .p-role { font-size: 10px; color: var(--bridge-text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* [Hero Section - Compact to save vertical space] */
        .hero { padding: 60px 6% 30px; text-align: center; position: relative; }
        .private-badge {
            display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 6px; 
            color: var(--bridge-gold); text-transform: uppercase; margin-bottom: 20px;
            border: 1px solid var(--bridge-gold); padding: 6px 20px; border-radius: 100px;
            animation: fadeInDown 1s var(--ease-silk) forwards; opacity: 0; transform: translateY(20px);
        }
        .hero h1 { 
            font-family: 'Playfair Display', serif; font-size: 65px; font-weight: 900; 
            color: var(--bridge-charcoal); line-height: 1.15; margin-bottom: 20px; 
            animation: fadeInDown 1s var(--ease-silk) 0.2s forwards; opacity: 0; transform: translateY(20px); 
        }
        .hero h1 span.creative { position: relative; display: inline-block; }
        .hero h1 span.creative::after {
            content: ''; position: absolute; bottom: 8px; left: 0; width: 100%; height: 15px;
            background: rgba(137, 191, 160, 0.3); z-index: -1; transform: rotate(-2deg);
        }
        .hero h1 span.italic-gold { color: var(--bridge-gold); font-style: italic; }
        .hero p { 
            font-size: 17px; color: var(--bridge-text-muted); max-width: 700px; margin: 0 auto; 
            font-weight: 400; line-height: 1.6; word-break: keep-all;
            animation: fadeInDown 1s var(--ease-silk) 0.4s forwards; opacity: 0; transform: translateY(20px); 
        }

        /* [Badge Showcase - Compact] */
        .badge-showcase {
            max-width: 900px; margin: 0 auto 30px; padding: 20px 30px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid var(--bridge-border);
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            opacity: 0; transform: translateY(20px); animation: fadeInDown 1s var(--ease-silk) 0.6s forwards;
            display: none;
        }
        .showcase-title { font-size: 11px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 3px; text-transform: uppercase; width: 120px; flex-shrink: 0; line-height: 1.4; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; justify-content: center; }
        .badge-item { 
            background: #FFF; padding: 6px 14px; border-radius: 50px; 
            font-size: 12px; font-weight: 900; color: var(--bridge-charcoal);
            border: 1px solid var(--bridge-border); display: flex; align-items: center; gap: 6px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 3px 10px rgba(0,0,0,0.02);
        }
        .badge-item:hover { transform: scale(1.1) rotate(-3deg); border-color: var(--bridge-gold); box-shadow: 0 8px 20px rgba(203,174,117,0.2); color: var(--bridge-gold); }

        /* [Filter Dock] */
        .filter-dock { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; position: sticky; top: 90px; z-index: 1000; padding: 15px; }
        .filter-btn {
            padding: 14px 40px; border-radius: 100px; border: 1px solid var(--bridge-border); 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); 
            font-weight: 800; font-size: 12px; letter-spacing: 3px; cursor: pointer; transition: 0.4s var(--ease-silk); color: var(--bridge-text-muted); text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .filter-btn:hover { background: #FFF; color: var(--bridge-charcoal); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .filter-btn.active { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); transform: scale(1.05); box-shadow: 0 15px 30px rgba(54,52,49,0.25); }

        /* 🚨 [Roadmap Grid - 6 Items at a Glance] 🚨 */
        .roadmap { 
            padding: 0 5vw 100px; max-width: 1400px; margin: 0 auto; 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; /* 3열 그리드 */
            scroll-margin-top: 180px; 
        }

        /* [The Master Card - Compact Grid Version] */
        .workbook-card {
            background: var(--bridge-paper); border-radius: 30px; 
            box-shadow: var(--shadow-silk); border: 1px solid var(--bridge-border); 
            display: flex; flex-direction: column; cursor: pointer; transition: 0.5s var(--ease-silk); 
            position: relative; overflow: hidden; min-height: 260px;
            animation: fadeInDown 0.6s var(--ease-silk) forwards; opacity: 0; transform: translateY(20px);
        }
        .workbook-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            box-shadow: var(--shadow-hover); 
            border-color: rgba(203,174,117,0.4); 
        }
        
        .card-accent { width: 100%; height: 8px; flex-shrink: 0; transition: 0.5s; }
        .series-A .card-accent { background: var(--bridge-green); }
        .series-B .card-accent { background: var(--bridge-gold); }
        .series-C .card-accent { background: var(--bridge-blue); }
        .series-D .card-accent { background: var(--bridge-charcoal); }

        .card-main { flex: 1; padding: 30px 35px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        
        .card-deco { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; opacity: 0.03; transition: 0.8s var(--ease-silk); pointer-events: none; }
        .series-A .card-deco { background: radial-gradient(var(--bridge-green), transparent); }
        .series-B .card-deco { background: radial-gradient(var(--bridge-gold), transparent); }
        .workbook-card:hover .card-deco { transform: scale(1.8); opacity: 0.08; }

        .unit-badge { font-size: 10px; font-weight: 900; background: var(--bridge-bg); color: var(--bridge-muted); border: 1px solid var(--bridge-border); padding: 6px 15px; border-radius: 8px; width: max-content; margin-bottom: 15px; letter-spacing: 3px; z-index: 2; transition: 0.4s; }
        .workbook-card:hover .unit-badge { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); }

        .theme-h2 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; color: var(--bridge-charcoal); margin-bottom: 10px; line-height: 1.15; z-index: 2; transition: 0.4s; }
        .workbook-card:hover .theme-h2 { color: var(--bridge-gold); }
        .theme-q { font-size: 15px; color: var(--bridge-text-muted); z-index: 2; font-weight: 400; line-height: 1.4; flex: 1; }
        
        .cta-box { margin-top: 25px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .btn-enter { color: var(--bridge-charcoal); font-weight: 900; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; transition: 0.4s; }
        .btn-enter span { font-size: 18px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--bridge-bg); width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 1px solid var(--bridge-border); }
        .workbook-card:hover .btn-enter { color: var(--bridge-gold); }
        .workbook-card:hover .btn-enter span { transform: translateX(8px); background: var(--bridge-gold); color: #FFF; border-color: var(--bridge-gold); box-shadow: 0 10px 20px rgba(203,174,117,0.3); }

        .progress-pill { 
            display: flex; align-items: center; gap: 8px; 
            background: #FFF; padding: 6px 15px; border-radius: 100px;
            font-size: 11px; font-weight: 900; color: var(--bridge-green); border: 1px solid rgba(137,191,160,0.3);
            box-shadow: 0 5px 10px rgba(137,191,160,0.1);
        }
        .progress-bar-bg { width: 50px; height: 5px; background: #E8E6E1; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--bridge-green); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* [Responsive Design Optimization] */
        @media (max-width: 1200px) {
            .roadmap { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 55px; }
        }
        
        @media (max-width: 800px) {
            header { padding: 12px 5vw; }
            .brand-logo-img { height: 40px; } 
            
            .profile-widget { padding: 5px 15px 5px 5px; }
            .avatar { width: 32px; height: 32px; font-size: 14px; }
            .p-role { display: none; }
            
            .creative-float { display: none; } 
            
            .hero { padding: 60px 5% 40px; }
            .private-badge { font-size: 10px; padding: 6px 20px; }
            .hero h1 { font-size: 38px; margin-bottom: 15px; }
            .hero p { font-size: 15px; }
            
            .badge-showcase { flex-direction: column; align-items: center; gap: 15px; padding: 20px; border-radius: 20px; }

            .filter-dock { flex-wrap: wrap; gap: 8px; top: 70px; padding: 10px 5%; margin-bottom: 40px; }
            .filter-btn { padding: 10px 20px; font-size: 10px; letter-spacing: 2px; }

            .roadmap { grid-template-columns: 1fr; gap: 20px; padding: 0 5vw 100px; }
            .card-main { padding: 30px 25px; }
            .theme-h2 { font-size: 26px; }
            .theme-q { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape circle"></div>
    <div class="bg-shape blob"></div>
    <div class="creative-float cf-1">A</div>
    <div class="creative-float cf-2">?</div>
    <div class="creative-float cf-3">B</div>
    <div class="creative-float cf-4">!</div>

    <header>
        <img src="logo.png" alt="Bridge Academy" class="brand-logo-img" onclick="location.reload()">
        
        <div class="profile-widget" id="profile-widget" onclick="App.celebrate()">
            <div class="avatar" id="nav-avatar">?</div>
            <div class="profile-text">
                <span class="p-name" id="nav-name">New Explorer</span>
                <span class="p-role">Private Lab</span>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="private-badge">✧ Premium Private School ✧</div>
            <h1 id="hero-title">Where <span class="creative">Curiosity</span><br>Meets <span class="italic-gold">Excellence.</span></h1>
            <p id="hero-subtitle">집에서 만나는 <strong>가장 완벽한 프라이빗 스쿨.</strong><br>질문하고, 상상하고, 자유롭게 표현하는 IBL 탐구 세계로 초대합니다.</p>
        </section>

        <section class="badge-showcase" id="badge-showcase">
            <div class="showcase-title">🏆 Explorer<br>Trophies</div>
            <div class="badge-list" id="badge-list">
                </div>
        </section>

        <nav class="filter-dock" id="filter-dock">
            <button id="f-ALL" class="filter-btn active" onclick="App.filter('ALL')">All Units</button>
            <button id="f-A" class="filter-btn" onclick="App.filter('A')">Series A</button>
            <button id="f-B" class="filter-btn" onclick="App.filter('B')">Series B</button>
            <button id="f-C" class="filter-btn" onclick="App.filter('C')">Series C</button>
            <button id="f-D" class="filter-btn" onclick="App.filter('D')">Series D</button>
        </nav>

        <section id="roadmap" class="roadmap"></section>
    </main>

    <script>
        // ======================================================================
        // [Curriculum Database - 월별 구분 제거, 순수 유닛 리스트]
        // ======================================================================
        const DB = [
            { unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1" },
            { unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2" },
            { unit: "A3", series: "A", theme: "My Super Family", question: "우리 가족은 어떤 초능력이 있을까?", id: "A-3" },
            { unit: "A4", series: "A", theme: "Under the Sea", question: "바다 밑에는 누가 살고 있을까?", id: "A-4" },
            { unit: "A5", series: "A", theme: "Colors of Weather", question: "날씨에도 색깔이 있을까?", id: "A-5" },
            { unit: "A6", series: "A", theme: "Space Adventure", question: "달나라 소풍을 가면 무엇이 필요할까?", id: "A-6" },
            { unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1" },
            { unit: "B2", series: "B", theme: "How Things Grow", question: "아주 작은 씨앗은 어떻게 꽃이 될까?", id: "B-2" },
            { unit: "B3", series: "B", theme: "Animal Homes", question: "동물들은 왜 각자 다른 집에 살까?", id: "B-3" },
            { unit: "B4", series: "B", theme: "Water Wonders", question: "무거운 배는 어떻게 물에 뜰까?", id: "B-4" },
            { unit: "B5", series: "B", theme: "Inside My Body", question: "밥을 먹으면 배 속에서 무슨 일이 생길까?", id: "B-5" },
            { unit: "B6", series: "B", theme: "Little Inventors", question: "아이디어를 어떻게 진짜로 만들까?", id: "B-6" }
            // C, D 시리즈도 동일한 포맷으로 추가 가능합니다.
        ];

        // ======================================================================
        // [Application Logic]
        // ======================================================================
        const App = {
            currentFilter: 'ALL',
            studentData: {}, 

            init() { 
                this.loadStudentData();
                this.updateProfileUI();
                this.render(); 
                
                setTimeout(() => {
                    if(this.studentData['A-1'] && this.studentData['A-1'].name) {
                        this.celebrate(true);
                    }
                }, 1000);
            },

            loadStudentData() {
                DB.forEach(item => {
                    const saved = localStorage.getItem(`br_v100_${item.id}`);
                    if(saved) {
                        try {
                            this.studentData[item.id] = JSON.parse(saved);
                        } catch(e) {}
                    }
                });
            },

            updateProfileUI() {
                const mainData = this.studentData['A-1'];
                
                if (mainData && mainData.name) {
                    const firstName = mainData.name.split(' ')[0];
                    
                    const widget = document.getElementById('profile-widget');
                    widget.classList.add('active');
                    document.getElementById('nav-name').innerText = mainData.name;
                    document.getElementById('nav-avatar').innerText = mainData.name.charAt(0).toUpperCase();
                    
                    document.getElementById('hero-title').innerHTML = `Welcome back to your <br><span class="highlight italic-gold">Private Lab,</span> ${firstName}.`;
                    document.getElementById('hero-subtitle').innerHTML = `마법 같은 캔버스와 AI 선생님이 기다리고 있습니다.<br><strong>${firstName}</strong>만의 멋진 탐구 여정을 계속해볼까요?`;

                    let allBadges = [];
                    Object.values(this.studentData).forEach(data => {
                        if(data.badges && Array.isArray(data.badges)) {
                            allBadges = allBadges.concat(data.badges);
                        }
                    });

                    const uniqueBadges = [...new Set(allBadges)];
                    if (uniqueBadges.length > 0) {
                        const showcase = document.getElementById('badge-showcase');
                        const list = document.getElementById('badge-list');
                        showcase.style.display = 'flex';
                        list.innerHTML = '';
                        
                        uniqueBadges.forEach(badge => {
                            const bEl = document.createElement('div');
                            bEl.className = 'badge-item';
                            bEl.innerText = badge;
                            list.appendChild(bEl);
                        });
                    }
                }
            },

            filter(f) { 
                this.currentFilter = f; 
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`f-${f}`).classList.add('active');
                
                this.render(); // 즉시 리렌더링

                // 🚨 오토 스크롤: 헤더 높이를 감안하여 그리드 상단으로 정확히 이동
                const roadmapEl = document.getElementById('roadmap');
                const headerHeight = document.querySelector('header').offsetHeight;
                // 약간의 상단 여백(80px)을 두어 보기 편하게 조정
                const offsetPosition = roadmapEl.getBoundingClientRect().top + window.scrollY - headerHeight - 80;
                
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            },

            render() {
                const roadmap = document.getElementById('roadmap');
                roadmap.innerHTML = "";
                
                // 월별 세그먼트 없이, 선택된 시리즈의 아이템만 평면적으로 필터링
                const items = DB.filter(d => this.currentFilter === 'ALL' || d.series === this.currentFilter);
                
                items.forEach((t, index) => {
                    const card = document.createElement('div');
                    card.className = `workbook-card series-${t.series}`;
                    // 순차적인 등장 애니메이션 딜레이
                    card.style.animationDelay = `${index * 0.1}s`;
                    card.onclick = () => { window.location.href = `workbook.html?id=${t.id}`; };
                    
                    let progressUI = '';
                    let ctaText = 'Start Adventure';
                    const unitData = this.studentData[t.id];
                    
                    if (unitData && unitData.page > 1) {
                        const progress = Math.min(Math.round((unitData.page / 17) * 100), 100);
                        ctaText = 'Continue Exploring';
                        progressUI = `
                            <div class="progress-pill">
                                ${progress}% 
                                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
                            </div>
                        `;
                    }

                    // 🚨 거추장스러운 독서 리스트를 제거하고 콤팩트한 카드로 재설계
                    card.innerHTML = `
                        <div class="card-accent"></div>
                        <div class="card-main">
                            <div class="card-deco"></div>
                            <div>
                                <div class="unit-badge">UNIT ${t.id}</div>
                                <h2 class="theme-h2">${t.theme}</h2>
                                <p class="theme-q">"${t.question}"</p>
                            </div>
                            <div class="cta-box">
                                <div class="btn-enter">${ctaText} <span>→</span></div>
                                ${progressUI}
                            </div>
                        </div>
                    `;
                    roadmap.appendChild(card);
                });
            },

            celebrate(isSubtle = false) {
                if (window.confetti) {
                    confetti({
                        particleCount: isSubtle ? 40 : 150,
                        spread: isSubtle ? 50 : 120,
                        origin: { y: 0.1, x: 0.85 }, 
                        colors: ['#89BFA0', '#CBAE75', '#7CA6C1']
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
