<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Bridge Academy Master Inquiry Workbook Roadmap">
    <title>Bridge Academy | Workbook Project</title>
    
    <!-- 
      ======================================================================
      [Typography Engine]
      Playfair Display: 글로벌 교육 기관의 헤리티지와 고급스러움을 표현
      Noto Sans KR: 본문 및 UI 텍스트의 완벽한 가독성을 제공
      ====================================================================== 
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Bridge Academy Premium Design System]
         * Absolute Single-Focus Theme Engine | Designed for Director Lee
         * ======================================================================
         */

        :root {
            /* --- 1. Core Identity Colors (Series Accent) --- */
            /* Foundation: 자연스럽고 안정적인 그린 */
            --bridge-green: #7BB891;    
            /* Perspective: 권위와 통찰력을 상징하는 골드 */
            --bridge-gold: #C5A059;     
            /* Exploration: 넓은 세상을 탐구하는 블루 */
            --bridge-blue: #6A9CBE;     
            /* Innovation: 깊이 있는 사고와 혁신의 차콜 */
            --bridge-charcoal: #2D2D34; 
            
            /* --- 2. Neutral Palette & Backgrounds --- */
            /* 부드러운 웜그레이 톤으로 눈의 피로를 최소화 */
            --bridge-taupe: #A39B8E;
            --bridge-light-taupe: #EAE6DF;
            /* 종이 질감을 연상시키는 오프화이트 배경 */
            --bridge-bg: #F9FAF9;       
            --bridge-paper: #FFFFFF;
            /* 은은한 경계선 */
            --bridge-border: rgba(45, 45, 52, 0.08);
            
            /* --- 3. Text Colors --- */
            --bridge-text-main: #1A1A1E;
            --bridge-text-muted: #888890;
            --bridge-text-light: #B0B0B5;
            
            /* --- 4. Spatial Shadows & Depth (3D Layering) --- */
            --shadow-flat: 0 5px 15px rgba(0, 0, 0, 0.02);
            --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.04);
            --shadow-float: 0 30px 60px rgba(0, 0, 0, 0.05);
            --shadow-massive: 0 50px 100px rgba(45, 45, 52, 0.1);
            
            /* --- 5. Motion Dynamics & Easing --- */
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-fast: all 0.3s var(--ease-smooth);
            --transition-slow: all 0.8s var(--ease-lux);
            
            /* --- 6. Layout Variables --- */
            --max-width-desktop: 1400px;
            --padding-desktop: 6%;
            --padding-mobile: 24px;
        }

        /* 
         * --------------------------------------------------
         * [CSS Reset & Base Normalization]
         * 브라우저 간의 기본 스타일 차이를 완벽히 제거합니다.
         * -------------------------------------------------- 
         */
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        html { 
            scroll-behavior: smooth; 
            font-size: 16px; 
        }
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bridge-bg); 
            color: var(--bridge-text-main); 
            line-height: 1.6; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* 텍스트 드래그 시 브릿지 아카데미 컬러 적용 */
        ::selection { 
            background: var(--bridge-charcoal); 
            color: #FFF; 
        }

        ul, ol { list-style: none; }
        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; font-family: inherit; }

        /* 
         * --------------------------------------------------
         * [Header Navigation]
         * 상단에 고정되어 기관의 아이덴티티를 지속적으로 노출합니다.
         * -------------------------------------------------- 
         */
        header {
            width: 100%; 
            padding: 24px var(--padding-desktop); 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 2000; 
            border-bottom: 1px solid var(--bridge-border);
            transition: var(--transition-fast);
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 24px;
            cursor: pointer; 
        }
        
        /* 로고 텍스트 스타일링 */
        .brand-logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 26px;
            color: var(--bridge-charcoal);
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .brand-logo-text span { 
            color: var(--bridge-green); 
            font-style: italic; 
        }
        
        /* 프로젝트 배지 */
        .header-badge { 
            font-size: 11px; 
            font-weight: 800; 
            letter-spacing: 5px; 
            color: var(--bridge-charcoal); 
            background: var(--bridge-light-taupe);
            padding: 10px 24px; 
            border-radius: 100px; 
            text-transform: uppercase; 
        }

        /* 
         * --------------------------------------------------
         * [Hero Section]
         * 워크북 프로젝트의 비전과 철학을 보여주는 첫 화면
         * -------------------------------------------------- 
         */
        .hero-section { 
            padding: 140px var(--padding-desktop) 100px; 
            text-align: center; 
            background: radial-gradient(ellipse at top, #FFFFFF 0%, transparent 80%); 
        }
        
        .hero-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 80px; 
            font-weight: 900; 
            margin-bottom: 30px; 
            letter-spacing: -2px; 
            line-height: 1.1; 
            color: var(--bridge-charcoal); 
        }
        .hero-title span { 
            color: var(--bridge-green); 
            font-style: italic; 
        }
        
        .hero-subtitle { 
            font-size: 20px; 
            color: var(--bridge-text-muted); 
            font-weight: 300; 
            max-width: 800px; 
            margin: 0 auto; 
            line-height: 1.8; 
            word-break: keep-all;
        }

        /* 
         * --------------------------------------------------
         * [Filter Navigation Dock]
         * A, B, C, D 시리즈별로 워크북을 필터링하는 컨트롤러
         * -------------------------------------------------- 
         */
        .filter-dock { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            margin-bottom: 100px; 
            position: sticky; 
            top: 90px; /* 헤더 높이 아래에 위치 */
            z-index: 1000; 
            padding: 20px var(--padding-desktop); 
        }
        
        .filter-btn {
            padding: 16px 40px; 
            border-radius: 100px; 
            border: 1px solid var(--bridge-border);
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            font-weight: 700; 
            font-size: 12px; 
            letter-spacing: 3px; 
            cursor: pointer; 
            transition: var(--transition-fast); 
            box-shadow: var(--shadow-subtle); 
            color: var(--bridge-text-muted); 
            text-transform: uppercase;
        }
        
        .filter-btn:hover { 
            color: var(--bridge-charcoal); 
            border-color: var(--bridge-taupe); 
            background: #FFF;
        }
        
        .filter-btn.active { 
            background: var(--bridge-charcoal); 
            color: #FFFFFF; 
            border-color: var(--bridge-charcoal); 
            transform: scale(1.05); 
            box-shadow: var(--shadow-float); 
        }

        /* 
         * --------------------------------------------------
         * [Roadmap Container & Month Segments]
         * 월별로 묶인 워크북 리스트를 감싸는 컨테이너
         * -------------------------------------------------- 
         */
        .roadmap-container { 
            padding: 0 var(--padding-desktop) 200px; 
            max-width: var(--max-width-desktop); 
            margin: 0 auto; 
        }
        
        .month-segment { 
            margin-bottom: 180px; 
            opacity: 0; 
            transform: translateY(40px); 
            transition: var(--transition-slow); 
        }
        .month-segment.revealed { 
            opacity: 1; 
            transform: translateY(0); 
        }
        
        .month-header { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            margin-bottom: 80px; 
            text-align: center;
        }
        
        .month-tag { 
            font-size: 12px; 
            font-weight: 800; 
            color: var(--bridge-gold); 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin-bottom: 16px;
        }
        
        .month-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 64px; 
            font-weight: 900; 
            line-height: 1; 
            color: var(--bridge-charcoal); 
            letter-spacing: -1px; 
        }
        
        .month-divider {
            width: 40px;
            height: 3px;
            background: var(--bridge-charcoal);
            margin-top: 30px;
            border-radius: 2px;
        }

        /* 
         * --------------------------------------------------
         * [Absolute Single-Focus Workbook Card]
         * 원장님의 요청: 이미지를 모두 제거하고 거대한 단일 클릭 영역 구성
         * -------------------------------------------------- 
         */
        .workbook-card { 
            margin-bottom: 60px; 
            background: var(--bridge-paper); 
            border-radius: 40px; 
            box-shadow: var(--shadow-float); 
            border: 1px solid rgba(0,0,0,0.03); 
            position: relative; 
            overflow: hidden; 
            transition: var(--transition-slow);
            cursor: pointer; /* 카드 전체가 버튼 역할을 함 */
            display: flex; 
            flex-direction: row;
            min-height: 420px;
            text-decoration: none;
        }
        
        .workbook-card:hover { 
            transform: translateY(-12px); 
            box-shadow: var(--shadow-massive); 
        }
        
        /* 시리즈별 색상을 나타내는 좌측 포인트 바 */
        .card-accent-bar {
            width: 20px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.5s var(--ease-lux);
            z-index: 5;
        }
        .workbook-card.series-A .card-accent-bar { background: var(--bridge-green); }
        .workbook-card.series-B .card-accent-bar { background: var(--bridge-gold); }
        .workbook-card.series-C .card-accent-bar { background: var(--bridge-blue); }
        .workbook-card.series-D .card-accent-bar { background: var(--bridge-charcoal); }
        
        .workbook-card:hover .card-accent-bar { width: 30px; }

        /* --------------------------------------------------
         * 좌측 영역: 테마의 핵심 정보 (아이들의 시선이 머무는 곳)
         * -------------------------------------------------- */
        .card-primary-focus { 
            flex: 6.5; 
            padding: 80px 80px 80px 100px; /* 좌측 포인트 바 공간 확보 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            background: #FFF;
        }
        
        .theme-meta-info {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .unit-badge { 
            font-size: 12px; 
            font-weight: 900; 
            color: #FFF; 
            background: var(--bridge-charcoal);
            padding: 8px 16px;
            border-radius: 8px;
            text-transform: uppercase; 
            letter-spacing: 3px; 
        }
        
        .series-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--bridge-text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .theme-title-text { 
            font-family: 'Playfair Display', serif; 
            font-size: 64px; 
            font-weight: 900; 
            margin-bottom: 24px; 
            color: var(--bridge-text-main); 
            letter-spacing: -2px; 
            line-height: 1.1; 
            transition: color 0.3s;
        }
        
        .theme-core-question { 
            font-size: 26px; 
            font-weight: 400; 
            color: var(--bridge-text-muted); 
            font-family: 'Playfair Display', serif;
            font-style: italic; 
            margin-bottom: 0; 
            line-height: 1.5; 
            word-break: keep-all;
        }

        /* 워크북으로 진입하는 액션 버튼 영역 */
        .action-cta-wrap { 
            margin-top: 60px; 
            display: inline-flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            font-weight: 800;
            color: var(--bridge-charcoal);
            letter-spacing: 3px;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            transition: var(--transition-fast);
            width: max-content;
        }
        
        .action-cta-wrap svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: transform 0.4s var(--ease-lux);
        }
        
        .workbook-card:hover .action-cta-wrap { 
            color: var(--bridge-gold); 
            border-bottom-color: var(--bridge-gold); 
        }
        .workbook-card:hover .action-cta-wrap svg { 
            transform: translateX(10px); 
        }

        /* --------------------------------------------------
         * 우측 영역: 권장 도서 목록 (텍스트로만 심플하게 배치)
         * -------------------------------------------------- */
        .card-secondary-focus { 
            flex: 3.5;
            background: var(--bridge-bg); 
            padding: 80px 60px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            border-left: 1px solid var(--bridge-border);
            position: relative;
            z-index: 1;
        }
        
        .booklist-title { 
            font-size: 12px; 
            font-weight: 800; 
            color: var(--bridge-text-muted); 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin-bottom: 40px; 
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .booklist-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #E0E0E0;
        }
        
        .book-list-group { 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .book-list-item { 
            font-family: 'Playfair Display', serif; 
            font-size: 18px; 
            font-weight: 500;
            color: var(--bridge-text-muted); 
            display: flex; 
            align-items: baseline; 
            gap: 20px;
            transition: var(--transition-fast);
        }
        
        .book-list-item span.index-num { 
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px; 
            font-weight: 900; 
            color: var(--bridge-charcoal); 
            opacity: 0.3; 
            letter-spacing: 2px;
        }
        
        /* 카드에 마우스를 올렸을 때 도서 목록도 반응하도록 처리 */
        .workbook-card:hover .book-list-item { 
            color: var(--bridge-text-main); 
            transform: translateX(5px); 
        }
        .workbook-card:hover .book-list-item span.index-num { 
            opacity: 1; 
            color: var(--bridge-gold); 
        }

        /* 
         * --------------------------------------------------
         * [Footer Section]
         * -------------------------------------------------- 
         */
        footer { 
            background: var(--bridge-charcoal); 
            padding: 120px var(--padding-desktop) 100px; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .footer-logo {
            color: #FFF; 
            opacity: 0.3; 
            font-family: 'Playfair Display', serif; 
            font-weight: 900; 
            font-size: 32px;
        }
        
        .footer-copyright { 
            font-size: 12px; 
            color: rgba(255,255,255,0.3); 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            font-weight: 500; 
            margin-top: 40px;
        }

        /* 
         * --------------------------------------------------
         * [Responsive Media Queries]
         * 스마트폰, 태블릿, 작은 노트북 환경을 위한 완벽한 레이아웃 대응
         * -------------------------------------------------- 
         */
         
        /* Tablet & Small Desktop (Max 1200px) */
        @media (max-width: 1200px) {
            .hero-title { font-size: 64px; }
            .workbook-card { flex-direction: column; min-height: auto; }
            /* 카드가 세로로 배치될 때 좌우 패딩을 조정합니다. */
            .card-primary-focus { padding: 60px 60px 60px 80px; }
            .card-secondary-focus { 
                border-left: none; 
                border-top: 1px solid var(--bridge-border); 
                padding: 60px 80px; 
                background: #FFF; 
            }
            .theme-title-text { font-size: 52px; }
        }
        
        /* Mobile (Max 768px) */
        @media (max-width: 768px) {
            header { padding: 20px var(--padding-mobile); }
            .brand-logo-text { font-size: 20px; }
            
            .hero-section { padding: 100px var(--padding-mobile) 60px; }
            .hero-title { font-size: 48px; }
            .hero-subtitle { font-size: 18px; }
            
            /* 필터 버튼 스크롤 가능하도록 가로 스크롤 적용 */
            .filter-dock { 
                overflow-x: auto; 
                justify-content: flex-start; 
                padding: 20px var(--padding-mobile); 
                margin-bottom: 60px;
                /* 스크롤바 숨기기 (모바일 환경에서 깔끔함 유지) */
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .filter-dock::-webkit-scrollbar { display: none; }
            
            .filter-btn { padding: 14px 30px; white-space: nowrap; }
            
            .month-title { font-size: 48px; }
            .month-segment { margin-bottom: 120px; }
            
            .workbook-card { border-radius: 30px; }
            .card-primary-focus { padding: 50px 30px 50px 40px; }
            .card-secondary-focus { padding: 40px 30px 50px 40px; }
            
            .theme-title-text { font-size: 38px; }
            .theme-core-question { font-size: 20px; }
        }
        
        /* Very Small Mobile (Max 480px) */
        @media (max-width: 480px) {
            .hero-title { font-size: 40px; }
            .theme-title-text { font-size: 32px; }
            .theme-meta-info { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- 
      ======================================================================
      [Header Section] 
      로고 및 네비게이션 영역
      ====================================================================== 
    -->
    <header>
        <div class="header-brand" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
            <div class="brand-logo-text">Bridge<span>Academy</span></div>
        </div>
        <div class="header-badge">WORKBOOK PROJECT</div>
    </header>

    <!-- 
      ======================================================================
      [Main Content Application]
      앱의 핵심 렌더링 영역
      ====================================================================== 
    -->
    <main>
        
        <!-- 히어로 섹션 (소개 영역) -->
        <section class="hero-section">
            <h1 class="hero-title">Inquiry <span>Workbook</span></h1>
            <p class="hero-subtitle">
                브릿지 아카데미의 24개 핵심 테마. 오직 깊이 있는 질문과 주제에 온전히 집중하여, 아이들의 비판적 사고를 확장하는 17페이지 워크북을 탐구합니다.
            </p>
        </section>

        <!-- 필터 네비게이션 (시리즈별 정렬) -->
        <nav class="filter-dock">
            <button id="filter-all" class="filter-btn active" onclick="AppController.filterThemes('ALL')">All Units</button>
            <button id="filter-A" class="filter-btn" onclick="AppController.filterThemes('A')">Series A : Foundation</button>
            <button id="filter-B" class="filter-btn" onclick="AppController.filterThemes('B')">Series B : Perspective</button>
            <button id="filter-C" class="filter-btn" onclick="AppController.filterThemes('C')">Series C : Exploration</button>
            <button id="filter-D" class="filter-btn" onclick="AppController.filterThemes('D')">Series D : Innovation</button>
        </nav>

        <!-- 워크북 카드가 렌더링될 메인 컨테이너 -->
        <section id="roadmap-container" class="roadmap-container">
            <!-- 자바스크립트 엔진이 이 위치에 DOM을 생성하여 주입합니다. -->
        </section>
        
    </main>

    <!-- 
      ======================================================================
      [Footer Section]
      ====================================================================== 
    -->
    <footer>
        <div class="footer-logo">Bridge Academy</div>
        <div class="footer-copyright">© 2026 Bridge Academy Education. All Rights Reserved.</div>
    </footer>

    <!-- 
      ======================================================================
      [Application Script Core - V36.0]
      엔터프라이즈급 24개 유닛 데이터베이스 및 렌더링 엔진
      ====================================================================== 
    -->
    <script>
        /**
         * [Database: WORKBOOK_MASTER_DB]

        // 연간 정렬을 위한 12개월 배열 상수
        const APP_CONSTANTS = {
            MONTHS: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
        };

        /**
         * [AppController Core Module]
         * 애플리케이션의 렌더링, 필터링, 상호작용 로직을 통제합니다.
         */
        const AppController = {
            
            // 현재 활성화된 필터 상태 ('ALL', 'A', 'B', 'C', 'D')
            activeFilter: 'ALL',

            /**
             * 애플리케이션 초기화 메서드
             */
            init() {
                this.renderWorkbookRoadmap();
                this.attachScrollObserver();
            },

            /**
             * 상단 필터 버튼 클릭 시 호출되는 핸들러
             * @param {string} filterTarget - 선택된 필터링 값
             */
            filterThemes(filterTarget) {
                this.activeFilter = filterTarget;
                
                // UI 버튼 상태 업데이트
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const activeBtn = document.getElementById(`filter-${filterTarget}`);
                if (activeBtn) activeBtn.classList.add('active');
                
                // DOM 재구성
                this.renderWorkbookRoadmap();
                
                // 애니메이션 옵저버 재부착
                setTimeout(() => this.attachScrollObserver(), 50);
            },

            /**
             * 데이터베이스를 순회하여 DOM 요소를 생성하고 화면에 주입합니다.
             */
            renderWorkbookRoadmap() {
                const container = document.getElementById('roadmap-container');
                container.innerHTML = ""; // 기존 내용 초기화
                
                // 월별 순서대로 데이터베이스 렌더링
                APP_CONSTANTS.MONTHS.forEach(monthKey => {
                    
                    // 해당 월에 속하는 테마 추출
                    const monthThemes = WORKBOOK_MASTER_DB.filter(item => item.month === monthKey);
                    if (monthThemes.length === 0) return;

                    // 월별 컨테이너(Segment) DOM 생성
                    const segmentElement = document.createElement('div');
                    segmentElement.className = 'month-segment';
                    
                    // 월 타이틀 헤더 주입
                    segmentElement.innerHTML = `
                        <div class="month-header">
                            <span class="month-tag">Academic Cycle</span>
                            <h2 class="month-title">${monthKey.toUpperCase()}</h2>
                            <div class="month-divider"></div>
                        </div>
                    `;

                    // 해당 월의 테마들을 카드로 생성하여 주입
                    let addedCardsCount = 0;
                    monthThemes.forEach(themeObj => {
                        
                        // 현재 선택된 시리즈 필터에 맞지 않으면 건너뜀
                        if (this.activeFilter !== 'ALL' && themeObj.series !== this.activeFilter) return;
                        
                        // 카드 DOM 요소 생성 및 추가
                        const cardDom = this.createCardDOM(themeObj);
                        segmentElement.appendChild(cardDom);
                        addedCardsCount++;
                    });

                    // 화면에 보일 카드가 1개 이상일 때만 화면에 렌더링
                    if (addedCardsCount > 0) {
                        container.appendChild(segmentElement);
                    }
                });
            },

            /**
             * [핵심 메서드] 단일 테마 데이터를 기반으로 거대한 클릭형 DOM 카드를 생성합니다.
             * 
             * @param {Object} data - 단일 테마 정보 객체
             * @returns {HTMLElement} - 완성된 카드 DOM 객체
             */
            createCardDOM(data) {
                // 1. 최상위 래퍼 생성 (a 태그 역할 수행)
                const cardWrapper = document.createElement('a');
                // 카드의 href 속성에 이동할 주소 할당 (예: workbook.html?id=A-1)
                cardWrapper.href = `workbook.html?id=${data.id}`;
                cardWrapper.className = `workbook-card series-${data.series}`;
                
                // 2. 카드 내부 HTML 템플릿 작성
                // 주의: 어떠한 img 태그도 포함하지 않으며, 오직 텍스트 정보로만 UI를 구성합니다.
                
                let booksHTML = "";
                data.books.forEach((bookTitle, index) => {
                    const formatNumber = String(index + 1).padStart(2, '0');
                    booksHTML += `
                        <li class="book-list-item">
                            <span class="index-num">${formatNumber}</span>
                            <span class="book-title-text">${bookTitle}</span>
                        </li>
                    `;
                });

                cardWrapper.innerHTML = `
                    <!-- 카드 좌측 상태선 -->
                    <div class="card-accent-bar"></div>
                    
                    <!-- 테마 주요 정보 영역 (좌측 70%) -->
                    <div class="card-primary-focus">
                        <div class="theme-meta-info">
                            <span class="unit-badge">UNIT ${data.id}</span>
                            <span class="series-label">SERIES ${data.series}</span>
                        </div>
                        
                        <h2 class="theme-title-text">${data.theme}</h2>
                        <h3 class="theme-core-question">"${data.question}"</h3>
                        
                        <!-- CTA 버튼 (텍스트형) -->
                        <div class="action-cta-wrap">
                            WORKBOOK 시작하기 
                            <!-- 고급스러운 우측 화살표 아이콘 (인라인 SVG) -->
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                    
                    <!-- 도서 리스트 영역 (우측 30%) -->
                    <div class="card-secondary-focus">
                        <span class="booklist-title">권장 도서 목록</span>
                        <ul class="book-list-group">
                            ${booksHTML}
                        </ul>
                    </div>
                `;
                
                return cardWrapper;
            },

            /**
             * 스크롤 시 카드가 부드럽게 나타나도록 하는 Intersection Observer 적용
             */
            attachScrollObserver() {
                // 브라우저가 Observer API를 지원하는지 체크 (오류 방지 로직)
                if (!('IntersectionObserver' in window)) return;

                const options = {
                    threshold: 0.15, // 타겟 요소가 15% 보일 때 작동
                    rootMargin: "0px 0px -50px 0px"
                };

                const observer = new IntersectionObserver((entries, observerInstance) => {
                    entries.forEach(entry => { 
                        if (entry.isIntersecting) {
                            // 요소가 화면에 보이면 클래스 추가하여 애니메이션 실행
                            entry.target.classList.add('revealed'); 
                            // 애니메이션이 한 번 실행되면 감시 해제 (성능 최적화)
                            observerInstance.unobserve(entry.target); 
                        }
                    });
                }, options);
                
                // 모든 month-segment 요소에 옵저버 부착
                const segments = document.querySelectorAll('.month-segment');
                segments.forEach(segment => observer.observe(segment));
            }
        };

        // DOM이 완전히 로드된 후 애플리케이션 코어 초기화 실행
        document.addEventListener('DOMContentLoaded', () => {
            AppController.init();
        });
        
    </script>
