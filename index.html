<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Elite Digital Campus</title>
    
    <!-- [Fonts] Google Fonts Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * [CSS Architecture] 
         * Bridge Academy Premium Design System 
         */
        :root {
            --bridge-green: #8CC69F;
            --bridge-taupe: #A39B8E;
            --bridge-charcoal: #3A3A42;
            --bridge-bg: #F7F9F8;
            --bridge-paper: #FFFFFF;
            --bridge-gold: #C5A059;
            --bridge-border: rgba(58, 58, 66, 0.08);
            --transition-smooth: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            --shadow-premium: 0 30px 60px rgba(58, 58, 66, 0.05);
            --shadow-hover: 0 50px 100px rgba(140, 198, 159, 0.15);
        }

        /* Base Reset */
        * { 
            margin: 0; padding: 0; 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bridge-bg);
            color: var(--bridge-charcoal);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* [Header] Premium Navigation */
        header {
            width: 100%;
            padding: 35px 8%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--bridge-border);
        }

        .logo-wrap { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-img { max-width: 190px; height: auto; }
        .campus-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--bridge-taupe);
            border: 1.5px solid var(--bridge-taupe);
            padding: 8px 22px;
            border-radius: 50px;
        }

        /* [Hero] High-End Visuals */
        .hero-section {
            padding: 120px 8% 80px;
            text-align: center;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--bridge-bg) 100%);
        }

        .hero-section h1 {
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--bridge-charcoal);
            letter-spacing: -1px;
        }

        .hero-section p {
            font-size: 20px;
            color: var(--bridge-taupe);
            font-weight: 300;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .btn-magic-scan {
            padding: 24px 60px;
            border-radius: 100px;
            background: var(--bridge-green);
            color: #FFFFFF;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 20px 50px rgba(140, 198, 159, 0.4);
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .btn-magic-scan:hover {
            transform: translateY(-5px);
            background: var(--bridge-charcoal);
            box-shadow: 0 30px 60px rgba(58, 58, 66, 0.2);
        }

        /* [Curriculum] Dynamic Grid System */
        .curriculum-content { padding: 60px 8% 120px; }

        .month-container { margin-bottom: 100px; }
        
        .month-header {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 50px;
            border-bottom: 2px solid var(--bridge-green);
            padding-bottom: 15px;
        }

        .month-title {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--bridge-charcoal);
            line-height: 1;
        }

        .month-subtitle {
            font-size: 12px;
            font-weight: 900;
            color: var(--bridge-taupe);
            letter-spacing: 4px;
            text-transform: uppercase;
            padding-bottom: 8px;
        }

        .curriculum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }

        .book-card {
            background: var(--bridge-paper);
            border-radius: 35px;
            overflow: hidden;
            box-shadow: var(--shadow-premium);
            border: 1px solid var(--bridge-border);
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-15px);
            box-shadow: var(--shadow-hover);
        }

        .book-thumb-wrap {
            width: 100%;
            height: 240px;
            background: #F1F1F1;
            position: relative;
            overflow: hidden;
        }

        .book-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .book-card:hover .book-thumb-img { transform: scale(1.1); }

        .book-info-area { padding: 35px; }

        .theme-tag {
            font-size: 10px;
            font-weight: 900;
            color: var(--bridge-green);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--bridge-charcoal);
            margin-bottom: 15px;
            line-height: 1.3;
            height: 58px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
            font-weight: 300;
        }

        /* [Scanner] AI Vision UI */
        #scanner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 249, 248, 0.98);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .scanner-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            border-radius: 40px;
            overflow: hidden;
            border: 10px solid #FFF;
            box-shadow: 0 50px 100px rgba(0,0,0,0.15);
        }

        #scan-video { width: 100%; height: auto; display: block; }

        .scan-overlay-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--bridge-green);
            box-shadow: 0 0 20px var(--bridge-green);
            animation: scannerLoop 2.5s ease-in-out infinite;
        }

        @keyframes scannerLoop {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scanner-status {
            margin-top: 40px;
            font-size: 20px;
            font-weight: 700;
            color: var(--bridge-charcoal);
        }

        .btn-scanner-action {
            margin-top: 40px;
            padding: 22px 70px;
            border-radius: 100px;
            background: var(--bridge-charcoal);
            color: #FFF;
            border: none;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-scanner-action:hover { background: var(--bridge-green); transform: scale(1.05); }

        /* [Footer] */
        footer {
            background: var(--bridge-charcoal);
            padding: 100px 8%;
            text-align: center;
        }

        .footer-logo { max-width: 150px; opacity: 0.4; margin-bottom: 30px; }
        .copyright { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        /* [Responsive] Mobile Tuning */
        @media (max-width: 1024px) {
            .hero-section h1 { font-size: 48px; }
            .curriculum-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
        }

        @media (max-width: 768px) {
            header { padding: 25px 5%; }
            .hero-section { padding: 80px 5%; }
            .hero-section h1 { font-size: 36px; }
            .curriculum-grid { grid-template-columns: 1fr; }
            .month-title { font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-wrap" onclick="window.location.reload()">
            <img src="logo.png" alt="Bridge Academy" class="logo-img">
        </div>
        <div class="campus-badge">Private Campus V22.0</div>
    </header>

    <!-- Main Content Container -->
    <main>
        <!-- Hero Introduction -->
        <section class="hero-section">
            <h1 id="hero-title">Redefining Inquiry Excellence</h1>
            <p id="hero-desc">Connecting Global Inquiry Standards with Creative AI Analysis</p>
            <button class="btn-magic-scan" onclick="ScannerUI.open()">
                <span class="icon">✨</span> MAGIC BOOK SCAN
            </button>
        </section>

        <!-- Dynamic Curriculum Sections -->
        <div id="curriculum-content" class="curriculum-content">
            <!-- JavaScript will inject content here -->
        </div>
    </main>

    <!-- AI Scanner Modal -->
    <div id="scanner-modal">
        <div style="font-size: 11px; letter-spacing: 5px; font-weight: 900; color: var(--bridge-green); margin-bottom: 20px;">AI VISION IDENTIFIER</div>
        <div class="scanner-container">
            <video id="scan-video" autoplay playsinline></video>
            <div class="scan-overlay-line"></div>
        </div>
        <div id="scan-status" class="scanner-status">Align the Book Cover within the Frame</div>
        <div style="display:flex; gap:15px;">
            <button class="btn-scanner-action" onclick="ScannerUI.identify()">IDENTIFY BOOK</button>
            <button class="btn-scanner-action" onclick="ScannerUI.close()" style="background:#EEE; color:#888;">CANCEL</button>
        </div>
    </div>

    <!-- Footer Area -->
    <footer>
        <img src="logo.png" alt="Bridge Academy" class="footer-logo">
        <div class="copyright">© 2026 BRIDGE ACADEMY. PRESERVING INQUIRY STANDARDS WORLDWIDE.</div>
    </footer>

    <!-- [JavaScript] Module Integration -->
    <script src="library.js"></script>
    <script>
        /**
         * [V22.0 Core Logic]
         * Author: Bridge Academy Dev Team
         */

        const CONFIG = {
            API_KEY: "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4",
            MODEL: "gemini-1.5-flash",
            MONTHS: ["Jan", "Feb", "Mar"]
        };

        // UI Rendering Module
        const AppUI = {
            init() {
                this.renderCurriculum();
                console.log("Bridge Academy Index Initialized Successfully.");
            },

            renderCurriculum() {
                const container = document.getElementById('curriculum-content');
                
                CONFIG.MONTHS.forEach(month => {
                    const monthData = BRIDGE_LIBRARY.filter(b => b.month === month);
                    if (monthData.length === 0) return;

                    const section = document.createElement('section');
                    section.className = 'month-container';
                    
                    section.innerHTML = `
                        <div class="month-header">
                            <h2 class="month-title">${month.toUpperCase()}</h2>
                            <span class="month-subtitle">Inquiry Lab Series</span>
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = 'curriculum-grid';

                    monthData.forEach(book => {
                        const card = document.createElement('div');
                        card.className = 'book-card';
                        card.onclick = () => window.location.href = `workbook.html?id=${book.id}`;
                        
                        card.innerHTML = `
                            <div class="book-thumb-wrap">
                                <img src="${book.id}.png" class="book-thumb-img" onerror="this.src='placeholder.png'">
                            </div>
                            <div class="book-info-area">
                                <span class="theme-tag">${book.theme}</span>
                                <h3 class="book-title">${book.title}</h3>
                                <p class="book-desc">${book.question}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    container.appendChild(section);
                });
            }
        };

        // AI Scanner Management Module
        const ScannerUI = {
            stream: null,

            async open() {
                const modal = document.getElementById('scanner-modal');
                modal.style.display = 'flex';
                
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                    });
                    document.getElementById('scan-video').srcObject = this.stream;
                } catch (err) {
                    console.error("Camera Access Denied:", err);
                    alert("Camera access is required for Magic Scan.");
                    this.close();
                }
            },

            close() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                }
                document.getElementById('scanner-modal').style.display = 'none';
            },

            async identify() {
                const status = document.getElementById('scan-status');
                const video = document.getElementById('scan-video');
                
                status.innerText = "Analyzing Book Identity...";
                
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const base64Image = canvas.toDataURL("image/jpeg", 0.7).split(',')[1];

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.MODEL}:generateContent?key=${CONFIG.API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Return only the exact children's book title recognized from the cover image. No extra words." },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    const title = data.candidates[0].content.parts[0].text.trim().toLowerCase();
                    
                    const matchedBook = BRIDGE_LIBRARY.find(b => 
                        title.includes(b.title.toLowerCase()) || b.title.toLowerCase().includes(title)
                    );

                    if (matchedBook) {
                        status.innerText = "Success! Entering Lab...";
                        setTimeout(() => window.location.href = `workbook.html?id=${matchedBook.id}`, 800);
                    } else {
                        status.innerText = "No Matching Book Found. Try Again.";
                    }
                } catch (error) {
                    console.error("Vision Analysis Failed:", error);
                    status.innerText = "Connection Error. Please Check your Internet.";
                }
            }
        };

        // Initialize Application
        window.onload = () => AppUI.init();
    </script>
</body>
</html>
