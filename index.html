<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Premium Workbook Project</title>
    
    <!-- [Premium Typography] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Premium Silk Design System V40.0]
         * Designed for Director Lee Yun-ji | Bridge Academy Master
         * ======================================================================
         */
        :root {
            --bridge-green: #89BFA0;
            --bridge-gold: #CBAE75;
            --bridge-blue: #7CA6C1;
            --bridge-charcoal: #363431;
            --bridge-bg: #FCFBF9;
            --bridge-paper: #FFFFFF;
            --bridge-text-main: #2A2825;
            --bridge-text-muted: #8C8985;
            --bridge-border: #F0EFEB;
            
            --shadow-silk: 0 30px 60px rgba(54, 52, 49, 0.04);
            --shadow-hover: 0 50px 100px rgba(54, 52, 49, 0.08);
            --ease-silk: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* [CSS Reset] */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bridge-bg); color: var(--bridge-text-main); line-height: 1.7; overflow-x: hidden; }

        /* [Header] */
        header {
            width: 100%; padding: 30px 6%; background: rgba(252, 251, 249, 0.95); 
            backdrop-filter: blur(30px); position: sticky; top: 0; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bridge-border);
        }
        .brand-logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 28px; color: var(--bridge-charcoal); cursor: pointer; }
        .brand-logo span { color: var(--bridge-green); font-style: italic; }
        .campus-badge { font-size: 11px; font-weight: 800; letter-spacing: 6px; padding: 12px 30px; border-radius: 100px; border: 1px solid var(--bridge-border); color: var(--bridge-text-muted); }

        /* [Hero] */
        .hero { padding: 160px 6% 100px; text-align: center; background: radial-gradient(circle at top, #FFF 0%, transparent 70%); }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 90px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1.1; margin-bottom: 40px; }
        .hero h1 span { color: var(--bridge-green); font-style: italic; }
        .hero p { font-size: 22px; color: var(--bridge-text-muted); max-width: 850px; margin: 0 auto; font-weight: 300; line-height: 2; }

        /* [Filter Dock] */
        .filter-dock { display: flex; justify-content: center; gap: 20px; margin-bottom: 120px; position: sticky; top: 100px; z-index: 1000; padding: 20px; }
        .filter-btn {
            padding: 18px 45px; border-radius: 100px; border: 1px solid var(--bridge-border); 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); 
            font-weight: 700; font-size: 13px; letter-spacing: 4px; cursor: pointer; transition: 0.4s var(--ease-silk); color: var(--bridge-text-muted);
        }
        .filter-btn.active { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); transform: scale(1.05); box-shadow: var(--shadow-hover); }

        /* [Roadmap Content] */
        .roadmap { padding: 0 6% 250px; max-width: 1400px; margin: 0 auto; }
        .month-segment { margin-bottom: 220px; opacity: 0; transform: translateY(40px); transition: 1.2s var(--ease-silk); }
        .month-segment.revealed { opacity: 1; transform: translateY(0); }
        .month-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 100px; }
        .month-tag { font-size: 13px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 8px; text-transform: uppercase; margin-bottom: 25px; }
        .month-name { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 900; color: var(--bridge-charcoal); }

        /* [The Master Card] */
        .workbook-card {
            margin-bottom: 60px; background: var(--bridge-paper); border-radius: 50px; 
            box-shadow: var(--shadow-silk); border: 1px solid var(--bridge-border); 
            display: flex; cursor: pointer; transition: 0.6s var(--ease-silk); overflow: hidden;
        }
        .workbook-card:hover { transform: translateY(-15px); box-shadow: var(--shadow-hover); }
        
        .card-accent { width: 18px; transition: 0.5s; }
        .series-A .card-accent { background: var(--bridge-green); }
        .series-B .card-accent { background: var(--bridge-gold); }
        .series-C .card-accent { background: var(--bridge-blue); }
        .series-D .card-accent { background: var(--bridge-charcoal); }

        .card-main { flex: 6.5; padding: 100px 80px; display: flex; flex-direction: column; justify-content: center; }
        .unit-badge { font-size: 12px; font-weight: 900; background: var(--bridge-charcoal); color: #FFF; padding: 10px 20px; border-radius: 8px; width: max-content; margin-bottom: 35px; letter-spacing: 4px; }
        .theme-h2 { font-family: 'Playfair Display', serif; font-size: 68px; font-weight: 900; color: var(--bridge-text-main); margin-bottom: 25px; line-height: 1.1; }
        .theme-q { font-size: 28px; font-family: 'Playfair Display', serif; font-style: italic; color: var(--bridge-text-muted); }
        
        .cta-box { margin-top: 60px; color: var(--bridge-gold); font-weight: 800; font-size: 14px; letter-spacing: 5px; display: flex; align-items: center; gap: 20px; }
        .cta-box span { font-size: 24px; transition: 0.4s; }
        .workbook-card:hover .cta-box span { transform: translateX(15px); }

        .card-side { flex: 3.5; background: #FAFAF9; padding: 100px 70px; border-left: 1px solid var(--bridge-border); display: flex; flex-direction: column; justify-content: center; }
        .side-label { font-size: 11px; font-weight: 800; color: var(--bridge-taupe); letter-spacing: 6px; margin-bottom: 40px; border-bottom: 1px solid #EEE; padding-bottom: 15px; text-transform: uppercase; }
        .book-list li { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--bridge-text-muted); margin-bottom: 20px; display: flex; gap: 20px; align-items: baseline; transition: 0.3s; }
        .book-list li b { font-size: 11px; font-weight: 900; color: var(--bridge-gold); opacity: 0.4; }
        .workbook-card:hover .book-list li { color: var(--bridge-text-main); }

        @media (max-width: 1200px) {
            .hero h1 { font-size: 60px; }
            .workbook-card { flex-direction: column; }
            .card-side { border-left: none; border-top: 1px solid var(--bridge-border); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo" onclick="location.reload()">Bridge<span>Academy</span></div>
        <div class="campus-badge">PREMIUM WORKBOOK PROJECT</div>
    </header>

    <main>
        <section class="hero">
            <h1>Inquiry <span>Workbook</span></h1>
            <p>북미 사립 학교의 Inquiry-Based Learning 교수법을 기반으로 설계된 24개의 핵심 테마 로드맵입니다. 질문을 통해 아이들의 사고력을 확장하십시오.</p>
        </section>

        <nav class="filter-dock">
            <button id="f-ALL" class="filter-btn active" onclick="App.filter('ALL')">All Units</button>
            <button id="f-A" class="filter-btn" onclick="App.filter('A')">Series A</button>
            <button id="f-B" class="filter-btn" onclick="App.filter('B')">Series B</button>
            <button id="f-C" class="filter-btn" onclick="App.filter('C')">Series C</button>
            <button id="f-D" class="filter-btn" onclick="App.filter('D')">Series D</button>
        </nav>

        <section id="roadmap" class="roadmap"></section>
    </main>

    <script>
        const DB = [
            { month: "Jan", unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1", books: ["I Like Myself!", "The Color Monster", "My Five Senses", "The Family Book", "From Head to Toe"] },
            { month: "Feb", unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2", books: ["The Very Hungry Caterpillar", "The Very Busy Spider", "The Grouchy Ladybug", "Waiting for Wings", "The Honeybee"] },
            { month: "Mar", unit: "A3", series: "A", theme: "My Super Family", question: "우리 가족은 어떤 초능력이 있을까?", id: "A-3", books: ["My Mom", "My Dad", "Love You Forever", "Guess How Much I Love You", "Night Before Mother's Day"] },
            { month: "Apr", unit: "A4", series: "A", theme: "Under the Sea", question: "바다 밑에는 누가 살고 있을까?", id: "A-4", books: ["The Pout-Pout Fish", "Ocean Commotion", "The Rainbow Fish", "I'm the Biggest Thing", "Swimmy"] },
            { month: "May", unit: "A5", series: "A", theme: "Colors of Weather", question: "날씨에도 색깔이 있을까?", id: "A-5", books: ["Rain", "Little Raindrop", "Chance of Meatballs", "Elmer and Rainbow", "Worm Weather"] },
            { month: "Jun", unit: "A6", series: "A", theme: "Space Adventure", question: "달나라 소풍을 가면 무엇이 필요할까?", id: "A-6", books: ["No Place Like Space", "Roaring Rockets", "Catch a Star", "Moon for Me", "Blast Off!"] },
            { month: "Jan", unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1", books: ["Me on the Map", "How We Do It", "Whoever You Are", "Madeline", "We're All Wonders"] },
            { month: "Feb", unit: "B2", series: "B", theme: "How Things Grow", question: "아주 작은 씨앗은 어떻게 꽃이 될까?", id: "B-2", books: ["The Tiny Seed", "Butterfly Cycle", "Planting a Rainbow", "Seed is Sleepy", "In the Garden"] },
            { month: "Mar", unit: "B3", series: "B", theme: "Animal Homes", question: "동물들은 왜 각자 다른 집에 살까?", id: "B-3", books: ["A House for Me", "Welcome Home Bear", "Great Kapok Tree", "Over in Meadow", "Who Lives Here?"] },
            { month: "Apr", unit: "B4", series: "B", theme: "Water Wonders", question: "무거운 배는 어떻게 물에 뜰까?", id: "B-4", books: ["Who Sank Boat?", "Hey, Water!", "Drop Around World", "Water Princess", "All the Water"] },
            { month: "May", unit: "B5", series: "B", theme: "Inside My Body", question: "밥을 먹으면 배 속에서 무슨 일이 생길까?", id: "B-5", books: ["Amazing Body", "Look Inside Body", "Magic School Bus", "Hear Your Heart", "Parts"] },
            { month: "Jun", unit: "B6", series: "B", theme: "Little Inventors", question: "머릿속 아이디어를 어떻게 진짜로 만들까?", id: "B-6", books: ["Rosie Revere", "The Idea", "Magnificent Thing", "Iggy Peck", "Boxitects"] }
            // ... 데이터베이스 확장은 원장님의 편의에 따라 계속 가능합니다.
        ];

        const App = {
            currentFilter: 'ALL',
            init() { this.render(); this.attachObserver(); },
            filter(f) { 
                this.currentFilter = f; 
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`f-${f}`).classList.add('active');
                this.render();
                setTimeout(() => this.attachObserver(), 50);
            },
            render() {
                const roadmap = document.getElementById('roadmap');
                roadmap.innerHTML = "";
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                
                months.forEach(m => {
                    const items = DB.filter(d => d.month === m && (this.currentFilter === 'ALL' || d.series === this.currentFilter));
                    if(items.length === 0) return;
                    
                    const segment = document.createElement('div');
                    segment.className = 'month-segment';
                    segment.innerHTML = `<div class="month-header"><span class="month-tag">Cycle</span><h2 class="month-name">${m.toUpperCase()}</h2><div class="month-divider"></div></div>`;
                    
                    items.forEach(t => {
                        const card = document.createElement('div');
                        card.className = `workbook-card series-${t.series}`;
                        card.onclick = () => { window.location.href = `workbook.html?id=${t.id}`; };
                        card.innerHTML = `
                            <div class="card-accent"></div>
                            <div class="card-main">
                                <div class="unit-badge">UNIT ${t.id}</div>
                                <h2 class="theme-h2">${t.theme}</h2>
                                <p class="theme-q">"${t.question}"</p>
                                <div class="cta-box">Enter Master Workbook <span>→</span></div>
                            </div>
                            <div class="card-side">
                                <span class="side-label">Curated Reading List</span>
                                <ul class="book-list">${t.books.map((b,i)=>`<li><b>0${i+1}</b> ${b}</li>`).join('')}</ul>
                            </div>
                        `;
                        segment.appendChild(card);
                    });
                    roadmap.appendChild(segment);
                });
            },
            attachObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('revealed'); });
                }, { threshold: 0.1 });
                document.querySelectorAll('.month-segment').forEach(s => observer.observe(s));
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
