<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Premium Explorer Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* * ======================================================================
         * [Architecture: Premium Silk Design System V2.0 (Integrated)]
         * Designed for Director Lee Yun-ji | Bridge Academy Master
         * ======================================================================
         */
        :root {
            --bridge-green: #89BFA0;
            --bridge-gold: #CBAE75;
            --bridge-blue: #7CA6C1;
            --bridge-charcoal: #363431;
            --bridge-bg: #FCFBF9;
            --bridge-paper: #FFFFFF;
            --bridge-text-main: #2A2825;
            --bridge-text-muted: #8C8985;
            --bridge-border: #F0EFEB;
            --bridge-ai: #F4F8F5;
            
            --shadow-silk: 0 30px 60px rgba(54, 52, 49, 0.04);
            --shadow-hover: 0 40px 80px rgba(137, 191, 160, 0.15);
            --ease-silk: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* [CSS Reset & Base] */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bridge-bg); 
            color: var(--bridge-text-main); 
            line-height: 1.7; 
            overflow-x: hidden; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(137, 191, 160, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(203, 174, 117, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }

        /* [Floating Background Shapes - Premium Kids Touch] */
        .bg-shape {
            position: fixed; z-index: -1; opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }
        .bg-shape.circle { width: 400px; height: 400px; border-radius: 50%; background: linear-gradient(135deg, rgba(137,191,160,0.1), transparent); top: -100px; left: -100px; }
        .bg-shape.blob { width: 500px; height: 500px; background: linear-gradient(135deg, rgba(124,166,193,0.1), transparent); bottom: -150px; right: -100px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation-duration: 25s; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-40px) rotate(10deg); } 100% { transform: translateY(0) rotate(0deg); } }

        /* [Header & Profile Widget (Glassmorphism)] */
        header {
            width: 100%; padding: 20px 6%; 
            background: rgba(252, 251, 249, 0.85); 
            backdrop-filter: blur(20px); 
            position: sticky; top: 0; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(240, 239, 235, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        
        .brand-logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 28px; color: var(--bridge-charcoal); cursor: pointer; transition: 0.3s; }
        .brand-logo:hover { transform: scale(1.02); }
        .brand-logo span { color: var(--bridge-green); font-style: italic; }
        
        /* 🚨 Workbook 연동 다이내믹 프로필 위젯 */
        .profile-widget {
            display: flex; align-items: center; gap: 12px;
            background: #FFF; padding: 6px 20px 6px 6px;
            border-radius: 50px; border: 1px solid var(--bridge-border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            cursor: pointer; transition: 0.3s var(--ease-silk);
        }
        .profile-widget:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-color: var(--bridge-gold); }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--bridge-border); color: var(--bridge-muted);
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 18px; border: 2px solid #FFF; transition: 0.3s;
        }
        .profile-widget.active .avatar { background: var(--bridge-gold); color: #FFF; box-shadow: 0 4px 12px rgba(203,174,117,0.4); }
        .profile-text { display: flex; flex-direction: column; justify-content: center; }
        .p-name { font-size: 14px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1.2; }
        .p-role { font-size: 10px; color: var(--bridge-text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* [Hero Section] */
        .hero { padding: 120px 6% 80px; text-align: center; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 85px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1.1; margin-bottom: 30px; animation: slideUp 1s var(--ease-silk) forwards; opacity: 0; transform: translateY(30px); }
        .hero h1 span { color: var(--bridge-green); font-style: italic; }
        .hero p { font-size: 20px; color: var(--bridge-text-muted); max-width: 800px; margin: 0 auto; font-weight: 400; line-height: 1.8; animation: slideUp 1s var(--ease-silk) 0.2s forwards; opacity: 0; transform: translateY(30px); }

        /* 🚨 Workbook 연동 뱃지 진열장 (처음엔 숨김) */
        .badge-showcase {
            max-width: 1000px; margin: 0 auto 60px; padding: 25px 40px;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
            border-radius: 25px; border: 1px solid var(--bridge-border);
            display: flex; align-items: center; gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            opacity: 0; transform: translateY(30px); animation: slideUp 1s var(--ease-silk) 0.4s forwards;
            display: none; /* JS에서 활성화 */
        }
        .showcase-title { font-size: 12px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 3px; text-transform: uppercase; width: 140px; flex-shrink: 0; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
        .badge-item { 
            background: #FFF; padding: 8px 16px; border-radius: 50px; 
            font-size: 13px; font-weight: 900; color: var(--bridge-charcoal);
            border: 1px solid var(--bridge-border); display: flex; align-items: center; gap: 6px;
            transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .badge-item:hover { transform: scale(1.08) rotate(-2deg); border-color: var(--bridge-gold); box-shadow: 0 8px 20px rgba(203,174,117,0.2); }

        /* [Filter Dock] */
        .filter-dock { display: flex; justify-content: center; gap: 15px; margin-bottom: 100px; position: sticky; top: 90px; z-index: 1000; padding: 20px; }
        .filter-btn {
            padding: 16px 40px; border-radius: 100px; border: 1px solid var(--bridge-border); 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); 
            font-weight: 800; font-size: 12px; letter-spacing: 3px; cursor: pointer; transition: 0.4s var(--ease-silk); color: var(--bridge-text-muted); text-transform: uppercase;
        }
        .filter-btn:hover { background: #FFF; color: var(--bridge-charcoal); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
        .filter-btn.active { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); transform: scale(1.05); box-shadow: 0 15px 30px rgba(54,52,49,0.2); }

        /* [Roadmap Content] */
        .roadmap { padding: 0 6% 150px; max-width: 1400px; margin: 0 auto; }
        .month-segment { margin-bottom: 180px; opacity: 0; transform: translateY(50px); transition: 1s var(--ease-silk); }
        .month-segment.revealed { opacity: 1; transform: translateY(0); }
        .month-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 80px; }
        .month-tag { font-size: 12px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 8px; text-transform: uppercase; margin-bottom: 15px; }
        .month-name { font-family: 'Playfair Display', serif; font-size: 65px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1; }

        /* [The Master Card - 3D Upgraded] */
        .workbook-card {
            margin-bottom: 50px; background: var(--bridge-paper); border-radius: 40px; 
            box-shadow: var(--shadow-silk); border: 1px solid var(--bridge-border); 
            display: flex; cursor: pointer; transition: 0.5s var(--ease-silk); overflow: hidden;
            position: relative;
        }
        
        /* 🚨 3D Tilt Hover Effect */
        .workbook-card:hover { 
            transform: translateY(-12px) scale(1.01); 
            box-shadow: var(--shadow-hover); 
            border-color: rgba(137,191,160,0.5);
        }
        
        .card-accent { width: 15px; transition: 0.5s; flex-shrink: 0; }
        .series-A .card-accent { background: var(--bridge-green); }
        .series-B .card-accent { background: var(--bridge-gold); }
        .series-C .card-accent { background: var(--bridge-blue); }
        .series-D .card-accent { background: var(--bridge-charcoal); }

        .card-main { flex: 1; padding: 70px 60px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        
        /* Background Deco inside Card */
        .card-deco { position: absolute; right: -50px; top: -50px; width: 250px; height: 250px; border-radius: 50%; opacity: 0.03; transition: 0.8s var(--ease-silk); pointer-events: none; }
        .series-A .card-deco { background: radial-gradient(var(--bridge-green), transparent); }
        .series-B .card-deco { background: radial-gradient(var(--bridge-gold), transparent); }
        .workbook-card:hover .card-deco { transform: scale(1.5); opacity: 0.08; }

        .unit-badge { font-size: 11px; font-weight: 900; background: var(--bridge-charcoal); color: #FFF; padding: 8px 18px; border-radius: 8px; width: max-content; margin-bottom: 25px; letter-spacing: 3px; z-index: 2; }
        .theme-h2 { font-family: 'Playfair Display', serif; font-size: 55px; font-weight: 900; color: var(--bridge-charcoal); margin-bottom: 20px; line-height: 1.1; z-index: 2; }
        .theme-q { font-size: 24px; font-family: 'Playfair Display', serif; font-style: italic; color: var(--bridge-text-muted); z-index: 2; }
        
        .cta-box { margin-top: 50px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .btn-enter { color: var(--bridge-gold); font-weight: 900; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; display: flex; align-items: center; gap: 15px; }
        .btn-enter span { font-size: 20px; transition: 0.4s var(--ease-silk); }
        .workbook-card:hover .btn-enter span { transform: translateX(10px); color: var(--bridge-green); }

        /* 🚨 Progress Indicator */
        .progress-pill { 
            display: flex; align-items: center; gap: 10px; 
            background: var(--bridge-ai); padding: 8px 20px; border-radius: 100px;
            font-size: 12px; font-weight: 900; color: var(--bridge-green); border: 1px solid rgba(137,191,160,0.3);
        }
        .progress-bar-bg { width: 60px; height: 6px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--bridge-green); }

        .card-side { width: 380px; background: #FAFAF9; padding: 70px 50px; border-left: 1px solid var(--bridge-border); display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; z-index: 2; }
        .side-label { font-size: 10px; font-weight: 900; color: var(--bridge-text-muted); letter-spacing: 5px; margin-bottom: 30px; border-bottom: 1px solid var(--bridge-border); padding-bottom: 15px; text-transform: uppercase; }
        .book-list { list-style: none; }
        .book-list li { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--bridge-text-muted); margin-bottom: 18px; display: flex; gap: 15px; align-items: baseline; transition: 0.3s; }
        .book-list li b { font-size: 10px; font-weight: 900; color: var(--bridge-gold); opacity: 0.5; font-family: 'Noto Sans KR', sans-serif; }
        .workbook-card:hover .book-list li { color: var(--bridge-charcoal); transform: translateX(5px); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        /* [Media Queries] */
        @media (max-width: 1200px) {
            .hero h1 { font-size: 65px; }
            .theme-h2 { font-size: 45px; }
            .card-side { width: 300px; padding: 50px 30px; }
        }
        
        @media (max-width: 900px) {
            header { padding: 15px 5%; height: 75px; }
            .brand-logo { font-size: 22px; }
            .profile-widget { padding: 5px 15px 5px 5px; }
            .avatar { width: 35px; height: 35px; font-size: 16px; }
            .p-role { display: none; }
            
            .hero { padding: 100px 5% 60px; }
            .hero h1 { font-size: 45px; }
            .hero p { font-size: 16px; }
            
            .badge-showcase { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; border-radius: 20px; }

            .filter-dock { flex-wrap: wrap; gap: 10px; top: 75px; padding: 15px 5%; margin-bottom: 60px; }
            .filter-btn { padding: 12px 25px; font-size: 11px; }

            .workbook-card { flex-direction: column; border-radius: 30px; }
            .card-accent { width: 100%; height: 10px; }
            .card-main { padding: 40px 30px; }
            .theme-h2 { font-size: 32px; }
            .theme-q { font-size: 18px; }
            
            .cta-box { flex-direction: column; align-items: flex-start; gap: 20px; margin-top: 30px; }
            
            .card-side { width: 100%; border-left: none; border-top: 1px solid var(--bridge-border); padding: 40px 30px; }
            .book-list li { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape circle"></div>
    <div class="bg-shape blob"></div>

    <header>
        <div class="brand-logo" onclick="location.reload()">Bridge<span>Academy</span></div>
        <div class="profile-widget" id="profile-widget" onclick="App.celebrate()">
            <div class="avatar" id="nav-avatar">?</div>
            <div class="profile-text">
                <span class="p-name" id="nav-name">New Explorer</span>
                <span class="p-role">Ready to Learn</span>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1 id="hero-title">Inquiry <span>Workbook</span></h1>
            <p id="hero-subtitle">북미 사립 학교의 Inquiry-Based Learning 교수법을 기반으로 설계된 핵심 테마 로드맵입니다. 질문을 통해 아이들의 사고력을 확장하십시오.</p>
        </section>

        <section class="badge-showcase" id="badge-showcase">
            <div class="showcase-title">🏆 My Trophies</div>
            <div class="badge-list" id="badge-list">
                </div>
        </section>

        <nav class="filter-dock">
            <button id="f-ALL" class="filter-btn active" onclick="App.filter('ALL')">All Units</button>
            <button id="f-A" class="filter-btn" onclick="App.filter('A')">Series A</button>
            <button id="f-B" class="filter-btn" onclick="App.filter('B')">Series B</button>
            <button id="f-C" class="filter-btn" onclick="App.filter('C')">Series C</button>
            <button id="f-D" class="filter-btn" onclick="App.filter('D')">Series D</button>
        </nav>

        <section id="roadmap" class="roadmap"></section>
    </main>

    <script>
        // ======================================================================
        // [Curriculum Database]
        // ======================================================================
        const DB = [
            { month: "Jan", unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1", books: ["I Like Myself!", "The Color Monster", "My Five Senses", "The Family Book", "From Head to Toe"] },
            { month: "Feb", unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2", books: ["The Very Hungry Caterpillar", "The Very Busy Spider", "The Grouchy Ladybug", "Waiting for Wings", "The Honeybee"] },
            { month: "Mar", unit: "A3", series: "A", theme: "My Super Family", question: "우리 가족은 어떤 초능력이 있을까?", id: "A-3", books: ["My Mom", "My Dad", "Love You Forever", "Guess How Much I Love You", "Night Before Mother's Day"] },
            { month: "Apr", unit: "A4", series: "A", theme: "Under the Sea", question: "바다 밑에는 누가 살고 있을까?", id: "A-4", books: ["The Pout-Pout Fish", "Ocean Commotion", "The Rainbow Fish", "I'm the Biggest Thing", "Swimmy"] },
            { month: "May", unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1", books: ["Me on the Map", "How We Do It", "Whoever You Are", "Madeline", "We're All Wonders"] },
            { month: "Jun", unit: "B2", series: "B", theme: "How Things Grow", question: "아주 작은 씨앗은 어떻게 꽃이 될까?", id: "B-2", books: ["The Tiny Seed", "Butterfly Cycle", "Planting a Rainbow", "Seed is Sleepy", "In the Garden"] }
            // 데이터베이스는 필요에 따라 확장 가능합니다.
        ];

        // ======================================================================
        // [Application Logic]
        // ======================================================================
        const App = {
            currentFilter: 'ALL',
            studentData: {}, // LocalStorage 데이터 보관용

            init() { 
                this.loadStudentData();
                this.updateProfileUI();
                this.render(); 
                this.attachObserver(); 
                
                setTimeout(() => {
                    if(this.studentData['A-1'] && this.studentData['A-1'].name) {
                        this.celebrate(true);
                    }
                }, 1000);
            },

            // 🚨 Workbook (V100.2)에서 저장한 데이터를 로드합니다.
            loadStudentData() {
                // A-1부터 B-6까지 모든 유닛의 데이터를 스캔하여 종합합니다.
                DB.forEach(item => {
                    const saved = localStorage.getItem(`br_v100_${item.id}`);
                    if(saved) {
                        try {
                            this.studentData[item.id] = JSON.parse(saved);
                        } catch(e) {}
                    }
                });
            },

            // 🚨 불러온 데이터로 프로필 및 배지 진열장 렌더링
            updateProfileUI() {
                // 주로 첫 번째 유닛(A-1)의 데이터를 메인 프로필로 사용
                const mainData = this.studentData['A-1'];
                
                if (mainData && mainData.name) {
                    const firstName = mainData.name.split(' ')[0];
                    
                    // 프로필 업데이트
                    const widget = document.getElementById('profile-widget');
                    widget.classList.add('active');
                    document.getElementById('nav-name').innerText = mainData.name;
                    document.getElementById('nav-avatar').innerText = mainData.name.charAt(0).toUpperCase();
                    
                    // 히어로 섹션 다정하게 변경
                    document.getElementById('hero-title').innerHTML = `Welcome back, <br><span class="highlight">${firstName}!</span>`;
                    document.getElementById('hero-subtitle').innerText = "Your magical canvas and AI tutor are waiting for you. Let's continue the adventure!";

                    // 배지 진열장 업데이트 (모든 유닛의 배지를 취합)
                    let allBadges = [];
                    Object.values(this.studentData).forEach(data => {
                        if(data.badges && Array.isArray(data.badges)) {
                            allBadges = allBadges.concat(data.badges);
                        }
                    });

                    const uniqueBadges = [...new Set(allBadges)];
                    if (uniqueBadges.length > 0) {
                        const showcase = document.getElementById('badge-showcase');
                        const list = document.getElementById('badge-list');
                        showcase.style.display = 'flex';
                        list.innerHTML = '';
                        
                        uniqueBadges.forEach(badge => {
                            const bEl = document.createElement('div');
                            bEl.className = 'badge-item';
                            bEl.innerText = badge;
                            list.appendChild(bEl);
                        });
                    }
                }
            },

            filter(f) { 
                this.currentFilter = f; 
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`f-${f}`).classList.add('active');
                this.render();
                setTimeout(() => this.attachObserver(), 50);
            },

            render() {
                const roadmap = document.getElementById('roadmap');
                roadmap.innerHTML = "";
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                
                months.forEach(m => {
                    const items = DB.filter(d => d.month === m && (this.currentFilter === 'ALL' || d.series === this.currentFilter));
                    if(items.length === 0) return;
                    
                    const segment = document.createElement('div');
                    segment.className = 'month-segment';
                    segment.innerHTML = `
                        <div class="month-header">
                            <span class="month-tag">Learning Cycle</span>
                            <h2 class="month-name">${m.toUpperCase()}</h2>
                        </div>
                    `;
                    
                    items.forEach(t => {
                        const card = document.createElement('div');
                        card.className = `workbook-card series-${t.series}`;
                        card.onclick = () => { window.location.href = `workbook.html?id=${t.id}`; };
                        
                        // 🚨 워크북 진행률(Progress) 계산 로직
                        let progressUI = '';
                        let ctaText = 'Enter Workbook';
                        const unitData = this.studentData[t.id];
                        
                        if (unitData && unitData.page > 1) {
                            const progress = Math.min(Math.round((unitData.page / 17) * 100), 100);
                            ctaText = 'Continue Adventure';
                            progressUI = `
                                <div class="progress-pill">
                                    ${progress}% 
                                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="card-accent"></div>
                            <div class="card-main">
                                <div class="card-deco"></div>
                                <div class="unit-badge">UNIT ${t.id}</div>
                                <h2 class="theme-h2">${t.theme}</h2>
                                <p class="theme-q">"${t.question}"</p>
                                <div class="cta-box">
                                    <div class="btn-enter">${ctaText} <span>→</span></div>
                                    ${progressUI}
                                </div>
                            </div>
                            <div class="card-side">
                                <span class="side-label">Curated Reading List</span>
                                <ul class="book-list">${t.books.map((b,i)=>`<li><b>0${i+1}</b> ${b}</li>`).join('')}</ul>
                            </div>
                        `;
                        segment.appendChild(card);
                    });
                    roadmap.appendChild(segment);
                });
            },

            attachObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('revealed'); });
                }, { threshold: 0.1 });
                document.querySelectorAll('.month-segment').forEach(s => observer.observe(s));
            },

            celebrate(isSubtle = false) {
                if (window.confetti) {
                    confetti({
                        particleCount: isSubtle ? 40 : 120,
                        spread: isSubtle ? 50 : 100,
                        origin: { y: 0.1, x: 0.8 }, 
                        colors: ['#89BFA0', '#CBAE75', '#7CA6C1']
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
