<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Premium Private Explorer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bridge-green: #89BFA0;
            --bridge-gold: #CBAE75;
            --bridge-blue: #7CA6C1;
            --bridge-charcoal: #363431;
            --bridge-bg: #FCFBF9;
            --bridge-paper: #FFFFFF;
            --bridge-text-main: #2A2825;
            --bridge-text-muted: #8C8985;
            --bridge-border: #E8E6E1;
            --bridge-ai: #F4F8F5;
            
            --shadow-silk: 0 30px 60px rgba(54, 52, 49, 0.05);
            --shadow-hover: 0 40px 80px rgba(137, 191, 160, 0.15);
            --ease-silk: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* [CSS Reset & Base] */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: var(--bridge-bg); 
            color: var(--bridge-text-main); 
            line-height: 1.7; 
            overflow-x: hidden; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(137, 191, 160, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(203, 174, 117, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }

        /* [Creative Floating Elements for Kids] */
        .creative-float {
            position: fixed; z-index: -1; opacity: 0.15;
            font-family: 'Playfair Display', serif; font-weight: 900; color: var(--bridge-gold);
            animation: floatLetters 25s infinite ease-in-out alternate;
            user-select: none; pointer-events: none;
        }
        .cf-1 { font-size: 150px; top: 10%; left: 5%; animation-delay: 0s; color: var(--bridge-green); }
        .cf-2 { font-size: 200px; bottom: 15%; right: 5%; animation-delay: -5s; }
        .cf-3 { font-size: 100px; top: 40%; left: 80%; animation-delay: -10s; color: var(--bridge-blue); }
        .cf-4 { font-size: 120px; bottom: 10%; left: 20%; animation-delay: -15s; }
        
        @keyframes floatLetters { 
            0% { transform: translateY(0) rotate(0deg) scale(1); } 
            50% { transform: translateY(-30px) rotate(15deg) scale(1.1); } 
            100% { transform: translateY(0) rotate(-5deg) scale(1); } 
        }

        /* 🚨 [Header & Optimized Logo System] 🚨 */
        header {
            width: 100%; padding: 15px 5vw; 
            background: rgba(252, 251, 249, 0.9); 
            backdrop-filter: blur(25px); 
            position: sticky; top: 0; z-index: 2000;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(240, 239, 235, 0.8);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            transition: all 0.4s ease;
        }
        
        /* 로고 가시성 극대화 및 프라이빗 스쿨 느낌의 패딩 적용 */
        .brand-logo-img {
            height: 65px; /* 기존 48px에서 대폭 확대 */
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.5s var(--ease-silk);
            transform-origin: left center;
        }
        .brand-logo-img:hover { transform: scale(1.05); }
        
        .profile-widget {
            display: flex; align-items: center; gap: 15px;
            background: #FFF; padding: 6px 25px 6px 8px;
            border-radius: 50px; border: 1px solid var(--bridge-border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            cursor: pointer; transition: 0.4s var(--ease-silk);
        }
        .profile-widget:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(203,174,117,0.15); border-color: var(--bridge-gold); }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--bridge-border); color: var(--bridge-muted);
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 20px; border: 2px solid #FFF; transition: 0.3s;
        }
        .profile-widget.active .avatar { background: var(--bridge-gold); color: #FFF; box-shadow: 0 4px 15px rgba(203,174,117,0.4); }
        .profile-text { display: flex; flex-direction: column; justify-content: center; }
        .p-name { font-size: 15px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1.2; }
        .p-role { font-size: 11px; color: var(--bridge-text-muted); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* [Hero Section - Private School & Creative Vibe] */
        .hero { padding: 130px 6% 90px; text-align: center; position: relative; }
        
        .private-badge {
            display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: 6px; 
            color: var(--bridge-gold); text-transform: uppercase; margin-bottom: 25px;
            border: 1px solid var(--bridge-gold); padding: 8px 25px; border-radius: 100px;
            animation: fadeInDown 1s var(--ease-silk) forwards; opacity: 0; transform: translateY(20px);
        }
        
        .hero h1 { 
            font-family: 'Playfair Display', serif; font-size: 80px; font-weight: 900; 
            color: var(--bridge-charcoal); line-height: 1.15; margin-bottom: 30px; 
            animation: fadeInDown 1s var(--ease-silk) 0.2s forwards; opacity: 0; transform: translateY(20px); 
        }
        .hero h1 span.creative { 
            position: relative; display: inline-block;
        }
        .hero h1 span.creative::after {
            content: ''; position: absolute; bottom: 8px; left: 0; width: 100%; height: 18px;
            background: rgba(137, 191, 160, 0.3); z-index: -1; transform: rotate(-2deg);
        }
        .hero h1 span.italic-gold { color: var(--bridge-gold); font-style: italic; }
        
        .hero p { 
            font-size: 20px; color: var(--bridge-text-muted); max-width: 750px; margin: 0 auto; 
            font-weight: 400; line-height: 1.8; word-break: keep-all;
            animation: fadeInDown 1s var(--ease-silk) 0.4s forwards; opacity: 0; transform: translateY(20px); 
        }
        .hero p strong { color: var(--bridge-charcoal); font-weight: 700; }

        /* [Badge Showcase - Kids Reward System] */
        .badge-showcase {
            max-width: 1050px; margin: 0 auto 70px; padding: 30px 45px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid var(--bridge-border);
            display: flex; align-items: center; gap: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.03);
            opacity: 0; transform: translateY(30px); animation: fadeInDown 1s var(--ease-silk) 0.6s forwards;
            display: none;
        }
        .showcase-title { font-size: 13px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 4px; text-transform: uppercase; width: 150px; flex-shrink: 0; line-height: 1.4; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 12px; flex: 1; }
        .badge-item { 
            background: #FFF; padding: 10px 18px; border-radius: 50px; 
            font-size: 14px; font-weight: 900; color: var(--bridge-charcoal);
            border: 1px solid var(--bridge-border); display: flex; align-items: center; gap: 8px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .badge-item:hover { transform: scale(1.1) rotate(-3deg); border-color: var(--bridge-gold); box-shadow: 0 10px 25px rgba(203,174,117,0.25); color: var(--bridge-gold); }

        /* [Filter Dock] */
        .filter-dock { display: flex; justify-content: center; gap: 15px; margin-bottom: 90px; position: sticky; top: 95px; z-index: 1000; padding: 15px; }
        .filter-btn {
            padding: 16px 45px; border-radius: 100px; border: 1px solid var(--bridge-border); 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); 
            font-weight: 800; font-size: 13px; letter-spacing: 3px; cursor: pointer; transition: 0.4s var(--ease-silk); color: var(--bridge-text-muted); text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .filter-btn:hover { background: #FFF; color: var(--bridge-charcoal); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .filter-btn.active { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); transform: scale(1.05); box-shadow: 0 15px 35px rgba(54,52,49,0.25); }

        /* [Roadmap Content] */
        .roadmap { padding: 0 5vw 150px; max-width: 1500px; margin: 0 auto; scroll-margin-top: 190px; }
        .month-segment { margin-bottom: 200px; opacity: 0; transform: translateY(60px); transition: 1s var(--ease-silk); }
        .month-segment.revealed { opacity: 1; transform: translateY(0); }
        .month-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 80px; }
        .month-tag { font-size: 12px; font-weight: 900; color: var(--bridge-gold); letter-spacing: 10px; text-transform: uppercase; margin-bottom: 15px; }
        .month-name { font-family: 'Playfair Display', serif; font-size: 70px; font-weight: 900; color: var(--bridge-charcoal); line-height: 1; position: relative; display: inline-block; }
        .month-name::after { content: ''; position: absolute; width: 40px; height: 4px; background: var(--bridge-gold); bottom: -20px; left: 50%; transform: translateX(-50%); border-radius: 10px; }

        /* [The Master Card - Premium 3D Interaction] */
        .workbook-card {
            margin-bottom: 60px; background: var(--bridge-paper); border-radius: 40px; 
            box-shadow: var(--shadow-silk); border: 1px solid var(--bridge-border); 
            display: flex; cursor: pointer; transition: 0.6s var(--ease-silk); overflow: hidden;
            position: relative;
        }
        .workbook-card:hover { 
            transform: translateY(-15px) scale(1.01); 
            box-shadow: var(--shadow-hover); 
            border-color: rgba(203,174,117,0.4); 
        }
        
        .card-accent { width: 16px; transition: 0.6s; flex-shrink: 0; }
        .series-A .card-accent { background: var(--bridge-green); }
        .series-B .card-accent { background: var(--bridge-gold); }
        .series-C .card-accent { background: var(--bridge-blue); }
        .series-D .card-accent { background: var(--bridge-charcoal); }

        .card-main { flex: 1; padding: 80px 70px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .card-deco { position: absolute; right: -60px; top: -60px; width: 300px; height: 300px; border-radius: 50%; opacity: 0.02; transition: 1s var(--ease-silk); pointer-events: none; }
        .series-A .card-deco { background: radial-gradient(var(--bridge-green), transparent); }
        .series-B .card-deco { background: radial-gradient(var(--bridge-gold), transparent); }
        .workbook-card:hover .card-deco { transform: scale(1.6); opacity: 0.06; }

        .unit-badge { font-size: 11px; font-weight: 900; background: var(--bridge-bg); color: var(--bridge-muted); border: 1px solid var(--bridge-border); padding: 8px 20px; border-radius: 12px; width: max-content; margin-bottom: 30px; letter-spacing: 4px; z-index: 2; transition: 0.4s; }
        .workbook-card:hover .unit-badge { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); }

        .theme-h2 { font-family: 'Playfair Display', serif; font-size: 58px; font-weight: 900; color: var(--bridge-charcoal); margin-bottom: 20px; line-height: 1.1; z-index: 2; transition: 0.4s; }
        .workbook-card:hover .theme-h2 { color: var(--bridge-gold); }
        .theme-q { font-size: 22px; color: var(--bridge-text-muted); z-index: 2; font-weight: 400; }
        
        .cta-box { margin-top: 55px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .btn-enter { color: var(--bridge-charcoal); font-weight: 900; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; display: flex; align-items: center; gap: 15px; transition: 0.4s; }
        .btn-enter span { font-size: 22px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: var(--bridge-bg); width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 1px solid var(--bridge-border); }
        .workbook-card:hover .btn-enter { color: var(--bridge-gold); }
        .workbook-card:hover .btn-enter span { transform: translateX(15px); background: var(--bridge-gold); color: #FFF; border-color: var(--bridge-gold); box-shadow: 0 10px 20px rgba(203,174,117,0.3); }

        .progress-pill { 
            display: flex; align-items: center; gap: 12px; 
            background: #FFF; padding: 10px 25px; border-radius: 100px;
            font-size: 13px; font-weight: 900; color: var(--bridge-green); border: 1px solid rgba(137,191,160,0.3);
            box-shadow: 0 5px 15px rgba(137,191,160,0.1);
        }
        .progress-bar-bg { width: 70px; height: 6px; background: #E8E6E1; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--bridge-green); }

        .card-side { width: 420px; background: #FAFAF9; padding: 80px 60px; border-left: 1px solid var(--bridge-border); display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; z-index: 2; }
        .side-label { font-size: 11px; font-weight: 900; color: var(--bridge-text-muted); letter-spacing: 5px; margin-bottom: 35px; border-bottom: 1px solid var(--bridge-border); padding-bottom: 15px; text-transform: uppercase; }
        .book-list { list-style: none; }
        .book-list li { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--bridge-text-muted); margin-bottom: 20px; display: flex; gap: 18px; align-items: baseline; transition: 0.4s var(--ease-silk); }
        .book-list li b { font-size: 11px; font-weight: 900; color: var(--bridge-gold); opacity: 0.5; font-family: 'Noto Sans KR', sans-serif; transition: 0.4s; }
        .workbook-card:hover .book-list li { color: var(--bridge-charcoal); transform: translateX(8px); }
        .workbook-card:hover .book-list li b { opacity: 1; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* [Responsive Design Optimization] */
        @media (max-width: 1200px) {
            .hero h1 { font-size: 65px; }
            .theme-h2 { font-size: 45px; }
            .card-side { width: 320px; padding: 50px 30px; }
            .cf-1 { font-size: 100px; } .cf-2 { font-size: 120px; }
        }
        
        @media (max-width: 900px) {
            header { padding: 15px 5vw; }
            .brand-logo-img { height: 45px; } /* 모바일 최적화 로고 사이즈 */
            
            .profile-widget { padding: 6px 15px 6px 6px; }
            .avatar { width: 35px; height: 35px; font-size: 16px; }
            .p-role { display: none; }
            
            .creative-float { display: none; } /* 모바일에서는 깔끔함을 위해 숨김 */
            
            .hero { padding: 80px 5% 50px; }
            .private-badge { font-size: 10px; padding: 6px 20px; }
            .hero h1 { font-size: 42px; margin-bottom: 20px; }
            .hero p { font-size: 16px; }
            
            .badge-showcase { flex-direction: column; align-items: flex-start; gap: 15px; padding: 25px; border-radius: 20px; }

            .filter-dock { flex-wrap: wrap; gap: 10px; top: 75px; padding: 15px 5%; margin-bottom: 60px; }
            .filter-btn { padding: 12px 25px; font-size: 11px; letter-spacing: 2px; }

            .workbook-card { flex-direction: column; border-radius: 30px; }
            .card-accent { width: 100%; height: 12px; }
            .card-main { padding: 40px 30px; }
            .theme-h2 { font-size: 34px; }
            .theme-q { font-size: 18px; }
            
            .cta-box { flex-direction: column; align-items: flex-start; gap: 25px; margin-top: 40px; }
            
            .card-side { width: 100%; border-left: none; border-top: 1px solid var(--bridge-border); padding: 40px 30px; }
            .book-list li { font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape circle"></div>
    <div class="bg-shape blob"></div>
    <div class="creative-float cf-1">A</div>
    <div class="creative-float cf-2">?</div>
    <div class="creative-float cf-3">B</div>
    <div class="creative-float cf-4">!</div>

    <header>
        <img src="logo.png" alt="Bridge Academy" class="brand-logo-img" onclick="location.reload()">
        
        <div class="profile-widget" id="profile-widget" onclick="App.celebrate()">
            <div class="avatar" id="nav-avatar">?</div>
            <div class="profile-text">
                <span class="p-name" id="nav-name">New Explorer</span>
                <span class="p-role">Private Lab</span>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="private-badge">✧ Premium Private School ✧</div>
            <h1 id="hero-title">Where <span class="creative">Curiosity</span><br>Meets <span class="italic-gold">Excellence.</span></h1>
            <p id="hero-subtitle">집에서 만나는 <strong>가장 완벽한 프라이빗 스쿨.</strong><br>질문하고, 상상하고, 자유롭게 표현하는 북미식 IBL 탐구 세계로 초대합니다.</p>
        </section>

        <section class="badge-showcase" id="badge-showcase">
            <div class="showcase-title">🏆 Explorer<br>Trophies</div>
            <div class="badge-list" id="badge-list">
                </div>
        </section>

        <nav class="filter-dock" id="filter-dock">
            <button id="f-ALL" class="filter-btn active" onclick="App.filter('ALL')">All Units</button>
            <button id="f-A" class="filter-btn" onclick="App.filter('A')">Series A</button>
            <button id="f-B" class="filter-btn" onclick="App.filter('B')">Series B</button>
            <button id="f-C" class="filter-btn" onclick="App.filter('C')">Series C</button>
            <button id="f-D" class="filter-btn" onclick="App.filter('D')">Series D</button>
        </nav>

        <section id="roadmap" class="roadmap"></section>
    </main>

    <script>
        // ======================================================================
        // [Curriculum Database]
        // ======================================================================
        const DB = [
            { month: "Jan", unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1", books: ["I Like Myself!", "The Color Monster", "My Five Senses", "The Family Book", "From Head to Toe"] },
            { month: "Feb", unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2", books: ["The Very Hungry Caterpillar", "The Very Busy Spider", "The Grouchy Ladybug", "Waiting for Wings", "The Honeybee"] },
            { month: "Mar", unit: "A3", series: "A", theme: "My Super Family", question: "우리 가족은 어떤 초능력이 있을까?", id: "A-3", books: ["My Mom", "My Dad", "Love You Forever", "Guess How Much I Love You", "Night Before Mother's Day"] },
            { month: "Apr", unit: "A4", series: "A", theme: "Under the Sea", question: "바다 밑에는 누가 살고 있을까?", id: "A-4", books: ["The Pout-Pout Fish", "Ocean Commotion", "The Rainbow Fish", "I'm the Biggest Thing", "Swimmy"] },
            { month: "May", unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1", books: ["Me on the Map", "How We Do It", "Whoever You Are", "Madeline", "We're All Wonders"] },
            { month: "Jun", unit: "B2", series: "B", theme: "How Things Grow", question: "아주 작은 씨앗은 어떻게 꽃이 될까?", id: "B-2", books: ["The Tiny Seed", "Butterfly Cycle", "Planting a Rainbow", "Seed is Sleepy", "In the Garden"] }
            // 원장님의 커리큘럼에 맞춰 계속 확장 가능합니다.
        ];

        // ======================================================================
        // [Application Logic]
        // ======================================================================
        const App = {
            currentFilter: 'ALL',
            studentData: {}, 

            init() { 
                this.loadStudentData();
                this.updateProfileUI();
                this.render(); 
                this.attachObserver(); 
                
                setTimeout(() => {
                    if(this.studentData['A-1'] && this.studentData['A-1'].name) {
                        this.celebrate(true);
                    }
                }, 1000);
            },

            loadStudentData() {
                DB.forEach(item => {
                    const saved = localStorage.getItem(`br_v100_${item.id}`);
                    if(saved) {
                        try {
                            this.studentData[item.id] = JSON.parse(saved);
                        } catch(e) {}
                    }
                });
            },

            updateProfileUI() {
                const mainData = this.studentData['A-1'];
                
                if (mainData && mainData.name) {
                    const firstName = mainData.name.split(' ')[0];
                    
                    const widget = document.getElementById('profile-widget');
                    widget.classList.add('active');
                    document.getElementById('nav-name').innerText = mainData.name;
                    document.getElementById('nav-avatar').innerText = mainData.name.charAt(0).toUpperCase();
                    
                    // 프라이빗 스쿨 컨셉에 맞춘 환영 문구
                    document.getElementById('hero-title').innerHTML = `Welcome back to your <br><span class="highlight italic-gold">Private Lab,</span> ${firstName}.`;
                    document.getElementById('hero-subtitle').innerHTML = `마법 같은 캔버스와 AI 선생님이 기다리고 있습니다.<br><strong>${firstName}</strong>만의 멋진 탐구 여정을 계속해볼까요?`;

                    let allBadges = [];
                    Object.values(this.studentData).forEach(data => {
                        if(data.badges && Array.isArray(data.badges)) {
                            allBadges = allBadges.concat(data.badges);
                        }
                    });

                    const uniqueBadges = [...new Set(allBadges)];
                    if (uniqueBadges.length > 0) {
                        const showcase = document.getElementById('badge-showcase');
                        const list = document.getElementById('badge-list');
                        showcase.style.display = 'flex';
                        list.innerHTML = '';
                        
                        uniqueBadges.forEach(badge => {
                            const bEl = document.createElement('div');
                            bEl.className = 'badge-item';
                            bEl.innerText = badge;
                            list.appendChild(bEl);
                        });
                    }
                }
            },

            // 🚨 과정(Series) 필터 클릭 시 즉각 이동(Auto-Scroll) 로직 구현
            filter(f) { 
                this.currentFilter = f; 
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`f-${f}`).classList.add('active');
                this.render();
                setTimeout(() => this.attachObserver(), 50);

                // 필터를 누르자마자 리스트 시작점으로 부드럽게 스크롤 (헤더 높이 + 여유 공간 계산)
                const roadmapEl = document.getElementById('roadmap');
                const headerHeight = document.querySelector('header').offsetHeight;
                const offsetPosition = roadmapEl.getBoundingClientRect().top + window.scrollY - headerHeight - 110;
                
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            },

            render() {
                const roadmap = document.getElementById('roadmap');
                roadmap.innerHTML = "";
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                
                months.forEach(m => {
                    const items = DB.filter(d => d.month === m && (this.currentFilter === 'ALL' || d.series === this.currentFilter));
                    if(items.length === 0) return;
                    
                    const segment = document.createElement('div');
                    segment.className = 'month-segment';
                    segment.innerHTML = `
                        <div class="month-header">
                            <span class="month-tag">Learning Cycle</span>
                            <h2 class="month-name">${m.toUpperCase()}</h2>
                        </div>
                    `;
                    
                    items.forEach(t => {
                        const card = document.createElement('div');
                        card.className = `workbook-card series-${t.series}`;
                        card.onclick = () => { window.location.href = `workbook.html?id=${t.id}`; };
                        
                        let progressUI = '';
                        let ctaText = 'Start Adventure';
                        const unitData = this.studentData[t.id];
                        
                        if (unitData && unitData.page > 1) {
                            const progress = Math.min(Math.round((unitData.page / 17) * 100), 100);
                            ctaText = 'Continue Exploring';
                            progressUI = `
                                <div class="progress-pill">
                                    ${progress}% 
                                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="card-accent"></div>
                            <div class="card-main">
                                <div class="card-deco"></div>
                                <div class="unit-badge">UNIT ${t.id}</div>
                                <h2 class="theme-h2">${t.theme}</h2>
                                <p class="theme-q">"${t.question}"</p>
                                <div class="cta-box">
                                    <div class="btn-enter">${ctaText} <span>→</span></div>
                                    ${progressUI}
                                </div>
                            </div>
                            <div class="card-side">
                                <span class="side-label">Curated Reading List</span>
                                <ul class="book-list">${t.books.map((b,i)=>`<li><b>0${i+1}</b> ${b}</li>`).join('')}</ul>
                            </div>
                        `;
                        segment.appendChild(card);
                    });
                    roadmap.appendChild(segment);
                });
            },

            attachObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('revealed'); });
                }, { threshold: 0.1 });
                document.querySelectorAll('.month-segment').forEach(s => observer.observe(s));
            },

            celebrate(isSubtle = false) {
                if (window.confetti) {
                    confetti({
                        particleCount: isSubtle ? 40 : 150,
                        spread: isSubtle ? 50 : 120,
                        origin: { y: 0.1, x: 0.85 }, 
                        colors: ['#89BFA0', '#CBAE75', '#7CA6C1']
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
