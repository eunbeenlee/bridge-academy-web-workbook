<!-- index.html의 <style> 섹션에 아래 내용을 덮어씌워 주세요 -->
<style>
    :root { 
        --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; 
        --bridge-bg: #F7F9F8; --bridge-paper: #FFFFFF; --bridge-gold: #C5A059;
    }

    /* Cinematic Series Card */
    .series-card { 
        background: var(--bridge-paper); 
        border-radius: 40px; 
        overflow: hidden; 
        position: relative; 
        box-shadow: 0 30px 100px rgba(58, 58, 66, 0.08); 
        border: 1px solid rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
    }

    /* 이미지 컨테이너: 단순 그래픽 대신 깊이감 있는 비주얼 배치 영역 */
    .card-image { 
        width: 100%; 
        height: 320px; 
        background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%); 
        position: relative;
        overflow: hidden;
    }
    
    /* 럭셔리 포인트: 이미지 위에 은은한 그라데이션 오버레이 */
    .card-image::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; width: 100%; height: 50%;
        background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0));
    }

    .card-content { padding: 45px; text-align: left; }
    
    /* 타이포그래피 업그레이드 */
    .tag { 
        font-size: 11px; font-weight: 900; color: var(--bridge-green); 
        text-transform: uppercase; letter-spacing: 3px; margin-bottom: 15px; 
        display: inline-block; border-bottom: 2px solid var(--bridge-green);
        padding-bottom: 5px;
    }

    .series-title { 
        font-family: 'Playfair Display', serif; 
        font-size: 32px; margin-bottom: 20px; font-weight: 500; 
        color: var(--bridge-charcoal);
    }

    .series-desc { 
        font-size: 15px; color: #777; line-height: 1.9; margin-bottom: 35px; 
        word-break: keep-all; font-weight: 300;
    }

    .btn-enter { 
        width: 100%; padding: 22px; border-radius: 20px; 
        background: var(--bridge-charcoal); color: #FFF; 
        border: none; font-weight: 700; cursor: pointer; 
        font-size: 16px; letter-spacing: 2px;
        box-shadow: 0 10px 30px rgba(58, 58, 66, 0.15);
    }
    
    .btn-enter:hover { 
        background: var(--bridge-green);
        transform: scale(1.02);
    }
</style>

<!-- 카드 섹션 HTML 부분 -->
<div class="series-card" onclick="location.href='workbook.html?series=A1'">
    <div class="card-image">
        <!-- 여기에 고화질 '탐구하는 아이' 사진을 넣으면 퀄리티가 완성됩니다 -->
        <img src="elite_inquiry_A1.jpg" alt="Elite Inquiry A1" style="width:100%; height:100%; object-fit:cover;">
    </div>
    <div class="card-content">
        <span class="tag">Foundation Series</span>
        <div class="series-title">Inquiry Level: A1</div>
        <p class="series-desc">
            자아 인식(Self-Awareness)과 기초 감각 탐구를 통해 <br>
            북미 정통 사립학교의 창의적 사고 체계를 형성하는 프리미엄 입문 과정입니다.
        </p>
        <button class="btn-enter">START INQUIRY JOURNEY</button>
    </div>
</div>
