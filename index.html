<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Academy | Elite Digital Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; --bridge-bg: #F7F9F8; --bridge-paper: #FFFFFF; }
        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--bridge-bg); margin: 0; color: var(--bridge-charcoal); }
        header { padding: 30px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .logo { max-width: 180px; cursor: pointer; }
        .hero { padding: 80px 8% 40px; text-align: center; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 48px; margin-bottom: 15px; }
        .btn-magic-scan { padding: 20px 45px; border-radius: 60px; background: var(--bridge-green); color: #FFF; border: none; font-weight: 800; cursor: pointer; letter-spacing: 2px; box-shadow: 0 15px 40px rgba(140, 198, 159, 0.3); }
        .month-section { padding: 40px 8%; }
        .month-title { font-family: 'Playfair Display', serif; font-size: 32px; border-bottom: 2px solid var(--bridge-green); display: inline-block; padding-bottom: 10px; margin-bottom: 40px; }
        .curriculum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .book-card { background: var(--bridge-paper); border-radius: 25px; overflow: hidden; box-shadow: 0 20px 50px rgba(58, 58, 66, 0.05); cursor: pointer; }
        .book-card:hover { transform: translateY(-10px); }
        .book-thumb { width: 100%; height: 200px; background: #EEE; display: flex; align-items: center; justify-content: center; }
        .book-info { padding: 25px; }
        .book-tag { font-size: 9px; font-weight: 900; color: var(--bridge-green); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 8px; }
        .book-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; height: 50px; overflow: hidden; }
        #scanner-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(247, 249, 248, 0.98); backdrop-filter: blur(20px); z-index: 1000; flex-direction:column; align-items:center; justify-content:center; }
        .scanner-frame { position: relative; width: 100%; max-width: 450px; border-radius: 30px; overflow: hidden; border: 8px solid #FFF; }
        #scan-video { width: 100%; display: block; }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--bridge-green); animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        footer { padding: 60px 8%; background: var(--bridge-charcoal); color: rgba(255,255,255,0.4); text-align: center; }
    </style>
</head>
<body>
<header><img src="logo.png" class="logo"><div style="font-size:10px; font-weight:700; letter-spacing:3px;">Q1 CAMPUS</div></header>
<section class="hero"><h1>Redefining Inquiry Excellence</h1><button class="btn-magic-scan" onclick="openScanner()">✨ MAGIC BOOK SCAN</button></section>
<div id="curriculum-content"></div>
<div id="scanner-modal">
    <div class="scanner-frame"><video id="scan-video" autoplay playsinline></video><div class="scan-line"></div></div>
    <div id="scan-status" style="margin-top: 30px; font-size: 18px; font-weight: 700;">Align book cover</div>
    <button onclick="identifyBook()" style="margin-top: 30px; padding: 18px 50px; border-radius: 50px; background: var(--bridge-charcoal); color: #FFF; border: none; font-weight: 800; cursor: pointer;">IDENTIFY BOOK</button>
    <button onclick="closeScanner()" style="margin-top:20px; background:none; border:none; color:#AAA; cursor:pointer;">Close</button>
</div>
<footer>© 2026 BRIDGE ACADEMY</footer>

<script src="library.js"></script>
<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    function renderCurriculum() {
        const container = document.getElementById('curriculum-content');
        ["Jan", "Feb", "Mar"].forEach(month => {
            const monthData = BRIDGE_LIBRARY.filter(b => b.month === month);
            const section = document.createElement('section'); section.className = 'month-section';
            section.innerHTML = `<h2 class="month-title">${month.toUpperCase()} INQUIRY</h2>`;
            const grid = document.createElement('div'); grid.className = 'curriculum-grid';
            monthData.forEach(book => {
                const card = document.createElement('div'); card.className = 'book-card';
                card.onclick = () => location.href = `workbook.html?id=${book.id}`;
                card.innerHTML = `<div class="book-thumb"><img src="${book.id}.png" onerror="this.src='placeholder.png'" style="width:100%;height:100%;object-fit:cover;"></div><div class="book-info"><span class="book-tag">${book.theme}</span><div class="book-title">${book.title}</div></div>`;
                grid.appendChild(card);
            });
            section.appendChild(grid); container.appendChild(section);
        });
    }
    let stream;
    async function openScanner() { document.getElementById('scanner-modal').style.display = 'flex'; try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); document.getElementById('scan-video').srcObject = stream; } catch (err) { closeScanner(); } }
    function closeScanner() { if (stream) stream.getTracks().forEach(t => t.stop()); document.getElementById('scanner-modal').style.display = 'none'; }
    async function identifyBook() {
        const video = document.getElementById('scan-video'); const canvas = document.createElement('canvas'); canvas.width = 500; canvas.height = 375;
        canvas.getContext('2d').drawImage(video, 0, 0, 500, 375);
        const base64Img = canvas.toDataURL("image/jpeg", 0.6).split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Identify title ONLY." }, { inline_data: { mime_type: "image/jpeg", data: base64Img } }] }] })
            });
            const d = await res.json(); const title = d.candidates[0].content.parts[0].text.trim();
            const matched = BRIDGE_LIBRARY.find(b => title.toLowerCase().includes(b.title.toLowerCase()));
            if (matched) location.href = `workbook.html?id=${matched.id}`;
        } catch (e) { document.getElementById('scan-status').innerText = "Try again."; }
    }
    window.onload = renderCurriculum;
</script>
</body>
</html>
