<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Academy | Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root { --br-green: #89BFA0; --br-charcoal: #363431; --br-bg: #FCFBF9; }
        body { background-color: var(--br-bg); font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 50px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; color: var(--br-charcoal); margin-bottom: 40px; }
        .logo span { color: var(--br-green); font-style: italic; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #EEE; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--br-green); box-shadow: 0 0 10px rgba(137,191,160,0.1); }
        button { width: 100%; padding: 16px; background: var(--br-charcoal); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: var(--br-green); transform: translateY(-2px); }
        .error-msg { color: #E74C3C; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Bridge<span>Academy</span></div>
        <p style="color:#888; font-size: 14px; margin-bottom: 30px;">Student & Parent Portal</p>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button onclick="handleLogin()">Login to Portal</button>
        <div id="error-msg" class="error-msg">이메일 또는 비밀번호가 일치하지 않습니다.</div>
    </div>

    <script>
        // 원장님의 Firebase 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyACTwFv5V9eXKKaQODzZokBkwGk8mB8AAk",
            authDomain: "bridge-academy-6d6a9.firebaseapp.com",
            projectId: "bridge-academy-6d6a9",
            storageBucket: "bridge-academy-6d6a9.firebasestorage.app",
            messagingSenderId: "581314243350",
            appId: "1:581314243350:web:57897ed73d787eb02efe37"
        };

        firebase.initializeApp(firebaseConfig);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                // 로그인 성공 시 대시보드로 이동
                location.href = 'dashboard.html';
            } catch (error) {
                errorEl.style.display = 'block';
                console.error("Login Error:", error.message);
            }
        }
    </script>
</body>
</html>
