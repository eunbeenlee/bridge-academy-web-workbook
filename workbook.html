<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium AI Lab V100.5</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        /* ======================================================================
         * [CSS Variables & Design Tokens]
         * ====================================================================== */
        :root {
            --br-green: #89BFA0; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            --br-error: #E74C3C; 
            --br-ai: #F4F8F5;
            --sidebar-width: 320px;
        }

        /* ======================================================================
         * [Global Reset]
         * ====================================================================== */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body { 
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Noto Sans KR', sans-serif; 
            pointer-events: auto !important; 
        }

        button { 
            border: none; 
            background: none; 
            font-family: inherit; 
            cursor: pointer; 
            outline: none; 
        }
        
        .app-container { 
            display: flex; 
            width: 100vw; 
            height: 100dvh; 
            position: relative; 
            pointer-events: auto !important; 
        }
        
        /* ======================================================================
         * [Sidebar Layout]
         * ====================================================================== */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            background: var(--br-paper); 
            border-right: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            flex-shrink: 0; 
            transition: transform 0.4s ease; 
        }

        .sidebar-header { 
            padding: 30px; 
            text-align: center; 
            border-bottom: 1px solid var(--br-border); 
            cursor: pointer; 
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 26px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
        }
        
        /* ======================================================================
         * [Student Profile & Badges]
         * ====================================================================== */
        .student-profile { 
            padding: 20px 30px; 
            border-bottom: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #FAFAFA; 
            transition: 0.3s; 
        }

        .student-profile.registered { 
            background: var(--br-ai); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .profile-avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            background: var(--br-border); 
            color: #FFF; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 20px; 
            transition: 0.3s; 
        }

        .student-profile.registered .profile-avatar { 
            background: var(--br-gold); 
            box-shadow: 0 5px 15px rgba(203,174,117,0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .profile-name { 
            font-size: 16px; 
            font-weight: 900; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .profile-role { 
            font-size: 11px; 
            color: var(--br-muted); 
            letter-spacing: 1px; 
        }
        
        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
        }

        .badge { 
            font-size: 11px; 
            padding: 4px 8px; 
            border-radius: 10px; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
            animation: popIn 0.3s ease; 
        }

        /* ======================================================================
         * [Navigation List]
         * ====================================================================== */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }

        .nav-item { 
            padding: 15px; 
            margin-bottom: 8px; 
            border-radius: 12px; 
            background: #FAFAFA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: 0.2s; 
        }

        .nav-item.active { 
            background: var(--br-ai); 
            border-left: 5px solid var(--br-green); 
            font-weight: 800; 
        }

        .nav-title { 
            font-size: 13px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 160px; 
        }

        .nav-badge { 
            font-size: 10px; 
            font-weight: 900; 
            opacity: 0.4; 
        }
        
        /* ======================================================================
         * [Main Workspace & Top Bar]
         * ====================================================================== */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            min-width: 0; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: 75px; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            flex-shrink: 0; 
            z-index: 10; 
        }

        .unit-info { 
            font-size: 12px; 
            font-weight: 900; 
            color: var(--br-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }

        .page-info { 
            font-family: 'Playfair Display', serif; 
            font-size: 30px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            margin-top: 5px; 
        }
        
        /* ======================================================================
         * [Stage & Drawing Board]
         * ====================================================================== */
        .stage-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px 40px; 
            background: var(--br-bg); 
            perspective: 1000px; 
            pointer-events: auto !important; 
            overflow: hidden; 
        }

        .drawing-board { 
            position: relative; 
            display: inline-flex; 
            line-height: 0; 
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            background: #FFF; 
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-origin: center; 
            pointer-events: auto !important; 
        }

        .drawing-board.fade-out { 
            opacity: 0; 
            transform: scale(0.95) translateY(10px); 
            pointer-events: none !important; 
        }

        #worksheet-img { 
            display: block; 
            max-width: 100%; 
            max-height: calc(100dvh - 220px); 
            width: auto; 
            height: auto; 
            border-radius: 15px; 
            pointer-events: none !important; 
            opacity: 0; 
            transition: opacity 0.3s; 
            user-select: none; 
        }

        #draw-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 9999 !important; 
            touch-action: none; 
            pointer-events: auto !important; 
            border-radius: 15px; 
            cursor: crosshair; 
        }

        /* ======================================================================
         * [Bottom Dock & Drawing Tools]
         * ====================================================================== */
        .bottom-dock { 
            height: 100px; 
            background: rgba(255, 255, 255, 0.95); 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 40px; 
            flex-shrink: 0; 
            z-index: 500; 
        }

        .tool-group { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: #FAFAFA; 
            padding: 10px 25px; 
            border-radius: 100px; 
            border: 1px solid var(--br-border); 
        }

        .color-preview { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            border: 3px solid #FFF; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        
        .btn-magic { 
            font-size: 20px; 
            padding: 5px; 
            cursor: pointer; 
            transition: 0.2s; 
            filter: grayscale(100%); 
        }

        .btn-magic.active { 
            filter: grayscale(0%); 
            transform: scale(1.2); 
        }

        .brush-slider { 
            width: 90px; 
            accent-color: var(--br-green); 
            cursor: pointer; 
            height: 6px; 
        }

        .btn-tool { 
            font-size: 16px; 
            font-weight: 900; 
            padding: 8px 12px; 
            color: var(--br-charcoal); 
            cursor: pointer; 
            transition: 0.2s; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            border-radius: 10px; 
        }

        .btn-tool:active { 
            transform: scale(0.9); 
        }

        .btn-erase { 
            font-size: 13px; 
            font-weight: 900; 
            padding: 10px 15px; 
            border-radius: 12px; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            cursor: pointer; 
            transition: 0.3s; 
            color: var(--br-charcoal); 
        }

        .btn-erase.active { 
            background: var(--br-error); 
            color: #FFF; 
            border-color: var(--br-error); 
        }
        
        /* ======================================================================
         * [Action Group & Primary Buttons]
         * ====================================================================== */
        .action-group { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }

        .btn-nav { 
            width: 55px; 
            height: 55px; 
            border-radius: 15px; 
            border: 1px solid var(--br-border); 
            background: #FFF; 
            font-size: 22px; 
            cursor: pointer; 
            transition: 0.2s; 
            color: var(--br-charcoal); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .btn-nav:active { 
            transform: scale(0.9); 
        }

        .btn-main { 
            height: 55px; 
            padding: 0 25px; 
            border-radius: 15px; 
            font-weight: 900; 
            font-size: 14px; 
            letter-spacing: 1px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: 0.2s; 
            text-transform: uppercase; 
        }

        .btn-main:active { 
            transform: scale(0.95); 
        }

        .btn-record { 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
        }

        .btn-record.recording { 
            background: #FFF0F0; 
            color: var(--br-error); 
            border-color: var(--br-error); 
        }

        .btn-record .dot { 
            width: 10px; 
            height: 10px; 
            background: var(--br-error); 
            border-radius: 50%; 
            opacity: 0; 
        }

        .btn-record.recording .dot { 
            opacity: 1; 
            animation: blink 1s infinite; 
        }

        .btn-submit { 
            background: var(--br-charcoal); 
            color: #FFF; 
        }

        /* ======================================================================
         * [AI Tutor Panel & Chat Interface]
         * ====================================================================== */
        .ai-panel { 
            position: absolute; 
            top: 0; 
            right: -450px; 
            width: 450px; 
            height: 100%; 
            background: #FFF; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.08); 
            z-index: 10001; 
            transition: right 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--br-border); 
        }

        .ai-panel.open { 
            right: 0; 
        }

        .ai-header { 
            padding: 25px; 
            background: var(--br-ai); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            flex-shrink: 0; 
        }

        .ai-title { 
            font-size: 18px; 
            font-weight: 900; 
            color: var(--br-green); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .btn-close-ai { 
            font-size: 32px; 
            color: var(--br-muted); 
            line-height: 1; 
            cursor: pointer; 
        }
        
        .ai-content { 
            padding: 25px; 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scroll-behavior: smooth; 
        }
        
        .chat-bubble { 
            max-width: 85%; 
            padding: 18px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.6; 
            font-weight: 500; 
            word-break: keep-all; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background: #F8F9FA; 
            border-bottom-left-radius: 5px; 
            border: 1px solid var(--br-border); 
            color: var(--br-text); 
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background: var(--br-green); 
            color: #FFF; 
            border-bottom-right-radius: 5px; 
            box-shadow: 0 5px 15px rgba(137,191,160,0.2); 
        }

        /* ======================================================================
         * [AI Analytics Card - Enhanced Details]
         * ====================================================================== */
        .analytics-card { 
            background: #FAFAFA; 
            border: 1px solid var(--br-border); 
            border-radius: 18px; 
            padding: 20px; 
            align-self: stretch; 
            animation: popIn 0.4s ease; 
            margin-bottom: 5px; 
        }

        .analytics-title {
            color: var(--br-gold);
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-row { 
            margin-bottom: 15px; 
        }

        .stat-label { 
            font-size: 12px; 
            font-weight: 900; 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 6px; 
            color: var(--br-charcoal); 
        }

        .bar-bg { 
            width: 100%; 
            height: 8px; 
            background: #E0E0E0; 
            border-radius: 10px; 
            overflow: hidden; 
        }

        .bar-fill { 
            height: 100%; 
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 10px; 
        }

        .transcript-box {
            background: #F4F8F5;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--br-green);
            font-style: italic;
            font-size: 14px;
            margin-bottom: 20px;
            color: var(--br-charcoal);
            line-height: 1.5;
        }

        .voice-fx-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 20px; 
            justify-content: center; 
        }

        .btn-fx { 
            padding: 8px 12px; 
            border-radius: 10px; 
            font-size: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            border: 1px solid var(--br-border); 
            background: #FFF; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            color: var(--br-charcoal); 
        }

        .btn-fx:hover { 
            background: var(--br-ai); 
            transform: translateY(-2px); 
            box-shadow: 0 5px 10px rgba(0,0,0,0.05); 
        }

        /* ======================================================================
         * [Chat Footer & Reply Inputs]
         * ====================================================================== */
        .chat-footer { 
            padding: 20px 25px; 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #FFF; 
        }

        .btn-reply { 
            width: 100%; 
            height: 55px; 
            background: var(--br-charcoal); 
            color: #FFF; 
            border-radius: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 15px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
        }

        .btn-reply.recording { 
            background: var(--br-error); 
            animation: pulse 1.5s infinite; 
        }

        .btn-next-page { 
            width: 100%; 
            height: 55px; 
            background: var(--br-blue); 
            color: #FFF; 
            border-radius: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 5px 15px rgba(124,166,193,0.3); 
            font-size: 15px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .btn-next-page:active { 
            transform: scale(0.95); 
        }

        .ai-name-input { 
            width: 100%; 
            padding: 15px; 
            border: 2px dashed var(--br-green); 
            border-radius: 12px; 
            margin-top: 15px; 
            font-size: 16px; 
            text-align: center; 
            font-weight: 800; 
            outline: none; 
        }

        /* ======================================================================
         * [Modals & Overlay Components]
         * ====================================================================== */
        .rgb-modal { 
            position: absolute; 
            bottom: 120px; 
            left: 40px; 
            background: #FFF; 
            border-radius: 25px; 
            padding: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            z-index: 5000; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
            transition: 0.3s ease; 
        }

        .rgb-modal.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0); 
        }

        .cert-modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100dvh; 
            background: rgba(0,0,0,0.8); 
            z-index: 30000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: 0.4s ease; 
            backdrop-filter: blur(10px); 
        }

        .cert-modal-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .cert-card { 
            background: #FFF; 
            width: 800px; 
            max-width: 90%; 
            border-radius: 30px; 
            padding: 50px; 
            text-align: center; 
            position: relative; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.3); 
            transform: scale(0.8); 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .cert-modal-overlay.active .cert-card { 
            transform: scale(1); 
        }

        .cert-border { 
            border: 8px solid var(--br-gold); 
            border-radius: 20px; 
            padding: 40px; 
            position: relative; 
        }

        .cert-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 45px; 
            color: var(--br-charcoal); 
            font-weight: 900; 
            margin-bottom: 10px; 
        }

        .cert-subtitle { 
            font-size: 16px; 
            color: var(--br-muted); 
            font-weight: 700; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-bottom: 30px; 
        }

        .cert-name { 
            font-size: 35px; 
            color: var(--br-green); 
            font-weight: 900; 
            margin-bottom: 20px; 
            text-decoration: underline; 
            text-decoration-color: var(--br-gold); 
        }

        .cert-img-container { 
            width: 100%; 
            max-width: 400px; 
            height: 250px; 
            margin: 0 auto 30px; 
            border-radius: 15px; 
            border: 2px dashed var(--br-border); 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: var(--br-bg); 
        }

        .cert-img-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        .cert-msg { 
            font-size: 16px; 
            color: var(--br-text); 
            line-height: 1.6; 
            font-weight: 500; 
            margin-bottom: 30px; 
            font-style: italic; 
        }

        .btn-print { 
            background: var(--br-charcoal); 
            color: #FFF; 
            padding: 15px 40px; 
            font-size: 16px; 
            font-weight: 900; 
            border-radius: 100px; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            transition: 0.3s; 
        }

        .btn-print:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 25px rgba(0,0,0,0.15); 
        }

        .cert-close { 
            position: absolute; 
            top: 20px; 
            right: 30px; 
            font-size: 30px; 
            color: var(--br-muted); 
            cursor: pointer; 
            font-weight: 900; 
        }

        /* ======================================================================
         * [Animations]
         * ====================================================================== */
        @keyframes popIn { 
            from { opacity: 0; transform: scale(0.9) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }

        @keyframes blink { 
            50% { opacity: 0.3; } 
        }

        @keyframes pulse { 
            0% { opacity: 0.8; transform: scale(0.98); } 
            50% { opacity: 1; transform: scale(1.02); } 
            100% { opacity: 0.8; transform: scale(0.98); } 
        }

        .mobile-menu-btn { 
            display: none; 
            font-size: 28px; 
            padding: 10px; 
            color: var(--br-charcoal); 
            z-index: 1500; 
        }

        /* ======================================================================
         * [Media Queries for Responsive Layout]
         * ====================================================================== */
        @media (max-width: 1024px) {
            :root { --sidebar-width: 260px; }
            .top-bar { height: 70px; padding: 0 20px; }
            .bottom-dock { height: 100px; padding: 0 20px; }
            .stage-wrapper { padding: 10px 20px; }
            .rgb-modal { left: 20px; bottom: 110px; }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; left: calc(var(--sidebar-width) * -1); top: 0; box-shadow: none; }
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            #worksheet-img { max-height: calc(100dvh - 210px); }
            .bottom-dock { height: 140px; flex-direction: column; justify-content: center; padding: 10px 20px; gap: 12px; border-radius: 25px 25px 0 0; }
            .tool-group { width: 100%; justify-content: center; padding: 8px 20px; }

            .btn-nav, .btn-main { height: 50px; font-size: 13px; }

            .rgb-modal { left: 50%; transform: translateX(-50%) translateY(20px); bottom: 160px; }
            .rgb-modal.active { transform: translateX(-50%) translateY(0); }
            .cert-card { padding: 30px 20px; }
            .cert-border { padding: 20px; }
            .cert-title { font-size: 30px; }
        }

<body>

    <div class="app-container">
        
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header" onclick="location.href='dashboard.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>

                        <span class="profile-name" id="display-name">Inquirer</span>
                        <span class="profile-role">Bridge Explorer</span>
                    </div>

            <div class="nav-list" id="nav-list">

                <div class="action-group">
                    <button class="btn-nav" onclick="AppEngine.smoothMove(-1)">◀</button>

                    </button>

                    <button class="btn-nav" onclick="AppEngine.smoothMove(1)">▶</button>

        </div>

        <div class="rgb-modal" id="rgb-modal">
            <canvas id="color-wheel" width="150" height="150"></canvas>

        </div>

        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">✨ AI Tutor</div>
                <button class="btn-close-ai" onclick="AITutor.close()">×</button>
            </div>
            
            <div class="ai-content" id="ai-content">
                </div>
            
            <div class="chat-footer" id="chat-footer" style="display:none;">
                <button class="btn-reply" id="btn-chat-record" onclick="AudioEngine.toggleChat()">🎤 Speak to Reply</button>

            </div>

        <div class="cert-modal-overlay" id="cert-modal">
            <div class="cert-card" id="cert-card-content">
                <div class="cert-close" onclick="CertificateEngine.close()">×</div>

                    <div class="cert-title">Certificate of Exploration</div>
                    <p style="margin-bottom: 20px; color: var(--br-muted); font-weight: 500;">This magical certificate is proudly presented to</p>
                    <div class="cert-name" id="cert-student-name">Student Name</div>
                    
                    <div class="cert-img-container">
                        <img id="cert-canvas-img" src="" alt="My Masterpiece">
                    </div>
                    
                    <div class="cert-msg" id="cert-ai-msg">"For showing amazing creativity and speaking with a clear, beautiful voice."</div>
                    
                    <button class="btn-print" onclick="CertificateEngine.print()">🖨️ Save & Print</button>

    <script>
        /**
         * System Configuration
         */
        const CONFIG = { 
            STORAGE_URL: "https://eunbeenlee.github.io/bridge-heritage/assets/" 
        };

        /**
         * Global Application State Management
         */
        const STATE = {
            studentName: "", 
            isNameRegistered: false,
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1, 
            isRecording: false, 
            lastTranscript: "",
            audioStartTime: 0, 
            audioDurationSec: 0, 
            sttConfidence: 0,
            isChatMode: false, 
            historyStack: [], 
            historyIndex: -1,
            audioBlobUrl: null, 
            badges: [], 
            brushType: 'normal', 
            rainbowHue: 0
        };

        /**
         * Storage Engine for Local Data Persistence
         */
        const StorageEngine = {
            /**
             * Saves the current user profile state to localStorage.
             */
            save() { 
                const stateData = { 
                    name: STATE.studentName, 
                    reg: STATE.isNameRegistered, 
                    page: STATE.currentPage, 
                    badges: STATE.badges 
                };
                localStorage.setItem(`br_v105_${STATE.id}`, JSON.stringify(stateData)); 
            },
            
            /**
             * Loads user profile state from localStorage.
             */
            load() {
                const s = JSON.parse(localStorage.getItem(`br_v105_${STATE.id}`) || "{}");
                
                if (s.name) {
                    STATE.studentName = s.name; 
                }
                if (s.reg) {
                    STATE.isNameRegistered = s.reg; 
                }
                if (s.page) {
                    STATE.currentPage = s.page; 
                }
                if (s.badges) {
                    STATE.badges = s.badges;
                }
            },
            
            /**
             * Saves the current canvas drawing to localStorage for the specific page.
             */
            saveCanvas() {
                if (!CanvasEngine.cvs) {
                    return;
                }
                const canvasData = CanvasEngine.cvs.toDataURL();
                localStorage.setItem(`br_cvs_${STATE.id}_${STATE.currentPage}`, canvasData);
            },
            
            /**
             * Loads the canvas drawing from localStorage for the specific page.
             */
            loadCanvas() {
                const data = localStorage.getItem(`br_cvs_${STATE.id}_${STATE.currentPage}`);
                
                if (data) {
                    const img = new Image();
                    img.onload = () => {
                        CanvasEngine.ctx.drawImage(
                            img, 
                            0, 
                            0, 
                            CanvasEngine.cvs.width / CanvasEngine.dpr, 
                            CanvasEngine.cvs.height / CanvasEngine.dpr
                        );
                        // Save restored image to history stack
                        CanvasEngine.saveHistory();
                    };
                    img.src = data;
                } else {
                    // Ensure empty state is pushed to history stack
                    CanvasEngine.saveHistory();
                }
            }
        };

        /**
         * Certificate Engine for generating and downloading awards
         */
        const CertificateEngine = {
            /**
             * Opens the certificate modal and populates it with user data.
             */
            open(weekNum) {
                const modal = document.getElementById('cert-modal');
                
                document.getElementById('cert-week').innerText = `WEEK ${weekNum} COMPLETED`;
                document.getElementById('cert-student-name').innerText = STATE.studentName || "Bridge Explorer";
                
                const img = document.getElementById('cert-canvas-img');
                img.src = CanvasEngine.cvs.toDataURL();
                
                const hasArt = STATE.badges.includes("🎨 Colorful Artist");
                const hasVoice = STATE.badges.includes("🗣️ Great Speaker");
                
                let msg = "For showing amazing curiosity and completing your inquiry journey.";
                
                if (hasArt && hasVoice) {
                    msg = "For your brilliant colorful art and speaking English so confidently!";
                } else if (hasArt) {
                    msg = "For expressing your wonderful imagination through colorful art!";
                } else if (hasVoice) {
                    msg = "For speaking English with a clear, brave voice like a true explorer!";
                }
                
                document.getElementById('cert-ai-msg').innerText = `"${msg}"`;
                
                modal.classList.add('active');
                
                // Trigger celebratory confetti
                if (window.confetti) {
                    confetti({ 
                        particleCount: 150, 
                        spread: 100, 
                        origin: { y: 0.5 }, 
                        colors: ['#CBAE75', '#89BFA0', '#7CA6C1'] 
                    });
                }
            },
            
            /**
             * Closes the certificate modal and proceeds to next page.
             */
            close() {
                document.getElementById('cert-modal').classList.remove('active');
                AppEngine.smoothMove(1); 
            },
            
            /**
             * Generates a PNG download of the certificate using html2canvas.
             */
            print() {
                const card = document.getElementById('cert-card-content');
                const closeBtn = document.querySelector('.cert-close');
                const printBtn = document.querySelector('.btn-print');
                
                // Hide interactive UI elements before capturing
                closeBtn.style.display = 'none'; 
                printBtn.style.display = 'none';
                
                html2canvas(card, { backgroundColor: '#FFFFFF', scale: 2 }).then(canvas => {
                    // Restore interactive UI elements
                    closeBtn.style.display = 'block'; 
                    printBtn.style.display = 'inline-flex';
                    
                    const imgData = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `Bridge_Certificate_Week_${Math.ceil(STATE.currentPage / 4)}.png`;
                    link.href = imgData;
                    link.click();
                });
            }
        };

        /**
         * Main Application Flow Engine
         */
        const AppEngine = {
            /**
             * Handles smooth transitions between pages.
             */
            smoothMove(dir) {
                StorageEngine.saveCanvas();

                const board = document.getElementById('drawing-board');
                board.classList.add('fade-out');
                
                setTimeout(() => {
                    STATE.currentPage += dir;
                    
                    if (STATE.currentPage < 1) {
                        STATE.currentPage = 1;
                    }
                    if (STATE.currentPage > 33) {
                        STATE.currentPage = 33; // Cap at max pages provided in context
                    }
                    
                    PageEngine.load(STATE.currentPage);
                    
                    setTimeout(() => {
                        board.classList.remove('fade-out');
                    }, 150);
                }, 400);
            },
            
            /**
             * Handles logic for the "Next Adventure" button in AI Tutor.
             */
            handleNextAdventure() {
                AITutor.close();
                StorageEngine.saveCanvas();

                // Check if week completed (every 4 pages)
                if (STATE.currentPage % 4 === 0) {
                    CertificateEngine.open(STATE.currentPage / 4);
                } else {
                    this.smoothMove(1);
                }
            }
        };

        /**
         * User Interface Rendering Engine
         */
        const UIEngine = {
            toggleSidebar() { 
                document.getElementById('sidebar').classList.toggle('open'); 
            },
            
            closeSidebarOnMobile() { 
                if (window.innerWidth <= 800) {
                    document.getElementById('sidebar').classList.remove('open'); 
                }
            },
            
            /**
             * Renders earned badges in the sidebar.
             */
            renderBadges() {
                const container = document.getElementById('badge-container');
                container.innerHTML = "";
                
                const uniqueBadges = [...new Set(STATE.badges)];
                
                uniqueBadges.forEach(badge => {
                    const el = document.createElement('div'); 
                    el.className = "badge"; 
                    el.innerText = badge;
                    container.appendChild(el);
                });
            },
            
            /**
             * Awards a new badge and triggers celebration.
             */
            awardBadge(badgeName) {
                if (!STATE.badges.includes(badgeName)) {
                    STATE.badges.push(badgeName);
                    StorageEngine.save(); 
                    this.renderBadges();
                    
                    if (window.confetti) {
                        confetti({ 
                            particleCount: 50, 
                            spread: 60, 
                            origin: { y: 0.8 }, 
                            colors: ['#CBAE75', '#89BFA0'] 
                        });
                    }
                }
            }
        };

        /**
         * ======================================================================
         * [V100.5 Master Intelligence DB - Full 33 Page Map]
         * ======================================================================
         * Provides context, goals, expected interactions, hit-zones, and AI questions
         * for every single page in Unit A-1 and A-2.
         */
        const PAGE_INTELLIGENCE = {

                4: { navTitle: "Drawing Practice", type: "vision", goal: "Draw Features", question: "Wow, you drew them perfectly. Can you point to your own nose?", keywords: ["draw", "face", "look"] },
                5: { navTitle: "Senses Verbs", type: "ocr", goal: "Verb Recognition", question: "What do you like to smell the most?", keywords: ["smell", "hear", "taste", "see"] },
                6: { navTitle: "Sentence Play", type: "writing", goal: "Sentence Completion", question: "I like my eyes too! What else do you like?", keywords: ["like", "my", "face"] },

                        { from: [0.2, 0.45], to: [0.8, 0.45], label: "Ear to Music" },
                        { from: [0.2, 0.65], to: [0.8, 0.85], label: "Eye to Binoculars" },
                        { from: [0.2, 0.85], to: [0.8, 0.25], label: "Foot to Shoes" }

                8: { navTitle: "Face Drawing", type: "vision_detail", goal: "Draw a Face", question: "Is your face smiling or sleeping today?", keywords: ["smile", "happy", "face"] },
                9: { navTitle: "Book Cover", type: "ocr", goal: "Book Introduction", question: "Are you ready to read about the Gorilla?", keywords: ["head", "toe", "book"] },

            }
        };

        /**
         * Page Initialization and Loading Engine
         */
        const PageEngine = {
            init() {
                const list = document.getElementById('nav-list');
                const unitData = PAGE_INTELLIGENCE[STATE.id];
                
                if (unitData) {
                    Object.keys(unitData).forEach(i => {
                        const ctx = unitData[i];
                        const weekBadge = Math.ceil(parseInt(i) / 4);
                        
                        const item = document.createElement('div');
                        item.className = 'nav-item'; 
                        item.id = `nav-${i}`;
                        item.innerHTML = `
                            <span class="nav-title">${ctx.navTitle}</span> 
                            <span class="nav-badge">W${weekBadge}-P.${String(i).padStart(2,'0')}</span>
                        `;
                        
                        item.onclick = () => { 
                            AppEngine.smoothMove(parseInt(i) - STATE.currentPage); 
                            UIEngine.closeSidebarOnMobile(); 
                        };
                        
                        list.appendChild(item);
                    });
                }
                
                this.load(STATE.currentPage);
            },
            
            load(n) {
                STATE.currentPage = n; 
                STATE.lastTranscript = ""; 
                STATE.sttConfidence = 0; 
                STATE.audioDurationSec = 0; 
                STATE.audioBlobUrl = null;
                
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('active');
                });
                
                const activeNav = document.getElementById(`nav-${n}`);
                if (activeNav) {
                    activeNav.classList.add('active');
                }
                
                CanvasEngine.hardReset(); 
                AITutor.close();

                const img = document.getElementById('worksheet-img');
                img.style.opacity = '0';
                
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE_URL}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png?t=${new Date().getTime()}`;
                img.src = imgPath;
                
                img.onload = () => { 
                    img.style.opacity = '1'; 
                    CanvasEngine.resizeCanvas(); 
                    StorageEngine.loadCanvas(); 
                };
                
                StorageEngine.save(); 
            }
        };

        /**
         * Drawing & Tools Engine
         */
        const CanvasEngine = {
            isDrawing: false, 
            hasMoved: false, 
            isErasing: false, 
            lastColor: "#363431",
            dpr: window.devicePixelRatio || 1, 
            historyStack: [], 
            historyIndex: -1, 
            colorsUsed: new Set(),

            init() {
                this.cvs = document.getElementById('draw-layer'); 
                this.ctx = this.cvs.getContext('2d');
                this.board = document.getElementById('drawing-board');
                
                this.setupUI(); 
                this.updateCursor();
                
                requestAnimationFrame(() => {
                    this.setupCanvas();
                    setTimeout(() => { 
                        this.setupCanvas(); 
                        this.saveHistory(); 
                    }, 50);
                });
                
                this.bind();
                
                new ResizeObserver(() => { 
                    requestAnimationFrame(() => this.resizeCanvas()); 
                }).observe(this.board);
            },
            
            hardReset() {
                if (!this.ctx || !this.cvs) return;
                
                this.ctx.save(); 
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                this.ctx.restore();
                
                STATE.historyStack = []; 
                STATE.historyIndex = -1; 
                this.colorsUsed.clear();
            },
            
            setBrush(type) {
                STATE.brushType = type;
                
                document.querySelectorAll('.btn-magic').forEach(el => {
                    el.classList.remove('active');
                });
                
                const brushBtn = document.getElementById(`btn-brush-${type}`);
                if (brushBtn) {
                    brushBtn.classList.add('active');
                }
                
                if (this.isErasing) {
                    this.toggleEraser();
                }
            },
            
            updateCursor() {
                const color = this.lastColor.replace('#', '%23');
                
                const svg = this.isErasing ? 
                    `<svg width="20" height="20" viewBox="0 0 24 24" fill="%23FFB6C1"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11C23 12 23 14 22 15L20 20Z"/></svg>` : 
                    `<svg width="20" height="20" viewBox="0 0 24 24" fill="${color}"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/><path d="M15 5l4 4"/><circle cx="2" cy="22" r="1.5" fill="${color}"/></svg>`;
                
                this.cvs.style.cursor = `url('data:image/svg+xml;utf8,${svg}') 0 20, auto`;
            },
            
            setupCanvas() {
                if (!this.board) return;
                
                const rect = this.board.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                
                this.cvs.style.width = rect.width + "px"; 
                this.cvs.style.height = rect.height + "px";
                
                this.cvs.width = rect.width * this.dpr; 
                this.cvs.height = rect.height * this.dpr;
                
                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                this.ctx.lineCap = 'round'; 
                this.ctx.lineJoin = 'round';
                
                const baseSize = document.getElementById('brush-size').value;
                this.ctx.lineWidth = this.isErasing ? baseSize * 2 : baseSize;
                this.ctx.strokeStyle = this.lastColor;
                this.ctx.globalCompositeOperation = this.isErasing ? "destination-out" : "source-over";
            },
            
            resizeCanvas() {
                if (!this.cvs || !this.ctx || !this.board) return;
                
                const rect = this.board.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                
                const temp = document.createElement('canvas'); 
                temp.width = this.cvs.width; 
                temp.height = this.cvs.height;
                
                if (this.cvs.width > 0 && this.cvs.height > 0) {
                    temp.getContext('2d').drawImage(this.cvs, 0, 0);
                }
                
                this.setupCanvas();
                
                if (temp.width > 0 && temp.height > 0) {
                    this.ctx.save(); 
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                    this.ctx.drawImage(
                        temp, 
                        0, 0, temp.width, temp.height, 
                        0, 0, this.cvs.width, this.cvs.height
                    );
                    this.ctx.restore();
                }
            },
            
            bind() {
                const getP = (e) => { 
                    const r = this.cvs.getBoundingClientRect(); 
                    let cx = e.clientX; 
                    let cy = e.clientY;
                    
                    if (e.touches && e.touches.length > 0) { 
                        cx = e.touches[0].clientX; 
                        cy = e.touches[0].clientY; 
                    }
                    
                    return { x: cx - r.left, y: cy - r.top }; 
                };
                
                this.cvs.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); 
                    this.isDrawing = true; 
                    this.hasMoved = false;
                    
                    try { 
                        this.cvs.setPointerCapture(e.pointerId); 
                    } catch(err) {}
                    
                    const p = getP(e); 
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y); 
                    this.colorsUsed.add(this.lastColor);
                });
                
                this.cvs.addEventListener('pointermove', (e) => {
                    if (!this.isDrawing) return; 
                    e.preventDefault(); 
                    this.hasMoved = true;
                    
                    const p = getP(e);
                    
                    this.ctx.globalCompositeOperation = this.isErasing ? "destination-out" : "source-over";
                    const size = document.getElementById('brush-size').value;
                    this.ctx.lineWidth = this.isErasing ? size * 2 : size;
                    
                    this.ctx.shadowBlur = 0; 
                    this.ctx.shadowColor = 'transparent';

                    if (this.isErasing) {
                        this.ctx.strokeStyle = "#FFF";
                    } else if (STATE.brushType === 'neon') {
                        this.ctx.strokeStyle = this.lastColor;
                        this.ctx.shadowBlur = parseInt(size) + 10;
                        this.ctx.shadowColor = this.lastColor;
                    } else if (STATE.brushType === 'rainbow') {
                        STATE.rainbowHue = (STATE.rainbowHue + 2) % 360;
                        this.ctx.strokeStyle = `hsl(${STATE.rainbowHue}, 100%, 50%)`;
                    } else {
                        this.ctx.strokeStyle = this.lastColor;
                    }

                    this.ctx.lineTo(p.x, p.y); 
                    this.ctx.stroke();
                    
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y);
                });
                
                const stop = (e) => {
                    this.isDrawing = false; 
                    
                    try { 
                        this.cvs.releasePointerCapture(e.pointerId); 
                    } catch(err) {}
                    
                    this.ctx.shadowBlur = 0;
                    
                    if (this.hasMoved) { 
                        this.saveHistory(); 
                        StorageEngine.saveCanvas(); 
                        
                        if (this.colorsUsed.size >= 4) {
                            UIEngine.awardBadge("🎨 Colorful Artist");
                        }
                    }
                };
                
                this.cvs.addEventListener('pointerup', stop); 
                this.cvs.addEventListener('pointercancel', stop);
                
                this.cvs.addEventListener('pointerleave', () => { 
                    this.isDrawing = false; 
                });
            },
            
            saveHistory() { 
                STATE.historyIndex++; 
                STATE.historyStack.length = STATE.historyIndex; 
                STATE.historyStack.push(this.cvs.toDataURL()); 
            },
            
            undo() { 
                if (STATE.historyIndex > 0) { 
                    STATE.historyIndex--; 
                    this.restore(); 
                } 
            },
            
            redo() { 
                if (STATE.historyIndex < STATE.historyStack.length - 1) { 
                    STATE.historyIndex++; 
                    this.restore(); 
                } 
            },
            
            restore() {
                const img = new Image();
                img.onload = () => {
                    this.ctx.save(); 
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
                    this.ctx.drawImage(img, 0, 0, this.cvs.width / this.dpr, this.cvs.height / this.dpr);
                    this.ctx.restore(); 
                    StorageEngine.saveCanvas();
                };
                img.src = STATE.historyStack[STATE.historyIndex];
            },
            
            setColor(hex) { 
                this.lastColor = hex; 
                document.getElementById('btn-color').style.background = hex; 
                
                if (!this.isErasing) {
                    this.ctx.strokeStyle = this.lastColor; 
                }
                
                this.updateCursor(); 
            },
            
            setupUI() { 
                document.getElementById('btn-color').style.background = this.lastColor; 
                
                document.getElementById('brush-size').oninput = (e) => { 
                    this.ctx.lineWidth = this.isErasing ? e.target.value * 2 : e.target.value; 
                }; 
            },
            
            toggleEraser() {
                this.isErasing = !this.isErasing; 
                const btn = document.getElementById('btn-eraser');
                
                if (this.isErasing) { 
                    btn.classList.add('active'); 
                    btn.innerText = "PEN MODE"; 
                    this.ctx.globalCompositeOperation = 'destination-out'; 
                    this.ctx.lineWidth = document.getElementById('brush-size').value * 2; 
                } else { 
                    btn.classList.remove('active'); 
                    btn.innerText = "ERASER"; 
                    this.ctx.globalCompositeOperation = 'source-over'; 
                    this.ctx.strokeStyle = this.lastColor; 
                    this.ctx.lineWidth = document.getElementById('brush-size').value; 
                }
                
                this.updateCursor();
            },
            
            clearAll() {
                if (!this.ctx || !this.cvs) return;
                
                this.ctx.save(); 
                this.ctx.setTransform(1, 0, 0, 1, 0, 0); 
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                this.ctx.restore();
                
                this.saveHistory(); 
                StorageEngine.saveCanvas(); 
                this.colorsUsed.clear();
            }
        };

        /**
         * Custom UI Component: RGB Color Wheel Selector
         */
        const RGBRingEngine = {
            init() {
                this.m = document.getElementById('rgb-modal'); 
                this.c = document.getElementById('color-wheel'); 
                this.x = this.c.getContext('2d', { willReadFrequently: true });
                
                const r = 75; 
                this.c.width = 150; 
                this.c.height = 150;
                
                for (let a = 0; a < 360; a++) { 
                    this.x.beginPath(); 
                    this.x.moveTo(r, r); 
                    this.x.arc(r, r, r, a * Math.PI / 180, (a + 2) * Math.PI / 180); 
                    this.x.fillStyle = `hsl(${a}, 100%, 50%)`; 
                    this.x.fill(); 
                }
                
                this.c.onclick = (e) => {
                    const rect = this.c.getBoundingClientRect(); 
                    const p = this.x.getImageData(e.clientX - rect.left, e.clientY - rect.top, 1, 1).data;
                    
                    if (p[3] < 50) return;
                    
                    CanvasEngine.setColor("#" + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1).toUpperCase()); 
                    this.toggle();
                };
            },
            
            toggle() { 
                this.m.classList.toggle('active'); 
            }
        };

        /**
         * Audio Engine for Voice Recording, STT, and Playback
         */
        const AudioEngine = {
            recognition: null, 
            mediaRecorder: null, 
            audioChunks: [],
            
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (SR) {
                    this.recognition = new SR(); 
                    this.recognition.lang = 'en-US'; 
                    this.recognition.interimResults = false; 
                    this.recognition.continuous = false;
                    
                    this.recognition.onresult = (e) => { 
                        STATE.lastTranscript = e.results[0][0].transcript; 
                        STATE.sttConfidence = Math.round(e.results[0][0].confidence * 100); 
                    };
                    
                    const finish = () => { 
                        if (STATE.isRecording) { 
                            if (STATE.isChatMode) {
                                this.toggleChat(); 
                            } else {
                                this.toggle(); 
                            }
                        } 
                    };
                    
                    this.recognition.onend = finish; 
                    this.recognition.onerror = finish;
                }
                
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                        this.mediaRecorder = new MediaRecorder(stream);
                        this.mediaRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                        
                        this.mediaRecorder.onstop = () => { 
                            STATE.audioBlobUrl = window.URL.createObjectURL(new Blob(this.audioChunks, { 'type' : 'audio/ogg; codecs=opus' })); 
                        };
                    }).catch(err => console.warn("Mic access denied."));
                }
            },
            
            startRecordingUI(btnId, textId, activeText) {
                STATE.isRecording = true; 
                STATE.lastTranscript = ""; 
                STATE.sttConfidence = 0; 
                STATE.audioStartTime = Date.now();
                
                const btn = document.getElementById(btnId); 
                btn.classList.add('recording');
                
                if (textId) {
                    document.getElementById(textId).innerText = activeText; 
                } else {
                    btn.innerHTML = `🎤 <span>${activeText}</span>`;
                }
                
                this.audioChunks = [];
                
                try { 
                    if (this.recognition) this.recognition.start(); 
                } catch(e) {}
                
                try { 
                    if (this.mediaRecorder) this.mediaRecorder.start(); 
                } catch(e) {}
            },
            
            stopRecordingUI(btnId, textId, idleText, callback) {
                STATE.isRecording = false; 
                STATE.audioDurationSec = (Date.now() - STATE.audioStartTime) / 1000;
                
                const btn = document.getElementById(btnId); 
                btn.classList.remove('recording');
                
                if (textId) {
                    document.getElementById(textId).innerText = idleText; 
                } else {
                    btn.innerHTML = `🎤 <span>${idleText}</span>`;
                }
                
                try { 
                    if (this.recognition) this.recognition.stop(); 
                } catch(e) {}
                
                try { 
                    if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
                        this.mediaRecorder.stop(); 
                    }
                } catch(e) {}
                
                setTimeout(callback, 600); 
            },
            
            toggle() { 
                if (!STATE.isRecording) { 
                    STATE.isChatMode = false; 
                    this.startRecordingUI('btn-record', 'record-text', 'Listening...'); 
                } else { 
                    this.stopRecordingUI('btn-record', 'record-text', 'Voice Log', () => AITutor.submit()); 
                } 
            },
            
            toggleChat() { 
                if (!STATE.isRecording) { 
                    STATE.isChatMode = true; 
                    this.startRecordingUI('btn-chat-record', null, 'Listening...'); 
                } else { 
                    this.stopRecordingUI('btn-chat-record', null, 'Speak to Reply', () => AITutor.processReply()); 
                } 
            },
            
            playVoiceEffect(effect) {
                if (!STATE.audioBlobUrl) return;
                
                const audio = new Audio(STATE.audioBlobUrl);
                
                if (effect === 'chipmunk') {
                    audio.playbackRate = 1.6; 
                } else if (effect === 'alien') {
                    audio.playbackRate = 0.7; 
                } else {
                    audio.playbackRate = 1.0;
                }
                
                audio.play();
            }
        };

                }

            async recognize(imgData) {

        const VisionAI_Doodle = {
            classifier: null,

            init() { 
                try { 
                    this.classifier = ml5.imageClassifier('DoodleNet', () => { 
                        this.isReady = true; 
                    }); 
                } catch(e) {}

            async classifyCanvas(canvas) {
                if (!this.isReady || !this.classifier) return [];
                
                return new Promise((resolve) => {
                    const timeout = setTimeout(() => resolve([]), 2000);
                    try { 
                        this.classifier.classify(canvas, (err, results) => { 
                            clearTimeout(timeout); 
                            if (err || !results) resolve([]); 
                            else resolve(results); 
                        }); 
                    } catch(e) { 
                        clearTimeout(timeout); 
                        resolve([]); 
                    }
                });
            }
        };

                    aiResponse = `Hi, <b>${callName}</b>! Welcome to your Private Lab. Today's goal is <b>${context.goal}</b>!`;
                } else {
                    aiResponse = `<b>[Visual Analysis]</b><br>${visualDetail}<br><br><b>[Vocal Analysis]</b><br>${speechDetail}<br><br><span style="color:var(--br-gold);">💡 ${context.question}</span>`;
                }

                let transcriptUI = "";
                if (STATE.lastTranscript) {
                    transcriptUI = `<div style="background:#F4F8F5; padding:12px; border-radius:10px; border-left:4px solid var(--br-green); font-style:italic; font-size:14px; margin-bottom:15px; color:var(--br-charcoal);">"${STATE.lastTranscript}"</div>`;
                }
                
                let voiceFxUI = "";
                if (STATE.lastTranscript) {
                    voiceFxUI = `<div class="voice-fx-group"><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('normal')">▶️ Normal</div><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('chipmunk')">🐿️ Chipmunk</div><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('alien')">👽 Alien</div></div>`;
                }

                content.innerHTML = `
                    <div class="analytics-card">
                        <div class="analytics-title">📊 Mission: ${context.goal}</div>
                        ${transcriptUI}
                        <div class="stat-row">
                            <div class="stat-label"><span>Clear Voice</span><span>${scorePronunciation}%</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${scorePronunciation}%; background:var(--br-blue)"></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-label"><span>Right Words</span><span>${scoreAccuracy}%</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${scoreAccuracy}%; background:var(--br-green)"></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-label"><span>Speaking Speed</span><span>${Math.round(wpm)} WPM</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${speedPercentage}%; background:var(--br-gold)"></div></div>
                        </div>
                        ${voiceFxUI}
                    </div>
                    <div class="chat-bubble ai">${aiResponse}</div>
                `;
                
                document.getElementById('chat-footer').style.display = "flex";
                this.speak(aiResponse.replace(/<[^>]*>?/gm, ''));
            },

            processReply() {
                if (!STATE.lastTranscript) return;
                
                const content = document.getElementById('ai-content');
                
                const uBubble = document.createElement('div'); 
                uBubble.className = "chat-bubble user"; 
                uBubble.innerText = STATE.lastTranscript;
                content.appendChild(uBubble); 
                content.scrollTop = content.scrollHeight;

                const followUps = [
                    "Wow, really? Tell me more!", 
                    "That's an interesting detail! Why is that?", 
                    "I love your idea! What else can you imagine?"
                ];
                
                const reply = followUps[Math.floor(Math.random() * followUps.length)];

                setTimeout(() => {
                    const aBubble = document.createElement('div'); 
                    aBubble.className = "chat-bubble ai"; 
                    aBubble.innerHTML = `<b style="color:var(--br-green);">${reply}</b>`;
                    content.appendChild(aBubble); 
                    content.scrollTop = content.scrollHeight;
                    
                    this.speak(reply);
                }, 800);
            },

            speak(t) {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(t); 
                    u.lang = 'en-US'; 
                    u.rate = 0.9; 
                    window.speechSynthesis.speak(u);
                }
            },
            
            close() { 
                document.getElementById('ai-panel').classList.remove('open'); 
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel(); 
                }
            }
        };

        // ======================================================================
        // [System Boot Sequence]
        // ======================================================================
        window.onload = () => {
            StorageEngine.load();
            
            if (STATE.isNameRegistered) {
                const profileBox = document.getElementById('profile-box');
                profileBox.classList.add('registered');
                document.getElementById('display-name').innerText = STATE.studentName;
                document.getElementById('avatar-char').innerText = STATE.studentName.charAt(0);
            }
            
            UIEngine.renderBadges();
            
            CanvasEngine.init(); 
            RGBRingEngine.init(); 
            PageEngine.init(); 
            AudioEngine.init();
            VisualAI_OCR.init(); 
            VisionAI_Doodle.init();
            
            setTimeout(() => { 
                CanvasEngine.resizeCanvas(); 
                StorageEngine.loadCanvas(); 
            }, 300);
        };
    </script>
</body>
</html>
