<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium AI Lab V100.300</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --br-green:#91D3B4; --br-gold:#CBAE75; --br-blue:#7CA6C1; --br-charcoal:#363431; --br-bg:#FCFBF9; --br-paper:#FFFFFF; --br-error:#E74C3C; --safe-bottom:env(safe-area-inset-bottom,0px); }
        * { margin:0; padding:0; box-sizing:border-box; cursor:none !important; font-family:'Nunito','Pretendard',sans-serif; }
        html,body { width:100%; height:100dvh; overflow:hidden; background:var(--br-bg); color:var(--br-charcoal); }
        a,button,input,select,textarea { font-family:inherit; outline:none; border:none; background:transparent; cursor:none !important; }
        ul,ol,li { list-style:none; }
        
        .cursor-dot { position:fixed; top:0; left:0; width:4px; height:4px; background:rgba(54,52,49,0.75); border-radius:50%; pointer-events:none; z-index:99999; transform:translate(-50%,-50%); transition:all 0.1s ease; }
        .cursor-ring { position:fixed; top:0; left:0; width:22px; height:22px; border:1px solid rgba(54,52,49,0.28); border-radius:50%; pointer-events:none; z-index:99998; transform:translate(-50%,-50%); transition:all 0.15s ease; }
        .cursor-dot.hovered { width:3px; height:3px; background:rgba(145,211,180,0.8); }
        .cursor-ring.hovered { width:28px; height:28px; background:rgba(145,211,180,0.05); border-color:rgba(145,211,180,0.5); }
        .cursor-dot.hidden, .cursor-ring.hidden { opacity:0; visibility:hidden; }
        .stage-wrapper,.drawing-board,#draw-layer { cursor:crosshair !important; }
        @media (pointer: coarse) { .cursor-dot,.cursor-ring { display:none !important; } *,html,body,a,button,input,textarea,.stage-wrapper,.drawing-board,#draw-layer { cursor:auto !important; } }

        .app-container { display:flex; width:100vw; height:100dvh; }
        .sidebar { width:320px; height:100%; background:var(--br-paper); border-right:1px solid #F0EFEB; display:flex; flex-direction:column; z-index:2000; flex-shrink:0; transition:transform 0.4s cubic-bezier(0.19,1,0.22,1); }
        .sidebar-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.18); z-index:1500; opacity:0; pointer-events:none; transition:opacity 0.3s; backdrop-filter:blur(3px); }
        .sidebar-backdrop.active { opacity:1; pointer-events:auto; }
        .sidebar-header { padding:35px 30px; text-align:center; border-bottom:1px solid #F0EFEB; }
        .brand-logo { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; line-height:1; display:flex; align-items:center; justify-content:center; gap:4px; }
        .brand-logo span { color:var(--br-green); font-style:italic; }
        .student-profile { padding:25px 30px; border-bottom:1px solid #F0EFEB; display:flex; flex-direction:column; gap:15px; background:#FAFAFA; }
        .profile-top { display:flex; align-items:center; gap:15px; }
        .profile-avatar { width:52px; height:52px; border-radius:50%; background:var(--br-gold); color:#FFF; display:flex; justify-content:center; align-items:center; font-weight:900; font-size:22px; box-shadow:0 8px 20px rgba(203,174,117,0.3); }
        .profile-info { display:flex; flex-direction:column; }
        .profile-name { font-size:18px; font-weight:900; text-transform:uppercase; }
        .profile-role { font-size:11px; font-weight:700; color:var(--br-muted); letter-spacing:1.5px; text-transform:uppercase; }
        .badge-container { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; }
        .badge { font-size:11px; padding:4px 10px; border-radius:12px; background:#FFF; border:1px solid #F0EFEB; font-weight:800; display:flex; align-items:center; gap:4px; animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); }
        
        .nav-list { flex:1; overflow-y:auto; padding:15px; }
        .nav-item { padding:18px 20px; margin-bottom:10px; border-radius:15px; background:#FAFAFA; display:flex; justify-content:space-between; align-items:center; transition:all 0.4s ease; border:1px solid transparent; }
        .nav-item.active { background:#F8FAFF; border-left:6px solid var(--br-green); box-shadow:0 10px 25px rgba(145,211,180,0.12); }
        .nav-title { font-size:14px; font-weight:700; max-width:170px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .nav-item.active .nav-title { font-weight:900; color:var(--br-green); }
        .nav-badge { font-size:10px; font-weight:900; color:var(--br-muted); }
        .nav-item.active .nav-badge { color:var(--br-green); }

        .workspace { flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow:hidden; pointer-events:auto !important; }
        .top-bar { height:85px; padding:0 45px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #F0EFEB; background:#FFF; z-index:10; }
        .top-bar-left { display:flex; align-items:center; gap:20px; }
        .mobile-menu-btn { display:none; font-size:28px; padding:10px; z-index:1500; }
        .unit-info { font-size:13px; font-weight:900; color:var(--br-gold); letter-spacing:3px; }
        .page-info { font-size:24px; font-weight:900; display:flex; align-items:center; gap:12px; margin-top:2px; }
        .page-goal { font-family:'Pretendard',sans-serif; font-size:15px; font-weight:600; color:var(--br-muted); background:#F8F9FA; padding:4px 14px; border-radius:50px; border:1px solid #F0EFEB; }
        .sync-indicator-container { display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:50px; background:var(--br-bg); border:1px solid #F0EFEB; font-size:12px; font-weight:700; color:var(--br-muted); transition:all 0.4s ease; }
        .sync-indicator-container.saving { color:var(--br-blue); background:#F0F4F8; border-color:#D9E4EC; }
        .sync-indicator-container.saved { color:var(--br-success); background:#F0FDF4; border-color:#DCFCE7; }
        .sync-icon.spin { animation:spin 1s linear infinite; }
        
        .toast-error { display:none; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--br-error); background:#FEF2F2; padding:8px 16px; border-radius:50px; border:1px solid #FCA5A5; animation:popIn 0.3s ease-out; position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:5000; }
        .toast-error.show { display:flex; }

        .stage-wrapper { flex:1; display:flex; justify-content:center; align-items:center; padding:40px; perspective:1200px; }
        .drawing-board { position:relative; display:inline-flex; border-radius:20px; box-shadow:0 30px 60px rgba(54,52,49,0.15); background:#FFF; transition:all 0.4s cubic-bezier(0.19,1,0.22,1); transform-origin:center; max-width:100%; max-height:100%; overflow:hidden; }
        .drawing-board::after { content:''; position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; mix-blend-mode:multiply; z-index:10000; }
        .drawing-board.fade-out { opacity:0; transform:scale(0.95) translateY(20px); }
        .drawing-board.error-state { border:2px dashed var(--br-error); background:#FFF0F0; }
        #worksheet-img { display:block; max-width:100%; max-height:calc(100dvh - 250px); width:auto; height:auto; border-radius:20px; opacity:0; transition:opacity 0.5s; user-select:none; object-fit:contain; pointer-events:none; }
        #draw-layer { position:absolute; inset:0; z-index:9999; touch-action:none; border-radius:20px; }

        .bottom-dock { height:110px; background:rgba(255,255,255,0.98); border-top:1px solid #F0EFEB; display:flex; align-items:center; justify-content:space-between; padding:0 50px var(--safe-bottom) 50px; z-index:500; }
        .tool-group { display:flex; align-items:center; gap:15px; background:#F8F9FA; padding:12px 30px; border-radius:100px; border:1px solid #F0EFEB; }
        .color-preview { width:44px; height:44px; border-radius:50%; border:3px solid #FFF; box-shadow:0 5px 15px rgba(0,0,0,0.1); transition:transform 0.5s; }
        .color-preview:active { transform:scale(0.85); }
        .btn-magic { font-size:24px; padding:5px; filter:grayscale(100%); opacity:0.6; transition:all 0.3s; }
        .btn-magic.active { filter:grayscale(0%); opacity:1; transform:scale(1.3); }
        .brush-slider-wrapper { display:flex; align-items:center; gap:10px; margin:0 10px; }
        .brush-slider { width:90px; accent-color:var(--br-green); height:6px; border-radius:10px; }
        .brush-preview-dot { width:6px; height:6px; background:var(--br-charcoal); border-radius:50%; display:inline-block; }
        .btn-tool { font-size:18px; font-weight:900; padding:10px 14px; background:#FFF; border:1px solid #F0EFEB; border-radius:12px; transition:transform 0.2s; }
        .btn-tool:active { transform:scale(0.85); }
        .btn-erase { font-size:14px; font-weight:900; padding:12px 18px; border-radius:14px; border:1px solid #F0EFEB; }
        .btn-erase.active { background:var(--br-error); color:#FFF; border-color:var(--br-error); }
        .btn-reset-all { font-size:14px; font-weight:900; padding:12px 18px; border-radius:14px; background:#FFF5F5; color:var(--br-error); display:flex; align-items:center; gap:6px; }
        .action-group { display:flex; gap:15px; align-items:center; }
        .btn-nav { width:60px; height:60px; border-radius:18px; border:1px solid #F0EFEB; background:#FFF; font-size:24px; display:flex; justify-content:center; align-items:center; box-shadow:0 10px 20px rgba(0,0,0,0.05); transition:transform 0.2s; }
        .btn-nav:active { transform:scale(0.85); }
        .btn-main { height:60px; padding:0 35px; border-radius:18px; font-weight:900; font-size:15px; letter-spacing:1px; display:flex; align-items:center; gap:12px; text-transform:uppercase; transition:all 0.3s; }
        .btn-record { background:#FFF; border:1px solid #F0EFEB; }
        .btn-record.recording { background:#FFF0F0; color:var(--br-error); border-color:var(--br-error); box-shadow:inset 0 0 0 2px var(--br-error); }
        .btn-record .dot { width:12px; height:12px; background:var(--br-error); border-radius:50%; opacity:0; }
        .btn-record.recording .dot { opacity:1; animation:blink 1s infinite; }
        .btn-submit { background:var(--br-charcoal); color:#FFF; box-shadow:0 10px 30px rgba(54,52,49,0.2); }
        .btn-submit:hover { background:var(--br-gold); transform:translateY(-3px); box-shadow:0 15px 35px rgba(203,174,117,0.4); }

        .ai-panel { position:absolute; top:0; right:-480px; width:480px; height:100%; background:#FFF; box-shadow:-25px 0 60px rgba(0,0,0,0.12); z-index:10001; transition:right 0.6s cubic-bezier(0.19,1,0.22,1); display:flex; flex-direction:column; border-left:1px solid #F0EFEB; }
        .ai-panel.open { right:0; }
        .ai-header { padding:30px 35px; background:#F8FAFF; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #F0EFEB; }
        .ai-title { font-family:'Jua',sans-serif; font-size:24px; color:var(--br-green); display:flex; align-items:center; gap:12px; }
        .btn-close-ai { font-size:34px; color:var(--br-muted); line-height:1; }
        .ai-content { padding:30px 35px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:20px; scroll-behavior:smooth; }
        .chat-bubble { max-width:90%; padding:20px 25px; border-radius:22px; font-size:16px; line-height:1.7; font-weight:500; word-break:keep-all; animation:popIn 0.5s ease; }
        .chat-bubble.ai { align-self:flex-start; background:#F8F9FA; border-bottom-left-radius:4px; border:1px solid #F0EFEB; }
        .chat-bubble.user { align-self:flex-end; background:var(--br-green); color:#FFF; border-bottom-right-radius:4px; box-shadow:0 8px 20px rgba(145,211,180,0.3); }
        .ai-loading-container { text-align:center; padding:50px 0; }
        .ai-loading-icon { font-size:36px; color:var(--br-green); margin-bottom:15px; }
        .ai-loading-text { font-weight:900; color:var(--br-muted); font-size:14px; }
        .analytics-card { background:#FAFAFA; border:1px solid #F0EFEB; border-radius:24px; padding:25px; margin-bottom:10px; }
        .analytics-title { color:var(--br-gold); font-size:14px; margin-bottom:20px; font-weight:900; text-transform:uppercase; border-bottom:1px dashed #F0EFEB; padding-bottom:12px; }
        .stat-row { margin-bottom:18px; display:flex; flex-direction:column; gap:8px; }
        .stat-label { font-size:13px; font-weight:800; display:flex; justify-content:space-between; }
        .bar-bg { width:100%; height:10px; background:#E8E6E1; border-radius:12px; overflow:hidden; }
        .bar-fill { height:100%; background:var(--br-blue); border-radius:12px; transition:width 1.2s ease; }
        .chat-footer { padding:25px 35px; border-top:1px solid #F0EFEB; display:flex; flex-direction:column; gap:15px; background:#FFF; }
        .btn-chat-action { width:100%; height:60px; background:var(--br-charcoal); color:#FFF; border-radius:18px; font-weight:900; font-size:16px; display:flex; justify-content:center; align-items:center; gap:10px; box-shadow:0 10px 20px rgba(54,52,49,0.2); }
        .btn-chat-next { text-align:center; font-size:14px; font-weight:bold; color:var(--br-blue); }

        .bridge-modal-overlay { position:fixed; inset:0; background:rgba(42,40,37,0.6); z-index:40000; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:opacity 0.3s; backdrop-filter:blur(8px); }
        .bridge-modal-overlay.active { opacity:1; pointer-events:auto; }
        .bridge-modal-box { background:#FFF; width:420px; max-width:90%; border-radius:24px; padding:40px 35px 35px; text-align:center; transform:scale(0.9) translateY(20px); transition:transform 0.4s; }
        .bridge-modal-overlay.active .bridge-modal-box { transform:scale(1) translateY(0); }
        .bridge-modal-icon { font-size:45px; color:var(--br-gold); margin-bottom:20px; }
        .bridge-modal-icon.warning { color:var(--br-error); }
        .bridge-modal-title { font-size:26px; font-weight:900; margin-bottom:12px; }
        .bridge-modal-text { font-size:15px; color:var(--br-muted); line-height:1.6; margin-bottom:30px; }
        .bridge-modal-actions { display:flex; gap:12px; }
        .bridge-modal-btn { flex:1; padding:15px 0; border-radius:14px; font-weight:900; font-size:15px; text-transform:uppercase; }
        .bridge-modal-cancel { background:#F0EFEB; }
        .bridge-modal-confirm { background:var(--br-error); color:#FFF; }

        .rgb-modal { position:absolute; bottom:130px; left:50px; background:#FFF; border-radius:25px; padding:25px; box-shadow:0 20px 50px rgba(0,0,0,0.15); z-index:5000; opacity:0; pointer-events:none; transform:translateY(20px); transition:all 0.3s; }
        .rgb-modal.active { opacity:1; pointer-events:auto; transform:translateY(0); }
        .rgb-modal-close { text-align:center; font-size:10px; margin-top:12px; font-weight:900; color:var(--br-muted); }

        .cert-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:30000; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:opacity 0.4s; backdrop-filter:blur(15px); }
        .cert-modal-overlay.active { opacity:1; pointer-events:auto; }
        .cert-card { background:#FFF; width:850px; max-width:90%; border-radius:35px; padding:60px; text-align:center; position:relative; transform:scale(0.85); transition:transform 0.5s; }
        .cert-modal-overlay.active .cert-card { transform:scale(1); }
        .cert-border { border:10px solid var(--br-gold); border-radius:25px; padding:50px; }
        .cert-title { font-size:50px; font-weight:900; margin-bottom:15px; }
        .cert-subtitle { font-size:18px; color:var(--br-muted); font-weight:900; letter-spacing:4px; text-transform:uppercase; margin-bottom:35px; }
        .cert-name { font-size:40px; color:var(--br-green); font-weight:900; margin-bottom:25px; text-decoration:underline; text-decoration-color:var(--br-gold); }
        .cert-img-container { width:100%; max-width:450px; height:280px; margin:0 auto 35px; border-radius:18px; border:3px dashed #F0EFEB; display:flex; justify-content:center; align-items:center; background:var(--br-bg); overflow:hidden; }
        .cert-img-container img { max-width:100%; max-height:100%; object-fit:contain; }
        .cert-msg { font-size:18px; font-style:italic; margin-bottom:35px; }
        .btn-print { background:var(--br-charcoal); color:#FFF; padding:18px 45px; font-size:18px; font-weight:900; border-radius:100px; display:inline-flex; align-items:center; gap:12px; }
        .cert-close { position:absolute; top:25px; right:35px; font-size:35px; color:var(--br-muted); font-weight:900; }

        @keyframes popIn { from { opacity:0; transform:scale(0.92) translateY(15px); } to { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        @keyframes spin { 100% { transform:rotate(360deg); } }

        @media (max-width: 1180px) {
            .sidebar { position:fixed; transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); box-shadow:20px 0 50px rgba(0,0,0,0.18); }
            .mobile-menu-btn { display:block; }
        }
        @media (max-width: 800px) {
            .top-bar { height:70px; padding:0 20px; }
            .bottom-dock { height:auto; flex-direction:column; padding:15px; gap:10px; border-radius:25px 25px 0 0; }
            .tool-group, .action-group { width:100%; justify-content:center; flex-wrap:wrap; }
            .ai-panel { width:100%; right:-100%; }
            #worksheet-img { max-height:50vh; }
        }
        @media (max-width: 480px) {
            .btn-nav, .btn-main { height:45px; font-size:13px; }
            .cert-card { padding:30px 20px; }
            .cert-border { padding:20px; }
            .cert-title { font-size:30px; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="cursor-dot"></div><div class="cursor-ring" id="cursor-ring"></div>

    <div class="app-container">
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="UIEngine.closeSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <header class="sidebar-header" onclick="location.href='dashboard.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </header>
            <section class="student-profile" id="profile-box">
                <div class="profile-top">
                    <div class="profile-avatar" id="avatar-char">?</div>
                    <div class="profile-info">
                        <span class="profile-name" id="display-name">Guest</span>
                        <span class="profile-role">Global Premium Explorer</span>
                    </div>
                </div>
                <div class="badge-container" id="badge-container"></div>
            </section>
            <section class="nav-list" id="nav-list"></section>
        </nav>

        <div class="workspace">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn interactive-hover" onclick="UIEngine.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">
                            <span id="page-number-text">Inquiry P.01</span>
                            <span id="page-goal-text" class="page-goal">Loading Goal...</span>
                        </div>
                    </div>
                </div>
                <div class="sync-indicator-container" id="sync-indicator"><i class="fa-solid fa-cloud sync-icon" id="sync-icon"></i><span id="sync-text">Synced</span></div>
            </header>
            
            <div id="error-toast" class="toast-error" role="alert"><i class="fa-solid fa-triangle-exclamation"></i><span id="error-toast-msg">Error</span></div>

            <main class="stage-wrapper interactive-hover">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img" crossorigin="anonymous" alt="Worksheet">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <footer class="bottom-dock">
                <div class="tool-group" role="group">
                    <div class="color-preview interactive-hover" id="btn-color" onclick="RGBRingEngine.toggle()"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;" tabindex="-1">
                    <button class="btn-magic active interactive-hover" id="btn-brush-normal" onclick="CanvasEngine.setBrush('normal')">🖍️</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-neon" onclick="CanvasEngine.setBrush('neon')">🌟</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-rainbow" onclick="CanvasEngine.setBrush('rainbow')">🌈</button>
                    <div class="brush-slider-wrapper"><input type="range" class="brush-slider interactive-hover" id="brush-size" min="2" max="35" value="6"><div class="brush-preview-dot" id="brush-preview-dot"></div></div>
                    <button class="btn-tool interactive-hover" onclick="CanvasEngine.undo()"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn-erase interactive-hover" id="btn-eraser" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-reset-all interactive-hover" onclick="CanvasEngine.promptHardReset()"><i class="fa-solid fa-trash-can"></i> CLEAR</button>

        const CanvasEngine = {
            isDrawing:false,hasMoved:false,isErasing:false,lastColor:"#363431",dpr:window.devicePixelRatio||1,historyStack:[],historyIndex:-1,
            init() { this.cvs=document.getElementById('draw-layer'); if(!this.cvs)return; this.ctx=this.cvs.getContext('2d'); this.board=document.getElementById('drawing-board'); this.setupUI(); this.setupCanvas(); this.bind(); this.updateBrushPreview(); const slider=document.getElementById('brush-size'); if(slider)slider.addEventListener('input',()=>this.updateBrushPreview()); if(window.ResizeObserver&&this.board)new ResizeObserver(()=>this.resizeCanvas()).observe(this.board); },
            updateBrushPreview() { const s=document.getElementById('brush-size'); const d=document.getElementById('brush-preview-dot'); if(!s||!d)return; const v=parseInt(s.value); d.style.width=`${v}px`; d.style.height=`${v}px`; d.style.backgroundColor=this.isErasing?"var(--br-muted)":this.lastColor; },
            isCanvasBlank() { if(!this.cvs||!this.ctx)return true; try{ const p=document.createElement('canvas'); p.width=64; p.height=64; const pctx=p.getContext('2d'); pctx.drawImage(this.cvs,0,0,64,64); const px=pctx.getImageData(0,0,64,64).data; for(let i=3;i<px.length;i+=4){if(px[i]!==0)return false;} return true; }catch(e){return true;} },
            captureWorksheetWithDrawing(compress=false, initialMaxWidth=600) {
                const ws=document.getElementById('worksheet-img'); const dr=this.cvs; if(!dr)return null;
                const m=document.createElement('canvas'); let sr=1.0; if(compress){if(dr.width>initialMaxWidth)sr=initialMaxWidth/dr.width;}
                m.width=Math.floor(dr.width*sr); m.height=Math.floor(dr.height*sr); const ctx=m.getContext('2d'); ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,m.width,m.height);
                try{ if(ws&&ws.complete&&ws.naturalWidth>0)ctx.drawImage(ws,0,0,m.width,m.height); ctx.drawImage(dr,0,0,m.width,m.height); }catch(e){ const fc=document.createElement('canvas'); fallbackCanvas.width=Math.floor(dr.width*sr); fallbackCanvas.height=Math.floor(dr.height*sr); const fCtx=fallbackCanvas.getContext('2d'); fCtx.fillStyle='#FFFFFF'; fCtx.fillRect(0,0,fallbackCanvas.width,fallbackCanvas.height); fCtx.drawImage(dr,0,0,fallbackCanvas.width,fallbackCanvas.height); ctx.drawImage(fallbackCanvas,0,0); }
                if(compress) {
                    let q=0.7; let enc=m.toDataURL('image/jpeg',q); enc=enc.replace(/^data:image\/\w+;base64,/,"");
                    while(enc.length>400000){ if(q<=0.1)break; q-=0.15; enc=m.toDataURL('image/jpeg',q).replace(/^data:image\/\w+;base64,/,""); }

                    return enc;

            setupCanvas() { if(!this.board||!this.cvs)return; const r=this.board.getBoundingClientRect(); if(r.width===0)return; this.cvs.style.width=r.width+"px"; this.cvs.style.height=r.height+"px"; this.cvs.width=r.width*this.dpr; this.cvs.height=r.height*this.dpr; this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0); this.ctx.lineCap='round'; this.ctx.lineJoin='round'; },
            resizeCanvas() { if(!this.cvs||!this.ctx||!this.board)return; const r=this.board.getBoundingClientRect(); if(r.width===0||r.height===0)return; const tmp=document.createElement('canvas'); temp.width=this.cvs.width; temp.height=this.cvs.height; if(this.cvs.width>0&&this.cvs.height>0)temp.getContext('2d').drawImage(this.cvs,0,0); this.setupCanvas(); if(temp.width>0&&temp.height>0)this.ctx.drawImage(temp,0,0,temp.width,temp.height,0,0,r.width,r.height); },
            bind() {
                const getP=(e)=>{ const r=this.cvs.getBoundingClientRect(); let cx=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0); let cy=e.clientY||(e.touches&&e.touches[0]?e.touches[0].clientY:0); return {x:cx-r.left,y:cy-r.top}; };
                const st=(e)=>{ e.preventDefault(); this.isDrawing=true; this.hasMoved=false; const p=getP(e); this.ctx.beginPath(); this.ctx.moveTo(p.x,p.y); STATE.strokeCount++; if(!this.isErasing)STATE.usedColors.add(this.lastColor); };
                const mv=(e)=>{ if(!this.isDrawing)return; e.preventDefault(); this.hasMoved=true; const p=getP(e); this.ctx.globalCompositeOperation=this.isErasing?"destination-out":"source-over"; const sv=document.getElementById('brush-size').value; this.ctx.lineWidth=this.isErasing?sv*3:sv; this.ctx.strokeStyle=this.isErasing?"#FFFFFF":this.lastColor; if(STATE.brushType==='rainbow'&&!this.isErasing)this.ctx.strokeStyle=`hsl(${(Date.now()/10)%360},100%,50%)`; else if(STATE.brushType==='neon'&&!this.isErasing){this.ctx.shadowBlur=parseInt(sv)+10;this.ctx.shadowColor=this.lastColor;}else{this.ctx.shadowBlur=0;} this.ctx.lineTo(p.x,p.y); this.ctx.stroke(); this.ctx.beginPath(); this.ctx.moveTo(p.x,p.y); };
                const ed=()=>{ this.isDrawing=false; this.ctx.shadowBlur=0; if(this.hasMoved){this.saveHistory();StorageEngine.saveCanvasLocal();StorageEngine.scheduleCloudSave();} };
                this.cvs.addEventListener('pointerdown',st); this.cvs.addEventListener('pointermove',mv); this.cvs.addEventListener('pointerup',ed); this.cvs.addEventListener('pointerleave',ed);
            },
            saveHistory() { this.historyIndex++; this.historyStack.length=this.historyIndex; this.historyStack.push(this.cvs.toDataURL()); if(this.historyStack.length>20){this.historyStack.shift();this.historyIndex--;} },
            undo() { if(this.historyIndex>0){this.historyIndex--; this.restore(); StorageEngine.saveCanvasLocal(); StorageEngine.scheduleCloudSave();} },
            restore() { if(!this.ctx||!this.cvs)return; const img=new Image(); img.onload=()=>{this.ctx.save();this.ctx.setTransform(1,0,0,1,0,0);this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height);this.ctx.drawImage(img,0,0,this.cvs.width,this.cvs.height);this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);this.ctx.restore();}; img.src=this.historyStack[this.historyIndex]; },
            setBrush(t) { STATE.brushType=t; document.querySelectorAll('.btn-magic').forEach(el=>el.classList.remove('active')); const ab=document.getElementById(`btn-brush-${t}`); if(ab)ab.classList.add('active'); if(this.isErasing)this.toggleEraser(); },
            toggleEraser() { this.isErasing=!this.isErasing; const btn=document.getElementById('btn-eraser'); if(btn)btn.classList.toggle('active'); this.updateBrushPreview(); },
            setColor(c) { this.lastColor=c; const p=document.getElementById('btn-color'); if(p)p.style.background=c; if(this.isErasing)this.toggleEraser(); this.updateBrushPreview(); },
            setupUI() { const p=document.getElementById('btn-color'); if(p)p.style.background=this.lastColor; },
            hardReset() { if(!this.ctx||!this.cvs)return; try{this.ctx.save();this.ctx.setTransform(1,0,0,1,0,0);this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height);this.ctx.restore();this.historyStack=[];this.historyIndex=-1;STATE.strokeCount=0;STATE.usedColors.clear();}catch(e){} },
            promptHardReset() { CustomModalEngine.confirm("Clear Canvas","Are you absolutely sure?",()=>{this.hardReset();this.saveHistory();StorageEngine.saveCanvasLocal();StorageEngine.scheduleCloudSave();}); }
        };

        const RGBRingEngine = {
            init() { const c=document.getElementById('color-wheel'); if(!c)return; const ctx=c.getContext('2d',{willReadFrequently:true}); for(let a=0;a<360;a++){ctx.beginPath();ctx.moveTo(75,75);ctx.arc(75,75,75,a*Math.PI/180,(a+2)*Math.PI/180);ctx.fillStyle=`hsl(${a},100%,50%)`;ctx.fill();} c.onclick=(e)=>{const r=c.getBoundingClientRect();const d=ctx.getImageData(e.clientX-r.left,e.clientY-r.top,1,1);CanvasEngine.setColor(`rgb(${d.data[0]},${d.data[1]},${d.data[2]})`);this.toggle();}; },
            toggle() { const m=document.getElementById('rgb-modal'); if(m)m.classList.toggle('active'); }
        };

        const CertificateEngine = {
            open(w) { const m=document.getElementById('cert-modal'); if(!m)return; const wl=document.getElementById('cert-week'); if(wl)wl.innerText=`WEEK ${w} COMPLETED`; const nl=document.getElementById('cert-student-name'); if(nl)nl.innerText=STATE.studentName||"Explorer"; const imgEl=document.getElementById('cert-canvas-img'); const mi=CanvasEngine.captureWorksheetWithDrawing(false); if(imgEl)imgEl.src=mi||CanvasEngine.cvs.toDataURL(); const me=document.getElementById('cert-ai-msg'); const ha=STATE.badges.includes("🎨 Colorful Artist"); const hv=STATE.badges.includes("🗣️ Great Speaker"); let msg="Great job!"; if(ha&&hv)msg="Brilliant art and speaking!"; else if(ha)msg="Wonderful colorful art!"; else if(hv)msg="Clear and brave voice!"; if(me)me.innerText=`"${msg}"`; m.classList.add('active'); if(window.confetti)confetti({particleCount:200,spread:120,origin:{y:0.5},colors:['#CBAE75','#89BFA0','#7CA6C1']}); },
            close() { const m=document.getElementById('cert-modal'); if(m)m.classList.remove('active'); if(STATE.currentPage===CurriculumEngine.last(STATE.unitId))location.href='dashboard.html'; else AppEngine.smoothMove(1); },
            print() { const c=document.getElementById('cert-card-content'); const cb=document.querySelector('.cert-close'); const pb=document.querySelector('.btn-print'); if(cb)cb.style.display='none'; if(pb)pb.style.display='none'; if(window.html2canvas&&c){html2canvas(c,{backgroundColor:'#FFF',scale:2}).then((cvs)=>{if(cb)cb.style.display='block';if(pb)pb.style.display='inline-flex';const l=document.createElement('a');l.download=`Cert_${STATE.studentName}.png`;l.href=cvs.toDataURL('image/png');l.click();});}else{window.print();if(cb)cb.style.display='block';if(pb)pb.style.display='inline-flex';} }
        };

        const AudioEngine = {
            recordingMode: 'main',
            async ensurePermission() { try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){await navigator.mediaDevices.getUserMedia({audio:true});return true;}return false;}catch(e){CustomModalEngine.alert("Microphone Needed","마이크 허용이 필요해요!");return false;} },
            init() { const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){this.rec=new SR();this.rec.lang='en-US';this.rec.continuous=false;this.rec.interimResults=false; this.rec.onresult=(e)=>{STATE.lastTranscript=e.results[0][0].transcript;STATE.sttConfidence=Math.round(e.results[0][0].confidence*100);}; this.rec.onend=()=>{if(!STATE.isRecording)return; STATE.isRecording=false; if(this.recordingMode==='chat'){const cb=document.getElementById('btn-chat-record');if(cb){cb.classList.remove('recording');cb.innerText="🎤 Speak to Teacher";}setTimeout(()=>AITutor.processReply(),800);}else{const rb=document.getElementById('btn-record');const rt=document.getElementById('record-text');if(rb)rb.classList.remove('recording');if(rt)rt.innerText="Voice Log";setTimeout(()=>AITutor.submit(),800);}}; this.rec.onerror=()=>{if(STATE.isRecording){STATE.isRecording=false;const rb=document.getElementById('btn-record');const rt=document.getElementById('record-text');if(rb)rb.classList.remove('recording');if(rt)rt.innerText="Voice Log";}}; }else{['btn-record','btn-chat-record'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;});} },
            async toggle() { if(!this.rec)return; const hp=await this.ensurePermission(); if(!hp)return; this.recordingMode='main'; const rb=document.getElementById('btn-record'); const rt=document.getElementById('record-text'); if(!STATE.isRecording){STATE.isRecording=true;if(rb)rb.classList.add('recording');if(rt)rt.innerText="Listening...";this.rec.start();}else{STATE.isRecording=false;if(rb)rb.classList.remove('recording');if(rt)rt.innerText="Voice Log";this.rec.stop();} },
            async toggleChat() { if(!this.rec)return; const hp=await this.ensurePermission(); if(!hp)return; this.recordingMode='chat'; const cb=document.getElementById('btn-chat-record'); if(!STATE.isRecording){STATE.isRecording=true;if(cb){cb.classList.add('recording');cb.innerText="Listening...";}this.rec.start();}else{STATE.isRecording=false;if(cb){cb.classList.remove('recording');cb.innerText="🎤 Speak to Teacher";}this.rec.stop();} }
        };

        const AITutor = {
            isBusy: false,
            getMemory() { return STATE.chatHistory.slice(-4).map(h=>`${h.role}: ${h.text}`).join("\n"); },
            async callBackendTutor(promptText, base64Img=null) {
                const ctrl=new AbortController(); const tId=setTimeout(()=>ctrl.abort(),15000);
                try{
                    if(!auth)throw new Error("No Auth"); const user=auth.currentUser; if(!user)throw new Error("Unauth"); const token=await user.getIdToken();
                    const reqObj={prompt:promptText,image:base64Img,metrics:{strokes:STATE.strokeCount,colors:STATE.usedColors.size},history:this.getMemory()};
                    const res=await fetch(CONFIG.API_TUTOR_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(reqObj),signal:ctrl.signal});
                    clearTimeout(tId); const data=await res.json(); return data.reply||"앗, 지금 대답하기 어려워요.";
                }catch(e){ clearTimeout(tId); return "네트워크 문제로 선생님이 대답하지 못했어요."; }
            },
            async submit() {
                if(STATE.isRecording){AudioEngine.toggle();return;} if(this.isBusy)return; this.isBusy=true;
                const rP=STATE.currentPage; const rU=STATE.unitId; const cont=document.getElementById('ai-content'); const pnl=document.getElementById('ai-panel');
                if(pnl)pnl.classList.add('open'); if(cont)cont.innerHTML=`<div class="ai-loading-container"><i class="fa-solid fa-spinner fa-spin ai-loading-icon"></i><p>Teacher is looking...</p></div>`;
                try{
                    StorageEngine.saveCanvasLocal(); StorageEngine.executeCloudSave();
                    const cvsImg=CanvasEngine.captureWorksheetWithDrawing(true);
                    let ud=PAGE_INTELLIGENCE[STATE.unitId][STATE.currentPage]||{goal:"Exploration",question:"Tell me about it."};
                    let st=STATE.lastTranscript||"Look!";
                    
                    const prompt=`Goal: ${ud.goal}. Question: ${ud.question}. Student said: "${st}". Look at their drawing and respond enthusiastically. Praise their specific effort and end with a follow-up question. Max 3 simple English sentences. No markdown.`;
                    
                    const reply=await this.callBackendTutor(prompt, cvsImg);
                    if(STATE.currentPage!==rP||STATE.unitId!==rU)return;
                    
                    STATE.chatHistory.push({role:"Student",text:st}); STATE.chatHistory.push({role:"Teacher",text:reply});
                    if(!(reply||"").includes("앗,")){ if(!CanvasEngine.isCanvasBlank())BadgeEngine.add("🎨 Colorful Artist"); if(STATE.sttConfidence>=80&&STATE.lastTranscript.length>0)BadgeEngine.add("🗣️ Great Speaker"); }
                    
                    if(cont){ cont.innerHTML=`<div class="analytics-card"><div class="analytics-title">Mission: ${ud.goal}</div><div class="stat-row"><div class="stat-label"><span>Voice</span><span>${STATE.sttConfidence}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${STATE.sttConfidence}%;"></div></div></div><div class="stat-row"><div class="stat-label"><span>Strokes</span><span>${STATE.strokeCount}</span></div></div></div>`; const bbl=document.createElement('div'); bbl.className='chat-bubble ai mt-4'; bbl.textContent=reply; cont.appendChild(bbl); }
                    const ft=document.getElementById('chat-footer'); if(ft)ft.style.display="block"; if(reply)this.speak(reply);
                } finally { this.isBusy=false; }
            },
            async processReply() {
                if(!STATE.lastTranscript||this.isBusy)return; this.isBusy=true;
                const rP=STATE.currentPage; const cont=document.getElementById('ai-content');
                if(cont){
                    const ub=document.createElement('div'); ub.className="chat-bubble user mt-4"; ub.textContent=STATE.lastTranscript; cont.appendChild(ub);
                    STATE.chatHistory.push({role:"Student",text:STATE.lastTranscript});
                    const ab=document.createElement('div'); ab.className="chat-bubble ai mt-4"; ab.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> 생각 중...`; cont.appendChild(ab); cont.scrollTop=cont.scrollHeight;
                    try{
                        const prompt=`Student just answered: "${STATE.lastTranscript}". Give an encouraging 2-sentence reply ending with another question.`;
                        const reply=await this.callBackendTutor(prompt);
                        if(STATE.currentPage!==rP)return;
                        STATE.chatHistory.push({role:"Teacher",text:reply});
                        ab.innerHTML=''; const b=document.createElement('b'); b.style.color='var(--br-green)'; b.textContent=reply; ab.appendChild(b); cont.scrollTop=cont.scrollHeight; if(reply)this.speak(reply);
                    } finally { this.isBusy=false; }
                }else{ this.isBusy=false; }
            },
            speak(text) { if(window.speechSynthesis){ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9; u.pitch=1.05; const vs=window.speechSynthesis.getVoices(); const pvs=vs.filter(v=>v.lang.startsWith('en-')&&(v.name.includes('Google')||v.name.includes('Samantha'))); if(pvs.length>0)u.voice=pvs[0]; window.speechSynthesis.speak(u); } },
            close() { const p=document.getElementById('ai-panel'); if(p)p.classList.remove('open'); if(window.speechSynthesis)window.speechSynthesis.cancel(); }
        };

        const AppEngine = {
            smoothMove(dir) { const np=CurriculumEngine.next(STATE.unitId,STATE.currentPage,dir); if(np===STATE.currentPage)return; StorageEngine.saveCanvasLocal(); StorageEngine.executeCloudSave(StorageEngine.createCanvasSnapshot(true)); const b=document.getElementById('drawing-board'); if(b)b.classList.add('fade-out'); setTimeout(()=>{STATE.currentPage=np; PageEngine.load(STATE.currentPage); setTimeout(()=>{if(b)b.classList.remove('fade-out');},150);},400); },
            handleNextAdventure() { AITutor.close(); if(CurriculumEngine.isWeekEnd(STATE.unitId,STATE.currentPage)){CertificateEngine.open(CurriculumEngine.weekIndex(STATE.unitId,STATE.currentPage));}else{this.smoothMove(1);} }
        };

        const PageEngine = {
            init() { const l=document.getElementById('nav-list'); if(!l)return; l.innerHTML=''; const ud=PAGE_INTELLIGENCE[STATE.unitId]; if(ud){ Object.keys(ud).forEach(k=>{const i=document.createElement('div'); i.className='nav-item interactive-hover'; i.id=`nav-${k}`; i.innerHTML=`<span class="nav-title">${ud[k].navTitle}</span><span class="nav-badge">W${CurriculumEngine.weekIndex(STATE.unitId,Number(k))}-P.${k}</span>`; i.onclick=()=>{AppEngine.smoothMove(Number(k)-STATE.currentPage);UIEngine.closeSidebar();}; l.appendChild(i);}); } this.load(STATE.currentPage); },
            load(n) { STATE.currentPage=n; STATE.lastTranscript=""; STATE.sttConfidence=0; const ui=document.getElementById('unit-info'); if(ui)ui.innerText=`MASTER LAB: ${STATE.unitId}`; const pgt=document.getElementById('page-goal-text'); const pnt=document.getElementById('page-number-text'); if(pnt)pnt.innerText=`Inquiry P.${String(n).padStart(2,'0')}`; let gt="Exploration"; if(PAGE_INTELLIGENCE[STATE.unitId]&&PAGE_INTELLIGENCE[STATE.unitId][n])gt=PAGE_INTELLIGENCE[STATE.unitId][n].goal; if(pgt)pgt.innerText=gt; document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active')); const an=document.getElementById(`nav-${n}`); const nl=document.getElementById('nav-list'); if(an){an.classList.add('active'); if(nl)nl.scrollTo({top:an.offsetTop-nl.offsetTop-50,behavior:'smooth'});} CanvasEngine.hardReset(); AITutor.close(); const wi=document.getElementById('worksheet-img'); if(wi)wi.style.opacity='0'; SmartImageLoader.findValidWorksheet(STATE.unitId,STATE.currentPage); StorageEngine.save(); }
        };

        const UIEngine = { toggleSidebar() { if(window.innerWidth>1180)return; document.getElementById('sidebar')?.classList.toggle('open'); document.getElementById('sidebar-backdrop')?.classList.toggle('active'); }, closeSidebar() { document.getElementById('sidebar')?.classList.remove('open'); document.getElementById('sidebar-backdrop')?.classList.remove('active'); } };

        // [P0] 앱 기동 및 100% 안전 Firebase 부팅 래퍼
        let systemBooted = false;
        function SystemBoot() {
            if(systemBooted) return; systemBooted = true;
            try {
                StorageEngine.load(); CustomModalEngine.init(); CanvasEngine.init(); RGBRingEngine.init(); AudioEngine.init(); CursorEngine.init(); BadgeEngine.renderAll(); PageEngine.init(); SyncIndicatorEngine.init();
                Logger.log("V100.300 Enterprise Master Boot Complete.");
            } catch(e) { Logger.error("Boot error", e); }
        }

        function safeFirebaseBoot() {
            if (typeof firebase !== 'undefined' && firebase.apps) {
                try {
                    if (!firebase.apps.length) firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
                    auth = firebase.auth(); db = firebase.firestore();
                    auth.onAuthStateChanged((user) => {
                        if (user) {
                            STATE.uid = user.uid; STATE.studentEmail = user.email; STATE.studentName = user.email.split('@')[0].toUpperCase();
                            const pb = document.getElementById('profile-box'); if(pb) pb.classList.add('registered');
                            const dn = document.getElementById('display-name'); if(dn) dn.innerText = STATE.studentName;
                            const ac = document.getElementById('avatar-char'); if(ac) ac.innerText = STATE.studentName.charAt(0);
                        } else {
                            STATE.studentName = "GUEST";
                        }
                        SystemBoot();
                    });
                } catch (e) { SystemBoot(); }
            } else { setTimeout(safeFirebaseBoot, 100); } // 0.1초마다 Firebase 모듈 로딩 체크
        }

        document.addEventListener("DOMContentLoaded", () => {
            safeFirebaseBoot();
            setTimeout(() => { if (!systemBooted) { STATE.studentName = "GUEST"; SystemBoot(); } }, 4000); // 4초 초과 시 절대 강제 기동
        });
    </script>
</body>
