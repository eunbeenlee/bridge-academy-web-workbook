<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium EdTech Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Visual AI (OCR) 엔진 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- 낙서 인식(Doodle Recognition) 엔진 -->
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

    <style>
        :root {
            --br-green: #89BFA0; --br-gold: #CBAE75; --br-blue: #7CA6C1; --br-charcoal: #363431;
            --br-bg: #FCFBF9; --br-paper: #FFFFFF; --br-text: #2A2825; --br-muted: #8C8985;
            --br-border: #F0EFEB; --br-error: #E74C3C; --br-ai: #F4F8F5;
            --sidebar-width: 320px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: var(--br-bg); color: var(--br-text); font-family: 'Noto Sans KR', sans-serif; pointer-events: auto !important; }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }
        
        .app-container { display: flex; width: 100vw; height: 100dvh; position: relative; pointer-events: auto !important; }
        
        /* [Sidebar] */
        .sidebar { width: var(--sidebar-width); height: 100%; background: var(--br-paper); border-right: 1px solid var(--br-border); display: flex; flex-direction: column; z-index: 10000; transition: transform 0.4s ease; flex-shrink: 0; }
        .sidebar-header { padding: 40px 30px 30px; text-align: center; border-bottom: 1px solid var(--br-border); cursor: pointer; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--br-charcoal); }
        .brand-logo span { color: var(--br-green); font-style: italic; }
        
        .student-profile { padding: 20px 30px; border-bottom: 1px solid var(--br-border); display: flex; align-items: center; gap: 15px; background: #FAFAFA; }
        .student-profile.registered { background: #F4F8F5; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--br-border); color: var(--br-muted); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 22px; flex-shrink: 0; }
        .student-profile.registered .profile-avatar { background: var(--br-gold); color: #FFF; }
        .profile-info { display: flex; flex-direction: column; overflow: hidden; }
        .profile-name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-role { font-size: 11px; color: var(--br-muted); letter-spacing: 1px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-item { padding: 18px 20px; margin-bottom: 10px; border-radius: 16px; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .nav-item.active { background: var(--br-ai); border-left: 6px solid var(--br-green); font-weight: 900; }
        .nav-title { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .nav-badge { font-size: 11px; font-weight: 900; opacity: 0.3; }
        
        /* [Workspace] */
        .workspace { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; overflow: hidden; pointer-events: auto !important; }
        
        .top-bar { height: 90px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 10; border-bottom: 1px solid transparent; }
        .unit-info { font-size: 13px; font-weight: 900; color: var(--br-gold); letter-spacing: 5px; }
        .page-info { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 700; color: var(--br-charcoal); margin-top: 5px; }
        
        /* [Stage Wrapper] */
        .stage-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px 40px; position: relative; overflow: hidden; pointer-events: auto !important; perspective: 1000px; }
        .drawing-board { position: relative; display: inline-flex; line-height: 0; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); background: var(--br-paper); max-width: 100%; max-height: 100%; pointer-events: auto !important; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: center center; opacity: 1; transform: scale(1); }
        .drawing-board.fade-out { opacity: 0; transform: scale(0.95) translateY(10px); pointer-events: none !important; }

        #worksheet-img { display: block; max-width: 100%; max-height: calc(100dvh - 240px); width: auto; height: auto; opacity: 0; transition: opacity 0.3s; border-radius: 15px; user-select: none; pointer-events: none !important; }
        
        /* 🚨 V84.0 CSS 커서 설정: js에서 덮어씌울 예정이므로 기본값 제거 */
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999 !important; touch-action: none; pointer-events: auto !important; border-radius: 15px; }

        /* [Bottom Dock] */
        .bottom-dock { height: 120px; flex-shrink: 0; background: rgba(255, 255, 255, 0.95); border-top: 1px solid var(--br-border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 500; }
        
        .tool-group { display: flex; align-items: center; gap: 15px; background: #FAFAFA; padding: 10px 25px; border-radius: 100px; border: 1px solid var(--br-border); }
        .color-preview { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #FFF; cursor: pointer; background: var(--br-charcoal); box-shadow: 0 5px 10px rgba(0,0,0,0.05); flex-shrink: 0; }
        .brush-slider { width: 120px; accent-color: var(--br-green); cursor: pointer; height: 6px; }
        
        .btn-erase { font-size: 13px; font-weight: 900; color: var(--br-charcoal); padding: 10px 15px; border-radius: 15px; transition: 0.3s; background: #FFF; border: 1px solid var(--br-border); cursor: pointer; }
        .btn-erase.active { background: var(--br-error); color: #FFF; border-color: var(--br-error); }
        .btn-erase-all { font-size: 11px; font-weight: 800; color: var(--br-muted); cursor: pointer; padding: 5px; }
        
        .action-group { display: flex; gap: 12px; align-items: center; }
        .btn-nav { width: 60px; height: 60px; border-radius: 18px; border: 1px solid var(--br-border); font-size: 24px; background: #FFF; cursor: pointer; color: var(--br-charcoal); display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: 0.2s; }
        .btn-nav:active { transform: scale(0.9); }
        .btn-core { height: 60px; padding: 0 25px; border-radius: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; flex-shrink: 0; transition: 0.2s; }
        .btn-core:active { transform: scale(0.95); }
        .btn-record { background: #FFF; color: var(--br-charcoal); border: 1px solid var(--br-border); }
        .btn-record .dot { width: 10px; height: 10px; background: var(--br-error); border-radius: 50%; opacity: 0; }
        .btn-record.recording { background: #FFF0F0; color: var(--br-error); border-color: #FADBD8; }
        .btn-record.recording .dot { opacity: 1; animation: blink 1s infinite; }
        .btn-submit { background: var(--br-charcoal); color: #FFF; }

        /* [RGB Color Ring Modal] */
        .rgb-modal { position: absolute; bottom: 130px; left: 40px; background: var(--br-paper); border-radius: 25px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 1px solid var(--br-border); z-index: 20000; opacity: 0; pointer-events: none; transform: translateY(20px); transition: 0.3s ease; display: flex; flex-direction: column; align-items: center; touch-action: none; }
        .rgb-modal.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #color-wheel { border-radius: 50%; cursor: crosshair; touch-action: none; }
        .rgb-close { text-align: center; font-size: 11px; font-weight: 900; color: var(--br-muted); margin-top: 15px; cursor: pointer; letter-spacing: 2px; padding: 10px; }

        /* [Multi-Turn AI Teacher Panel] */
        .ai-panel { position: absolute; top: 0; right: -450px; width: 450px; height: 100%; background: #FFF; box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 10001; transition: right 0.5s ease; display: flex; flex-direction: column; border-left: 1px solid var(--br-border); }
        .ai-panel.open { right: 0; }
        .ai-header { padding: 25px; background: var(--br-ai); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br-border); flex-shrink: 0; }
        .ai-title { font-size: 18px; font-weight: 900; color: var(--br-green); display: flex; align-items: center; gap: 10px; }
        .btn-close-ai { font-size: 32px; color: var(--br-muted); line-height: 1; cursor: pointer; }
        
        .ai-content { padding: 25px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .chat-bubble { max-width: 85%; padding: 18px; border-radius: 20px; font-size: 15px; line-height: 1.6; font-weight: 500; word-break: keep-all; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .chat-bubble.ai { align-self: flex-start; background: #F8F9FA; border: 1px solid var(--br-border); border-bottom-left-radius: 5px; color: var(--br-text); }
        .chat-bubble.user { align-self: flex-end; background: var(--br-green); color: #FFF; border-bottom-right-radius: 5px; box-shadow: 0 5px 15px rgba(137,191,160,0.2); }
        
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .analytics-box { background: #FAFAFA; border: 1px solid var(--br-border); border-radius: 20px; padding: 20px; margin-bottom: 10px; align-self: stretch; animation: popIn 0.4s ease; }
        .analytics-title { font-size: 11px; font-weight: 900; color: var(--br-muted); letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        .stat-row { margin-bottom: 12px; }
        .stat-label { font-size: 12px; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--br-charcoal); }
        .stat-bar-bg { width: 100%; height: 8px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--br-gold); width: 0%; transition: width 1.5s ease; border-radius: 10px; }
        .stat-bar-fill.green { background: var(--br-green); }
        .stat-bar-fill.blue { background: var(--br-blue); }
        
        .chat-input-area { padding: 20px 25px; border-top: 1px solid var(--br-border); background: #FFF; display: flex; flex-direction: column; gap: 10px; }
        .btn-chat-record { width: 100%; height: 55px; background: var(--br-charcoal); color: #FFF; border-radius: 15px; font-weight: 900; font-size: 15px; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s; }
        .btn-chat-record.recording { background: var(--br-error); animation: pulse 1.5s infinite; }
        .btn-chat-next { width: 100%; height: 55px; background: var(--br-blue); color: #FFF; border-radius: 15px; font-weight: 900; font-size: 15px; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(124,166,193,0.3); }
        .btn-chat-next:active { transform: scale(0.95); }

        .ai-name-input { width: 100%; padding: 15px; border: 2px dashed var(--br-green); border-radius: 12px; margin-top: 15px; font-size: 16px; text-align: center; font-weight: 800; outline: none; }
        .ai-name-btn { width: 100%; background: var(--br-green); color: #fff; padding: 15px; border-radius: 12px; margin-top: 10px; font-weight: 900; cursor: pointer; font-size: 14px; }
        .ai-btn-secondary { background: #EEE; color: #333; margin-top: 5px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .mobile-menu-btn { display: none; font-size: 28px; padding: 10px; color: var(--br-charcoal); z-index: 1500; }

        @media (max-width: 1024px) {
            :root { --sidebar-width: 260px; }
            .top-bar { height: 75px; padding: 0 20px; }
            .bottom-dock { height: 100px; padding: 0 20px; }
            .stage-wrapper { padding: 10px 20px; }
            .rgb-modal { left: 20px; bottom: 110px; }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; left: calc(var(--sidebar-width) * -1); top: 0; box-shadow: none; }
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            .top-bar { height: 70px; }
            #worksheet-img { max-height: calc(100dvh - 230px); }
            .bottom-dock { height: 140px; flex-direction: column; justify-content: center; padding: 10px 20px; gap: 12px; border-radius: 25px 25px 0 0; }
            .tool-group { width: 100%; justify-content: center; padding: 8px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
            .btn-nav, .btn-core { height: 50px; font-size: 13px; }
            .ai-panel { width: 100%; right: -100%; border-left: none; }
            .rgb-modal { left: 50%; transform: translateX(-50%) translateY(20px); bottom: 160px; }
            .rgb-modal.active { transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header" onclick="location.href='index.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>
            <div class="student-profile" id="profile-box">
                <div class="profile-avatar" id="avatar-char">?</div>
                <div class="profile-info">
                    <span class="profile-name" id="display-student-name">Inquirer</span>
                    <span class="profile-role">Awaiting Name</span>
                </div>
            </div>
            <div class="nav-list" id="nav-list"></div>
        </nav>

        <div class="workspace">
            <div class="top-bar">
                <div class="top-bar-left" style="display:flex; align-items:center; gap:10px;">
                    <button class="mobile-menu-btn" onclick="UIEngine.toggleSidebar()">☰</button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
            </div>

            <main class="stage-wrapper">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img" crossorigin="anonymous">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <div class="bottom-dock">
                <div class="tool-group">
                    <div class="color-preview" id="btn-color" onclick="RGBRingEngine.toggle()"></div>
                    <input type="range" class="brush-slider" id="brush-size" min="2" max="40" value="6">
                    
                    <button class="btn-erase" onclick="CanvasEngine.undo()" title="Undo">↺</button>
                    <button class="btn-erase" onclick="CanvasEngine.redo()" title="Redo">↻</button>
                    
                    <button class="btn-erase" id="btn-eraser" style="margin-left: 10px;" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-erase-all" onclick="CanvasEngine.clearAll()">[CLEAR ALL]</button>
                </div>
                
                <div class="action-group">
                    <button class="btn-nav" onclick="AppEngine.smoothPageTransition(-1)">◀</button>
                    <button class="btn-core btn-record" id="btn-record" onclick="AudioEngine.toggle()">
                        <div class="dot"></div> <span id="record-text">Audio Log</span>
                    </button>
                    <button class="btn-core btn-submit" onclick="AITutor.submitWork()">Submit ✨</button>
                    <button class="btn-nav" onclick="AppEngine.smoothPageTransition(1)">▶</button>
                </div>
            </div>
        </div>

        <div class="rgb-modal" id="rgb-modal">
            <canvas id="color-wheel" width="180" height="180"></canvas>
            <div class="rgb-close" onclick="RGBRingEngine.toggle()">[ CLOSE ]</div>
        </div>

        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">Bridge AI Tutor</div>
                <button class="btn-close-ai" onclick="AITutor.close()">×</button>
            </div>
            <div class="ai-content" id="ai-content"></div>
            <div class="chat-input-area" id="chat-input-area" style="display:none;">
                <button class="btn-chat-record" id="btn-chat-record" onclick="AudioEngine.toggleChat()">
                    🎤 <span>Hold to Reply</span>
                </button>
                <button class="btn-chat-next" onclick="AppEngine.smoothPageTransition(1); AITutor.close();">
                    NEXT ADVENTURE 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            STORAGE_URL: "https://eunbeenlee.github.io/bridge-heritage/assets/"
        };

        const STATE = {
            studentName: "", isNameRegistered: false,
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1, isRecording: false, lastTranscript: "",
            audioStartTime: 0, audioDurationSec: 0, sttConfidence: 0,
            isChatMode: false 
        };

        const AppEngine = {
            smoothPageTransition(direction) {
                const board = document.getElementById('drawing-board');
                board.classList.add('fade-out');
                setTimeout(() => {
                    PageEngine.move(direction);
                    setTimeout(() => {
                        board.classList.remove('fade-out');
                    }, 150); 
                }, 400);
            }
        };

        const UIEngine = {
            toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); },
            closeSidebarOnMobile() { if(window.innerWidth <= 800) document.getElementById('sidebar').classList.remove('open'); }
        };

        const AI_CONTEXT_DB = {
            "A-1": {
                pages: {
                    1: { navTitle: "👑 My Special Name", keywords: ["name", "hello", "am", "is"], intent: "Expressing name and identity", analysis: "The strokes show positive self-perception.", question: "What makes your name special?" },
                    2: { navTitle: "👀 My Beautiful Face", keywords: ["face", "eyes", "nose", "mouth"], intent: "Depicting face", analysis: "High observation skills shown.", question: "What is your favorite part of your face?" },
                    3: { navTitle: "🖐️ My Strong Hands", keywords: ["hands", "touch", "clap"], intent: "Exploring body functions", analysis: "Shows understanding of body capabilities.", question: "What fun things can you do with hands?" },
                    4: { navTitle: "👨‍👩‍👧 My Family Tree", keywords: ["mom", "dad", "family", "brother", "sister"], intent: "Understanding family", analysis: "Clear depiction of family members.", question: "Who did you draw here?" },
                    5: { navTitle: "🎨 My Favorite Colors", keywords: ["color", "red", "blue", "yellow", "green"], intent: "Expressing preferences", analysis: "Vibrant color choices.", question: "Why did you choose these colors?" }
                }
            }
        };

        function getPageContext(unitId, pageNum) {
            const unitData = AI_CONTEXT_DB[unitId];
            if (unitData && unitData.pages[pageNum]) return unitData.pages[pageNum];
            return { navTitle: "✨ Inquiry Lab", keywords: ["wow", "beautiful"], intent: "Creative problem-solving", analysis: "Approaches from multiple angles.", question: "Can you tell me more about this?" };
        }

        const PageEngine = {
            init() {
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                const list = document.getElementById('nav-list');
                for(let i=1; i<=17; i++) {
                    const ctx = getPageContext(STATE.id, i);
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span class="nav-title">${ctx.navTitle}</span> <span class="nav-badge">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => { AppEngine.smoothPageTransition(i - STATE.currentPage); UIEngine.closeSidebarOnMobile(); };
                    list.appendChild(item);
                }
                this.load(1);
            },
            load(n) {
                STATE.currentPage = n; STATE.lastTranscript = ""; STATE.sttConfidence = 0; STATE.audioDurationSec = 0;
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE_URL}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png?t=${new Date().getTime()}`;
                
                const img = document.getElementById('worksheet-img');
                img.style.opacity = '0'; 
                img.src = imgPath;
                
                img.onload = () => { 
                    img.style.opacity = '1'; 
                    CanvasEngine.resizeCanvas();
                };

                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${n}`);
                if(activeNav) activeNav.classList.add('active');
                
                CanvasEngine.clearAll(); AITutor.close();
            },
            move(dir) { 
                const t = STATE.currentPage + dir; 
                if(t >= 1 && t <= 17) this.load(t); 
            }
        };

        const RGBRingEngine = {
            init() {
                this.modal = document.getElementById('rgb-modal');
                this.cvs = document.getElementById('color-wheel');
                this.ctx = this.cvs.getContext('2d', { willReadFrequently: true });
                
                const size = 180;
                this.cvs.width = size;
                this.cvs.height = size;
                this.cvs.style.width = size + 'px';
                this.cvs.style.height = size + 'px';
                
                this.drawWheel(size);
                this.bind();
            },
            drawWheel(size) {
                const radius = size / 2;
                for(let angle=0; angle<=360; angle++) {
                    const startAngle = (angle - 1) * Math.PI / 180;
                    const endAngle = (angle + 1) * Math.PI / 180;
                    this.ctx.beginPath();
                    this.ctx.moveTo(radius, radius);
                    this.ctx.arc(radius, radius, radius, startAngle, endAngle);
                    this.ctx.closePath();
                    this.ctx.fillStyle = `hsl(${angle}, 100%, 50%)`;
                    this.ctx.fill();
                }
                const grad = this.ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0,0,size, size);
                
                this.ctx.beginPath();
                this.ctx.arc(radius, radius, 12, 0, Math.PI*2);
                this.ctx.fillStyle = "#363431";
                this.ctx.fill();
            },
            bind() {
                const pickColor = (e) => {
                    e.preventDefault();
                    const rect = this.cvs.getBoundingClientRect();
                    let clientX = e.clientX; let clientY = e.clientY;
                    
                    if(e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
                    }
                    
                    const x = Math.floor(clientX - rect.left);
                    const y = Math.floor(clientY - rect.top);
                    
                    const pixel = this.ctx.getImageData(x, y, 1, 1).data;
                    if(pixel[3] < 50) return; 
                    
                    const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1).toUpperCase();
                    CanvasEngine.setColor(hex);
                    this.toggle(); 
                };
                this.cvs.addEventListener('mousedown', pickColor, { passive: false });
                this.cvs.addEventListener('touchstart', pickColor, { passive: false });
            },
            toggle() { this.modal.classList.toggle('active'); }
        };

        const CanvasEngine = {
            isDrawing: false, hasMoved: false, isErasing: false, lastColor: "#363431",
            dpr: window.devicePixelRatio || 1, historyStack: [], historyIndex: -1,

            init() {
                this.cvs = document.getElementById('draw-layer');
                this.ctx = this.cvs.getContext('2d');
                this.board = document.getElementById('drawing-board');

                this.setupUI();
                requestAnimationFrame(() => {
                    this.setupCanvas();
                    setTimeout(() => {
                        this.setupCanvas();
                        this.saveState(); 
                    }, 50);
                });
                
                this.bindEvents();
                this.setupResizeObserver();
                this.updateCursor(); // 🚨 V84.0 커서 초기 세팅
            },

            // 🚨 V84.0 마우스 커서를 귀여운 펜/지우개로 실시간 변경하는 매직 엔진
            updateCursor() {
                if (this.isErasing) {
                    // 귀여운 핑크색 지우개 커서
                    const eraserSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="%23FFB6C1" stroke="%23363431" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11C23 12 23 14 22 15L20 20Z"/><path d="M17 17L7 7"/></svg>`;
                    this.cvs.style.cursor = `url('data:image/svg+xml;utf8,${eraserSvg}') 4 24, cell`;
                } else {
                    // 현재 선택된 색깔이 칠해진 귀여운 연필/마법스틱 커서
                    const colorEncoded = this.lastColor.replace('#', '%23');
                    const penSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="${colorEncoded}" stroke="%23363431" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/><path d="M15 5l4 4"/><circle cx="2" cy="22" r="2.5" fill="${colorEncoded}" stroke="none"/></svg>`;
                    this.cvs.style.cursor = `url('data:image/svg+xml;utf8,${penSvg}') 2 24, crosshair`;
                }
            },

            setupCanvas() {
                const rect = this.board.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;

                this.cvs.style.width = rect.width + "px";
                this.cvs.style.height = rect.height + "px";
                this.cvs.width = rect.width * this.dpr;
                this.cvs.height = rect.height * this.dpr;

                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                
                const baseSize = document.getElementById('brush-size').value;
                this.ctx.lineWidth = this.isErasing ? baseSize * 2 : baseSize;
                this.ctx.strokeStyle = this.lastColor;
                this.ctx.globalCompositeOperation = this.isErasing ? "destination-out" : "source-over";
            },

            setupResizeObserver() {
                const ro = new ResizeObserver(() => { requestAnimationFrame(() => { this.resizeCanvas(); }); });
                ro.observe(this.board);
            },

            resizeCanvas() {
                if (!this.cvs || !this.ctx || !this.board) return;
                const rect = this.board.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;

                const temp = document.createElement('canvas');
                temp.width = this.cvs.width; temp.height = this.cvs.height;
                if(this.cvs.width > 0 && this.cvs.height > 0) temp.getContext('2d').drawImage(this.cvs, 0, 0);

                this.setupCanvas();

                if(temp.width > 0 && temp.height > 0) {
                    this.ctx.save();
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                    this.ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, this.cvs.width, this.cvs.height);
                    this.ctx.restore();
                }
            },

            getPos(e) {
                const rect = this.cvs.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            },

            bindEvents() {
                this.cvs.style.touchAction = "none"; 

                this.cvs.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); 
                    this.isDrawing = true; this.hasMoved = false; 
                    try { this.cvs.setPointerCapture(e.pointerId); } catch(err){}

                    const p = this.getPos(e);
                    this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y);
                });

                this.cvs.addEventListener('pointermove', (e) => {
                    if (!this.isDrawing) return;
                    e.preventDefault(); this.hasMoved = true; 

                    const p = this.getPos(e);
                    this.ctx.lineTo(p.x, p.y); this.ctx.stroke();
                });

                this.cvs.addEventListener('pointerup', (e) => {
                    this.isDrawing = false;
                    try { this.cvs.releasePointerCapture(e.pointerId); } catch(err){}
                    if(this.hasMoved) { this.saveState(); }
                });

                this.cvs.addEventListener('pointercancel', (e) => {
                    this.isDrawing = false;
                    try { this.cvs.releasePointerCapture(e.pointerId); } catch(err){}
                });

                this.cvs.addEventListener('pointerleave', () => { this.isDrawing = false; });
            },

            saveState() {
                this.historyIndex++;
                if (this.historyIndex < this.historyStack.length) {
                    this.historyStack.length = this.historyIndex;
                }
                this.historyStack.push(this.cvs.toDataURL());
            },

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.restoreState();
                }
            },

            redo() {
                if (this.historyIndex < this.historyStack.length - 1) {
                    this.historyIndex++;
                    this.restoreState();
                }
            },

            restoreState() {
                const img = new Image();
                img.onload = () => {
                    this.ctx.save();
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
                    this.ctx.drawImage(img, 0, 0);
                    this.ctx.restore();
                };
                img.src = this.historyStack[this.historyIndex];
            },

            setColor(hex) {
                this.lastColor = hex;
                document.getElementById('btn-color').style.background = hex;
                if (!this.isErasing) { 
                    this.ctx.strokeStyle = this.lastColor; 
                }
                this.updateCursor(); // 🚨 색상이 바뀔 때마다 커서 마법 지팡이 색도 실시간 변경!
            },

            setupUI() {
                const colorBtn = document.getElementById('btn-color');
                colorBtn.style.background = this.lastColor;
                document.getElementById('brush-size').oninput = (e) => {
                    const size = e.target.value;
                    this.ctx.lineWidth = this.isErasing ? size * 2 : size;
                };
            },

            toggleEraser() {
                const btn = document.getElementById('btn-eraser');
                this.isErasing = !this.isErasing;

                if (this.isErasing) {
                    btn.classList.add('active'); btn.innerText = "PEN MODE";
                    this.ctx.globalCompositeOperation = 'destination-out';
                    this.ctx.lineWidth = document.getElementById('brush-size').value * 2;
                } else {
                    btn.classList.remove('active'); btn.innerText = "ERASER";
                    this.ctx.globalCompositeOperation = 'source-over';
                    this.ctx.strokeStyle = this.lastColor;
                    this.ctx.lineWidth = document.getElementById('brush-size').value;
                }
                this.updateCursor(); // 🚨 지우개 상태에 따라 커서 모양 변경
            },

            clearAll() {
                if (!this.ctx || !this.cvs) return;
                this.ctx.save();
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
                this.ctx.restore();
                this.saveState(); 
            }
        };

        const VisionAI = {
            classifier: null, isReady: false,
            init() {
                try {
                    this.classifier = ml5.imageClassifier('DoodleNet', () => {
                        this.isReady = true; console.log("DoodleNet is loaded and ready.");
                    });
                } catch(e) { console.warn("Vision AI failed to initialize."); }
            },
            async classifyCanvas(canvas) {
                if(!this.isReady || !this.classifier) return null;
                return new Promise((resolve) => {
                    this.classifier.classify(canvas, (err, results) => {
                        if(err) resolve(null);
                        else resolve(results[0].label); 
                    });
                });
            }
        };

        const AudioEngine = {
            recognition: null,
            init() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'en-US'; 
                    this.recognition.interimResults = false; 
                    this.recognition.continuous = false;
                    
                    this.recognition.onresult = (event) => { 
                        STATE.lastTranscript = event.results[0][0].transcript;
                        STATE.sttConfidence = Math.round(event.results[0][0].confidence * 100);
                    };
                    this.recognition.onend = () => { 
                        if (STATE.isRecording) { STATE.isChatMode ? this.toggleChat() : this.toggle(); }
                    };
                    this.recognition.onerror = () => { 
                        if (STATE.isRecording) { STATE.isChatMode ? this.toggleChat() : this.toggle(); }
                    };
                }
            },
            toggle() {
                const btn = document.getElementById('btn-record'); const text = document.getElementById('record-text');
                if(!STATE.isRecording) { 
                    STATE.isRecording = true; STATE.isChatMode = false; STATE.lastTranscript = ""; STATE.sttConfidence = 0;
                    STATE.audioStartTime = Date.now();
                    btn.classList.add('recording'); text.innerText = "Listening..."; 
                    if(this.recognition) { try { this.recognition.start(); } catch(e) {} }
                } else { 
                    STATE.isRecording = false; 
                    STATE.audioDurationSec = (Date.now() - STATE.audioStartTime) / 1000;
                    btn.classList.remove('recording'); text.innerText = "Audio Log"; 
                    if(this.recognition) { this.recognition.stop(); }
                    setTimeout(() => { AITutor.submitWork(); }, 500);
                }
            },
            toggleChat() {
                const btn = document.getElementById('btn-chat-record');
                if(!STATE.isRecording) { 
                    STATE.isRecording = true; STATE.isChatMode = true; STATE.lastTranscript = "";
                    btn.classList.add('recording'); btn.innerHTML = "🎤 <span>Listening...</span>"; 
                    if(this.recognition) { try { this.recognition.start(); } catch(e) {} }
                } else { 
                    STATE.isRecording = false; 
                    btn.classList.remove('recording'); btn.innerHTML = "🎤 <span>Hold to Reply</span>"; 
                    if(this.recognition) { this.recognition.stop(); }
                    setTimeout(() => { AITutor.processChatReply(); }, 500);
                }
            }
        };

        const AITutor = {
            async submitWork() {
                if(STATE.isRecording) { AudioEngine.toggle(); return; }
                
                if (STATE.currentPage === 1 && !STATE.isNameRegistered) { 
                    this.scanHandwritingForName(); 
                    return; 
                }
                
                const panel = document.getElementById('ai-panel'); 
                const content = document.getElementById('ai-content'); 
                panel.classList.add('open');
                
                content.innerHTML = `<div style="text-align:center; padding: 50px 0;"><div style="width:50px; height:50px; border:4px solid #EEE; border-top-color:var(--br-green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div><p style="font-size:13px; color:var(--br-muted); font-weight:900; letter-spacing:3px; animation: pulse 1.5s infinite;">ANALYZING AUDIO & DRAWING...</p></div>`;
                document.getElementById('chat-input-area').style.display = "none";

                let doodleLabel = await VisionAI.classifyCanvas(CanvasEngine.cvs);
                if (doodleLabel) doodleLabel = doodleLabel.replace(/_/g, ' '); 

                setTimeout(() => {
                    this.provideFeedback(false, doodleLabel);
                }, 800);
            },
            
            scanHandwritingForName() {
                const panel = document.getElementById('ai-panel'); 
                const content = document.getElementById('ai-content');
                panel.classList.add('open'); 
                document.getElementById('chat-input-area').style.display = "none";
                
                content.innerHTML = `
                    <div style="text-align:center; padding: 50px 0;">
                        <div style="width:50px; height:50px; border:4px solid #EEE; border-top-color:var(--br-green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div>
                        <p id="ocr-status" style="font-size:13px; color:var(--br-muted); font-weight:900; letter-spacing:3px; animation: pulse 1.5s infinite;">ACTIVATING VISUAL AI...</p>
                    </div>
                `;

                const tempCvs = document.createElement('canvas');
                tempCvs.width = CanvasEngine.cvs.width * 2; 
                tempCvs.height = CanvasEngine.cvs.height * 2;
                const tCtx = tempCvs.getContext('2d');
                tCtx.fillStyle = '#FFFFFF'; 
                tCtx.fillRect(0, 0, tempCvs.width, tempCvs.height);
                tCtx.drawImage(CanvasEngine.cvs, 0, 0, tempCvs.width, tempCvs.height);
                
                const imgData = tempCvs.toDataURL('image/jpeg', 1.0);

                if(window.Tesseract) {
                    setTimeout(() => { document.getElementById('ocr-status').innerText = "READING HANDWRITING..."; }, 800);
                    Tesseract.recognize(imgData, 'eng').then(({ data: { text } }) => {
                        let cleanedName = text.replace(/[^a-zA-Z]/g, '').trim();
                        if (cleanedName.length >= 2) {
                            cleanedName = cleanedName.charAt(0).toUpperCase() + cleanedName.slice(1).toLowerCase();
                            this.confirmScannedName(cleanedName);
                        } else {
                            this.showManualInput("I couldn't quite read that. What is your name?");
                        }
                    }).catch(err => {
                        this.showManualInput("Visual AI failed. Please type your name.");
                    });
                } else {
                    this.showManualInput("Visual AI is offline. Please type your name.");
                }
            },

            confirmScannedName(scannedName) {
                const content = document.getElementById('ai-content');
                content.innerHTML = `
                    <div class="chat-bubble ai">
                        <b>Bridge Visual AI</b><br><br>
                        Wow! I read your handwriting. Is your name <b style="color:var(--br-green); font-size:20px;">${scannedName}</b>?<br><br>
                        <button class="ai-name-btn" onclick="AITutor.saveName('${scannedName}')">YES, THAT'S ME!</button>
                        <button class="ai-name-btn ai-btn-secondary" onclick="AITutor.showManualInput('Let me try typing it instead.')">NO, LET ME TYPE</button>
                    </div>
                `;
            },

            showManualInput(message) {
                const content = document.getElementById('ai-content');
                content.innerHTML = `
                    <div class="chat-bubble ai">
                        <b>Bridge Visual AI</b><br><br>
                        ${message}<br>
                        <input type="text" id="ai-name-verify" class="ai-name-input" placeholder="e.g. Elena" autocomplete="off" onkeypress="if(event.key === 'Enter') AITutor.saveName()">
                        <button class="ai-name-btn" onclick="AITutor.saveName()">CONFIRM NAME</button>
                    </div>
                `;
                setTimeout(() => {
                    const input = document.getElementById('ai-name-verify');
                    if(input) input.focus();
                }, 100);
            },

            saveName(providedName = null) {
                const nameInput = providedName || document.getElementById('ai-name-verify').value.trim();
                if(nameInput) {
                    STATE.studentName = nameInput; STATE.isNameRegistered = true;
                    document.getElementById('profile-box').classList.add('registered'); 
                    document.getElementById('display-student-name').innerText = nameInput; 
                    document.getElementById('avatar-char').innerText = nameInput.charAt(0).toUpperCase(); 
                    document.querySelector('.profile-role').innerText = "Bridge Inquirer";
                    
                    this.provideFeedback(true);
                } else { alert("Please enter your name."); }
            },

            provideFeedback(isFirstGreeting = false, doodleLabel = null) {
                const content = document.getElementById('ai-content'); 
                const contextData = getPageContext(STATE.id, STATE.currentPage); 
                const callName = STATE.studentName ? STATE.studentName : "my friend";
                
                let transcriptHtml = ""; let analysisMod = contextData.analysis; 
                let scorePronunciation = 0; let scoreAccuracy = 0; let scoreSpeedWPM = 0; let speedPercentage = 0;
                
                if (STATE.lastTranscript) {
                    transcriptHtml = `<div class="transcript-box">" ${STATE.lastTranscript} "</div>`;
                    scorePronunciation = STATE.sttConfidence || 85;
                    const spokenWords = STATE.lastTranscript.toLowerCase(); 
                    const targetKeywords = contextData.keywords;
                    const hitKeywords = targetKeywords.filter(kw => spokenWords.includes(kw));
                    scoreAccuracy = targetKeywords.length > 0 ? Math.round((hitKeywords.length / targetKeywords.length) * 100) : 100;
                    
                    const wordCount = STATE.lastTranscript.trim().split(/\s+/).length;
                    if (STATE.audioDurationSec > 0) scoreSpeedWPM = Math.round((wordCount / STATE.audioDurationSec) * 60);
                    speedPercentage = Math.min(Math.round((scoreSpeedWPM / 120) * 100), 100);

                    if (hitKeywords.length > 0) analysisMod = `<b style="color:var(--br-green);">Excellent Accuracy!</b> You used ${hitKeywords.length} key words perfectly.`;
                    else analysisMod = `<b>Great Speaking!</b> I heard your voice clearly.`;
                } else { transcriptHtml = `<div class="transcript-empty">(No voice log detected)</div>`; }
                
                let doodleMsg = "";
                if (doodleLabel) {
                    doodleMsg = `<br><br>🖍️ I also looked at your drawing! It looks like a <b>${doodleLabel}</b>. Is that right?`;
                }

                let introText = isFirstGreeting ? `<b>Nice to meet you, ${callName}!</b><br><br>I scanned your beautiful name.` : `<b>Hello, ${callName}!</b><br><br>I analyzed your speech and your drawing.`;

                content.innerHTML = `
                    <div class="analytics-box">
                        <div class="analytics-title">Advanced Speech Analytics</div>
                        ${transcriptHtml}
                        <div class="stat-row"><div class="stat-label"><span>Pronunciation (Clarity)</span> <span>${scorePronunciation}%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill blue" style="width: ${scorePronunciation}%;"></div></div></div>
                        <div class="stat-row"><div class="stat-label"><span>Accuracy (Keywords)</span> <span>${scoreAccuracy}%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill green" style="width: ${scoreAccuracy}%;"></div></div></div>
                        <div class="stat-row"><div class="stat-label"><span>Fluency (Speed)</span> <span>${scoreSpeedWPM} WPM</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${speedPercentage}%;"></div></div></div>
                        <div class="visual-intent"><b>🎯 AI Analysis:</b><br>${analysisMod}</div>
                    </div>
                    <div class="chat-bubble ai">${introText}${doodleMsg}<br><br><b style="font-size:16px; color:var(--br-green);">${contextData.question}</b></div>
                `;
                
                document.getElementById('chat-input-area').style.display = "flex";
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    let speechTxt = isFirstGreeting ? `Nice to meet you, ${callName}. ${contextData.question}` : `Hello, ${callName}. ${doodleLabel ? `Your drawing looks like a ${doodleLabel}. ` : ''}${contextData.question}`;
                    const utterance = new SpeechSynthesisUtterance(speechTxt);
                    utterance.lang = 'en-US'; utterance.rate = 0.85; utterance.pitch = 1.2; window.speechSynthesis.speak(utterance);
                }
            },

            processChatReply() {
                if(!STATE.lastTranscript) return;
                
                const content = document.getElementById('ai-content');
                
                const userBubble = document.createElement('div');
                userBubble.className = "chat-bubble user";
                userBubble.innerText = STATE.lastTranscript;
                content.appendChild(userBubble);
                content.scrollTop = content.scrollHeight;

                const followUps = [
                    "That is so interesting! Can you tell me more about that?",
                    "Wow! Why do you think that is?",
                    "That's a great thought. What else comes to your mind?",
                    "I love that answer! How does that make you feel?"
                ];
                const replyText = followUps[Math.floor(Math.random() * followUps.length)];

                setTimeout(() => {
                    const aiBubble = document.createElement('div');
                    aiBubble.className = "chat-bubble ai";
                    aiBubble.innerHTML = `<b style="color:var(--br-green); font-size:16px;">${replyText}</b>`;
                    content.appendChild(aiBubble);
                    content.scrollTop = content.scrollHeight;

                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(replyText);
                        utterance.lang = 'en-US'; utterance.rate = 0.85; utterance.pitch = 1.2; 
                        window.speechSynthesis.speak(utterance);
                    }
                }, 1000);
            },

            close() { document.getElementById('ai-panel').classList.remove('open'); if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
        };

        window.onload = () => {
            CanvasEngine.init(); 
            RGBRingEngine.init(); 
            PageEngine.init(); 
            AudioEngine.init(); 
            VisionAI.init(); 
            
            setTimeout(() => {
                CanvasEngine.resizeCanvas();
            }, 300);
        };
    </script>
</body>
</html>
