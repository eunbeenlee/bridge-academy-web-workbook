<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Master Inquiry Lab</title>
    
    <!-- [Premium Typography] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Premium Silk Workbook System V38.0]
         * Designed exclusively for Director Lee Yun-ji
         * ======================================================================
         */
        :root {
            /* Premium Silk Palette matching index.html */
            --bridge-green: #89BFA0;
            --bridge-gold: #CBAE75;
            --bridge-blue: #7CA6C1;
            --bridge-charcoal: #363431;
            
            --bridge-bg: #FCFBF9;
            --bridge-sidebar: #FFFFFF;
            --bridge-border: #F0EFEB;
            --bridge-text-main: #2A2825;
            --bridge-text-muted: #8C8985;
            
            --shadow-float: 0 20px 50px rgba(54, 52, 49, 0.04);
            --shadow-massive: 0 40px 80px rgba(54, 52, 49, 0.08);
            --ease-silk: cubic-bezier(0.25, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bridge-bg); height: 100vh; display: flex; overflow: hidden; color: var(--bridge-text-main); }

        /* --------------------------------------------------
         * [Sidebar] 17-Page Master Navigation
         * -------------------------------------------------- */
        .sidebar { 
            width: 340px; 
            background: var(--bridge-sidebar); 
            border-right: 1px solid var(--bridge-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
            box-shadow: 10px 0 30px rgba(0,0,0,0.02); 
        }
        
        .sidebar-header { 
            padding: 40px 30px; 
            text-align: center; 
            border-bottom: 1px solid var(--bridge-border); 
            cursor: pointer; 
            transition: all 0.3s var(--ease-silk);
        }
        .sidebar-header:hover { opacity: 0.7; }
        
        .brand-logo-text { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 22px; color: var(--bridge-charcoal); letter-spacing: -0.5px; margin-bottom: 15px;}
        .brand-logo-text span { color: var(--bridge-green); font-style: italic; font-weight: 600; }
        
        .back-to-campus { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--bridge-gold); 
            letter-spacing: 4px; 
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .log-nav-list { flex: 1; overflow-y: auto; padding: 30px 20px; }
        .log-nav-list::-webkit-scrollbar { width: 4px; }
        .log-nav-list::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 10px; }
        
        .log-item { 
            padding: 20px 24px; 
            margin-bottom: 12px; 
            border-radius: 20px; 
            background: #FAFAFA;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.3s var(--ease-silk);
            border: 1px solid transparent;
        }
        .log-item:hover { background: #F5F5F5; border-color: #EAEAEA; transform: translateX(5px); }
        .log-item.active { 
            background: #F4F8F5; 
            border-left: 6px solid var(--bridge-green); 
            border-color: #F4F8F5;
            color: var(--bridge-charcoal); 
            box-shadow: 0 10px 20px rgba(137,191,160,0.1); 
        }
        
        .log-title { font-size: 14px; font-weight: 500; }
        .log-item.active .log-title { font-weight: 700; }
        .page-tag { font-size: 11px; font-weight: 800; opacity: 0.4; letter-spacing: 1px; }

        /* --------------------------------------------------
         * [Workspace Stage] Core Image Viewer
         * -------------------------------------------------- */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; }
        .viewer-stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 50px 40px; overflow-y: auto; }
        
        .status-bar { 
            width: 100%; 
            max-width: 900px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 30px; 
        }
        .unit-id-tag { font-size: 13px; font-weight: 800; color: var(--bridge-gold); letter-spacing: 5px; text-transform: uppercase; }
        .page-headline { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; color: var(--bridge-charcoal); letter-spacing: -1px; }

        /* --------------------------------------------------
         * [Canvas Architecture] Image & Drawing Layer
         * -------------------------------------------------- */
        .canvas-container { 
            position: relative; 
            background: #FFF; 
            border-radius: 24px; 
            box-shadow: var(--shadow-float); 
            width: 100%; 
            max-width: 900px; 
            line-height: 0; 
            border: 1px solid var(--bridge-border); 
            transition: var(--transition-slow);
        }
        
        #main-worksheet { width: 100%; height: auto; border-radius: 24px; pointer-events: none; opacity: 0; transition: opacity 0.5s ease; }
        #drawing-layer { position: absolute; top: 0; left: 0; border-radius: 24px; cursor: crosshair; touch-action: none; }

        /* Error/Missing Image State */
        .error-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: #FCFBF9; border-radius: 24px; z-index: 50; text-align: center;
        }
        .error-icon { width: 60px; height: 60px; opacity: 0.2; margin-bottom: 20px; }
        .error-msg { font-size: 16px; color: var(--bridge-text-muted); font-weight: 500; letter-spacing: 1px; }
        .error-path { font-family: monospace; font-size: 12px; color: #AAA; margin-top: 10px; background: #F0F0F0; padding: 4px 10px; border-radius: 4px; }

        /* --------------------------------------------------
         * [Bottom Control Dock]
         * -------------------------------------------------- */
        .control-dock { 
            width: 100%; background: rgba(255, 255, 255, 0.9); padding: 25px 40px 35px; 
            border-top: 1px solid var(--bridge-border); display: flex; flex-direction: column; gap: 25px; 
            align-items: center; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); position: sticky; bottom: 0;
            z-index: 500;
        }
        
        .tool-bar { 
            display: flex; width: 100%; max-width: 900px; align-items: center; justify-content: space-between; 
            background: #F8F8F8; padding: 15px 30px; border-radius: 100px; border: 1px solid var(--bridge-border); 
        }
        
        .color-ring { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid #FFF; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .brush-slider { width: 200px; accent-color: var(--bridge-green); cursor: pointer; }

        .action-row { display: flex; width: 100%; max-width: 900px; gap: 20px; }
        .btn-nav { width: 70px; height: 70px; border-radius: 20px; border: 1px solid var(--bridge-border); background: #FFF; font-size: 20px; cursor: pointer; transition: all 0.3s var(--ease-silk); color: var(--bridge-text-muted); }
        .btn-nav:hover { background: #F5F5F5; color: var(--bridge-charcoal); }
        
        .btn-action { height: 70px; border-radius: 20px; border: none; font-weight: 700; cursor: pointer; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; transition: all 0.4s var(--ease-silk); }
        .btn-record { background: #FFF; color: var(--bridge-charcoal); border: 1px solid var(--bridge-border); flex: 1; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; flex: 2; box-shadow: 0 15px 30px rgba(54, 52, 49, 0.15); }
        .btn-submit:hover { background: var(--bridge-gold); transform: translateY(-3px); box-shadow: 0 20px 40px rgba(203, 174, 117, 0.2); }

        /* --------------------------------------------------
         * [Mobile Optimization]
         * -------------------------------------------------- */
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 1px solid var(--bridge-border); align-items: center; }
            .sidebar-header { padding: 15px 20px; border-bottom: none; border-right: 1px solid var(--bridge-border); display: flex; align-items: center; gap: 15px; }
            .brand-logo-text { font-size: 16px; margin-bottom: 0; }
            .log-nav-list { display: flex; overflow-x: auto; padding: 10px 15px; gap: 10px; }
            .log-item { min-width: 160px; margin-bottom: 0; padding: 12px 16px; border-radius: 12px; }
            .viewer-stage { padding: 30px 20px; }
            .page-headline { font-size: 32px; }
            .control-dock { padding: 20px; }
            .action-row { flex-wrap: wrap; }
            .btn-action { height: 60px; }
            .btn-nav { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <!-- Professional Navigation Sidebar -->
    <nav class="sidebar">
        <!-- 메인 캠퍼스로 돌아가기 -->
        <div class="sidebar-header" onclick="location.href='index.html'">
            <div class="brand-logo-text">Bridge<span>Academy</span></div>
            <div class="back-to-campus">◀ Back to Campus</div>
        </div>
        <div id="log-list" class="log-nav-list">
            <!-- 자바스크립트를 통해 1~17페이지 메뉴가 생성됩니다. -->
        </div>
    </nav>

    <!-- Main Inquiry Workspace -->
    <div class="workspace">
        <main class="viewer-stage">
            <div class="status-bar">
                <div id="unit-id-tag" class="unit-id-tag">UNIT LOADING...</div>
                <div id="page-indicator" class="page-headline">Inquiry Log</div>
            </div>

            <div class="canvas-container">
                
                <!-- Error State : 이미지가 깃허브에 없을 때 띄워줌 -->
                <div id="error-state" class="error-overlay">
                    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <div class="error-msg">교재 이미지를 클라우드에서 찾고 있습니다.</div>
                    <div id="error-path-text" class="error-path">경로 확인 중...</div>
                </div>

                <!-- Main Worksheet Image -->
                <img src="" id="main-worksheet" crossorigin="anonymous" alt="Workbook Page">
                <canvas id="drawing-layer"></canvas>
            </div>
        </main>

        <!-- Premium Control Dock -->
        <div class="control-dock">
            <div class="tool-bar">
                <div style="display:flex; align-items:center; gap:20px;">
                    <canvas id="color-picker-wheel" width="80" height="80" style="width:40px; height:40px; border-radius:50%; cursor:pointer;"></canvas>
                    <div id="brush-preview" class="color-ring" style="background:#363431;"></div>
                </div>
                <input type="range" id="brush-size" class="brush-slider" min="2" max="30" value="6">
                <button onclick="CanvasEngine.clear()" style="background:none; border:none; color:#8C8985; font-weight:700; cursor:pointer; font-size:12px; letter-spacing:3px;">ERASE ALL</button>
            </div>
            <div class="action-row">
                <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                <button id="btn-audio" class="btn-action btn-record" onclick="AudioEngine.toggle()">🎤 RECORD</button>
                <button class="btn-action btn-submit" onclick="alert('제출이 완료되었습니다.')">SUBMIT INQUIRY ✨</button>
                <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         [CORE LAB ENGINE V38.0]
         URL에서 id를 완벽히 추출하고, 원장님의 폴더 규칙(A-1/A-1-1.png)을 적용
         ====================================================================== -->
    <script>
        /**
         * [State Management]
         */
        const STATE = {
            // URL 주소창에서 '?id=A-1' 등의 값을 뽑아냅니다. 만약 주소에 없으면 기본값으로 'A-1'을 사용합니다.
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            p: 1, // 현재 페이지 번호
            isDrawing: false
        };

        // --- Module 1: Path Generator (가장 중요한 이미지 경로 생성기) ---
        const PathEngine = {
            /**
             * 원장님 규칙: assets/폴더명/폴더명-페이지번호.png
             * 결과 예시: assets/A-1/A-1-1.png
             */
            generate(themeId, pageNum) {
                return `assets/${themeId}/${themeId}-${pageNum}.png`;
            }
        };

        // --- Module 2: Page Navigation System ---
        const PageEngine = {
            init() {
                // 상단 유닛 이름 업데이트 (예: UNIT A-1)
                document.getElementById('unit-id-tag').innerText = `MASTER LAB: UNIT ${STATE.id}`;
                
                const list = document.getElementById('log-list');
                list.innerHTML = ""; // 초기화
                
                // 1페이지부터 17페이지까지 왼쪽 메뉴 생성
                for(let i=1; i<=17; i++) {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.id = `page-${i}`;
                    item.innerHTML = `<span class="log-title">Inquiry Page</span> <span class="page-tag">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => this.load(i);
                    list.appendChild(item);
                }
                
                // 1페이지부터 로드 시작
                this.load(1); 
            },
            
            load(n) {
                STATE.p = n; 
                
                // 1. 이미지 경로 생성
                const imgPath = PathEngine.generate(STATE.id, n);
                
                const imgElement = document.getElementById('main-worksheet');
                const errorState = document.getElementById('error-state');
                const errorPathText = document.getElementById('error-path-text');
                
                // 로딩 초기화
                errorState.style.display = 'none';
                imgElement.style.opacity = '0'; 
                
                // 이미지 소스 삽입 (GitHub에서 불러오기 시도)
                imgElement.src = imgPath;
                
                // 로드 성공 시
                imgElement.onload = () => {
                    imgElement.style.opacity = '1';
                    CanvasEngine.resize(); 
                };
                
                // 로드 실패 시 (원장님이 아직 GitHub에 사진을 안 올렸거나, 대소문자가 틀렸을 때)
                imgElement.onerror = () => {
                    errorState.style.display = 'flex';
                    errorPathText.innerText = `찾을 수 없는 파일: ${imgPath}`;
                    CanvasEngine.clear();
                };

                // 상단 헤드라인 글자 변경
                document.getElementById('page-indicator').innerText = `Inquiry Log P.${String(n).padStart(2,'0')}`;
                
                // 왼쪽 사이드바 활성화 디자인 변경
                document.querySelectorAll('.log-item').forEach(el => el.classList.remove('active'));
                const activeItem = document.getElementById(`page-${n}`);
                if(activeItem) {
                    activeItem.classList.add('active');
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                
                CanvasEngine.clear();
            },
            
            // 이전/다음 버튼 로직
            move(dir) {
                const target = STATE.p + dir;
                if(target >= 1 && target <= 17) this.load(target);
            }
        };

        // --- Module 3: Canvas Drawing Engine (그림 그리기 기능) ---
        const CanvasEngine = {
            init() {
                this.cvs = document.getElementById('drawing-layer');
                this.ctx = this.cvs.getContext('2d');
                this.img = document.getElementById('main-worksheet');
                this.setupEvents();
                this.drawWheel();
            },
            setupEvents() {
                const getP = (e) => {
                    const r = this.cvs.getBoundingClientRect();
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const cy = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: cx - r.left, y: cy - r.top };
                };
                const start = (e) => { STATE.isDrawing = true; const p = getP(e); this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); };
                const move = (e) => { if(!STATE.isDrawing) return; if(e.cancelable) e.preventDefault(); const p = getP(e); this.ctx.lineTo(p.x, p.y); this.ctx.stroke(); };
                const stop = () => STATE.isDrawing = false;

                this.cvs.addEventListener('mousedown', start);
                this.cvs.addEventListener('mousemove', move);
                window.addEventListener('mouseup', stop);
                this.cvs.addEventListener('touchstart', start, {passive:false});
                this.cvs.addEventListener('touchmove', move, {passive:false});
            },
            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.cvs.width = this.img.clientWidth * dpr;
                this.cvs.height = this.img.clientHeight * dpr;
                this.cvs.style.width = this.img.clientWidth + 'px';
                this.cvs.style.height = this.img.clientHeight + 'px';
                this.ctx.scale(dpr, dpr);
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.lineWidth = document.getElementById('brush-size').value;
                this.ctx.strokeStyle = document.getElementById('brush-preview').style.background;
            },
            clear() { 
                this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height); 
                this.ctx.beginPath(); 
            },
            drawWheel() {
                const wc = document.getElementById('color-picker-wheel');
                const wctx = wc.getContext('2d');
                const r = 40;
                for(let i=0; i<360; i++) {
                    wctx.beginPath(); wctx.moveTo(r,r);
                    wctx.arc(r,r,r, (i-1)*Math.PI/180, (i+1)*Math.PI/180);
                    wctx.fillStyle = `hsl(${i}, 100%, 50%)`; wctx.fill();
                }
                wctx.beginPath(); wctx.arc(r,r,15,0,Math.PI*2); wctx.fillStyle="#FFF"; wctx.fill();
                
                wc.onclick = (e) => {
                    const rect = wc.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (80/rect.width);
                    const y = (e.clientY - rect.top) * (80/rect.height);
                    const pxl = wctx.getImageData(x,y,1,1).data;
                    const rgb = `rgb(${pxl[0]},${pxl[1]},${pxl[2]})`;
                    this.ctx.strokeStyle = rgb;
                    document.getElementById('brush-preview').style.background = rgb;
                };
                
                document.getElementById('brush-size').oninput = (e) => {
                    this.ctx.lineWidth = e.target.value;
                };
            }
        };

        // --- Module 4: Audio Mock Engine ---
        const AudioEngine = {
            toggle() {
                const btn = document.getElementById('btn-audio');
                if(btn.innerText.includes("RECORD")) {
                    btn.innerText = "🛑 STOP REC";
                    btn.style.background = "#FBEAEA";
                    btn.style.color = "#C0392B";
                    btn.style.borderColor = "#F1C40F";
                } else {
                    btn.innerText = "🎤 RECORD";
                    btn.style.background = "#FFF";
                    btn.style.color = "var(--bridge-charcoal)";
                    btn.style.borderColor = "var(--bridge-border)";
                }
            }
        };

        // Bootstrap App
        window.onload = () => { 
            CanvasEngine.init(); 
            PageEngine.init(); 
            
            // 브라우저 크기가 변할 때 캔버스 크기 재조정
            window.addEventListener('resize', () => {
                if(document.getElementById('main-worksheet').src) {
                    setTimeout(() => CanvasEngine.resize(), 100);
                }
            });
        };
    </script>
</body>
</html>
