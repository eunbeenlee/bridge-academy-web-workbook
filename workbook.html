<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Inquiry Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Premium Inquiry Lab V40.0]
         * Remote Asset Integration Module
         * ======================================================================
         */
        :root {
            --lab-bg: #FCFBF9;
            --lab-sidebar: #FFFFFF;
            --lab-accent: #89BFA0;
            --lab-gold: #CBAE75;
            --lab-charcoal: #363431;
            --lab-border: #F0EFEB;
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--lab-bg); height: 100vh; display: flex; overflow: hidden; }

        /* [Sidebar Navigation] */
        .sidebar { 
            width: 360px; background: var(--lab-sidebar); border-right: 1px solid var(--lab-border); 
            display: flex; flex-direction: column; box-shadow: 15px 0 40px rgba(0,0,0,0.02); z-index: 100;
        }
        .sidebar-header { 
            padding: 45px 35px; border-bottom: 1px solid var(--lab-border); cursor: pointer; 
            transition: 0.4s var(--ease-lux); text-align: center;
        }
        .sidebar-header:hover { opacity: 0.6; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; color: var(--lab-charcoal); margin-bottom: 15px; }
        .logo span { color: var(--lab-accent); font-style: italic; }
        .btn-back { font-size: 11px; font-weight: 700; color: var(--lab-gold); letter-spacing: 4px; text-transform: uppercase; }

        .nav-list { flex: 1; overflow-y: auto; padding: 30px 25px; }
        .nav-item { 
            padding: 22px 25px; margin-bottom: 12px; border-radius: 20px; background: #FAFAFA;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; 
            transition: 0.3s; border: 1px solid transparent;
        }
        .nav-item:hover { background: #F5F5F5; transform: translateX(5px); }
        .nav-item.active { 
            background: #F4F8F5; border-left: 6px solid var(--lab-accent); border-color: #F4F8F5;
            font-weight: 700; box-shadow: 0 10px 20px rgba(137, 191, 160, 0.1); 
        }
        .page-num { font-size: 11px; font-weight: 900; opacity: 0.3; letter-spacing: 1px; }

        /* [Workspace] */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; align-items: center; padding: 60px 40px; }
        .lab-info { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 35px; }
        .unit-tag { font-size: 14px; font-weight: 900; color: var(--lab-gold); letter-spacing: 6px; }
        .page-h1 { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 700; color: var(--lab-charcoal); }

        .stage-container { 
            position: relative; background: #FFF; border-radius: 30px; box-shadow: 0 30px 70px rgba(0,0,0,0.04); 
            width: 100%; max-width: 900px; border: 1px solid var(--lab-border); line-height: 0;
        }
        #worksheet { width: 100%; height: auto; border-radius: 30px; opacity: 0; transition: opacity 0.8s ease; }
        #canvas { position: absolute; top: 0; left: 0; border-radius: 30px; touch-action: none; cursor: crosshair; }

        /* [Controls] */
        .control-dock { 
            width: 100%; max-width: 900px; margin-top: 40px; background: rgba(255, 255, 255, 0.9); 
            padding: 25px 45px; border-radius: 100px; border: 1px solid var(--lab-border); 
            backdrop-filter: blur(20px); display: flex; gap: 30px; align-items: center; justify-content: space-between;
        }
        .tool-group { display: flex; align-items: center; gap: 20px; }
        .color-well { width: 50px; height: 50px; border-radius: 50%; border: 4px solid #FFF; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; }
        .brush-range { width: 180px; accent-color: var(--lab-accent); cursor: pointer; }
        
        .btn-submit { 
            padding: 22px 60px; border-radius: 100px; background: var(--lab-charcoal); color: #FFF; 
            font-weight: 900; letter-spacing: 4px; cursor: pointer; transition: 0.4s var(--ease-lux);
        }
        .btn-submit:hover { background: var(--lab-accent); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(137, 191, 160, 0.3); }

        /* [Loading / Error] */
        .error-state { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            background: #FAFAFA; border-radius: 30px; z-index: 50; 
        }
        .error-state p { font-size: 16px; color: var(--lab-charcoal); opacity: 0.4; font-weight: 700; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header" onclick="location.href='index.html'">
            <div class="logo">Bridge<span>Academy</span></div>
            <div class="btn-back">◀ BACK TO CAMPUS</div>
        </div>
        <div id="nav-pages" class="nav-list"></div>
    </nav>

    <div class="workspace">
        <div class="lab-info">
            <div id="display-unit" class="unit-tag">MASTER LAB: UNIT A-1</div>
            <div id="display-page" class="page-h1">Inquiry Log P.01</div>
        </div>

        <div class="stage-container">
            <div id="error-box" class="error-state"><p>CONNECTING TO CLOUD ASSETS...</p></div>
            <img src="" id="worksheet" crossorigin="anonymous">
            <canvas id="canvas"></canvas>
        </div>

        <div class="control-dock">
            <div class="tool-group">
                <input type="color" id="color-input" value="#363431" class="color-well">
                <input type="range" id="brush-input" min="2" max="25" value="6" class="brush-range">
            </div>
            <button class="btn-submit" onclick="alert('데이터가 브릿지 클라우드에 안전하게 저장되었습니다.')">SUBMIT INQUIRY ✨</button>
            <button onclick="CanvasEngine.clear()" style="background:none; border:none; color:#AAA; font-weight:700; cursor:pointer; font-size:12px; letter-spacing:2px;">RESET</button>
        </div>
    </div>

    <script>
        /**
         * [State & Configuration]
         * 원장님의 bridge-heritage 저장소 주소를 기본값으로 설정합니다.
         */
        const STATE = {
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            p: 1,
            // [중요] YOUR_GITHUB_ID를 실제 아이디로 반드시 교체하십시오.
            cloudRoot: "https://YOUR_GITHUB_ID.github.io/bridge-heritage/assets/"
        };

        const PageEngine = {
            init() {
                document.getElementById('display-unit').innerText = `MASTER LAB: UNIT ${STATE.id}`;
                const list = document.getElementById('nav-pages');
                for(let i=1; i<=17; i++) {
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span>Inquiry Entry</span> <span class="page-num">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => this.load(i);
                    list.appendChild(item);
                }
                this.load(1);
            },
            load(n) {
                STATE.p = n;
                const path = `${STATE.cloudRoot}${STATE.id}/${STATE.id}-${n}.png`;
                const img = document.getElementById('worksheet');
                const err = document.getElementById('error-box');
                
                img.style.opacity = '0'; err.style.display = 'flex';
                img.src = path;
                
                img.onload = () => { img.style.opacity = '1'; err.style.display = 'none'; CanvasEngine.sync(); };
                img.onerror = () => { err.innerHTML = `<p>ASSET NOT FOUND: ${STATE.id}-${n}.png</p>`; };

                document.getElementById('display-page').innerText = `Inquiry Log P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`nav-${n}`).classList.add('active');
                CanvasEngine.clear();
            }
        };

        const CanvasEngine = {
            init() {
                this.cvs = document.getElementById('canvas'); this.ctx = this.cvs.getContext('2d');
                this.img = document.getElementById('worksheet');
                let isDrawing = false;
                const getPos = (e) => {
                    const rect = this.cvs.getBoundingClientRect();
                    const x = (e.clientX || e.touches[0].clientX) - rect.left;
                    const y = (e.clientY || e.touches[0].clientY) - rect.top;
                    return { x, y };
                };
                const start = (e) => { isDrawing = true; const p = getPos(e); this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); };
                const move = (e) => { if(!isDrawing) return; if(e.cancelable) e.preventDefault(); const p = getPos(e); this.ctx.lineTo(p.x, p.y); this.ctx.stroke(); };
                this.cvs.onmousedown = start; this.cvs.onmousemove = move; window.onmouseup = () => isDrawing = false;
                this.cvs.ontouchstart = start; this.cvs.ontouchmove = move; window.ontouchend = () => isDrawing = false;
            },
            sync() {
                const dpr = window.devicePixelRatio || 1;
                this.cvs.width = this.img.clientWidth * dpr;
                this.cvs.height = this.img.clientHeight * dpr;
                this.cvs.style.width = this.img.clientWidth + 'px';
                this.cvs.style.height = this.img.clientHeight + 'px';
                this.ctx.scale(dpr, dpr);
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                this.ctx.strokeStyle = document.getElementById('color-input').value;
                this.ctx.lineWidth = document.getElementById('brush-input').value;
                
                document.getElementById('color-input').onchange = (e) => this.ctx.strokeStyle = e.target.value;
                document.getElementById('brush-input').oninput = (e) => this.ctx.lineWidth = e.target.value;
            },
            clear() { this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height); this.ctx.beginPath(); }
        };

        window.onload = () => { PageEngine.init(); CanvasEngine.init(); };
    </script>
</body>
</html>
