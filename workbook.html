<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Professional Classroom</title>
    <style>
        :root { 
            --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; --bridge-bg: #F7F9F8; --bridge-paper: #FFFFFF; --bridge-danger: #E07A5F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bridge-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--bridge-charcoal); }
        
        /* 사이드바 */
        .sidebar { width: 280px; background: var(--bridge-paper); display: flex; flex-direction: column; z-index: 20; border-right: 1px solid #EAEAEA; box-shadow: 2px 0 15px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 30px 20px 20px; text-align: center; border-bottom: 1px solid #F0F0F0; cursor: pointer; }
        .sidebar-logo { max-width: 180px; height: auto; margin-bottom: 5px; }
        
        .nav-list { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; background: transparent; border: 1px solid transparent; color: #666; transition: all 0.3s ease; }
        .nav-item.active { background: #EAF4ED; color: var(--bridge-charcoal); font-weight: bold; border-left: 5px solid var(--bridge-green); }
        .nav-text { display: flex; flex-direction: column; font-size: 14px; }
        .nav-text span.page-num { font-size: 11px; opacity: 0.6; margin-bottom: 4px; font-weight: bold; }

        /* 메인 뷰어 */
        .viewer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 25px; position: relative; overflow-y: auto; }
        
        /* 상단 타겟 단어 바 */
        .top-info-bar { width: 100%; max-width: 850px; display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; }
        .target-words-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 10px 20px; background: #FFF; border-radius: 15px; border: 1px solid #EAEAEA; }
        .target-words-box span { font-size: 10px; color: var(--bridge-green); font-weight: 900; text-transform: uppercase; }
        #target-words-text { font-weight: 800; font-size: 16px; color: var(--bridge-charcoal); }

        .canvas-container { position: relative; background: var(--bridge-paper); border-radius: 20px; box-shadow: 0 10px 40px rgba(58, 58, 66, 0.08); padding: 10px; width: 100%; max-width: 850px; line-height: 0; }
        #main-img { width: 100%; max-height: 45vh; display: block; pointer-events: none; object-fit: contain; }
        #drawing-canvas { position: absolute; top: 10px; left: 10px; cursor: crosshair; touch-action: none; }

        /* 💡 1페이지 이름 입력 플로팅 UI */
        #name-input-container { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; display: none; }
        .floating-label { font-size: 11px; color: var(--bridge-green); font-weight: 900; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .floating-name-input { border: 2px solid var(--bridge-green); border-radius: 50px; padding: 10px 25px; font-size: 18px; font-weight: bold; width: 250px; outline: none; box-shadow: 0 10px 25px rgba(140, 198, 159, 0.2); }

        /* 컨트롤 패널 */
        .controls-wrapper { width: 100%; max-width: 850px; margin-top: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .tool-bar { display: flex; align-items: center; justify-content: center; gap: 20px; background: white; padding: 15px 35px; border-radius: 50px; box-shadow: 0 5px 25px rgba(0,0,0,0.04); width: 100%; flex-wrap: wrap; border: 1px solid #F0F0F0; }
        .brush-control { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: bold; }
        input[type=range] { width: 120px; accent-color: var(--bridge-green); }
        
        .color-ring-container { position: relative; width: 45px; height: 45px; cursor: pointer; }
        #color-wheel { border-radius: 50%; width: 100%; height: 100%; }
        .current-color-indicator { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #FFF; box-shadow: 0 2px 6px rgba(0,0,0,0.15); background: #3A3A42; }
        
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; justify-content: center; }
        .btn { padding: 15px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-nav { background: #F0F2F1; color: var(--bridge-charcoal); min-width: 100px; }
        .btn-record { background: #F0F2F1; color: var(--bridge-charcoal); flex: 1; max-width: 250px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #EAEAEA; }
        .btn-record.recording { background: var(--bridge-danger); color: #FFF; animation: pulse 1.5s infinite; border: none; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; box-shadow: 0 8px 20px rgba(58, 58, 66, 0.2); flex: 1; max-width: 300px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* 결과 팝업 */
        #success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(247, 249, 248, 0.98); backdrop-filter: blur(8px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 20px; text-align: center; padding: 40px; }
        .status-title { font-size: 28px; font-weight: 900; color: var(--bridge-green); margin-bottom: 10px; }
        .score-badge { font-size: 44px; color: #FFF; background: var(--bridge-green); padding: 10px 50px; border-radius: 60px; margin-bottom: 25px; font-weight: 900; }
        .ai-feedback-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 20px; }
        .child-msg-box { font-size: 26px; color: var(--bridge-charcoal); font-weight: 800; line-height: 1.3; }
        .parent-insight-box { font-size: 15px; color: #666; text-align: left; background: #FFF; padding: 25px; border-radius: 15px; border: 1px solid #EAEAEA; line-height: 1.6; }
        .parent-insight-box strong { color: var(--bridge-charcoal); display: block; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; padding: 15px; }
            .nav-list { display: flex; overflow-x: auto; padding: 5px 0; gap: 10px; }
            .nav-item { min-width: 130px; margin-bottom: 0; }
            .viewer { padding: 15px; }
            #main-img { max-height: 35vh; }
            .nav-buttons { flex-direction: column; }
            .btn { width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header" onclick="window.location.href='index.html'">
        <img src="logo.png" alt="Bridge Academy" class="sidebar-logo">
    </div>
    <div id="nav-list" class="nav-list"></div>
</div>

<div class="viewer">
    <div class="top-info-bar">
        <div class="target-words-box" id="target-words-box">
            <span>Inquiry Target</span> <div id="target-words-text">Loading...</div>
        </div>
    </div>

    <div id="success-overlay">
        <div class="status-title" id="status-title">TEACHER'S ASSESSMENT 👩‍🏫</div>
        <div id="score-badge" class="score-badge">WAIT</div>
        <div class="ai-feedback-container">
            <div id="child-msg" class="child-msg-box">Teacher is reviewing your work...</div>
            <div id="parent-insight" class="parent-insight-box">
                <strong>Professional Observation</strong>
                Generating educational insight for this inquiry.
            </div>
        </div>
        <button id="overlay-btn" class="btn" style="background: var(--bridge-charcoal); color: #FFF; margin-top: 35px; padding: 18px 70px;" onclick="handleOverlayClick()">Continue</button>
    </div>

    <div class="canvas-container">
        <!-- 💡 1페이지 이름 입력란 -->
        <div id="name-input-container">
            <span class="floating-label">Enter Student Name</span>
            <input type="text" id="global-student-name" class="floating-name-input" placeholder="Type name here...">
        </div>
        <img src="" id="main-img" crossorigin="anonymous">
        <canvas id="drawing-canvas"></canvas>
    </div>
    
    <div class="controls-wrapper">
        <div class="tool-bar">
            <div class="brush-control">Pen <input type="range" id="brush-size" min="3" max="25" value="8"></div>
            <div class="color-ring-container"><canvas id="color-wheel" width="80" height="80"></canvas></div>
            <div class="current-color-indicator" id="current-color-bg"></div>
            <button onclick="resetCanvas()" style="background:none; border:none; color:#888; cursor:pointer; font-weight:bold; font-size:14px;">Reset Canvas</button>
        </div>
        <div class="nav-buttons">
            <button id="prev-btn" class="btn btn-nav" onclick="changePage(-1)">◀ Prev</button>
            <button id="record-btn" class="btn btn-record" onclick="toggleRecording()">🎤 Voice Recording</button>
            <button id="submit-btn" class="btn btn-submit" onclick="submitWork()">Submit to Teacher ✨</button>
            <button id="next-btn" class="btn btn-nav" onclick="changePage(1)">Next ▶</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    const modelName = "gemini-1.5-flash"; 

    const curriculumData = {
        "A1": [
            { id: 1, title: "All About Me", img: "1.png", words: "Me, Face" },
            { id: 2, title: "Book of the Month", img: "2.png", words: "Like, Myself" },
            { id: 3, title: "Key Words (Body)", img: "3.png", words: "Nose, Ears, Hair, Eyes" },
            { id: 4, title: "Key Words (Review)", img: "4.png", words: "Face, Draw" },
            { id: 5, title: "Key Words (Sensory)", img: "5.png", words: "Smell, Hear, See" },
            { id: 6, title: "Key Sentences", img: "6.png", words: "I like my nose" },
            { id: 7, title: "I Can... (Matching)", img: "7.png", words: "Match, Line" },
            { id: 8, title: "This is My Face", img: "8.png", words: "My face, Happy" }
        ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const data = curriculumData[urlParams.get('series') || 'A1'];
    let currentPageIndex = 0;
    let isSeriesFinished = false;
    let savedName = "Student"; // 전역 이름 변수

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('main-img');
    const brushSlider = document.getElementById('brush-size');
    let drawing = false;

    // --- 리셋 버그 수정 ---
    function resetCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath(); // 이전 경로 완전히 끊기
        drawing = false; // 드로잉 상태 강제 종료
    }

    // --- 컬러링 휠 ---
    const wheelCanvas = document.getElementById('color-wheel');
    const wheelCtx = wheelCanvas.getContext('2d');
    function drawColorWheel() {
        const radius = wheelCanvas.width / 2;
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle - 1) * Math.PI / 180;
            const endAngle = (angle + 1) * Math.PI / 180;
            wheelCtx.beginPath(); wheelCtx.moveTo(radius, radius);
            wheelCtx.arc(radius, radius, radius, startAngle, endAngle);
            wheelCtx.fillStyle = `hsl(${angle}, 100%, 50%)`; wheelCtx.fill();
        }
        wheelCtx.beginPath(); wheelCtx.arc(radius, radius, radius * 0.4, 0, Math.PI * 2);
        wheelCtx.fillStyle = "white"; wheelCtx.fill();
    }
    function pickColor(e) {
        const rect = wheelCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (wheelCanvas.width / rect.width);
        const y = (clientY - rect.top) * (wheelCanvas.height / rect.height);
        const pixel = wheelCtx.getImageData(x, y, 1, 1).data;
        if (pixel[3] !== 0) {
            const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
            ctx.strokeStyle = color;
            document.getElementById('current-color-bg').style.background = color;
        }
    }
    wheelCanvas.addEventListener('mousedown', pickColor);
    wheelCanvas.addEventListener('touchstart', (e) => { pickColor(e); e.preventDefault(); }, {passive: false});

    // --- 드로잉 시스템 ---
    function resizeCanvas() {
        canvas.width = img.clientWidth; canvas.height = img.clientHeight;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = brushSlider.value;
        ctx.strokeStyle = document.getElementById('current-color-bg').style.background || '#3A3A42';
    }
    img.onload = resizeCanvas;
    brushSlider.oninput = () => { ctx.lineWidth = brushSlider.value; };
    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }
    function startDrawing(e) { drawing = true; const pos = getCoords(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
    function draw(e) { if (!drawing) return; e.preventDefault(); const pos = getCoords(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); }, {passive: false});

    // --- 녹음 시스템 ---
    let mediaRecorder; let audioChunks = []; let audioBlob = null; let isRecording = false;
    async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(type => MediaRecorder.isTypeSupported(type));
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    audioChunks = []; btn.innerHTML = "🎵 Recorded";
                    btn.style.background = "var(--bridge-green)"; btn.style.color = "#FFF";
                };
                audioChunks = []; mediaRecorder.start(); isRecording = true;
                btn.innerHTML = "🔴 Recording..."; btn.classList.add('recording');
            } catch (err) { alert("Microphone access required."); }
        } else {
            mediaRecorder.stop(); isRecording = false;
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
        }
    }

    // --- 이름 저장 리스너 ---
    document.getElementById('global-student-name').addEventListener('input', (e) => {
        savedName = e.target.value || "Student";
    });

    // --- 페이지 관리 ---
    function loadPage(index) {
        currentPageIndex = index; audioBlob = null;
        const btn = document.getElementById('record-btn');
        btn.innerHTML = "🎤 Voice Recording"; btn.style.background = "#F0F2F1"; btn.style.color = "var(--bridge-charcoal)";
        
        // 1페이지일 때만 이름 입력창 노출
        document.getElementById('name-input-container').style.display = (index === 0) ? 'block' : 'none';

        img.src = data[index].img;
        document.getElementById('target-words-text').innerText = data[index].words;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.nav-item').forEach((el, idx) => el.classList.toggle('active', idx === index));
        document.getElementById('prev-btn').disabled = (index === 0);
        document.getElementById('next-btn').disabled = (index === data.length - 1);
    }
    function changePage(step) { loadPage(currentPageIndex + step); }

    // --- AI 피드백 엔진 ---
    async function submitWork() {
        const overlay = document.getElementById('success-overlay');
        overlay.style.display = 'flex';
        document.getElementById('status-title').innerText = "TEACHER'S ASSESSMENT 👩‍🏫";
        document.getElementById('score-badge').innerText = "WAIT";
        document.getElementById('child-msg').innerText = "Analyzing your masterpiece...";

        try {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 400; 
            tempCanvas.height = img.naturalHeight * (400 / img.naturalWidth);
            tCtx.fillStyle = "#FFFFFF"; tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
            const combinedData = tempCanvas.toDataURL("image/jpeg", 0.5).split(',')[1];

            let promptParts = [
                { text: `[Role]: Bridge Academy Teacher. [Student]: ${savedName}. [Target Words]: ${data[currentPageIndex].words}. [Instruction]: 1. Address ${savedName} by name. 2. Provide 1 enthusiastic sentence for the child. 3. Provide 1 professional sentence for parent insight. Strictly JSON: { "score": number, "child_msg": "string", "parent_insight": "string" }` },
                { inline_data: { mime_type: "image/jpeg", data: combinedData } }
            ];

            if (audioBlob) {
                const base64Audio = await new Promise(resolve => {
                    const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.readAsDataURL(audioBlob);
                });
                promptParts.push({ inline_data: { mime_type: audioBlob.type, data: base64Audio } });
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: promptParts }] })
            });

            const result = await response.json();
            const cleanJson = result.candidates[0].content.parts[0].text.replace(/```json|```/g, "").match(/\{.*\}/s)[0];
            const analysis = JSON.parse(cleanJson);
            
            document.getElementById('status-title').innerText = "ASSESSMENT COMPLETE ⭐";
            document.getElementById('score-badge').innerText = `${analysis.score}%`;
            document.getElementById('child-msg').innerText = `"${analysis.child_msg}"`;
            document.getElementById('parent-insight').innerHTML = `<strong>Professional Observation</strong> ${analysis.parent_insight}`;

            if (currentPageIndex === data.length - 1) { isSeriesFinished = true; document.getElementById('overlay-btn').innerText = "Finish Exploration"; }
        } catch (e) {
            document.getElementById('status-title').innerText = "WELL DONE! 👍";
            document.getElementById('score-badge').innerText = "100%"; 
            document.getElementById('child-msg').innerText = `Amazing effort, ${savedName}! Teacher is so proud of you!`;
            if (currentPageIndex === data.length - 1) { isSeriesFinished = true; document.getElementById('overlay-btn').innerText = "Finish Exploration"; }
        }
    }

    function handleOverlayClick() { if (isSeriesFinished) { window.location.href = 'index.html'; } else { document.getElementById('success-overlay').style.display = 'none'; } }

    if (data) {
        const navList = document.getElementById('nav-list');
        data.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'nav-item' + (index === 0 ? ' active' : '');
            div.innerHTML = `<div class="nav-text"><span class="page-num">PAGE 0${item.id}</span>${item.title}</div>`;
            div.onclick = () => loadPage(index);
            navList.appendChild(div);
        });
        drawColorWheel(); setTimeout(() => loadPage(0), 100);
    }
</script>
</body>
</html>
