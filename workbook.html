<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Professional Classroom</title>
    <style>
        :root { 
            --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; 
            --bridge-bg: #F0F2F1; --bridge-paper: #FFFFFF; --bridge-danger: #E07A5F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: radial-gradient(circle at center, #F7F9F8 0%, #E2E8E5 100%); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bridge-paper); display: flex; flex-direction: column; z-index: 20; border-right: 1px solid rgba(0,0,0,0.05); }
        .viewer { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center; padding: 40px; gap: 40px; position: relative; }
        .canvas-container { position: relative; background: var(--bridge-paper); border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.12); flex-shrink: 0; touch-action: none; }
        #main-img { height: 85vh; width: auto; display: block; pointer-events: none; }
        #drawing-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; touch-action: none; }
        .side-tools-dock { display: flex; flex-direction: column; gap: 25px; width: 100px; align-items: center; background: rgba(255,255,255,0.5); padding: 30px 10px; border-radius: 50px; backdrop-filter: blur(10px); }
        .brush-v-slider { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 150px; accent-color: var(--bridge-green); }
        .bottom-action-bar { position: absolute; bottom: 30px; left: 300px; right: 40px; display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 18px 35px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-record.recording { background: var(--bridge-danger); animation: pulse 1.5s infinite; }
        #success-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.98); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @media (max-width: 1100px) { body { flex-direction: column; overflow-y: auto; } .viewer { flex-direction: column; } #main-img { height: auto; width: 100%; } }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header" onclick="location.href='index.html'"><img src="logo.png" style="max-width:150px;"></div>
    <div id="nav-list" class="nav-list"></div>
</div>
<div class="viewer">
    <div style="flex:1; display:flex; flex-direction:column; align-items:flex-end;"><div id="target-words-text" style="font-size:24px; font-weight:800;">Loading...</div></div>
    <div class="canvas-container">
        <div id="success-overlay"><div id="score-badge" style="font-size:50px; background:var(--bridge-green); padding:15px 60px; border-radius:100px; color:#FFF;">WAIT</div><div id="child-msg" style="margin:20px; font-size:24px; font-weight:800;"></div><button class="btn" onclick="handleOverlayClick()">Continue</button></div>
        <img src="" id="main-img" crossorigin="anonymous">
        <canvas id="drawing-canvas"></canvas>
    </div>
    <div class="side-tools-dock">
        <canvas id="color-wheel" width="80" height="80" style="border-radius:50%; cursor:pointer;"></canvas>
        <div id="current-color-bg" style="width:40px; height:40px; border-radius:50%; border:3px solid #FFF;"></div>
        <input type="range" id="brush-size" class="brush-v-slider" min="3" max="25" value="8">
        <button onclick="resetCanvas()" style="background:none; border:none; color:#AAA; cursor:pointer;">RESET</button>
    </div>
    <div class="bottom-action-bar">
        <button id="record-btn" class="btn" onclick="toggleRecording()" style="background:#FFF;">🎤 RECORD</button>
        <button class="btn" onclick="submitWork()" style="background:var(--bridge-charcoal); color:#FFF; min-width:250px;">SUBMIT ✨</button>
    </div>
</div>
<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    const curriculumData = { "A1": [{ id: 1, title: "All About Me", img: "1.png", words: "Me, Face" }, { id: 2, title: "Under the Sea", img: "2.png", words: "Shark, Whale" }] };
    const urlParams = new URLSearchParams(window.location.search); const data = curriculumData[urlParams.get('series') || 'A1'];
    let currentPageIndex = 0; let savedName = "Friend"; let drawing = false; let audioBlob = null;
    const canvas = document.getElementById('drawing-canvas'); const ctx = canvas.getContext('2d'); const img = document.getElementById('main-img');
    function resetCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); drawing = false; }
    img.onload = () => {
        const dpr = window.devicePixelRatio || 1; canvas.width = img.clientWidth * dpr; canvas.height = img.clientHeight * dpr;
        canvas.style.width = img.clientWidth + 'px'; canvas.style.height = img.clientHeight + 'px';
        ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineWidth = document.getElementById('brush-size').value;
    };
    function getCoords(e) { const r = canvas.getBoundingClientRect(); const cx = e.touches ? e.touches[0].clientX : e.clientX; const cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: cx - r.left, y: cy - r.top }; }
    canvas.addEventListener('mousedown', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', e => { if (!drawing) return; e.preventDefault(); const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', e => { if (!drawing) return; const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, {passive:false});
    async function toggleRecording() { /* ...기존 녹음 로직... */ }
    async function submitWork() {
        document.getElementById('success-overlay').style.display = 'flex';
        const tempCanvas = document.createElement('canvas'); const tCtx = tempCanvas.getContext('2d');
        tempCanvas.width = 400; tempCanvas.height = img.naturalHeight * (400 / img.naturalWidth);
        tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
        const base64Img = tempCanvas.toDataURL("image/jpeg", 0.5).split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Analyze for ${savedName}. Target: ${data[currentPageIndex].words}. Return JSON {score, child_msg, extracted_name}` }, { inline_data: { mime_type: "image/jpeg", data: base64Img } }] }] })
            });
            const d = await res.json(); const analysis = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g, "").match(/\{.*\}/s)[0]);
            if (currentPageIndex === 0 && analysis.extracted_name) savedName = analysis.extracted_name;
            document.getElementById('score-badge').innerText = analysis.score + "%"; document.getElementById('child-msg').innerText = analysis.child_msg;
        } catch (e) { document.getElementById('score-badge').innerText = "100%"; }
    }
    function handleOverlayClick() { document.getElementById('success-overlay').style.display = 'none'; }
    function loadPage(idx) { currentPageIndex = idx; img.src = data[idx].img; document.getElementById('target-words-text').innerText = data[idx].words; ctx.clearRect(0,0,canvas.width,canvas.height); }
    loadPage(0);
</script>
</body>
</html>
