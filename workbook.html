<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Test</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#fafafa;
}

/* 캔버스 영역 */
.wrapper {
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.board {
    position:relative;
    width:800px;
    height:500px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* 이미지 */
#img {
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

/* 캔버스 */
#canvas {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:10;
    touch-action:none; /* 핵심 */
}

/* 버튼 */
.controls {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

button {
    padding:10px 15px;
    border-radius:10px;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="board" id="board">
        <img id="img" src="https://picsum.photos/800/500">
        <canvas id="canvas"></canvas>
    </div>
</div>

<div class="controls">
    <button onclick="Canvas.clear()">CLEAR</button>
    <button onclick="Canvas.toggleEraser()">ERASER</button>
</div>

<script>
const Canvas = {
    isDrawing:false,
    isErasing:false,
    color:"#000",
    dpr: window.devicePixelRatio || 1,

    init() {
        this.cvs = document.getElementById("canvas");
        this.ctx = this.cvs.getContext("2d");
        this.board = document.getElementById("board");

        this.resize();
        this.bind();
        this.observe();
    },

    resize() {
        const rect = this.board.getBoundingClientRect();

        this.cvs.width = rect.width * this.dpr;
        this.cvs.height = rect.height * this.dpr;

        this.cvs.style.width = rect.width + "px";
        this.cvs.style.height = rect.height + "px";

        this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);

        this.ctx.lineCap = "round";
        this.ctx.lineJoin = "round";
        this.ctx.lineWidth = 5;
        this.ctx.strokeStyle = this.color;
    },

    observe() {
        const ro = new ResizeObserver(() => {
            this.resize();
        });
        ro.observe(this.board);
    },

    getPos(e) {
        const rect = this.cvs.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    },

    bind() {
        this.cvs.addEventListener("pointerdown", e => {
            console.log("DRAW START"); // 디버깅
            this.isDrawing = true;

            const p = this.getPos(e);
            this.ctx.beginPath();
            this.ctx.moveTo(p.x, p.y);
        });

        this.cvs.addEventListener("pointermove", e => {
            if(!this.isDrawing) return;

            const p = this.getPos(e);
            this.ctx.lineTo(p.x, p.y);
            this.ctx.stroke();
        });

        this.cvs.addEventListener("pointerup", () => {
            this.isDrawing = false;
        });

        this.cvs.addEventListener("pointerleave", () => {
            this.isDrawing = false;
        });
    },

    toggleEraser() {
        this.isErasing = !this.isErasing;

        if(this.isErasing) {
            this.ctx.globalCompositeOperation = "destination-out";
        } else {
            this.ctx.globalCompositeOperation = "source-over";
        }
    },

    clear() {
        this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height);
    }
};

window.onload = () => {
    Canvas.init();
};
</script>

</body>
</html>
