                    }
                    if (printBtn) {
                        printBtn.style.display = 'inline-flex'; 
                    }
                }
            }
        };

        const AudioEngine = {
            recordingMode: 'main',
            
            async ensurePermission() {
                try {
                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        await navigator.mediaDevices.getUserMedia({ audio: true });
                        return true;
                    }
                    return false;
                } catch (e) {
                    CustomModalEngine.alert("Microphone Needed", "마이크 사용을 허용해주셔야 선생님과 이야기할 수 있어요!");
                    return false;
                }
            },
            
            init() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    this.rec = new SR(); 
                    this.rec.lang = 'en-US'; 
                    this.rec.continuous = false; 
                    this.rec.interimResults = false;
                    
                    this.rec.onresult = (e) => { 
                        STATE.lastTranscript = e.results[0][0].transcript; 
                        STATE.sttConfidence = Math.round(e.results[0][0].confidence * 100); 
                    };
                    
                    this.rec.onend = () => { 
                        if (!STATE.isRecording) {
                            return;
                        }
                        STATE.isRecording = false;
                        
                        if (this.recordingMode === 'chat') {
                            const chatBtn = document.getElementById('btn-chat-record');
                            if (chatBtn) {
                                chatBtn.classList.remove('recording');
                                chatBtn.innerText = "🎤 Speak to Teacher";
                            }
                            setTimeout(() => {
                                AITutor.processReply();
                            }, 800);
                        } else {
                            const recBtn = document.getElementById('btn-record');
                            const recText = document.getElementById('record-text');
                            if (recBtn) {
                                recBtn.classList.remove('recording');
                            }
                            if (recText) {
                                recText.innerText = "Voice Log";
                            }
                            setTimeout(() => {
                                AITutor.submit();
                            }, 800);
                        }
                    };
                    
                    this.rec.onerror = () => { 
                        if (STATE.isRecording) { 
                            STATE.isRecording = false; 
                            const recBtn = document.getElementById('btn-record');
                            const recText = document.getElementById('record-text');
                            if (recBtn) {
                                recBtn.classList.remove('recording'); 
                            }
                            if (recText) {
                                recText.innerText = "Voice Log"; 
                            }
                        } 
                    };
                } else { 
                    ['btn-record', 'btn-chat-record'].forEach((id) => { 
                        const btn = document.getElementById(id);
                        if (btn) {
                            btn.disabled = true; 
                        }
                    }); 
                }
            },
            
            async toggle() {
                if (!this.rec) {
                    return; 
                }
                const hasPermission = await this.ensurePermission();
                if (!hasPermission) {
                    return;
                }
                
                this.recordingMode = 'main';
                const recBtn = document.getElementById('btn-record');
                const recText = document.getElementById('record-text');
                
                if (!STATE.isRecording) { 
                    STATE.isRecording = true; 
                    if (recBtn) {
                        recBtn.classList.add('recording'); 
                    }
                    if (recText) {
                        recText.innerText = "Listening..."; 
                    }
                    this.rec.start(); 
                } else { 
                    STATE.isRecording = false; 
                    if (recBtn) {
                        recBtn.classList.remove('recording'); 
                    }
                    if (recText) {
                        recText.innerText = "Voice Log"; 
                    }
                    this.rec.stop(); 
                }
            },
            
            async toggleChat() {
                if (!this.rec) {
                    return; 
                }
                const hasPermission = await this.ensurePermission();
                if (!hasPermission) {
                    return;
                }
                
                this.recordingMode = 'chat';
                const chatBtn = document.getElementById('btn-chat-record');
                
                if (!STATE.isRecording) { 
                    STATE.isRecording = true; 
                    if (chatBtn) {
                        chatBtn.classList.add('recording'); 
                        chatBtn.innerText = "Listening...";
                    }
                    this.rec.start(); 
                } else { 
                    STATE.isRecording = false; 
                    if (chatBtn) {
                        chatBtn.classList.remove('recording'); 
                        chatBtn.innerText = "🎤 Speak to Teacher";
                    }
                    this.rec.stop(); 
                }
            }
        };

        const AITutor = {
            isBusy: false,
            
            async callBackendTutor(promptText, base64Img = null) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                
                try {
                    const user = auth.currentUser; 
                    if (!user) {
                        throw new Error("Unauthorized");
                    }
                    
                    const token = await user.getIdToken();
                    let imageVal = null;
                    if (base64Img) {
                        const splitArr = base64Img.split(',');
                        if (splitArr.length > 1) {
                            imageVal = splitArr[1];
                        }
                    }
                    
                    const reqObj = {
                        prompt: promptText, 
                        image: imageVal, 
                        unitId: STATE.unitId, 
                        page: STATE.currentPage,
                        // [P0] 디바이스 엔진 추적 메트릭스 & 대화 히스토리 통합 전송
                        metrics: {
                            strokes: STATE.strokeCount,
                            colors: STATE.usedColors.size
                        },
                        history: STATE.chatHistory.slice(-4).map(h => `${h.role}: ${h.text}`).join("\n") 
                    };
                    
                    const response = await fetch(CONFIG.API_TUTOR_ENDPOINT, {
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify(reqObj),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    const data = await response.json(); 
                    if (data.reply) {
                        return data.reply;
                    } else {
                        return "앗, 선생님이 지금 대답을 준비하지 못했어요.";
                    }
                } catch (e) { 
                    clearTimeout(timeoutId);
                    if (e.name === 'AbortError') {
                        return "앗, 연결 시간이 너무 오래 걸렸어요. 다시 버튼을 눌러주세요!";
                    }
                    return "앗, 네트워크 문제로 AI 선생님이 대답하지 못했어요. 다시 제출해주세요!"; 
                }
            },
            
            async submit() {
                if (STATE.isRecording) { 
                    AudioEngine.toggle(); 
                    return; 
                } 
                if (this.isBusy) {
                    return; 
                }
                this.isBusy = true;
                
                const requestPage = STATE.currentPage;
                const requestUnit = STATE.unitId;
                
                const content = document.getElementById('ai-content'); 
                const panel = document.getElementById('ai-panel');
                
                if (panel) {
                    panel.classList.add('open');
                }
                
                if (content) {
                    content.innerHTML = `
                        <div class="ai-loading-container">
                            <i class="fa-solid fa-spinner fa-spin ai-loading-icon"></i>
                            <p>Teacher is looking at your art...</p>
                        </div>
                    `;
                }
                
                try {
                    StorageEngine.saveCanvasLocal(); 
                    StorageEngine.executeCloudSave();
                    
                    const canvasImg = CanvasEngine.captureWorksheetWithDrawing(true);
                    let unitData = { goal: "Free Exploration", question: "Tell me more about it.", context: "The student is exploring and drawing freely." };
                    
                    if (PAGE_INTELLIGENCE[STATE.unitId] && PAGE_INTELLIGENCE[STATE.unitId][STATE.currentPage]) {
                        unitData = PAGE_INTELLIGENCE[STATE.unitId][STATE.currentPage];
                    }
                    
                    let saidText = STATE.lastTranscript || "Look at my work!";
                    let confidenceLog = STATE.sttConfidence > 0 ? `(Voice Confidence: ${STATE.sttConfidence}%)` : "";
                    
                    // 대화 이력을 시작
                    STATE.chatHistory.push({ role: "Student", text: saidText });

                    const prompt = `Act as an enthusiastic, friendly American teacher for a young kindergarten student named ${STATE.studentName}.
Task 1: Look at the attached drawing/worksheet image. (Context: ${unitData.goal} - ${unitData.context || unitData.question}).
Task 2: Read what the student just said out loud: "${saidText}" ${confidenceLog}.
Rules:
1. Praise specific details you see in BOTH their drawing and what they said. Be very encouraging.
2. If the student's voice confidence is low, gently encourage them to speak a little louder next time, but still praise their effort.
3. Keep it to 2-3 short, simple English sentences suitable for a young child.
4. ALWAYS end your response with a simple, fun follow-up question to keep the conversation going (e.g., "What colors did you use?", "Was it fun?", "What will you make with those tools?").
5. Use plain text only, no markdown, no emojis.`;
                    
                    const reply = await this.callBackendTutor(prompt, canvasImg);
                    
                    if (STATE.currentPage !== requestPage || STATE.unitId !== requestUnit) {
                        return;
                    }
                    
                    STATE.chatHistory.push({ role: "Teacher", text: reply });

                    const aiFailed = (reply || "").includes("앗,");
                    if (!aiFailed) {
                        if (!CanvasEngine.isCanvasBlank()) {
                            BadgeEngine.add("🎨 Colorful Artist");
                        }
                        if (STATE.sttConfidence >= 80 && STATE.lastTranscript.length > 0) {
                            BadgeEngine.add("🗣️ Great Speaker");
                        }
                    }
                    
                    if (content) {
                        content.innerHTML = `
                            <div class="analytics-card">
                                <div class="analytics-title">Mission: ${unitData.goal}</div>
                                <div class="stat-row">
                                    <div class="stat-label"><span>Voice Confidence</span><span>${STATE.sttConfidence}%</span></div>
                                    <div class="bar-bg"><div class="bar-fill" style="width:${STATE.sttConfidence}%; background-color:var(--br-blue)"></div></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-label"><span>Brush Strokes Count</span><span>${STATE.strokeCount}</span></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-label"><span>Unique Colors Used</span><span>${STATE.usedColors.size}</span></div>
                                </div>
                            </div>
                        `;
                        const bbl = document.createElement('div'); 
                        bbl.className = 'chat-bubble ai mt-4'; 
                        bbl.textContent = reply || "I see what you did! Great job!"; 
                        content.appendChild(bbl);
                    }
                    
                    const footer = document.getElementById('chat-footer');
                    if (footer) {
                        footer.style.display = "block"; 
                    }
                    
                    if (reply) {
                        this.speak(reply);
                    }
                } finally { 
                    this.isBusy = false; 
                }
            },
            
            async processReply() {
                if (!STATE.lastTranscript || this.isBusy) {
                    return; 
                }
                this.isBusy = true;
                
                const requestPage = STATE.currentPage;
                const requestUnit = STATE.unitId;
                const content = document.getElementById('ai-content');
                
                if (content) {
                    const uBbl = document.createElement('div'); 
                    uBbl.className = "chat-bubble user mt-4"; 
                    uBbl.textContent = STATE.lastTranscript; 
                    content.appendChild(uBbl);
                    
                    STATE.chatHistory.push({ role: "Student", text: STATE.lastTranscript });
                    
                    const aBbl = document.createElement('div'); 
                    aBbl.className = "chat-bubble ai mt-4"; 
                    aBbl.innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="color:var(--br-green)"></i> 생각 중...`; 
                    content.appendChild(aBbl); 
                    content.scrollTop = content.scrollHeight;
                    
                    try {
                        const prompt = `Act as an enthusiastic, friendly American teacher for a young kindergarten student named ${STATE.studentName}. 
Respond directly to what the student just answered: "${STATE.lastTranscript}". 
Rules:
1. Give a highly engaging, encouraging message in very simple, natural English.
2. Maximum 2 to 3 short sentences.
3. End with another simple question to keep the chat going.
4. Plain text only, no emojis or markdown.`;

                        const reply = await this.callBackendTutor(prompt);
                        
                        if (STATE.currentPage !== requestPage || STATE.unitId !== requestUnit) {
                            return;
                        }
                        
                        STATE.chatHistory.push({ role: "Teacher", text: reply });

                        aBbl.innerHTML = ''; 
                        const b = document.createElement('b'); 
                        b.style.color = 'var(--br-green)'; 
                        b.textContent = reply || "That's wonderful!"; 
                        aBbl.appendChild(b);
                        content.scrollTop = content.scrollHeight; 
                        
                        if (reply) {
                            this.speak(reply);
                        }
                    } finally { 
                        this.isBusy = false; 
                    }
                } else {
                    this.isBusy = false;
                }
            },
            
            speak(text) { 
                if (window.speechSynthesis) { 
                    window.speechSynthesis.cancel(); 
                    const u = new SpeechSynthesisUtterance(text); 
                    u.lang = 'en-US'; 
                    u.rate = 0.9; 
                    u.pitch = 1.05; 
                    
                    const voices = window.speechSynthesis.getVoices();
                    const preferredVoices = voices.filter(v => v.lang.startsWith('en-') && (v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Siri') || v.name.includes('Alex')));
                    
                    if (preferredVoices.length > 0) {
                        u.voice = preferredVoices[0];
                    }
                    
                    window.speechSynthesis.speak(u); 
                } 
            },
            
            close() { 
                const panel = document.getElementById('ai-panel');
                if (panel) {
                    panel.classList.remove('open'); 
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel(); 
                }
            }
        };

        if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => { 
                window.speechSynthesis.getVoices(); 
            };
        }

        const AppEngine = {
            smoothMove(dir) {
                const nextPage = CurriculumEngine.next(STATE.unitId, STATE.currentPage, dir); 
                if (nextPage === STATE.currentPage) {
                    return;
                }
                
                StorageEngine.saveCanvasLocal(); 
                StorageEngine.executeCloudSave(StorageEngine.createCanvasSnapshot(true));
                
                const board = document.getElementById('drawing-board');
                if (board) {
                    board.classList.add('fade-out');
                }
                
                setTimeout(() => { 
                    STATE.currentPage = nextPage; 
                    PageEngine.load(STATE.currentPage); 
                    setTimeout(() => { 
                        if (board) {
                            board.classList.remove('fade-out'); 
                        }
                    }, 150); 
                }, 400);
            },
            handleNextAdventure() { 
                AITutor.close(); 
                if (CurriculumEngine.isWeekEnd(STATE.unitId, STATE.currentPage)) {
                    CertificateEngine.open(CurriculumEngine.weekIndex(STATE.unitId, STATE.currentPage)); 
                } else {
                    this.smoothMove(1); 
                }
            }
        };

        const PageEngine = {
            init() {
                const list = document.getElementById('nav-list'); 
                if (!list) {
                    return; 
                }
                list.innerHTML = '';
                
                const unitData = PAGE_INTELLIGENCE[STATE.unitId];
                if (unitData) {
                    Object.keys(unitData).forEach((key) => {
                        const item = document.createElement('div'); 
                        item.className = 'nav-item interactive-hover'; 
                        item.id = `nav-${key}`;
                        
                        const titleText = unitData[key].navTitle;
                        const numKey = Number(key);
                        const weekIdx = CurriculumEngine.weekIndex(STATE.unitId, numKey);
                        
                        item.innerHTML = `<span class="nav-title">${titleText}</span><span class="nav-badge">W${weekIdx}-P.${key}</span>`;
                        item.onclick = () => { 
                            AppEngine.smoothMove(numKey - STATE.currentPage); 
                            UIEngine.closeSidebar(); 
                        }; 
                        list.appendChild(item);
                    });
                }
                this.load(STATE.currentPage);
            },
            load(n) {
                STATE.currentPage = n; 
                STATE.lastTranscript = ""; 
                STATE.sttConfidence = 0;
                
                const unitInfo = document.getElementById('unit-info');
                if (unitInfo) {
                    unitInfo.innerText = `MASTER LAB: ${STATE.unitId}`; 
                }
                
                const pageInfo = document.getElementById('page-info');
                const pageGoal = document.getElementById('page-goal-text');
                const padN = String(n).padStart(2, '0');
                
                if (document.getElementById('page-number-text')) {
                    document.getElementById('page-number-text').innerText = `Inquiry P.${padN}`;
                }
                
                let goalText = "Free Exploration";
                if (PAGE_INTELLIGENCE[STATE.unitId] && PAGE_INTELLIGENCE[STATE.unitId][n]) {
                    goalText = PAGE_INTELLIGENCE[STATE.unitId][n].goal;
                }
                
                if (pageGoal) {
                    pageGoal.innerText = goalText;
                }
                
                document.querySelectorAll('.nav-item').forEach((el) => {
                    el.classList.remove('active');
                });
                
                const activeNav = document.getElementById(`nav-${n}`);
                const navList = document.getElementById('nav-list');
                
                if (activeNav) {
                    activeNav.classList.add('active');
                    if (navList) {
                        navList.scrollTo({ top: activeNav.offsetTop - navList.offsetTop - 50, behavior: 'smooth' });
                    }
                }
                
                CanvasEngine.hardReset(); 
                AITutor.close(); 
                
                const worksheetImg = document.getElementById('worksheet-img');
                if (worksheetImg) {
                    worksheetImg.style.opacity = '0';
                }
                
                SmartImageLoader.findValidWorksheet(STATE.unitId, STATE.currentPage); 
                StorageEngine.save();
            }
        };

        const UIEngine = {
            toggleSidebar() { 
                if (window.innerWidth > 1180) {
                    return; 
                }
                const sb = document.getElementById('sidebar');
                if (sb) {
                    sb.classList.toggle('open'); 
                }
                const bd = document.getElementById('sidebar-backdrop');
                if (bd) {
                    bd.classList.toggle('active'); 
                }
            },
            closeSidebar() { 
                const sb = document.getElementById('sidebar');
                if (sb) {
                    sb.classList.remove('open'); 
                }
                const bd = document.getElementById('sidebar-backdrop');
                if (bd) {
                    bd.classList.remove('active'); 
                }
            }
        };

        /**
         * [5-20. FINAL BOOTSTRAP: THE FAIL-SAFE BOOTLOADER]
         */
        let systemBooted = false;
        function SystemBoot() {
            if (systemBooted) {
                return; 
            }
            systemBooted = true;
            
            try {
                StorageEngine.load(); 
                CustomModalEngine.init(); 
                CanvasEngine.init(); 
                RGBRingEngine.init(); 
                AudioEngine.init(); 
                CursorEngine.init(); 
                BadgeEngine.renderAll(); 
                PageEngine.init(); 
                SyncIndicatorEngine.init();
                Logger.log("V100.105 Hyper-Cognitive System Boot Complete.");
            } catch(error) { 
                Logger.error("Framework initialization error:", error); 
            }
        }

        // [최우선 보안 검증: 모든 DOM 객체 로딩 완료 후 부팅 진입]
        document.addEventListener("DOMContentLoaded", () => {
            try {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        Logger.log("Secured Session Authenticated:", user.email);
                        STATE.uid = user.uid; 
                        STATE.studentEmail = user.email;
                        STATE.studentName = user.email.split('@')[0].toUpperCase() || "EXPLORER";
                        
                        const profileBox = document.getElementById('profile-box');
                        if (profileBox) {
                            profileBox.classList.add('registered');
                        }
                        const displayNameEl = document.getElementById('display-name');
                        if (displayNameEl) {
                            displayNameEl.innerText = STATE.studentName;
                        }
                        const avatarEl = document.getElementById('avatar-char');
                        if (avatarEl) {
                            avatarEl.innerText = STATE.studentName.charAt(0);
                        }
                    } else {
                        Logger.warn("No active session. Launching in Guest Fallback Mode.");
                        STATE.studentName = "GUEST";
                    }
                    
                    SystemBoot(); 
                });
            } catch (authException) {
                Logger.error("Firebase Auth Module Failed. Engaging fallback boot.", authException);
                SystemBoot();
            }

            setTimeout(() => {
                if (!systemBooted) {
                    Logger.warn("Absolute Timeout Triggered. Force booting the system.");
                    STATE.studentName = "GUEST";
                    SystemBoot();
                }
            }, 3000);
        });

    </script>
</body>
</html>
