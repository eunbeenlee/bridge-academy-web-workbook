<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Master Inquiry Lab</title>
    
    <!-- [Premium Typography] -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 
         * ======================================================================
         * [Architecture: Bridge Academy Premium Lab System V34.0]
         * Designed for Director Lee Yun-ji | Bridge Academy Heritage
         * ======================================================================
         */
        :root {
            --bridge-green: #8CC69F;
            --bridge-gold: #C5A059;
            --bridge-charcoal: #3A3A42;
            --bridge-bg: #F0F2F1;
            --bridge-paper: #FFFFFF;
            --luxury-shadow: 0 50px 100px rgba(58, 58, 66, 0.08);
            --transition-master: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* [Global Standards] */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans KR', sans-serif; background: radial-gradient(circle at center, #F7F9F8 0%, #DDE3E0 100%); height: 100vh; display: flex; overflow: hidden; }

        /* --------------------------------------------------
         * [Sidebar] 17-Page Log Navigation
         * -------------------------------------------------- */
        .sidebar { 
            width: 360px; 
            background: var(--bridge-paper); 
            border-right: 1px solid rgba(0,0,0,0.06); 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.02); 
        }
        .sidebar-header { 
            padding: 50px 40px; 
            text-align: center; 
            border-bottom: 1px solid #F8F8F8; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .sidebar-header:hover { opacity: 0.7; }
        .logo-img { max-width: 200px; margin-bottom: 25px; }
        .active-theme-label { 
            font-family: 'Playfair Display', serif; 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--bridge-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }

        .log-nav-list { flex: 1; overflow-y: auto; padding: 30px; }
        .log-nav-list::-webkit-scrollbar { width: 6px; }
        .log-nav-list::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 10px; }
        
        .log-item { 
            padding: 24px 25px; 
            margin-bottom: 15px; 
            border-radius: 20px; 
            background: #FAFAFA;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .log-item:hover { background: #F0F0F0; border-color: #EAEAEA; }
        .log-item.active { 
            background: #EAF4ED; 
            border-left: 8px solid var(--bridge-green); 
            border-color: #EAF4ED;
            font-weight: 700; 
            color: var(--bridge-charcoal); 
            box-shadow: 0 10px 20px rgba(140,198,159,0.15); 
        }
        .page-tag { font-size: 11px; font-weight: 900; opacity: 0.4; letter-spacing: 1px; }

        /* --------------------------------------------------
         * [Workspace Stage] Core Image Viewer
         * -------------------------------------------------- */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; }
        .viewer-stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 60px 40px; overflow-y: auto; }
        
        .status-bar { 
            width: 100%; 
            max-width: 850px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 35px; 
        }
        .unit-id { font-size: 14px; font-weight: 900; color: var(--bridge-green); letter-spacing: 6px; text-transform: uppercase; }
        .page-headline { font-family: 'Playfair Display', serif; font-size: 46px; font-weight: 900; color: var(--bridge-charcoal); letter-spacing: -1px; }

        /* --------------------------------------------------
         * [Canvas Architecture] Image & Drawing Layer
         * -------------------------------------------------- */
        .canvas-container { 
            position: relative; 
            background: #FFF; 
            border-radius: 20px; 
            box-shadow: var(--luxury-shadow); 
            width: 100%; 
            max-width: 850px; 
            line-height: 0; 
            border: 1px solid #EAEAEA; 
        }
        #main-worksheet { width: 100%; height: auto; border-radius: 20px; pointer-events: none; }
        #drawing-layer { position: absolute; top: 0; left: 0; border-radius: 20px; cursor: crosshair; touch-action: none; }

        /* [Loading State / Error State] */
        .error-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: #F9F9F9; border-radius: 20px; z-index: 50; text-align: center;
        }
        .error-msg { font-size: 18px; color: #999; font-weight: 500; margin-top: 20px; letter-spacing: 2px; }

        /* --------------------------------------------------
         * [AI Insight Overlay]
         * -------------------------------------------------- */
        #ai-insight-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(40px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; padding: 80px; border-radius: 20px;
        }
        .score-circle { 
            width: 160px; height: 150px; background: var(--bridge-green); color: #FFF; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 52px; font-weight: 900; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(140, 198, 159, 0.3); 
        }
        .insight-msg { font-size: 30px; font-weight: 800; color: var(--bridge-charcoal); margin-bottom: 50px; line-height: 1.6; word-break: keep-all; }

        /* --------------------------------------------------
         * [Bottom Control System]
         * -------------------------------------------------- */
        .control-dock { 
            width: 100%; background: rgba(255, 255, 255, 0.96); padding: 35px 50px; 
            border-top: 1px solid #EEE; display: flex; flex-direction: column; gap: 30px; 
            align-items: center; backdrop-filter: blur(25px); position: sticky; bottom: 0;
            z-index: 500;
        }
        .tool-bar { 
            display: flex; width: 100%; max-width: 850px; align-items: center; justify-content: space-between; 
            background: #F8FAF9; padding: 20px 40px; border-radius: 100px; border: 1.5px solid #EEE; 
        }
        .color-ring { width: 55px; height: 55px; border-radius: 50%; cursor: pointer; border: 3px solid #FFF; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .brush-slider { width: 250px; accent-color: var(--bridge-green); cursor: pointer; }

        .action-row { display: flex; width: 100%; max-width: 850px; gap: 25px; }
        .btn-nav { width: 80px; height: 80px; border-radius: 25px; border: 1.5px solid #EEE; background: #FFF; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .btn-nav:hover { background: #F5F5F5; }
        .btn-action { height: 80px; border-radius: 25px; border: none; font-weight: 900; cursor: pointer; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; transition: var(--transition-master); }
        .btn-record { background: #FFF; color: var(--bridge-charcoal); border: 2.5px solid #F0F0F0; flex: 1; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; flex: 1.8; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .btn-submit:hover { background: var(--bridge-green); transform: translateY(-5px); box-shadow: 0 30px 60px rgba(140, 198, 159, 0.3); }

        /* --------------------------------------------------
         * [Mobile & Tablet Optimization]
         * -------------------------------------------------- */
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 1px solid #EEE; }
            .sidebar-header { padding: 20px; border-bottom: none; border-right: 1px solid #EEE; }
            .logo-img { max-width: 120px; margin-bottom: 10px; }
            .log-nav-list { display: flex; overflow-x: auto; padding: 15px; gap: 15px; }
            .log-item { min-width: 180px; margin-bottom: 0; padding: 15px 20px; }
            .viewer-stage { padding: 40px 20px; }
            .status-bar { margin-bottom: 20px; }
            .page-headline { font-size: 32px; }
            .control-dock { padding: 20px; }
            .action-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- Professional Navigation Sidebar -->
    <nav class="sidebar">
        <!-- 클릭 시 인덱스(메인 화면)로 돌아가기 -->
        <div class="sidebar-header" onclick="location.href='index.html'">
            <img src="logo.png" alt="Bridge Academy" class="logo-img">
            <div id="display-theme-title" class="active-theme-label">Back to Campus</div>
        </div>
        <div id="log-list" class="log-nav-list">
            <!-- JavaScript Engine renders 1-17 pages here -->
        </div>
    </nav>

    <!-- Main Inquiry Workspace -->
    <div class="workspace">
        <main class="viewer-stage">
            <div class="status-bar">
                <div id="unit-id-tag" class="unit-id">UNIT A-1</div>
                <div id="page-indicator" class="page-headline">Inquiry Log P.01</div>
            </div>

            <div class="canvas-container">
                <!-- AI Feedback Overlay -->
                <div id="ai-insight-overlay">
                    <div id="score-badge" class="score-circle">100</div>
                    <div id="insight-msg" class="insight-msg">Masterful Inquiry Evidence Detected.</div>
                    <button onclick="LabUI.closeInsight()" style="padding:24px 80px; border-radius:100px; background:var(--bridge-charcoal); color:#FFF; font-weight:900; border:none; cursor:pointer; letter-spacing:5px;">CONTINUE</button>
                </div>
                
                <!-- Error/Missing Image State -->
                <div id="error-state" class="error-overlay">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#CCC" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <div class="error-msg">Uploading Asset to Master Database...</div>
                </div>

                <!-- Main Worksheet Image -->
                <img src="" id="main-worksheet" crossorigin="anonymous">
                <canvas id="drawing-layer"></canvas>
            </div>
        </main>

        <!-- Premium Control Dock -->
        <div class="control-dock">
            <div class="tool-bar">
                <div style="display:flex; align-items:center; gap:25px;">
                    <canvas id="color-picker-wheel" width="110" height="110" style="width:55px; height:55px; border-radius:50%; cursor:pointer;"></canvas>
                    <div id="brush-preview" class="color-ring" style="background:#3A3A42;"></div>
                </div>
                <input type="range" id="brush-size" class="brush-slider" min="3" max="35" value="8">
                <button onclick="CanvasEngine.clear()" style="background:none; border:none; color:#AAA; font-weight:900; cursor:pointer; font-size:15px; letter-spacing:3px;">RESET</button>
            </div>
            <div class="action-row">
                <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                <button id="btn-audio" class="btn-action btn-record" onclick="AudioEngine.toggle()">🎤 RECORD</button>
                <button class="btn-action btn-submit" onclick="AIEngine.analyze()">SUBMIT INQUIRY ✨</button>
                <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         [CORE LAB ENGINE V34.0]
         Path Matcher: assets/A-1/A-1-1.png
         ====================================================================== -->
    <script>
        /**
         * [State Management]
         * id: URL에서 받아온 테마 ID (예: "A-1") - 없으면 기본값 A-1
         * p: 현재 페이지 번호 (1 ~ 17)
         */
        const STATE = {
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            p: 1,
            isDrawing: false
        };

        const CONFIG = {
            KEY: "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4",
            MODEL: "gemini-1.5-flash",
            ASSET_ROOT: "assets" // GitHub 최상단 assets 폴더
        };

        // --- Module 1: Path Generator (V34.0) ---
        const PathEngine = {
            /**
             * 원장님 지정 규칙 완벽 반영: assets/폴더명/폴더명-페이지번호.png
             * 예: assets/A-1/A-1-1.png
             */
            generate(themeId, pageNum) {
                return `${CONFIG.ASSET_ROOT}/${themeId}/${themeId}-${pageNum}.png`;
            }
        };

        // --- Module 2: Page Navigation System ---
        const PageEngine = {
            init() {
                // 상단 유닛 이름 업데이트
                document.getElementById('unit-id-tag').innerText = `MASTER LAB: ${STATE.id}`;
                
                const list = document.getElementById('log-list');
                // 1페이지부터 17페이지까지 네비게이션 생성
                for(let i=1; i<=17; i++) {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.id = `page-${i}`;
                    item.innerHTML = `<span>Inquiry Entry</span> <span class="page-tag">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => this.load(i);
                    list.appendChild(item);
                }
                this.load(1); // 첫 페이지 로드
            },
            
            load(n) {
                STATE.p = n; 
                
                // 1. 경로 생성
                const imgPath = PathEngine.generate(STATE.id, n);
                
                // 2. UI 업데이트
                const imgElement = document.getElementById('main-worksheet');
                const errorState = document.getElementById('error-state');
                
                // 로딩 시작 시 에러 숨김
                errorState.style.display = 'none';
                imgElement.style.opacity = '0'; 
                
                // 이미지 소스 삽입
                imgElement.src = imgPath;
                
                // 이미지 로드 성공
                imgElement.onload = () => {
                    imgElement.style.opacity = '1';
                    CanvasEngine.resize(); // 캔버스 크기 맞춤
                };
                
                // 이미지 로드 실패 (아직 업로드 안된 경우)
                imgElement.onerror = () => {
                    errorState.style.display = 'flex';
                    CanvasEngine.clear();
                };

                // 헤드라인 업데이트
                document.getElementById('page-indicator').innerText = `Inquiry Log P.${String(n).padStart(2,'0')}`;
                
                // 사이드바 활성화 표시
                document.querySelectorAll('.log-item').forEach(el => el.classList.remove('active'));
                const activeItem = document.getElementById(`page-${n}`);
                if(activeItem) {
                    activeItem.classList.add('active');
                    // 스크롤 자동 이동 (선택사항)
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                
                CanvasEngine.clear();
            },
            
            move(dir) {
                const target = STATE.p + dir;
                if(target >= 1 && target <= 17) this.load(target);
            }
        };

        // --- Module 3: Canvas Drawing Engine ---
        const CanvasEngine = {
            init() {
                this.cvs = document.getElementById('drawing-layer');
                this.ctx = this.cvs.getContext('2d');
                this.img = document.getElementById('main-worksheet');
                this.setupEvents();
                this.drawWheel();
            },
            setupEvents() {
                const getP = (e) => {
                    const r = this.cvs.getBoundingClientRect();
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const cy = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: cx - r.left, y: cy - r.top };
                };
                const start = (e) => { STATE.isDrawing = true; const p = getP(e); this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); };
                const move = (e) => { if(!STATE.isDrawing) return; if(e.cancelable) e.preventDefault(); const p = getP(e); this.ctx.lineTo(p.x, p.y); this.ctx.stroke(); };
                const stop = () => STATE.isDrawing = false;

                this.cvs.addEventListener('mousedown', start);
                this.cvs.addEventListener('mousemove', move);
                window.addEventListener('mouseup', stop);
                this.cvs.addEventListener('touchstart', start, {passive:false});
                this.cvs.addEventListener('touchmove', move, {passive:false});
            },
            resize() {
                const dpr = window.devicePixelRatio || 1;
                this.cvs.width = this.img.clientWidth * dpr;
                this.cvs.height = this.img.clientHeight * dpr;
                this.cvs.style.width = this.img.clientWidth + 'px';
                this.cvs.style.height = this.img.clientHeight + 'px';
                this.ctx.scale(dpr, dpr);
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.lineWidth = document.getElementById('brush-size').value;
                this.ctx.strokeStyle = document.getElementById('brush-preview').style.background;
            },
            clear() { 
                this.ctx.clearRect(0,0,this.cvs.width,this.cvs.height); 
                this.ctx.beginPath(); 
            },
            drawWheel() {
                const wc = document.getElementById('color-picker-wheel');
                const wctx = wc.getContext('2d');
                const r = 55;
                for(let i=0; i<360; i++) {
                    wctx.beginPath(); wctx.moveTo(r,r);
                    wctx.arc(r,r,r, (i-1)*Math.PI/180, (i+1)*Math.PI/180);
                    wctx.fillStyle = `hsl(${i}, 100%, 50%)`; wctx.fill();
                }
                wctx.beginPath(); wctx.arc(r,r,20,0,Math.PI*2); wctx.fillStyle="#FFF"; wctx.fill();
                
                wc.onclick = (e) => {
                    const rect = wc.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (110/rect.width);
                    const y = (e.clientY - rect.top) * (110/rect.height);
                    const pxl = wctx.getImageData(x,y,1,1).data;
                    const rgb = `rgb(${pxl[0]},${pxl[1]},${pxl[2]})`;
                    this.ctx.strokeStyle = rgb;
                    document.getElementById('brush-preview').style.background = rgb;
                };
                
                document.getElementById('brush-size').oninput = (e) => {
                    this.ctx.lineWidth = e.target.value;
                };
            }
        };

        // --- Module 4: AI Engine (Simulated or API) ---
        const AIEngine = {
            async analyze() {
                const overlay = document.getElementById('ai-insight-overlay');
                overlay.style.display = 'flex';
                document.getElementById('insight-msg').innerText = "Analyzing your Inquiry Evidence...";

                // 짧은 딜레이 후 결과 피드백 (시연용)
                setTimeout(() => {
                    document.getElementById('score-badge').innerText = "100";
                    document.getElementById('insight-msg').innerText = "Excellent Inquiry! You have demonstrated great critical thinking skills on this page.";
                }, 1500);
            }
        };

        const LabUI = { 
            closeInsight() { document.getElementById('ai-insight-overlay').style.display = 'none'; } 
        };

        const AudioEngine = {
            toggle() {
                const btn = document.getElementById('btn-audio');
                if(btn.innerText.includes("RECORD")) {
                    btn.innerText = "🛑 STOP REC";
                    btn.style.background = "#FFEEEE";
                    btn.style.color = "#E00";
                } else {
                    btn.innerText = "🎤 RECORD";
                    btn.style.background = "#FFF";
                    btn.style.color = "var(--bridge-charcoal)";
                }
            }
        };

        // Bootstrap App
        window.onload = () => { 
            CanvasEngine.init(); 
            PageEngine.init(); 
            
            // 화면 리사이즈 시 캔버스 조정
            window.addEventListener('resize', () => {
                if(document.getElementById('main-worksheet').src) {
                    setTimeout(() => CanvasEngine.resize(), 100);
                }
            });
        };
    </script>
</body>
</html>
