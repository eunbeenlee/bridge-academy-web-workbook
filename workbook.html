<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium EdTech Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --br-green: #89BFA0; --br-gold: #CBAE75; --br-blue: #7CA6C1; --br-charcoal: #363431;
            --br-bg: #FCFBF9; --br-paper: #FFFFFF; --br-text: #2A2825; --br-muted: #8C8985;
            --br-border: #F0EFEB; --br-error: #E74C3C; --br-ai: #F4F8F5;
            --sidebar-width: 320px;
        }

        /* [Absolute Reset] 브라우저 스크롤 및 줌 강제 차단 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100dvh; position: fixed; top: 0; left: 0; overflow: hidden; background-color: var(--br-bg); color: var(--br-text); font-family: 'Noto Sans KR', sans-serif; touch-action: none; }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }
        
        .app-container { display: flex; width: 100vw; height: 100dvh; position: relative; }
        
        /* [Sidebar] */
        .sidebar { width: var(--sidebar-width); height: 100%; background: var(--br-paper); border-right: 1px solid var(--br-border); display: flex; flex-direction: column; z-index: 10000; transition: transform 0.4s ease; flex-shrink: 0; }
        .sidebar-header { padding: 40px 30px 30px; text-align: center; border-bottom: 1px solid var(--br-border); cursor: pointer; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--br-charcoal); }
        .brand-logo span { color: var(--br-green); font-style: italic; }
        
        .student-profile { padding: 20px 30px; border-bottom: 1px solid var(--br-border); display: flex; align-items: center; gap: 15px; background: #FAFAFA; }
        .student-profile.registered { background: #F4F8F5; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--br-border); color: var(--br-muted); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 22px; flex-shrink: 0; }
        .student-profile.registered .profile-avatar { background: var(--br-gold); color: #FFF; }
        .profile-info { display: flex; flex-direction: column; overflow: hidden; }
        .profile-name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-role { font-size: 11px; color: var(--br-muted); letter-spacing: 1px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-item { padding: 18px 20px; margin-bottom: 10px; border-radius: 16px; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .nav-item.active { background: var(--br-ai); border-left: 6px solid var(--br-green); font-weight: 900; }
        .nav-title { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .nav-badge { font-size: 11px; font-weight: 900; opacity: 0.3; }
        
        /* [Workspace] */
        .workspace { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; overflow: hidden; }
        
        .top-bar { height: 90px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 10; border-bottom: 1px solid transparent; }
        .unit-info { font-size: 13px; font-weight: 900; color: var(--br-gold); letter-spacing: 5px; }
        .page-info { font-family: 'Playfair Display', serif; font-size: 38px; font-weight: 700; color: var(--br-charcoal); margin-top: 5px; }
        
        /* [Stage Wrapper] */
        .stage-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px 40px; position: relative; overflow: hidden; }
        
        .drawing-board { position: relative; display: inline-block; line-height: 0; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); background: var(--br-paper); max-width: 100%; max-height: 100%; }
        
        #worksheet-img { display: block; max-width: 100%; max-height: calc(100dvh - 240px); width: auto; height: auto; opacity: 0; transition: opacity 0.3s; border-radius: 15px; pointer-events: none; }
        
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999 !important; border-radius: 15px; cursor: crosshair; }

        /* [Bottom Dock] */
        .bottom-dock { height: 120px; flex-shrink: 0; background: rgba(255, 255, 255, 0.95); border-top: 1px solid var(--br-border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 500; }
        
        .tool-group { display: flex; align-items: center; gap: 15px; background: #FAFAFA; padding: 10px 25px; border-radius: 100px; border: 1px solid var(--br-border); }
        .color-preview { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #FFF; cursor: pointer; background: var(--br-charcoal); box-shadow: 0 5px 10px rgba(0,0,0,0.05); flex-shrink: 0; }
        .brush-slider { width: 120px; accent-color: var(--br-green); cursor: pointer; height: 6px; }
        
        .btn-erase { font-size: 13px; font-weight: 900; color: var(--br-charcoal); padding: 10px 15px; border-radius: 15px; background: #FFF; border: 1px solid var(--br-border); cursor: pointer; }
        .btn-erase.active { background: var(--br-error); color: #FFF; border-color: var(--br-error); }
        .btn-erase-all { font-size: 11px; font-weight: 800; color: var(--br-muted); cursor: pointer; padding: 5px; }
        
        .action-group { display: flex; gap: 12px; align-items: center; }
        .btn-nav { width: 60px; height: 60px; border-radius: 18px; border: 1px solid var(--br-border); font-size: 24px; background: #FFF; cursor: pointer; color: var(--br-charcoal); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .btn-core { height: 60px; padding: 0 25px; border-radius: 18px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .btn-record { background: #FFF; color: var(--br-charcoal); border: 1px solid var(--br-border); }
        .btn-submit { background: var(--br-charcoal); color: #FFF; }

        /* [English AI Teacher Panel] */
        .ai-panel { position: absolute; top: 0; right: -450px; width: 420px; height: 100%; background: #FFF; box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 10001; transition: right 0.5s ease; display: flex; flex-direction: column; border-left: 1px solid var(--br-border); }
        .ai-panel.open { right: 0; }
        .ai-header { padding: 25px; background: var(--br-ai); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br-border); flex-shrink: 0; }
        .ai-title { font-size: 18px; font-weight: 900; color: var(--br-green); display: flex; align-items: center; gap: 10px; }
        .btn-close-ai { font-size: 32px; color: var(--br-muted); line-height: 1; cursor: pointer; }
        
        .ai-content { padding: 25px; flex: 1; overflow-y: auto; }
        .transcript-box { background: #F4F8F5; padding: 15px; border-radius: 12px; border-left: 4px solid var(--br-green); margin-bottom: 20px; font-size: 14px; font-style: italic; color: var(--br-charcoal); font-weight: 700; line-height: 1.5; }
        .analytics-box { background: #FAFAFA; border: 1px solid var(--br-border); border-radius: 20px; padding: 20px; margin-bottom: 25px; }
        .analytics-title { font-size: 11px; font-weight: 900; color: var(--br-muted); letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        .stat-row { margin-bottom: 15px; }
        .stat-label { font-size: 13px; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--br-charcoal); }
        .stat-bar-bg { width: 100%; height: 10px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--br-gold); width: 0%; transition: width 1.5s ease; }
        .visual-intent { font-size: 13px; background: #FFF; padding: 15px; border-radius: 12px; border: 1px dashed var(--br-border); margin-top: 15px; line-height: 1.6; color: var(--br-text); }
        .ai-bubble { background: #F8F9FA; padding: 20px; border-radius: 20px; border-bottom-left-radius: 5px; border: 1px solid var(--br-border); font-size: 15px; line-height: 1.7; font-weight: 500; }
        .ai-name-input { width: 100%; padding: 15px; border: 2px dashed var(--br-green); border-radius: 12px; margin-top: 15px; font-size: 16px; text-align: center; font-weight: 800; outline: none; }
        .ai-name-btn { width: 100%; background: var(--br-green); color: #fff; padding: 15px; border-radius: 12px; margin-top: 10px; font-weight: 900; cursor: pointer; font-size: 14px; }

        .mobile-menu-btn { display: none; font-size: 28px; padding: 10px; color: var(--br-charcoal); z-index: 1500; }

        @media (max-width: 1024px) {
            :root { --sidebar-width: 260px; }
            .top-bar { height: 75px; padding: 0 20px; }
            .bottom-dock { height: 100px; padding: 0 20px; }
            .stage-wrapper { padding: 10px 20px; }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; left: calc(var(--sidebar-width) * -1); top: 0; box-shadow: none; }
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            .top-bar { height: 70px; }
            #worksheet-img { max-height: calc(100dvh - 230px); }
            .bottom-dock { height: 140px; flex-direction: column; justify-content: center; padding: 10px 20px; gap: 12px; border-radius: 25px 25px 0 0; }
            .tool-group { width: 100%; justify-content: center; padding: 8px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
            .btn-nav, .btn-core { height: 50px; font-size: 13px; }
            .ai-panel { width: 100%; right: -100%; border-left: none; }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header" onclick="location.href='index.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>
            <div class="student-profile" id="profile-box">
                <div class="profile-avatar" id="avatar-char">?</div>
                <div class="profile-info">
                    <span class="profile-name" id="display-student-name">Inquirer</span>
                    <span class="profile-role">Awaiting Name</span>
                </div>
            </div>
            <div class="nav-list" id="nav-list"></div>
        </nav>

        <div class="workspace">
            <div class="top-bar">
                <div class="top-bar-left" style="display:flex; align-items:center; gap:10px;">
                    <button class="mobile-menu-btn" onclick="UIEngine.toggleSidebar()">☰</button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
            </div>

            <main class="stage-wrapper">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <div class="bottom-dock">
                <div class="tool-group">
                    <div class="color-preview" id="btn-color"></div>
                    <!-- 네이티브 컬러 피커 연동 -->
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;">
                    <input type="range" class="brush-slider" id="brush-size" min="2" max="40" value="6">
                    <button class="btn-erase" id="btn-eraser" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-erase-all" onclick="CanvasEngine.clearAll()">[CLEAR ALL]</button>
                </div>
                
                <div class="action-group">
                    <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                    <button class="btn-core btn-record" id="btn-record" onclick="AudioEngine.toggle()">
                        <div class="dot"></div> <span id="record-text">Audio Log</span>
                    </button>
                    <button class="btn-core btn-submit" onclick="AITutor.submitWork()">Submit ✨</button>
                    <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
                </div>
            </div>
        </div>

        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">Bridge AI Tutor</div>
                <button class="btn-close-ai" onclick="AITutor.close()">×</button>
            </div>
            <div class="ai-content" id="ai-content"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            STORAGE_URL: "https://eunbeenlee.github.io/bridge-heritage/assets/"
        };

        const STATE = {
            studentName: "", isNameRegistered: false,
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1, isRecording: false, lastTranscript: ""
        };

        const UIEngine = {
            toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); },
            closeSidebarOnMobile() { if(window.innerWidth <= 800) document.getElementById('sidebar').classList.remove('open'); }
        };

        const AI_CONTEXT_DB = {
            "A-1": {
                pages: {
                    1: { navTitle: "👑 My Special Name", keywords: ["name", "hello"], intent: "Expressing name and identity", analysis: "The strokes show positive self-perception.", question: "What makes your name special?" },
                    2: { navTitle: "👀 My Beautiful Face", keywords: ["face", "eyes", "nose"], intent: "Depicting face", analysis: "High observation skills shown.", question: "What is your favorite part of your face?" },
                    3: { navTitle: "🖐️ My Strong Hands", keywords: ["hands", "touch"], intent: "Exploring body functions", analysis: "Shows understanding of body capabilities.", question: "What fun things can you do with hands?" },
                    4: { navTitle: "👨‍👩‍👧 My Family Tree", keywords: ["mom", "dad", "family"], intent: "Understanding family", analysis: "Clear depiction of family members.", question: "Who did you draw here?" },
                    5: { navTitle: "🎨 My Favorite Colors", keywords: ["color", "red", "blue"], intent: "Expressing preferences", analysis: "Vibrant color choices.", question: "Why did you choose these colors?" }
                }
            }
        };

        function getPageContext(unitId, pageNum) {
            const unitData = AI_CONTEXT_DB[unitId];
            if (unitData && unitData.pages[pageNum]) return unitData.pages[pageNum];
            return { navTitle: "✨ Inquiry Lab", keywords: ["wow", "beautiful"], intent: "Creative problem-solving", analysis: "Approaches from multiple angles.", question: "Can you tell me more about this?" };
        }

        const PageEngine = {
            init() {
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                const list = document.getElementById('nav-list');
                for(let i=1; i<=17; i++) {
                    const ctx = getPageContext(STATE.id, i);
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span class="nav-title">${ctx.navTitle}</span> <span class="nav-badge">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => { this.load(i); UIEngine.closeSidebarOnMobile(); };
                    list.appendChild(item);
                }
                this.load(1);
            },
            load(n) {
                STATE.currentPage = n; STATE.lastTranscript = ""; 
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE_URL}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png?t=${new Date().getTime()}`;
                
                const img = document.getElementById('worksheet-img');
                img.style.opacity = '0'; 
                img.src = imgPath;
                
                img.onload = () => { 
                    img.style.opacity = '1'; 
                    // ResizeObserver가 변화를 감지해 자동으로 CanvasEngine.resizeCanvas()를 호출합니다.
                };

                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${n}`);
                if(activeNav) activeNav.classList.add('active');
                
                CanvasEngine.clearAll(); AITutor.close();
            },
            move(dir) { const t = STATE.currentPage + dir; if(t >= 1 && t <= 17) this.load(t); }
        };

        /* ======================================================================
         * [V68.0 User-Driven Masterpiece Canvas Engine]
         * 원장님께서 직접 제공해주신 최적화된 PointerEvent 엔진 이식
         * ====================================================================== */
        const CanvasEngine = {
            isDrawing: false,
            isErasing: false,
            lastColor: "#363431",

            init() {
                this.cvs = document.getElementById('draw-layer');
                this.ctx = this.cvs.getContext('2d');
                this.board = document.getElementById('drawing-board');

                this.dpr = window.devicePixelRatio || 1;

                this.setupCanvas();
                this.bindEvents();
                this.setupResizeObserver();
                this.setupUI();
            },

            setupCanvas() {
                const rect = this.board.getBoundingClientRect();

                this.cvs.style.width = rect.width + "px";
                this.cvs.style.height = rect.height + "px";

                this.cvs.width = rect.width * this.dpr;
                this.cvs.height = rect.height * this.dpr;

                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.strokeStyle = this.lastColor;
                this.ctx.lineWidth = 6;
            },

            setupResizeObserver() {
                const ro = new ResizeObserver(() => {
                    this.resizeCanvas();
                });
                ro.observe(this.board);
            },

            resizeCanvas() {
                const temp = document.createElement('canvas');
                temp.width = this.cvs.width;
                temp.height = this.cvs.height;
                temp.getContext('2d').drawImage(this.cvs, 0, 0);

                this.setupCanvas();

                // 리사이즈 시 기존에 그린 그림 복원
                const rect = this.board.getBoundingClientRect();
                this.ctx.drawImage(
                    temp,
                    0, 0, temp.width, temp.height,
                    0, 0, rect.width, rect.height
                );
            },

            getPos(e) {
                const rect = this.cvs.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            },

            bindEvents() {
                this.cvs.style.touchAction = "none"; // 🔥 핵심: 브라우저 기본 터치 동작(스크롤, 줌 등) 완벽 차단

                this.cvs.addEventListener('pointerdown', (e) => {
                    this.isDrawing = true;
                    this.cvs.setPointerCapture(e.pointerId);

                    const p = this.getPos(e);
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                });

                this.cvs.addEventListener('pointermove', (e) => {
                    if (!this.isDrawing) return;

                    const p = this.getPos(e);
                    this.ctx.lineTo(p.x, p.y);
                    this.ctx.stroke();
                });

                this.cvs.addEventListener('pointerup', (e) => {
                    this.isDrawing = false;
                    this.cvs.releasePointerCapture(e.pointerId);
                });

                this.cvs.addEventListener('pointerleave', () => {
                    this.isDrawing = false;
                });
            },

            setupUI() {
                // 색상 피커 연동
                const colorBtn = document.getElementById('btn-color');
                const picker = document.getElementById('native-color-picker');

                colorBtn.style.background = this.lastColor;

                colorBtn.onclick = () => picker.click();

                picker.onchange = (e) => {
                    this.lastColor = e.target.value;
                    colorBtn.style.background = this.lastColor;

                    if (!this.isErasing) {
                        this.ctx.strokeStyle = this.lastColor;
                    }
                };

                // 브러시 두께 조절 연동
                document.getElementById('brush-size').oninput = (e) => {
                    const size = e.target.value;
                    this.ctx.lineWidth = this.isErasing ? size * 2 : size;
                };
            },

            toggleEraser() {
                const btn = document.getElementById('btn-eraser');

                this.isErasing = !this.isErasing;

                if (this.isErasing) {
                    btn.classList.add('active');
                    btn.innerText = "PEN MODE";
                    this.ctx.globalCompositeOperation = 'destination-out';
                } else {
                    btn.classList.remove('active');
                    btn.innerText = "ERASER";
                    this.ctx.globalCompositeOperation = 'source-over';
                    this.ctx.strokeStyle = this.lastColor;
                }
            },

            clearAll() {
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
            }
        };

        /* ======================================================================
         * [Audio Engine & AI Tutor] 
         * ====================================================================== */
        const AudioEngine = {
            recognition: null,
            init() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'en-US'; this.recognition.interimResults = false; this.recognition.continuous = false;
                    this.recognition.onresult = (event) => { STATE.lastTranscript = event.results[0][0].transcript; };
                    this.recognition.onend = () => { if (STATE.isRecording) this.toggle(); };
                    this.recognition.onerror = () => { if (STATE.isRecording) this.toggle(); };
                }
            },
            toggle() {
                const btn = document.getElementById('btn-record'); const text = document.getElementById('record-text');
                if(!STATE.isRecording) { 
                    STATE.isRecording = true; STATE.lastTranscript = ""; btn.classList.add('recording'); text.innerText = "Listening..."; 
                    if(this.recognition) { try { this.recognition.start(); } catch(e) {} }
                } else { 
                    STATE.isRecording = false; btn.classList.remove('recording'); text.innerText = "Audio Log"; 
                    if(this.recognition) { this.recognition.stop(); }
                    setTimeout(() => { AITutor.submitWork(); }, 500);
                }
            }
        };

        const AITutor = {
            submitWork() {
                if(STATE.isRecording) { AudioEngine.toggle(); return; }
                if (STATE.currentPage === 1 && !STATE.isNameRegistered) { this.scanHandwritingForName(); return; }
                this.provideFeedback();
            },
            
            scanHandwritingForName() {
                const panel = document.getElementById('ai-panel'); const content = document.getElementById('ai-content');
                panel.classList.add('open'); 
                content.innerHTML = `<div style="text-align:center; padding: 50px 0;"><div style="width:50px; height:50px; border:4px solid #EEE; border-top-color:var(--br-green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div><p style="font-size:13px; color:var(--br-muted); font-weight:900; letter-spacing:3px;">SCANNING HANDWRITING...</p></div>`;

                setTimeout(() => {
                    content.innerHTML = `<div class="ai-bubble"><b>Bridge Visual AI</b><br><br>Great handwriting! Please confirm your name spelling below to start your 1:1 voice tutoring session.<input type="text" id="ai-name-verify" class="ai-name-input" placeholder="e.g. Olivia" autocomplete="off" onkeypress="if(event.key === 'Enter') AITutor.saveName()"><button class="ai-name-btn" onclick="AITutor.saveName()">CONFIRM NAME</button></div>`;
                    setTimeout(() => document.getElementById('ai-name-verify').focus(), 100);
                }, 2000);
            },

            saveName() {
                const nameInput = document.getElementById('ai-name-verify').value.trim();
                if(nameInput) {
                    STATE.studentName = nameInput; STATE.isNameRegistered = true;
                    document.getElementById('profile-box').classList.add('registered'); document.getElementById('display-student-name').innerText = nameInput; document.getElementById('avatar-char').innerText = nameInput.charAt(0).toUpperCase(); document.querySelector('.profile-role').innerText = "Bridge Inquirer";
                    this.provideFeedback(true);
                } else { alert("Please enter your name."); }
            },

            provideFeedback(isFirstGreeting = false) {
                const panel = document.getElementById('ai-panel'); const content = document.getElementById('ai-content'); panel.classList.add('open');
                const contextData = getPageContext(STATE.id, STATE.currentPage); const callName = STATE.studentName ? STATE.studentName : "my friend";
                
                let transcriptHtml = ""; let analysisMod = contextData.analysis; let confidenceLvl = Math.floor(Math.random() * 15) + 65; 
                
                if (STATE.lastTranscript) {
                    transcriptHtml = `<div class="transcript-box">" ${STATE.lastTranscript} "</div>`;
                    const spokenWords = STATE.lastTranscript.toLowerCase(); const hitKeywords = contextData.keywords.filter(kw => spokenWords.includes(kw));
                    
                    if (hitKeywords.length > 0) {
                        confidenceLvl = Math.floor(Math.random() * 5) + 95;
                        analysisMod = `<b style="color:var(--br-green);">Perfect Audio Match!</b> I heard you mention words like '<b>${hitKeywords.join(", ")}</b>'. ${contextData.analysis}`;
                    } else {
                        confidenceLvl = Math.floor(Math.random() * 10) + 85; 
                        analysisMod = `<b>Great Speaking!</b> I heard your voice clearly. ${contextData.analysis}`;
                    }
                } else { transcriptHtml = `<div class="transcript-empty">(No voice log detected. Try using the Audio Log!)</div>`; }
                
                let introText = isFirstGreeting ? `<b>Nice to meet you, ${callName}!</b><br><br>I scanned your beautiful name. Now let's explore together.<br><br>` : `<b>Hello, ${callName}!</b><br><br>I looked at your drawing and listened to your voice.<br><br>`;

                content.innerHTML = `<div class="analytics-box"><div class="analytics-title">Inquiry Analytics</div>${transcriptHtml}<div class="stat-row"><div class="stat-label"><span>Voice Confidence</span> <span>${confidenceLvl}%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${confidenceLvl}%;"></div></div></div><div class="visual-intent"><b>🎯 Intent Analysis: ${contextData.intent}</b><br><br>${analysisMod}</div></div><div class="ai-bubble">${introText}<b style="font-size:18px; color:var(--br-green);">${contextData.question}</b></div>`;
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(isFirstGreeting ? `Nice to meet you, ${callName}. ${contextData.question}` : `Hello, ${callName}. ${contextData.question}`);
                    utterance.lang = 'en-US'; utterance.rate = 0.85; utterance.pitch = 1.2; window.speechSynthesis.speak(utterance);
                }
            },
            close() { document.getElementById('ai-panel').classList.remove('open'); if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
        };

        window.onload = () => {
            PageEngine.init(); 
            CanvasEngine.init(); 
            AudioEngine.init(); 
        };
    </script>
</body>
</html>
