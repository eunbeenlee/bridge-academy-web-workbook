<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta 
        name="mobile-web-app-capable" 
        content="yes"
    >
    <meta 
        name="apple-mobile-web-app-capable" 
        content="yes"
    >
    <meta 
        name="apple-mobile-web-app-status-bar-style" 
        content="black-translucent"
    >
    <meta 
        name="theme-color" 
        content="#FCFBF9"
    >
    
    <title>Bridge Academy | Premium AI Lab V100.51</title>

    <link 
        rel="icon" 
        href="data:;base64,iVBORw0KGgo="
    >
    
    <link 
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" 
        rel="stylesheet"
    >
    <link 
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" 
        rel="stylesheet"
    >
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
    
    <script 
        src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"
    ></script>
    <script 
        src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
    ></script> 
    
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"
    ></script>
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"
    ></script>
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"
    ></script>

    <style>
        /* ----------------------------------------------------------------------
           [4-1. DESIGN TOKENS & CSS VARIABLES]
        ---------------------------------------------------------------------- */
        :root {
            /* 브랜드 컬러 시스템 지정 */
            --br-green: #91D3B4; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            
            /* 백그라운드 색상 토큰 */
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-ai-soft: #F8FAFF;
            
            /* 텍스트 및 경계선 색상 토큰 */
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            
            /* 시스템 상태(성공, 에러) 토큰 */
            --br-error: #E74C3C; 
            --br-error-light: #FEF2F2;
            --br-error-border: #FCA5A5;
            --br-success: #2ECC71;
            
            /* 화면 분할 규격 치수 */
            --sidebar-width: 320px;
            --topbar-height: 85px;
            --dock-height: 110px;
            
            /* 최신 모바일 기기(아이폰 노치 등) 안전 영역 환경 변수 할당 */
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            /* 시스템 전역 애니메이션 시간축 변수 */
            --transition-smooth: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --transition-fast: all 0.2s ease-in-out;
            --transition-elastic: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            /* 엘리먼트 섀도우 뎁스 토큰 */
            --shadow-float: 0px 25px 70px rgba(0, 0, 0, 0.07);
            --shadow-button: 0px 10px 20px rgba(0, 0, 0, 0.05);
            --shadow-premium: 0px 30px 60px rgba(54, 52, 49, 0.15);
        }

        /* ----------------------------------------------------------------------
           [4-2. BASE RESET & FALLBACKS]
        ---------------------------------------------------------------------- */
        * { 
            /* 모든 요소의 브라우저 기본 마진 초기화 */
            margin-top: 0px; 
            margin-right: 0px; 
            margin-bottom: 0px; 
            margin-left: 0px; 
            
            /* 모든 요소의 브라우저 기본 패딩 초기화 */
            padding-top: 0px; 
            padding-right: 0px; 
            padding-bottom: 0px; 
            padding-left: 0px; 
            
            box-sizing: border-box; 
            
            /* 모바일 기기 터치 시 발생하는 반투명 하이라이트 박스 억제 */
            -webkit-tap-highlight-color: transparent; 
            
            /* [P0 Fix] 프리미엄 커스텀 마우스 포인터 이식을 위해 브라우저의 기본 마우스 커서를
               가장 최상단 부모 속성부터 !important 명령어로 억제합니다. 
            */
            cursor: none !important;
        }

        html {
            width: 100%; 
            height: 100dvh; 
            
            overflow-x: hidden; 
            overflow-y: hidden; 
            
            background-color: var(--br-bg); 
            color: var(--br-text); 
            
            font-family: 'Pretendard', sans-serif; 
            
            pointer-events: auto !important; 
            
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            width: 100%; 
            height: 100dvh; 
            
            overflow-x: hidden; 
            overflow-y: hidden; 
            
            background-color: var(--br-bg); 
            color: var(--br-text); 
            
            font-family: 'Pretendard', sans-serif; 
            
            pointer-events: auto !important; 
            
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        /* [P0 Fix] 링크(a), 입력창(input) 등 상호작용 요소의 기본 커서도 강제 억제 */
        a { 
            cursor: none !important; 
        }

        button { 
            cursor: none !important; 
            
            border-top-width: 0px;
            border-right-width: 0px;
            border-bottom-width: 0px;
            border-left-width: 0px;
            
            background-color: transparent; 
            
            font-family: inherit; 
            
            outline-width: 0px; 
        }

        input { 
            cursor: none !important; 
        }

        select { 
            cursor: none !important; 
        }

        textarea { 
            cursor: none !important; 
        }

        ul { 
            list-style-type: none; 
        }

        ol { 
            list-style-type: none; 
        }

        li { 
            list-style-type: none; 
        }

        /* 모바일 사파리의 100dvh 미지원 환경을 위한 뷰포트 높이 폴백 */
        @supports not (height: 100dvh) {
            html { 
                height: 100vh; 
            }
            body { 
                height: 100vh; 
            }
            .app-container { 
                height: 100vh; 
            }
        }

        /* ----------------------------------------------------------------------
           [4-3. PREMIUM CUSTOM CURSOR SYSTEM (CHILD SAFE OPTIMIZED)]
        ---------------------------------------------------------------------- */
        .cursor-dot {
            position: fixed;
            top: 0px;
            left: 0px;
            
            width: 4px;
            height: 4px;
            
            background-color: rgba(54, 52, 49, 0.75);
            
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            
            pointer-events: none;
            z-index: 99999;
            
            transform: translate(-50%, -50%);
            
            /* 물리 딜레이가 아닌 CSS 선형 전환만 적용하여 제로 레이턴시 확보 */
            transition-property: width, height, opacity, background-color;
            transition-duration: 0.16s;
            transition-timing-function: ease;
        }

        .cursor-ring {
            position: fixed;
            top: 0px;
            left: 0px;
            
            width: 22px;
            height: 22px;
            
            border-top-width: 1px;
            border-right-width: 1px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            
            border-top-color: rgba(54, 52, 49, 0.28);
            border-right-color: rgba(54, 52, 49, 0.28);
            border-bottom-color: rgba(54, 52, 49, 0.28);
            border-left-color: rgba(54, 52, 49, 0.28);
            
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            
            pointer-events: none;
            z-index: 99998;
            
            transform: translate(-50%, -50%);
            
            transition-property: width, height, opacity, border-color, background-color;
            transition-duration: 0.22s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        }

        .cursor-dot.hovered {
            width: 3px;
            height: 3px;
            
            background-color: rgba(145, 211, 180, 0.8);
        }

        .cursor-ring.hovered {
            /* [P1 Fix] 버튼 호버 시 지나치게 비대해지지 않도록 아이들 시각에 맞춰 스케일업 최소화 */
            width: 28px;
            height: 28px;
            
            background-color: rgba(145, 211, 180, 0.05);
            
            border-top-color: rgba(145, 211, 180, 0.5);
            border-right-color: rgba(145, 211, 180, 0.5);
            border-bottom-color: rgba(145, 211, 180, 0.5);
            border-left-color: rgba(145, 211, 180, 0.5);
        }

        .cursor-dot.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .cursor-ring.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* [핵심 로직] 캔버스 드로잉 영역에서는 정밀 십자선 커서(crosshair)가 강제 표출되도록
            최우선순위(Important) 선언문을 각각의 스테이지 래퍼에 개별 주입합니다. 
        */
        .stage-wrapper {
            cursor: crosshair !important;
        }

        .drawing-board {
            cursor: crosshair !important;
        }

        #draw-layer {
            cursor: crosshair !important;
        }

        /* 터치/펜 환경(모바일/태블릿) 커스텀 커서 엔진 전면 비활성화 */
        @media (pointer: coarse) {
            .cursor-dot { 
                display: none !important; 
            }
            .cursor-ring { 
                display: none !important; 
            }
            html { 
                cursor: auto !important; 
            }
            body { 
                cursor: auto !important; 
            }
            a { 
                cursor: auto !important; 
            }
            button { 
                cursor: auto !important; 
            }
            input { 
                cursor: auto !important; 
            }
            select { 
                cursor: auto !important; 
            }
            textarea { 
                cursor: auto !important; 
            }
            .stage-wrapper { 
                cursor: auto !important; 
            }
            .drawing-board { 
                cursor: auto !important; 
            }
            #draw-layer { 
                cursor: auto !important; 
            }
        }
        
        /* ----------------------------------------------------------------------
           [4-4. GLOBAL APP CONTAINER]
        ---------------------------------------------------------------------- */
        .app-container { 
            display: flex; 
            flex-direction: row;
            
            width: 100vw; 
            height: 100dvh; 
            
            position: relative; 
            
            pointer-events: auto !important; 
        }
        
        /* ----------------------------------------------------------------------
           [4-5. SIDEBAR NAVIGATION COMPONENT]
        ---------------------------------------------------------------------- */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            
            background-color: var(--br-paper); 
            
            border-right-width: 1px; 
            border-right-style: solid; 
            border-right-color: var(--br-border); 
            
            display: flex; 
            flex-direction: column; 
            
            z-index: 2000; 
            flex-shrink: 0; 
            
            transition-property: transform; 
            transition-duration: 0.4s; 
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); 
            
            box-shadow: 5px 0px 15px rgba(0, 0, 0, 0.02);
        }

        .sidebar-backdrop {
            position: fixed;
            top: 0px;
            right: 0px;
            bottom: 0px;
            left: 0px;
            
            background-color: rgba(0, 0, 0, 0.18);
            
            z-index: 1500; 
            opacity: 0;
            pointer-events: none;
            
            transition-property: opacity;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            
            backdrop-filter: blur(3px); 
        }

        .sidebar-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-header { 
            padding-top: 35px;
            padding-right: 30px;
            padding-bottom: 35px;
            padding-left: 30px;
            
            text-align: center; 
            
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            
            transition-property: background-color;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        .sidebar-header:hover {
            background-color: var(--br-bg);
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 900; 
            
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
        }
        
        /* ----------------------------------------------------------------------
           [4-6. STUDENT PROFILE LAYOUT WIDGET]
        ---------------------------------------------------------------------- */
        .student-profile { 
            padding-top: 25px;
            padding-right: 30px;
            padding-bottom: 25px;
            padding-left: 30px;
            
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            
            background-color: #FAFAFA; 
            
            transition-property: background-color; 
            transition-duration: 0.3s; 
            transition-timing-function: ease; 
        }

        .student-profile.registered { 
            background-color: var(--br-ai-soft); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            
            border-top-left-radius: 50%; 
            border-top-right-radius: 50%; 
            border-bottom-right-radius: 50%; 
            border-bottom-left-radius: 50%; 
            
            background-color: var(--br-border); 
            color: #FFFFFF; 
            
            display: flex; 
            justify-content: center; 
            align-items: center; 
            
            font-weight: 900; 
            font-size: 22px; 
            font-family: 'Nunito', sans-serif; 
            
            transition-property: background-color, box-shadow, color;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
            
            box-shadow: inset 0px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .student-profile.registered .profile-avatar { 
            background-color: var(--br-gold); 
            box-shadow: 0px 8px 20px rgba(203, 174, 117, 0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            
            overflow-x: hidden; 
            overflow-y: hidden; 
        }

        .profile-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            font-weight: 900; 
            
            color: var(--br-charcoal); 
            text-transform: uppercase; 
            
            white-space: nowrap; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            text-overflow: ellipsis; 
        }

        .profile-role { 
            font-size: 11px; 
            font-weight: 700; 
            
            color: var(--br-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }

        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            min-height: 24px;
        }

        .badge { 
            font-size: 11px; 
            
            padding-top: 4px;
            padding-right: 10px;
            padding-bottom: 4px;
            padding-left: 10px;
            
            border-top-left-radius: 12px; 
            border-top-right-radius: 12px; 
            border-bottom-right-radius: 12px; 
            border-bottom-left-radius: 12px; 
            
            background-color: #FFFFFF; 
            
            border-top-width: 1px; 
            border-right-width: 1px; 
            border-bottom-width: 1px; 
            border-left-width: 1px; 
            
            border-top-style: solid; 
            border-right-style: solid; 
            border-bottom-style: solid; 
            border-left-style: solid; 
            
            border-top-color: var(--br-border); 
            border-right-color: var(--br-border); 
            border-bottom-color: var(--br-border); 
            border-left-color: var(--br-border); 
            
            color: var(--br-charcoal); 
            font-weight: 800; 
            
            display: flex; 
            align-items: center; 
            gap: 4px; 
            
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.02); 
            
            animation-name: popIn; 
            animation-duration: 0.4s; 
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* ----------------------------------------------------------------------
           [4-7. CURRICULUM NAVIGATION LIST]
        ---------------------------------------------------------------------- */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            
            padding-top: 15px;
            padding-right: 15px;
            padding-bottom: 15px;
            padding-left: 15px;
            
            scroll-behavior: smooth; 
        }

        .nav-list::-webkit-scrollbar { 
            width: 5px; 
        }

        .nav-list::-webkit-scrollbar-track { 
            background-color: transparent; 
        }

        .nav-list::-webkit-scrollbar-thumb { 
            background-color: #E8E6E1; 
            
            border-top-left-radius: 10px; 
            border-top-right-radius: 10px; 
            border-bottom-right-radius: 10px; 
            border-bottom-left-radius: 10px; 
        }

        .nav-list::-webkit-scrollbar-thumb:hover { 
            background-color: #D5D3CE; 
        }

        .nav-item { 
            padding-top: 18px;
            padding-right: 20px;
            padding-bottom: 18px;
            padding-left: 20px;
            margin-bottom: 10px; 
            
            border-top-left-radius: 15px; 
            border-top-right-radius: 15px; 
            border-bottom-right-radius: 15px; 
            border-bottom-left-radius: 15px; 
            
            background-color: #FAFAFA; 
            
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            
            transition-property: transform, background-color, border-color, box-shadow;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
            
            border-top-width: 1px; 
            border-right-width: 1px; 
            border-bottom-width: 1px; 
            border-left-width: 1px; 
            
            border-top-style: solid; 
            border-right-style: solid; 
            border-bottom-style: solid; 
            border-left-style: solid; 
            
            border-top-color: transparent; 
            border-right-color: transparent; 
            border-bottom-color: transparent; 
            border-left-color: transparent; 
        }

        .nav-item:hover { 
            background-color: #FFFFFF; 
            
            border-top-color: var(--br-border);
            border-right-color: var(--br-border);
            border-bottom-color: var(--br-border);
            border-left-color: var(--br-border);
            
            transform: translateY(-2px); 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.02); 
        }

        .nav-item.active { 
            background-color: var(--br-ai-soft); 
            
            border-left-width: 6px; 
            border-left-style: solid; 
            border-left-color: var(--br-green); 
            
            border-top-color: transparent; 
            border-right-color: transparent; 
            border-bottom-color: transparent; 
            
            box-shadow: 0px 10px 25px rgba(145, 211, 180, 0.12); 
        }

        .nav-title { 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            
            white-space: nowrap; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            text-overflow: ellipsis; 
            max-width: 170px; 
        }

        .nav-item.active .nav-title { 
            font-weight: 900; 
            color: var(--br-green); 
        }

        .nav-badge { 
            font-family: 'Nunito', sans-serif; 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--br-muted); 
        }

        .nav-item.active .nav-badge { 
            color: var(--br-green); 
            opacity: 1; 
        }

        /* ----------------------------------------------------------------------
           [4-8. WORKSPACE STAGE & TOP BAR CONTROLS]
        ---------------------------------------------------------------------- */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            
            min-width: 0px; 
            height: 100%; 
            
            position: relative; 
            
            overflow-x: hidden; 
            overflow-y: hidden; 
            
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: var(--topbar-height); 
            
            padding-top: 0px;
            padding-right: 45px;
            padding-bottom: 0px;
            padding-left: 45px;
            
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            
            background-color: #FFFFFF; 
            z-index: 10; 
        }

        .top-bar-left { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }

        .mobile-menu-btn { 
            display: none; 
            font-size: 28px; 
            
            padding-top: 10px;

            border-bottom-right-radius: 20px; 
            border-bottom-left-radius: 20px; 
            
            box-shadow: var(--shadow-premium); 
            background-color: #FFFFFF;

            overflow-x: hidden; 
            overflow-y: hidden;
        }

            top: 0px;
            left: 0px;

            height: 100%;

            pointer-events: none;
            
            z-index: 10000; 
            mix-blend-mode: multiply;
        }

            opacity: 0; 
            transform: scale(0.95) translateY(20px); 
        }

        /* ----------------------------------------------------------------------
           [4-15. CSS KEYFRAMES ANIMATIONS]
        ---------------------------------------------------------------------- */
        @keyframes popIn { 
            from { 
                opacity: 0; 
                transform: scale(0.92) translateY(15px); 
            } 
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0px); 
            } 
        }
        
        @keyframes blink { 
            0% { 
                opacity: 1; 
            }
            50% { 
                opacity: 0.3; 
            } 
            100% { 
                opacity: 1; 
            }
        }
        
        @keyframes spin {
            0% { 
                transform: rotate(0deg); 
            }
            100% { 
                transform: rotate(360deg); 
            }
        }

        const CursorEngine = {
            dot: null,
            ring: null,
            posX: 0,
            posY: 0,
            mouseX: 0,
            mouseY: 0,
            initialized: false,

            init() {
                if (window.matchMedia("(pointer: coarse)").matches) {
                    return;
                }

                this.dot = document.getElementById('cursor-dot');
                this.ring = document.getElementById('cursor-ring');

                if (!this.dot) {
                    return;
                }
                
                if (!this.ring) {
                    return;
                }

                this.initialized = true;

                document.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;

                    this.dot.style.left = `${this.mouseX}px`;
                    this.dot.style.top = `${this.mouseY}px`;

                    const isDrawingSurface = Boolean(e.target.closest('.stage-wrapper, .drawing-board, #draw-layer'));

                    if (isDrawingSurface) {
                        this.dot.classList.add('hidden');
                        this.ring.classList.add('hidden');
                    } else {
                        this.dot.classList.remove('hidden');
                        this.ring.classList.remove('hidden');
                    }
                });

                document.addEventListener('mouseover', (e) => {
                    if (e.target.closest('.stage-wrapper, .drawing-board, #draw-layer')) {
                        return;
                    }

                    if (e.target.closest('.interactive-hover, a, button, input[type="range"]')) {
                        this.dot.classList.add('hovered');
                        this.ring.classList.add('hovered');
                    }
                });

                document.addEventListener('mouseout', (e) => {
                    if (e.target.closest('.interactive-hover, a, button, input[type="range"]')) {
                        this.dot.classList.remove('hovered');
                        this.ring.classList.remove('hovered');
                    }
                });

                this.render();
            },

            render() {
                if (!this.initialized) {
                    return;
                }

                this.posX = this.posX + (this.mouseX - this.posX) * 0.18;
                this.posY = this.posY + (this.mouseY - this.posY) * 0.18;

                this.ring.style.left = `${this.posX}px`;
                this.ring.style.top = `${this.posY}px`;

                    this.render();
                });
            }

                if (data) {
                    const keys = Object.keys(data);
                    const numKeys = keys.map(Number);
                    
                    return numKeys.sort((a, b) => {
                        return a - b;
                    });
                } else {
                    return [];
                }
            },
            
            first(unitId) {
                const pageArray = this.pages(unitId);
                
                if (pageArray.length > 0) {
                    return pageArray[0];
                } else {
                    return 1;
                }
            },
            
            last(unitId) {
                const pageArray = this.pages(unitId);
                
                if (pageArray.length > 0) {
                    return pageArray[pageArray.length - 1];
                } else {
                    return 1;
                }
            },
            
            clamp(unitId, page) {
                const pageArray = this.pages(unitId);
                
                if (pageArray.includes(page)) {
                    return page;
                } else {
                    if (pageArray.length > 0) {
                        return pageArray[0];
                    } else {
                        return 1;
                    }
                }
            },
            
            next(unitId, page, dir) {
                const pageArray = this.pages(unitId);
                let idx = pageArray.indexOf(page);
                let safeIdx = 0;
                
                if (idx === -1) {
                    safeIdx = 0;
                } else {
                    safeIdx = idx;
                }
                
                let calcIdx = Math.min(Math.max(safeIdx + dir, 0), pageArray.length - 1);
                
                if (pageArray[calcIdx]) {
                    return pageArray[calcIdx];
                } else {
                    return page;
                }
            },

            weekIndex(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                
                if (idx === -1) {
                    return 1;
                } else {
                    return Math.floor(idx / 4) + 1;
                }
            },

            isWeekEnd(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                
                if (idx !== -1) {
                    if ((idx + 1) % 4 === 0) {
                        return true;
                    } else if (idx === pages.length - 1) {
                        return true;
                    } else {
                        return false;
                    }
                } else {
                    return false;
                }
            }
        };

        if (!PAGE_INTELLIGENCE[STATE.unitId]) {
            Logger.warn(`Invalid Unit ID constraint detected: ${STATE.unitId}. Forcing fallback to A-1.`);
            STATE.unitId = "A-1";

        const rawPageParam = new URLSearchParams(window.location.search).get('page');
        if (rawPageParam) {
            STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, Number(rawPageParam));
        } else {
            STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, CurriculumEngine.first(STATE.unitId));

        const SyncIndicatorEngine = {
            container: null,

            init() {
                this.container = document.getElementById('sync-indicator');
                this.icon = document.getElementById('sync-icon');
                this.text = document.getElementById('sync-text');

            resetInlineStyle() {

                this.container.style.color = "";
                this.container.style.backgroundColor = "";
                this.container.style.borderColor = "";

            setSaving() {

            setSaved() {

        /**
         * [5-6. SMART IMAGE LOADER ENGINE]
         * (P0 Fix: 교재 이미지가 없을 때도 캔버스가 작동하도록 Fallback 레이싱 알고리즘 최적화)
         */
        const SmartImageLoader = {
            requestToken: 0,

            async findValidWorksheet(unitId, pageNum) {
                this.requestToken = this.requestToken + 1;
                const token = this.requestToken; 
                
                const imgElement = document.getElementById('worksheet-img');
                const boardElement = document.getElementById('drawing-board');
                
                const seriesChar = unitId.charAt(0);
                const t = Date.now(); 

                /* 깃허브 실제 디렉토리 구조 타겟팅 + 보안 락 해제된 경로 */
                const basePaths = [
                    `${seriesChar}/${unitId}/${unitId}-${pageNum}`,
                    `${unitId}/${unitId}-${pageNum}`,
                    `${seriesChar}/${unitId}/${pageNum}`,
                    `${unitId}/${pageNum}`
                ];

                const possiblePaths = [];
                
                basePaths.forEach((base) => {
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.png`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpg`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpeg`);
                });

                const tryLoad = (index) => {
                    if (token !== this.requestToken) {
                        return;
                    }

                    if (index >= possiblePaths.length) {
                        Logger.error(`Worksheet missing. 404 on ${unitId} Page ${pageNum}`);
                        
                        if (imgElement) {
                            imgElement.style.opacity = '1';
                        }
                        if (boardElement) {
                            boardElement.classList.add('error-state');
                        }
                        
                        setTimeout(() => {
                            if (token !== this.requestToken) {
                                return;
                            }
                            CanvasEngine.resizeCanvas();
                            StorageEngine.loadCanvasLocal();
                        }, 50);
                        
                        return;
                    }

                    const testUrl = `${possiblePaths[index]}?t=${t}`;
                    const tempImg = new Image();

                    tempImg.onload = () => {
                        if (token !== this.requestToken) {
                            return;
                        }
                        
                        Logger.log("Mounted:", testUrl);
                        
                        if (boardElement) {
                            boardElement.classList.remove('error-state');
                        }
                        
                        if (imgElement) {
                            /* 이미지 로드 완료 시점 감지 및 DOM Reflow 대기 */
                            imgElement.onload = () => {
                                if (token !== this.requestToken) {
                                    return;
                                }
                                
                                imgElement.style.opacity = '1';
                                
                                setTimeout(() => {
                                    if (token !== this.requestToken) {
                                        return;
                                    }
                                    CanvasEngine.resizeCanvas();
                                    StorageEngine.loadCanvasLocal();
                                }, 50);
                            };
                            
                            imgElement.src = testUrl;
                        } else {
                            setTimeout(() => {
                                if (token !== this.requestToken) {
                                    return;
                                }
                                CanvasEngine.resizeCanvas();
                                StorageEngine.loadCanvasLocal();
                            }, 50);
                        }
                    };

                    tempImg.onerror = () => {
                        tryLoad(index + 1);
                    };
                    
                    tempImg.src = testUrl;
                };

                tryLoad(0);
            }
        };

        const StorageEngine = {
            cloudSaveTimer: null,

            load() {
                if (!STATE.uid) {
                    return;
                }
                
                try {
                    const rawStorage = localStorage.getItem(`br_data_${STATE.uid}_${STATE.unitId}`);
                    let s = {};
                    
                    if (rawStorage) {
                        s = JSON.parse(rawStorage);
                    }
                    
                    if (s.name) {
                        STATE.studentName = s.name; 
                    }
                    
                    if (s.badges) {
                        STATE.badges = s.badges;
                    }
                    
                    const urlPage = Number(new URLSearchParams(window.location.search).get('page'));
                    
                    if (urlPage) {
                        if (CurriculumEngine.pages(STATE.unitId).includes(urlPage)) {
                            STATE.currentPage = urlPage;
                        }
                    } else {
                        if (s.page) {
                            STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, s.page);
                        }
                    }
                } catch (e) { 
                    Logger.warn("Metadata local cache failure", e); 
                }
            },
            
            async save() {
                if (!STATE.uid) {
                    return;
                }
                
                try {
                    const data = { 
                        name: STATE.studentName, 
                        page: STATE.currentPage, 
                        badges: STATE.badges || [] 
                    };
                    
                    localStorage.setItem(`br_data_${STATE.uid}_${STATE.unitId}`, JSON.stringify(data));
                    
                    await db.collection("students").doc(STATE.uid).set({ 
                        name: data.name, 
                        page: data.page, 
                        badges: data.badges, 
                        email: STATE.studentEmail, 
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { 
                        merge: true 
                    });
                } catch (error) { 
                    Logger.error("Core transaction metadata sync failed.", error); 
                }
            },
            
            createCanvasSnapshot(compressForDatabase = false) {
                if (!CanvasEngine.cvs) {
                    return null;
                }
                
                if (!STATE.uid) {
                    return null;
                }
                
                let canvasData = null;
                
                if (compressForDatabase) {
                    canvasData = CanvasEngine.captureWorksheetWithDrawing(true, 1024); 
                    
                    if (canvasData) {
                        if (canvasData.length > 900000) {
                            canvasData = CanvasEngine.captureWorksheetWithDrawing(true, 768);
                        }
                    }
                    
                    if (canvasData) {
                        if (canvasData.length > 900000) {
                            canvasData = CanvasEngine.captureWorksheetWithDrawing(true, 640);
                        }
                    }
                } else {
                    canvasData = CanvasEngine.cvs.toDataURL('image/webp', 0.6); 
                }
                
                const key = `br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`;
                
                if (!compressForDatabase) {
                    try { 
                        localStorage.setItem(key, canvasData); 
                    } catch(e) {
                        
                    }
                }
                
                const returnObject = { 
                    uid: STATE.uid, 
                    studentEmail: STATE.studentEmail, 
                    unitId: STATE.unitId, 
                    page: STATE.currentPage, 
                    transcript: STATE.lastTranscript, 
                    canvasData: canvasData 
                };
                
                return returnObject;
            },
            
            saveCanvasLocal() { 
                return this.createCanvasSnapshot(false); 
            },
            
            scheduleCloudSave() {
                SyncIndicatorEngine.setSaving();
                const snapshot = this.createCanvasSnapshot(true);
                
                if (this.cloudSaveTimer) {
                    clearTimeout(this.cloudSaveTimer);
                }
                
                this.cloudSaveTimer = setTimeout(() => { 
                    this.executeCloudSave(snapshot); 
                }, 1500); 
            },
            
            async executeCloudSave(snapshot = null) {
                let payload = null;
                
                if (snapshot) {
                    payload = snapshot;
                } else {
                    payload = this.createCanvasSnapshot(true);
                }
                
                if (!payload) {
                    return;
                }
                
                try {
                    const firestoreDocId = `${payload.uid}_${payload.unitId}_P${payload.page}`;
                    
                    await db.collection("student_drawings").doc(firestoreDocId).set({ 
                        uid: payload.uid, 
                        studentID: payload.studentEmail, 
                        unitId: payload.unitId, 
                        page: payload.page, 
                        imageUrl: payload.canvasData, 
                        transcript: payload.transcript, 
                        timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { 
                        merge: true 
                    });
                    
                    SyncIndicatorEngine.setSaved();
                } catch (error) { 
                    Logger.warn("Cloud infrastructure save fault.", error); 
                    SyncIndicatorEngine.setError(); 
                }
            },
            
            loadCanvasLocal() {
                try {
                    const cacheKey = `br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`;
                    const localData = localStorage.getItem(cacheKey);
                    
                    if (localData) {
                        const img = new Image();
                        img.onload = () => { 
                            CanvasEngine.ctx.drawImage(
                                img, 
                                0, 
                                0, 
                                CanvasEngine.cvs.width / CanvasEngine.dpr, 
                                CanvasEngine.cvs.height / CanvasEngine.dpr
                            ); 
                            CanvasEngine.saveHistory(); 
                        };
                        img.src = localData;
                    } else { 
                        CanvasEngine.saveHistory(); 
                    }
                } catch (error) { 
                    CanvasEngine.saveHistory(); 
                }
            }
        };

        /**
         * [5-13. ADVANCED INTERACTIVE CANVAS BOARD ENGINE]
         */
        const CanvasEngine = {
            isDrawing: false, 
            hasMoved: false, 
            isErasing: false, 
            lastColor: "#363431", 
            dpr: window.devicePixelRatio || 1, 
            historyStack: [], 
            historyIndex: -1,
            
            init() {
                this.cvs = document.getElementById('draw-layer'); 
                if (!this.cvs) {
                    return;
                }
                
                this.ctx = this.cvs.getContext('2d'); 
                this.board = document.getElementById('drawing-board');
                
                this.setupUI(); 
                this.setupCanvas(); 
                this.bind(); 
                this.updateBrushPreview();
                
                const slider = document.getElementById('brush-size');
                
                if (slider) {
                    slider.addEventListener('input', () => {
                        this.updateBrushPreview();
                    });
                }
                
                if (window.ResizeObserver) {
                    if (this.board) { 
                        const observer = new ResizeObserver(() => {
                            this.resizeCanvas();
                        });
                        observer.observe(this.board); 
                    }
                }
            },
            
            updateBrushPreview() {
                const slider = document.getElementById('brush-size'); 
                const dot = document.getElementById('brush-preview-dot');
                
                if (!slider) {
                    return;
                }
                
                if (!dot) {
                    return;
                }
                
                const val = parseInt(slider.value); 
                dot.style.width = `${val}px`; 
                dot.style.height = `${val}px`;
                
                if (this.isErasing) {
                    dot.style.backgroundColor = "var(--br-muted)";
                } else {
                    dot.style.backgroundColor = this.lastColor;
                }
            },
            
            isCanvasBlank() {
                if (!this.cvs) {
                    return true;
                }
                
                if (!this.ctx) {
                    return true;
                }
                
                try {
                    const probe = document.createElement('canvas'); 
                    probe.width = 64; 
                    probe.height = 64;
                    
                    const pctx = probe.getContext('2d'); 
                    pctx.drawImage(this.cvs, 0, 0, 64, 64);
                    
                    const pixels = pctx.getImageData(0, 0, 64, 64).data;
                    
                    for (let i = 3; i < pixels.length; i = i + 4) { 
                        if (pixels[i] !== 0) {
                            return false; 
                        }
                    }
                    
                    return true;
                } catch(e) { 
                    return true; 
                }
            },
            
            captureWorksheetWithDrawing(compressForDatabase = false, maxWidth = 1024) {
                const worksheet = document.getElementById('worksheet-img'); 
                const draw = this.cvs;
                
                if (!worksheet) {
                    return null;
                }
                
                if (!draw) {
                    return null;
                }
                
                /* [P0 Fix] Tainted Canvas 보안 예외 상황을 완벽 방어하는 트라이-캐치 병합기 */
                const merged = document.createElement('canvas');
                let scale = 1;
                
                if (compressForDatabase) {
                    scale = Math.min(maxWidth / draw.width, 1);
                } else {
                    scale = 1;
                }
                
                merged.width = Math.floor(draw.width * scale); 
                merged.height = Math.floor(draw.height * scale);
                
                const ctx = merged.getContext('2d'); 
                ctx.fillStyle = '#FFFFFF'; 
                ctx.fillRect(0, 0, merged.width, merged.height);
                
                try {
                    if (worksheet.complete && worksheet.naturalWidth > 0) {
                        ctx.drawImage(worksheet, 0, 0, merged.width, merged.height); 
                    }
                    ctx.drawImage(draw, 0, 0, merged.width, merged.height);
                    
                    if (compressForDatabase) {
                        return merged.toDataURL('image/jpeg', 0.55);
                    } else {
                        return merged.toDataURL('image/jpeg', 0.72);
                    }
                } catch(e) { 
                    /* 브라우저가 CORS 정책을 위반했다며 캔버스를 오염시킨 경우 
                       교재 이미지를 포기하고, 아이가 그린 그림만 흰색 배경에 덧씌워 AI로 보냄 (절대 멈추지 않음) */
                    const fallback = document.createElement('canvas');
                    fallback.width = draw.width;
                    fallback.height = draw.height;
                    const fCtx = fallback.getContext('2d');
                    fCtx.fillStyle = '#FFFFFF';
                    fCtx.fillRect(0, 0, fallback.width, fallback.height);
                    fCtx.drawImage(draw, 0, 0);
                    
                    if (compressForDatabase) {
                        return fallback.toDataURL('image/jpeg', 0.55);
                    } else {
                        return fallback.toDataURL('image/jpeg', 0.72);
                    }
                }
            },
            
            setupCanvas() {
                if (!this.board) {
                    return;
                }
                if (!this.cvs) {
                    return;
                }
                
                const rect = this.board.getBoundingClientRect(); 
                if (rect.width === 0) {
                    return;
                }
                
                this.cvs.style.width = rect.width + "px"; 
                this.cvs.style.height = rect.height + "px";
                
                this.cvs.width = rect.width * this.dpr; 
                this.cvs.height = rect.height * this.dpr;
                
                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); 
                this.ctx.lineCap = 'round'; 
                this.ctx.lineJoin = 'round';
            },
            
            resizeCanvas() {
                if (!this.cvs) {
                    return;
                }
                if (!this.ctx) {
                    return;
                }
                if (!this.board) {
                    return;
                }
                
                const rect = this.board.getBoundingClientRect(); 
                if (rect.width === 0) {
                    return;
                }
                if (rect.height === 0) {
                    return;
                }
                
                const temp = document.createElement('canvas'); 
                temp.width = this.cvs.width; 
                temp.height = this.cvs.height;
                
                if (this.cvs.width > 0) {
                    if (this.cvs.height > 0) {
                        temp.getContext('2d').drawImage(this.cvs, 0, 0);
                    }
                }
                
                this.setupCanvas();
                
                if (temp.width > 0) {
                    if (temp.height > 0) {
                        this.ctx.drawImage(
                            temp, 
                            0, 
                            0, 
                            temp.width, 
                            temp.height, 
                            0, 
                            0, 
                            rect.width, 
                            rect.height
                        );
                    }
                }
            },
            
            bind() {
                const getP = (e) => { 
                    const r = this.cvs.getBoundingClientRect(); 
                    let cx = 0;
                    let cy = 0;
                    
                    if (e.clientX) {
                        cx = e.clientX;
                    } else {
                        if (e.touches) {
                            if (e.touches[0]) {
                                cx = e.touches[0].clientX;
                            }
                        }
                    }
                    
                    if (e.clientY) {
                        cy = e.clientY;
                    } else {
                        if (e.touches) {
                            if (e.touches[0]) {
                                cy = e.touches[0].clientY;
                            }
                        }
                    }
                    
                    const returnObj = {
                        x: cx - r.left,
                        y: cy - r.top
                    };
                    
                    return returnObj; 
                };
                
                const start = (e) => { 
                    e.preventDefault(); 
                    this.isDrawing = true; 
                    this.hasMoved = false; 
                    const p = getP(e); 
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y); 
                };
                
                const move = (e) => {
                    if (!this.isDrawing) {
                        return;
                    }
                    
                    e.preventDefault(); 
                    this.hasMoved = true; 
                    const p = getP(e);
                    
                    if (this.isErasing) {
                        this.ctx.globalCompositeOperation = "destination-out";
                    } else {
                        this.ctx.globalCompositeOperation = "source-over";
                    }
                    
                    const sliderVal = document.getElementById('brush-size').value; 
                    
                    if (this.isErasing) {
                        this.ctx.lineWidth = sliderVal * 3;
                    } else {
                        this.ctx.lineWidth = sliderVal;
                    }
                    
                    if (this.isErasing) {
                        this.ctx.strokeStyle = "#FFFFFF";
                    } else {
                        this.ctx.strokeStyle = this.lastColor;
                    }
                    
                    if (STATE.brushType === 'rainbow') {
                        if (!this.isErasing) { 
                            const timeVal = Date.now() / 10;
                            const hueVal = timeVal % 360;
                            this.ctx.strokeStyle = `hsl(${hueVal}, 100%, 50%)`; 
                        } 
                    } else {
                        if (STATE.brushType === 'neon') {
                            if (!this.isErasing) { 
                                this.ctx.shadowBlur = parseInt(sliderVal) + 10; 
                                this.ctx.shadowColor = this.lastColor; 
                            }
                        } else { 
                            this.ctx.shadowBlur = 0; 
                        }
                    }
                    
                    this.ctx.lineTo(p.x, p.y); 
                    this.ctx.stroke(); 
                    
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y);
                };
                
                const end = () => { 
                    this.isDrawing = false; 
                    this.ctx.shadowBlur = 0; 
                    if (this.hasMoved) { 
                        this.saveHistory(); 
                        StorageEngine.saveCanvasLocal(); 
                        StorageEngine.scheduleCloudSave(); 
                    } 
                };
                
                this.cvs.addEventListener('pointerdown', start); 
                this.cvs.addEventListener('pointermove', move); 
                this.cvs.addEventListener('pointerup', end); 
                this.cvs.addEventListener('pointerleave', end);
            },
            
            saveHistory() { 
                this.historyIndex = this.historyIndex + 1; 
                this.historyStack.length = this.historyIndex; 
                this.historyStack.push(this.cvs.toDataURL()); 
                
                if (this.historyStack.length > 20) { 
                    this.historyStack.shift(); 
                    this.historyIndex = this.historyIndex - 1; 
                } 
            },
            
            undo() { 
                if (this.historyIndex > 0) { 
                    this.historyIndex = this.historyIndex - 1; 
                    this.restore(); 
                    StorageEngine.saveCanvasLocal(); 
                    StorageEngine.scheduleCloudSave(); 
                } 
            },
            
            restore() { 
                if (!this.ctx) {
                    return;
                }
                if (!this.cvs) {
                    return;
                }
                
                const img = new Image(); 
                img.onload = () => { 
                    this.ctx.save(); 
                    
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                    this.ctx.drawImage(
                        img, 
                        0, 
                        0, 
                        this.cvs.width, 
                        this.cvs.height
                    ); 
                    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                    
                    this.ctx.restore(); 
                }; 
                img.src = this.historyStack[this.historyIndex]; 
            },
            
            setBrush(t) { 
                STATE.brushType = t; 
                
                const magicBtns = document.querySelectorAll('.btn-magic');
                magicBtns.forEach((el) => {
                    el.classList.remove('active');
                });
                
                const activeBtn = document.getElementById(`btn-brush-${t}`); 
                if (activeBtn) {
                    activeBtn.classList.add('active'); 
                }
                
                if (this.isErasing) {
                    this.toggleEraser(); 
                }
            },
            
            toggleEraser() { 
                if (this.isErasing) {
                    this.isErasing = false;
                } else {
                    this.isErasing = true;
                }
                
                const btn = document.getElementById('btn-eraser'); 
                if (btn) {
                    btn.classList.toggle('active'); 
                }
                
                this.updateBrushPreview(); 
            },
            
            setColor(color) { 
                this.lastColor = color; 
                const preview = document.getElementById('btn-color'); 
                if (preview) {
                    preview.style.background = color; 
                }
                
                if (this.isErasing) {
                    this.toggleEraser(); 
                }
                
                this.updateBrushPreview(); 
            },
            
            setupUI() { 
                const preview = document.getElementById('btn-color'); 
                if (preview) {
                    preview.style.background = this.lastColor; 
                }
            },
            
            hardReset() { 
                if (!this.ctx) {
                    return;
                }
                if (!this.cvs) {
                    return;
                }
                
                try { 
                    this.ctx.save(); 
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                    this.ctx.restore(); 
                    this.historyStack = []; 
                    this.historyIndex = -1; 
                } catch(e) { 
                    Logger.error("Canvas clear error", e); 
                } 
            },
            
            promptHardReset() { 
                CustomModalEngine.confirm(
                    "Clear Canvas", 
                    "Are you absolutely sure you want to wipe this clean?", 
                    () => { 
                        this.hardReset(); 
                        this.saveHistory(); 
                        StorageEngine.saveCanvasLocal(); 
                        StorageEngine.scheduleCloudSave(); 
                    }
                ); 
            }
        };

        const RGBRingEngine = {
            init() {
                const c = document.getElementById('color-wheel'); 
                if (!c) {
                    return; 
                }
                
                const ctx = c.getContext('2d', { 
                    willReadFrequently: true 
                });
                
                for (let a = 0; a < 360; a = a + 1) { 
                    ctx.beginPath(); 
                    ctx.moveTo(75, 75); 
                    
                    const startAngle = a * Math.PI / 180;
                    const endAngle = (a + 2) * Math.PI / 180;
                    
                    ctx.arc(75, 75, 75, startAngle, endAngle); 
                    ctx.fillStyle = `hsl(${a}, 100%, 50%)`; 
                    ctx.fill(); 
                }
                
                c.onclick = (e) => { 
                    const rect = c.getBoundingClientRect(); 
                    
                    const pX = e.clientX - rect.left;
                    const pY = e.clientY - rect.top;
                    
                    const imgData = ctx.getImageData(pX, pY, 1, 1);
                    const data = imgData.data; 
                    
                    const rgbStr = `rgb(${data[0]}, ${data[1]}, ${data[2]})`;
                    CanvasEngine.setColor(rgbStr); 
                    
                    this.toggle(); 
                };
            },
            
            toggle() { 
                const modal = document.getElementById('rgb-modal');
                if (modal) {
                    modal.classList.toggle('active'); 
                }
            }
        };

        const AITutor = {
            isBusy: false,
            
            async callBackendTutor(promptText, base64Img = null) {
                try {
                    const user = auth.currentUser; 
                    
                    if (!user) {
                        throw new Error("Unauthorized");
                    }
                    
                    const token = await user.getIdToken();
                    
                    let imageVal = null;
                    if (base64Img) {
                        const splitArr = base64Img.split(',');
                        imageVal = splitArr[1];
                    }
                    
                    const reqObj = {
                        prompt: promptText, 
                        image: imageVal, 
                        unitId: STATE.unitId, 
                        page: STATE.currentPage
                    };
                    
                    const response = await fetch(CONFIG.API_TUTOR_ENDPOINT, {
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify(reqObj)
                    });
                    
                    const data = await response.json(); 
                    return data.reply;
                } catch (e) { 
                    return "AI 선생님 연결에 실패했어요."; 
                }
            },
            
            async submit() {
                if (STATE.isRecording) { 
                    AudioEngine.toggle(); 
                    return; 
                } 
                
                if (this.isBusy) {
                    return; 
                }
                
                this.isBusy = true;
                
                const requestPage = STATE.currentPage;
                const requestUnit = STATE.unitId;
                
                const content = document.getElementById('ai-content'); 
                const panel = document.getElementById('ai-panel');
                
                if (panel) {
                    panel.classList.add('open');
                }
                
                if (content) {
                    content.innerHTML = `
                        <div class="ai-loading-container">
                            <i class="fa-solid fa-spinner fa-spin ai-loading-icon"></i>
                            <p>Teacher is reviewing your sketch...</p>
                        </div>
                    `;
                }
                
                try {
                    StorageEngine.saveCanvasLocal(); 
                    StorageEngine.executeCloudSave();
                    
                    const canvasImg = CanvasEngine.captureWorksheetWithDrawing(true);
                    let unitData = { 
                        goal: "Free Exploration", 
                        question: "Tell me more about it." 
                    };
                    
                    if (PAGE_INTELLIGENCE[STATE.unitId]) {
                        if (PAGE_INTELLIGENCE[STATE.unitId][STATE.currentPage]) {
                            unitData = PAGE_INTELLIGENCE[STATE.unitId][STATE.currentPage];
                        }
                    }
                    
                    let saidText = "Look at my art!";
                    if (STATE.lastTranscript) {
                        saidText = STATE.lastTranscript;
                    }
                    
                    const prompt = `You are Teacher Bridge. Name: ${STATE.studentName}, Goal: ${unitData.goal}, Question: ${unitData.question}, Student Said: "${saidText}". Praise explicitly, max 3 short sentences, mix easy Korean contextually. Plain text only.`;
                    
                    const reply = await this.callBackendTutor(prompt, canvasImg);
                    
                    if (STATE.currentPage !== requestPage) {
                        return;
                    }
                    
                    if (STATE.unitId !== requestUnit) {
                        return;
                    }
                    
                    const aiFailed = reply.includes("AI 선생님 연결에 실패");
                    
                    if (!aiFailed) {
                        const isBlank = CanvasEngine.isCanvasBlank();
                        if (!isBlank) {
                            BadgeEngine.add("🎨 Colorful Artist");
                        }
                        
                        if (STATE.sttConfidence >= 80) {
                            if (STATE.lastTranscript.length > 0) {
                                BadgeEngine.add("🗣️ Great Speaker");
                            }
                        }
                    }
                    
                    if (content) {
                        const htmlStr = `
                            <div class="analytics-card">
                                <div class="analytics-title">Mission: ${unitData.goal}</div>
                                <div class="stat-row">
                                    <div class="stat-label">
                                        <span>Voice Confidence</span>
                                        <span>${STATE.sttConfidence}%</span>
                                    </div>
                                    <div class="bar-bg">
                                        <div class="bar-fill" style="width:${STATE.sttConfidence}%; background-color:var(--br-blue)"></div>
                                    </div>
                                </div>
                            </div>
                        `;
                        content.innerHTML = htmlStr;
                        
                        const bbl = document.createElement('div'); 
                        bbl.className = 'chat-bubble ai mt-4'; 
                        bbl.textContent = reply; 
                        content.appendChild(bbl);
                    }
                    
                    const footer = document.getElementById('chat-footer');
                    if (footer) {
                        footer.style.display = "block"; 
                    }
                    
                    this.speak(reply);
                } finally { 
                    this.isBusy = false; 
                }
            },
            
            async processReply() {
                if (!STATE.lastTranscript) {
                    return;
                }
                
                if (this.isBusy) {
                    return; 
                }
                
                this.isBusy = true;
                
                const requestPage = STATE.currentPage;
                const requestUnit = STATE.unitId;
                const content = document.getElementById('ai-content');
                
                if (content) {
                    const uBbl = document.createElement('div'); 
                    uBbl.className = "chat-bubble user mt-4"; 
                    uBbl.textContent = STATE.lastTranscript; 
                    content.appendChild(uBbl);
                    
                    const aBbl = document.createElement('div'); 
                    aBbl.className = "chat-bubble ai mt-4"; 
                    aBbl.innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="color:var(--br-green)"></i> 생각 중...`; 
                    content.appendChild(aBbl); 
                    
                    content.scrollTop = content.scrollHeight;
                    
                    try {
                        const reply = await this.callBackendTutor(`Respond to student's remark: "${STATE.lastTranscript}". 1-2 short sentences, friendly, plain text.`);
                        
                        if (STATE.currentPage !== requestPage) {
                            return;
                        }
                        
                        if (STATE.unitId !== requestUnit) {
                            return;
                        }
                        
                        aBbl.innerHTML = ''; 
                        
                        const b = document.createElement('b'); 
                        b.style.color = 'var(--br-green)'; 
                        b.textContent = reply; 
                        aBbl.appendChild(b);
                        
                        content.scrollTop = content.scrollHeight; 
                        
                        this.speak(reply);
                    } finally { 
                        this.isBusy = false; 
                    }
                } else {
                    this.isBusy = false;
                }
            },
            
            speak(text) { 
                if (window.speechSynthesis) { 
                    window.speechSynthesis.cancel(); 
                    
                    const u = new SpeechSynthesisUtterance(text); 
                    u.lang = 'en-US'; 
                    u.rate = 0.95; 
                    
                    window.speechSynthesis.speak(u); 
                } 
            },
            
            close() { 
                const panel = document.getElementById('ai-panel');
                if (panel) {
                    panel.classList.remove('open'); 
                }
                
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel(); 
                }
            }
        };

                    displayNameEl.innerText = STATE.studentName;
                }
                
                const avatarEl = document.getElementById('avatar-char');
                if (avatarEl) {
                    avatarEl.innerText = STATE.studentName.charAt(0);
                }
                
                SystemBoot(); 
            }
        });
    </script>
</body>
</html>
