<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FCFBF9">
    
    <title>Bridge Academy | Premium AI Lab V100.56</title>

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script> 
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ======================================================================
           [1] 글로벌 CSS 변수 및 디자인 토큰
           ====================================================================== */
        :root {
            /* 브릿지 아카데미 메인 컬러 */
            --br-green: #91D3B4; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            
            /* 배경 및 레이아웃 컬러 */
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-ai-soft: #F8FAFF;
            
            /* 텍스트 및 경계선 컬러 */
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            
            /* 상태 표시 컬러 */
            --br-error: #E74C3C; 
            --br-error-light: #FEF2F2;
            --br-error-border: #FCA5A5;
            --br-success: #2ECC71;
            
            /* 규격 변수 */
            --sidebar-width: 320px;
            --topbar-height: 85px;
            --dock-height: 110px;
            
            /* 모바일 세이프 에어리어 */
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            /* 그림자 토큰 */
            --shadow-float: 0px 25px 70px rgba(0, 0, 0, 0.07);
            --shadow-button: 0px 10px 20px rgba(0, 0, 0, 0.05);
            --shadow-premium: 0px 30px 60px rgba(54, 52, 49, 0.15);
        }

        /* ======================================================================
           [2] 초기화 (CSS Reset)
           ====================================================================== */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            cursor: none !important; /* 커스텀 커서를 위한 기본 커서 숨김 */
        }

        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Pretendard', sans-serif; 
            pointer-events: auto !important; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        a, button, input, select, textarea { 
            cursor: none !important; 
        }

        button { 
            border: none; 
            background-color: transparent; 
            font-family: inherit; 
            outline: none; 
        }

        ul, ol, li { 
            list-style-type: none; 
        }

        @supports not (height: 100dvh) {
            html, body, .app-container { 
                height: 100vh; 
            }
        }

        /* ======================================================================
           [3] 제로 레이턴시 커스텀 커서 (아동용 디자인)
           ====================================================================== */
        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 4px;
            height: 4px;
            background-color: rgba(54, 52, 49, 0.75);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.16s ease, height 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
        }

        .cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 22px;
            height: 22px;
            border: 1px solid rgba(54, 52, 49, 0.28);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.22s ease-out, height 0.22s ease-out, opacity 0.22s ease, border-color 0.22s ease, background-color 0.22s ease;
        }

        .cursor-dot.hovered {
            width: 3px;
            height: 3px;
            background-color: rgba(145, 211, 180, 0.8);
        }

        .cursor-ring.hovered {
            width: 28px;
            height: 28px;
            background-color: rgba(145, 211, 180, 0.05);
            border-color: rgba(145, 211, 180, 0.5);
        }

        .cursor-dot.hidden, .cursor-ring.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* 캔버스 드로잉 영역에서는 십자선 커서 표출 */
        .stage-wrapper, .drawing-board, #draw-layer {
            cursor: crosshair !important;
        }

        /* 모바일 터치 환경에서는 커스텀 커서 완전 비활성화 */
        @media (pointer: coarse) {
            .cursor-dot, .cursor-ring { 
                display: none !important; 
            }
            *, html, body, a, button, input, textarea, select, .stage-wrapper, .drawing-board, #draw-layer { 
                cursor: auto !important; 
            }
        }

        /* ======================================================================
           [4] 메인 레이아웃 및 사이드바 (App Container & Sidebar)
           ====================================================================== */
        .app-container { 
            display: flex; 
            flex-direction: row;
            width: 100vw; 
            height: 100dvh; 
            position: relative; 
        }

        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            background-color: var(--br-paper); 
            border-right: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 2000; 
            flex-shrink: 0; 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
            box-shadow: 5px 0px 15px rgba(0, 0, 0, 0.02);
        }

        .sidebar-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.18);
            z-index: 1500; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(3px); 
        }

        .sidebar-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-header { 
            padding: 35px 30px;
            text-align: center; 
            border-bottom: 1px solid var(--br-border); 
            transition: background-color 0.4s ease;
        }
        
        .sidebar-header:hover {
            background-color: var(--br-bg);
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
        }

        /* 학생 프로필 모듈 */
        .student-profile { 
            padding: 25px 30px;
            border-bottom: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #FAFAFA; 
            transition: background-color 0.3s ease; 
        }

        .student-profile.registered { 
            background-color: var(--br-ai-soft); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            background-color: var(--br-border); 
            color: #FFFFFF; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 22px; 
            font-family: 'Nunito', sans-serif; 
            transition: all 0.4s ease;
            box-shadow: inset 0px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .student-profile.registered .profile-avatar { 
            background-color: var(--br-gold); 
            box-shadow: 0px 8px 20px rgba(203, 174, 117, 0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .profile-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            text-transform: uppercase; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .profile-role { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--br-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }

        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            min-height: 24px;
        }

        .badge { 
            font-size: 11px; 
            padding: 4px 10px;
            border-radius: 12px; 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.02); 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* 커리큘럼 네비게이션 리스트 */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px;
            scroll-behavior: smooth; 
        }

        .nav-list::-webkit-scrollbar { 
            width: 5px; 
        }

        .nav-list::-webkit-scrollbar-track { 
            background-color: transparent; 
        }

        .nav-list::-webkit-scrollbar-thumb { 
            background-color: #E8E6E1; 
            border-radius: 10px; 
        }

        .nav-list::-webkit-scrollbar-thumb:hover { 
            background-color: #D5D3CE; 
        }

        .nav-item { 
            padding: 18px 20px;
            margin-bottom: 10px; 
            border-radius: 15px; 
            background-color: #FAFAFA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            border: 1px solid transparent; 
        }

        .nav-item:hover { 
            background-color: #FFFFFF; 
            border-color: var(--br-border);
            transform: translateY(-2px); 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.02); 
        }

        .nav-item.active { 
            background-color: var(--br-ai-soft); 
            border-left: 6px solid var(--br-green); 
            border-color: transparent;
            box-shadow: 0px 10px 25px rgba(145, 211, 180, 0.12); 
        }

        .nav-title { 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 170px; 
        }

        .nav-item.active .nav-title { 
            font-weight: 900; 
            color: var(--br-green); 
        }

        .nav-badge { 
            font-family: 'Nunito', sans-serif; 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--br-muted); 
        }

        .nav-item.active .nav-badge { 
            color: var(--br-green); 
            opacity: 1; 
        }

        /* ======================================================================
           [5] 메인 워크스페이스 & 상단바 (Workspace & Topbar)
           ====================================================================== */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0px; 
            height: 100%; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: var(--topbar-height); 
            padding: 0px 45px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            background-color: #FFFFFF; 
            z-index: 10; 
        }

        .top-bar-left { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }

        .mobile-menu-btn { 
            display: none; 
            font-size: 28px; 
            padding: 10px; 
            color: var(--br-charcoal); 
            z-index: 1500; 
        }

        .unit-info { 
            font-family: 'Nunito', sans-serif; 
            font-size: 13px; 
            font-weight: 900; 
            color: var(--br-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }

        .page-info { 
            font-family: 'Playfair Display', serif; 
            font-size: 34px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
            margin-top: 2px; 
        }

        .sync-indicator-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            background-color: var(--br-bg);
            border: 1px solid var(--br-border);
            font-size: 12px;
            font-weight: 700;
            color: var(--br-muted);
            transition: all 0.4s ease;
        }

        .sync-indicator-container.saving {
            color: var(--br-blue);
            background-color: #F0F4F8;
            border-color: #D9E4EC; 
        }

        .sync-indicator-container.saved {
            color: var(--br-success);
            background-color: #F0FDF4;
            border-color: #DCFCE7; 
        }

        .sync-icon.spin { 
            animation: spin 1s linear infinite; 
        }

        /* 에러 토스트 메시지 */
        .toast-error { 
            display: none; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--br-error); 
            background-color: var(--br-error-light); 
            padding: 8px 16px;
            border-radius: 50px; 
            border: 1px solid var(--br-error-border); 
            animation: popIn 0.3s ease-out; 
            z-index: 5000;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .toast-error.show { 
            display: flex; 
        }
        
        /* ======================================================================
           [6] 캔버스 드로잉 스테이지 (Canvas Drawing Board) - 레이아웃 붕괴 완벽 수정
           ====================================================================== */
        .stage-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px;
            background-color: var(--br-bg); 
            perspective: 1200px; 
            overflow: hidden; 
        }

        .drawing-board { 
            position: relative; 
            display: inline-flex; /* 콘텐츠(교재 이미지)의 크기에 맞춰 스스로 크기를 조절(Shrink-wrap)합니다. */
            border-radius: 20px; 
            box-shadow: var(--shadow-premium); 
            background-color: #FFFFFF; 
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: center; 
            pointer-events: auto !important; 
            max-width: 100%; 
            max-height: 100%; 
            /* 강제 규격을 삭제하여 이미지가 작은 경우에도 여백이 생기지 않도록 방어합니다. */
        }

        /* 도화지 질감 오버레이 */
        .drawing-board::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10000; 
            mix-blend-mode: multiply;
        }

        .drawing-board.fade-out { 
            opacity: 0; 
            transform: scale(0.95) translateY(20px); 
        }

        .drawing-board.error-state { 
            border: 2px dashed var(--br-error); 
            background-color: #FFF0F0; 
        }

        #worksheet-img { 
            display: block; 
            max-width: 100%; 
            max-height: calc(100dvh - 250px); 
            width: auto; 
            height: auto; 
            border-radius: 20px; 
            pointer-events: none !important; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
            user-select: none; 
            object-fit: contain;
            background-color: transparent;
            /* 억지스러운 min-width 삭제 완료 */
        }

        #draw-layer { 
            position: absolute; 
            top: 0px; 
            left: 0px; 
            width: 100%; 
            height: 100%; 
            z-index: 9999 !important; 
            touch-action: none; 
            border-radius: 20px; 
        }

        /* ======================================================================
           [7] 하단 독 컨트롤 패널 (Bottom Dock)
           ====================================================================== */
        .bottom-dock { 
            height: var(--dock-height); 
            background-color: rgba(255, 255, 255, 0.98); 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0px 50px var(--safe-bottom) 50px;
            z-index: 500; 
        }

        .tool-group { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background-color: #F8F9FA; 
            padding: 12px 30px;
            border-radius: 100px; 
            border: 1px solid var(--br-border); 
        }

        .color-preview { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 3px solid #FFFFFF; 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); 
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .color-preview:active { 
            transform: scale(0.85); 
        }

        .btn-magic { 
            font-size: 24px; 
            padding: 5px;
            transition: all 0.3s ease;
            filter: grayscale(100%); 
            opacity: 0.6; 
        }

        .btn-magic:active {
            transform: scale(0.8);
        }

        .btn-magic.active { 
            filter: grayscale(0%); 
            opacity: 1; 
            transform: scale(1.3); 
        }

        .brush-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0px 10px;
        }

        .brush-slider { 
            width: 90px; 
            accent-color: var(--br-green); 
            height: 6px; 
            border-radius: 10px; 
        }

        .brush-preview-dot {
            width: 6px;
            height: 6px;
            background-color: var(--br-charcoal);
            border-radius: 50%;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-tool { 
            font-size: 18px; 
            font-weight: 900; 
            padding: 10px 14px;
            color: var(--br-charcoal); 
            transition: all 0.4s ease;
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            border-radius: 12px; 
        }

        .btn-tool:active { 
            transform: scale(0.85); 
        }

        .btn-erase { 
            font-size: 14px; 
            font-weight: 900; 
            padding: 12px 18px;
            border-radius: 14px; 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            transition: all 0.2s ease;
            color: var(--br-charcoal); 
        }

        .btn-erase:active {
            transform: scale(0.9);
        }

        .btn-erase.active { 
            background-color: var(--br-error); 
            color: #FFFFFF; 
            border-color: var(--br-error);
        }
        
        .btn-reset-all {
            font-size: 14px; 
            font-weight: 900; 
            padding: 12px 18px;
            border-radius: 14px; 
            background-color: #FFF5F5; 
            border: 1px solid #FFEBEB; 
            transition: all 0.2s ease;
            color: var(--br-error);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-reset-all:hover {
            background-color: var(--br-error-light);
            border-color: var(--br-error-border);
        }
        
        .btn-reset-all:active {
            transform: scale(0.9);
        }

        .action-group { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }

        .btn-nav { 
            width: 60px; 
            height: 60px; 
            border-radius: 18px; 
            border: 1px solid var(--br-border); 
            background-color: #FFFFFF; 
            font-size: 24px; 
            transition: all 0.3s ease;
            color: var(--br-charcoal); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: var(--shadow-button); 
        }

        .btn-nav:hover { 
            background-color: #FAFAFA; 
            border-color: var(--br-charcoal);
        }

        .btn-nav:active { 
            transform: scale(0.85); 
        }

        .btn-main { 
            height: 60px; 
            padding: 0px 35px;
            border-radius: 18px; 
            font-weight: 900; 
            font-size: 15px; 
            letter-spacing: 1px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: all 0.3s ease;
            text-transform: uppercase; 
            font-family: 'Nunito', sans-serif; 
        }

        .btn-record { 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
        }

        .btn-record:hover { 
            border-color: var(--br-error);
            color: var(--br-error); 
        }
        
        .btn-record:active {
            transform: scale(0.95);
        }

        .btn-record.recording { 
            background-color: #FFF0F0; 
            color: var(--br-error); 
            border-color: var(--br-error);
            box-shadow: inset 0px 0px 0px 2px var(--br-error); 
        }

        .btn-record .dot { 
            width: 12px; 
            height: 12px; 
            background-color: var(--br-error); 
            border-radius: 50%; 
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        .btn-record.recording .dot { 
            opacity: 1; 
            animation: blink 1s infinite; 
        }

        .btn-submit { 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            box-shadow: 0px 10px 30px rgba(54, 52, 49, 0.2); 
        }

        .btn-submit:hover { 
            background-color: var(--br-gold); 
            transform: translateY(-3px); 
            box-shadow: 0px 15px 35px rgba(203, 174, 117, 0.4); 
        }

        .btn-submit:active { 
            transform: scale(0.9) translateY(0px); 
        }

        /* ======================================================================
           [8] AI PRIVATE TUTOR SIDE PANEL
           ====================================================================== */
        .ai-panel { 
            position: absolute; 
            top: 0px; 
            right: -480px; 
            width: 480px; 
            height: 100%; 
            background-color: #FFFFFF; 
            box-shadow: -25px 0px 60px rgba(0, 0, 0, 0.12); 
            z-index: 10001; 
            transition: right 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--br-border); 
        }

        .ai-panel.open { 
            right: 0px; 
        }

        .ai-header { 
            padding: 30px 35px;
            background-color: var(--br-ai-soft); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
        }

        .ai-title { 
            font-family: 'Jua', sans-serif; 
            font-size: 24px; 
            color: var(--br-green); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .btn-close-ai { 
            font-size: 34px; 
            color: var(--br-muted); 
            line-height: 1; 
            transition: all 0.2s ease;
        }

        .btn-close-ai:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }
        
        .ai-content { 
            padding: 30px 35px;
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth; 
        }
        
        .chat-bubble { 
            max-width: 90%; 
            padding: 20px 25px;
            border-radius: 22px; 
            font-size: 16px; 
            line-height: 1.7; 
            font-weight: 500; 
            word-break: keep-all; 
            animation: popIn 0.5s ease; 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background-color: #F8F9FA; 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--br-border); 
            color: var(--br-text); 
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background-color: var(--br-green); 
            color: #FFFFFF; 
            border-bottom-right-radius: 4px; 
            box-shadow: 0px 8px 20px rgba(145, 211, 180, 0.3); 
        }
        
        .ai-loading-container { 
            text-align: center; 
            padding: 50px 0px;
        }

        .ai-loading-icon { 
            font-size: 36px; 
            color: var(--br-green); 
            margin-bottom: 15px; 
        }

        .ai-loading-text { 
            font-weight: 900; 
            color: var(--br-muted); 
            font-family: 'Nunito', sans-serif; 
            font-size: 14px; 
        }

        .analytics-card { 
            background-color: #FAFAFA; 
            border: 1px solid var(--br-border); 
            border-radius: 24px; 
            padding: 25px;
            align-self: stretch; 
            margin-bottom: 10px; 
        }

        .analytics-title { 
            font-family: 'Nunito', sans-serif; 
            color: var(--br-gold); 
            font-size: 14px; 
            margin-bottom: 20px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-bottom: 1px dashed var(--br-border); 
            padding-bottom: 12px; 
        }

        .stat-row { 
            margin-bottom: 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }

        .stat-label { 
            font-size: 13px; 
            font-weight: 800; 
            display: flex; 
            justify-content: space-between; 
            color: var(--br-charcoal); 
        }

        .bar-bg { 
            width: 100%; 
            height: 10px; 
            background-color: #E8E6E1; 
            border-radius: 12px; 
            overflow: hidden; 
        }

        .bar-fill { 
            height: 100%; 
            transition: width 1.2s ease; 
            border-radius: 12px; 
        }

        .chat-footer { 
            padding: 25px 35px;
            border-top: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #FFFFFF; 
        }

        .btn-chat-action { 
            width: 100%; 
            height: 60px; 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            border-radius: 18px; 
            font-weight: 900; 
            transition: all 0.3s ease;
            font-size: 16px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            font-family: 'Nunito', sans-serif; 
            box-shadow: 0px 10px 20px rgba(54, 52, 49, 0.2); 
        }
        
        .btn-chat-action:hover { 
            background-color: var(--br-gold); 
            transform: translateY(-2px); 
        }
        
        .btn-chat-action:active {
            transform: scale(0.95);
        }

        .btn-chat-next { 
            width: 100%; 
            text-align: center; 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--br-blue); 
            margin-top: 15px; 
            transition: color 0.3s ease; 
        }
        
        .btn-chat-next:hover { 
            color: var(--br-gold); 
        }

        /* ======================================================================
           [9] DIALOG MODALS & OVERLAYS
           ====================================================================== */
        .bridge-modal-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(42, 40, 37, 0.6);
            z-index: 40000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .bridge-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bridge-modal-box {
            background-color: var(--br-paper);
            width: 420px;
            max-width: 90%;
            border-radius: 24px;
            padding: 40px 35px 35px 35px;
            text-align: center;
            box-shadow: var(--shadow-premium);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s ease;
        }

        .bridge-modal-overlay.active .bridge-modal-box {
            transform: scale(1) translateY(0px);
        }

        .bridge-modal-icon {
            font-size: 45px;
            color: var(--br-gold);
            margin-bottom: 20px;
            display: block;
        }
        
        .bridge-modal-icon.warning {
            color: var(--br-error);
        }

        .bridge-modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--br-charcoal);
            margin-bottom: 12px;
        }

        .bridge-modal-text {
            font-size: 15px;
            color: var(--br-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .bridge-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .bridge-modal-btn {
            flex: 1;
            padding: 15px 0px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .bridge-modal-btn:active {
            transform: scale(0.9);
        }

        .bridge-modal-cancel {
            background-color: #F0EFEB;
            color: var(--br-charcoal);
            border: 1px solid transparent;
        }
        
        .bridge-modal-cancel:hover {
            background-color: #E5E4E0;
        }

        .bridge-modal-confirm {
            background-color: var(--br-error);
            color: #FFFFFF;
            border: 1px solid transparent;
            box-shadow: 0px 8px 15px rgba(231, 76, 60, 0.2);
        }
        
        .bridge-modal-confirm:hover {
            background-color: #C0392B;
        }
        
        .bridge-modal-confirm.neutral {
            background-color: var(--br-charcoal);
            box-shadow: 0px 8px 15px rgba(54, 52, 49, 0.2);
        }
        
        .bridge-modal-confirm.neutral:hover {
            background-color: var(--br-gold);
        }

        .rgb-modal { 
            position: absolute; 
            bottom: 130px; 
            left: 50px; 
            background-color: #FFFFFF; 
            border-radius: 25px; 
            padding: 25px;
            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.15); 
            z-index: 5000; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
            transition: all 0.3s ease; 
        }

        .rgb-modal.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0px); 
        }
        
        .rgb-modal-close { 
            text-align: center; 
            font-size: 10px; 
            margin-top: 12px; 
            font-weight: 900; 
            color: var(--br-muted); 
            transition: color 0.2s ease;
        }

        .rgb-modal-close:hover { 
            color: var(--br-charcoal); 
        }

        /* ======================================================================
           [10] CERTIFICATE SYSTEM (수료증)
           ====================================================================== */
        .cert-modal-overlay { 
            position: fixed; 
            top: 0px; 
            right: 0px;
            bottom: 0px;
            left: 0px; 
            width: 100vw; 
            height: 100dvh; 
            background-color: rgba(0, 0, 0, 0.85); 
            z-index: 30000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.4s ease; 
            backdrop-filter: blur(15px); 
        }

        .cert-modal-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .cert-card { 
            background-color: #FFFFFF; 
            width: 850px; 
            max-width: 90%; 
            border-radius: 35px; 
            padding: 60px;
            text-align: center; 
            position: relative; 
            box-shadow: 0px 40px 80px rgba(0, 0, 0, 0.4); 
            transform: scale(0.85); 
            transition: transform 0.5s ease; 
        }

        .cert-modal-overlay.active .cert-card { 
            transform: scale(1); 
        }

        .cert-border { 
            border: 10px solid var(--br-gold); 
            border-radius: 25px; 
            padding: 50px;
            position: relative; 
        }

        .cert-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 50px; 
            color: var(--br-charcoal); 
            font-weight: 900; 
            margin-bottom: 15px; 
        }

        .cert-subtitle { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            color: var(--br-muted); 
            font-weight: 900; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 35px; 
        }

        .cert-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 40px; 
            color: var(--br-green); 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-decoration: underline; 
            text-decoration-color: var(--br-gold); 
        }

        .cert-img-container { 
            width: 100%; 
            max-width: 450px; 
            height: 280px; 
            margin: 0px auto 35px auto;
            border-radius: 18px; 
            border: 3px dashed var(--br-border); 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--br-bg); 
        }

        .cert-img-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        .cert-msg { 
            font-size: 18px; 
            color: var(--br-text); 
            line-height: 1.6; 
            font-weight: 600; 
            margin-bottom: 35px; 
            font-style: italic; 
        }

        .btn-print { 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            padding: 18px 45px;
            font-size: 18px; 
            font-weight: 900; 
            border-radius: 100px; 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.15); 
            transition: all 0.5s ease; 
        }

        .btn-print:hover { 
            transform: translateY(-4px); 
            box-shadow: 0px 20px 35px rgba(203, 174, 117, 0.3); 
            background-color: var(--br-gold); 
        }
        
        .btn-print:active {
            transform: scale(0.95);
        }

        .cert-close { 
            position: absolute; 
            top: 25px; 
            right: 35px; 
            font-size: 35px; 
            color: var(--br-muted); 
            font-weight: 900; 
            transition: all 0.2s ease; 
        }
        
        .cert-close:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }

        /* ======================================================================
           [11] CSS KEYFRAMES ANIMATIONS
           ====================================================================== */
        @keyframes popIn { 
            from { opacity: 0; transform: scale(0.92) translateY(15px); } 
            to { opacity: 1; transform: scale(1) translateY(0px); } 
        }
        
        @keyframes blink { 
            0% { opacity: 1; }
            50% { opacity: 0.3; } 
            100% { opacity: 1; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ======================================================================
           [12] MOBILE DEVICE RESPONSIVE MEDIA CONSTRAINTS
           ====================================================================== */
        @media (pointer: coarse) {
            .btn-nav, .btn-main, .btn-tool, .btn-erase, .btn-magic, .color-preview, .btn-reset-all { 
                min-width: 44px; min-height: 44px; 
            }
        }

        @media (min-width: 801px) and (max-width: 1180px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); box-shadow: none; }
            .sidebar.open { transform: translateX(0px); box-shadow: 20px 0px 50px rgba(0, 0, 0, 0.18); }
            .workspace { width: 100%; }
            .top-bar { height: 76px; padding: 0px 24px; }
            .stage-wrapper { padding: 20px; }
            .bottom-dock { height: 128px; padding: 14px 24px; gap: 14px; }
            .tool-group, .action-group { flex-wrap: wrap; justify-content: center; }
            .btn-main { padding: 0px 22px; }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; left: 0; transform: translateX(-100%); box-shadow: none; }
            .sidebar.open { transform: translateX(0px); box-shadow: 20px 0px 50px rgba(0, 0, 0, 0.2); }
            .workspace { width: 100%; }
            .stage-wrapper { padding: 12px; }
            #worksheet-img { min-width: 0px; width: 100%; max-width: 100%; max-height: calc(100dvh - 240px); }
            .bottom-dock { height: calc(140px + var(--safe-bottom)); flex-direction: column; justify-content: center; padding: 10px 20px calc(10px + var(--safe-bottom)) 20px; gap: 12px; border-radius: 25px 25px 0px 0px; }
            .tool-group { width: 100%; justify-content: center; padding: 8px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
            .btn-nav, .btn-main { height: 50px; font-size: 13px; }
            .ai-panel { width: 100%; right: -100%; border-left: none; }
            .rgb-modal { left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(160px + var(--safe-bottom)); }
            .rgb-modal.active { transform: translateX(-50%) translateY(0px); }
            .cert-card { padding: 30px 20px; }
            .cert-border { padding: 20px; }
            .cert-title { font-size: 30px; }
            .bridge-modal-box { padding: 30px 20px; max-width: 95%; }
        }

        @media (max-width: 560px) {
            .top-bar { height: 68px; padding: 0px 14px; }
            .unit-info { font-size: 10px; letter-spacing: 1.8px; }
            .page-info { font-size: 24px; }
            .ai-header, .ai-content, .chat-footer { padding: 0px 20px; }
            .chat-bubble { max-width: 96%; font-size: 15px; }
        }

        @media (max-width: 480px) {
            .bottom-dock { height: calc(170px + var(--safe-bottom)); padding: 10px 12px calc(10px + var(--safe-bottom)) 12px; }
            .tool-group { gap: 6px; padding: 8px; border-radius: 18px; flex-wrap: wrap; }
            .btn-magic { font-size: 20px; }
            .brush-slider { width: 72px; }
            #worksheet-img { max-height: calc(100dvh - 220px); }
            .btn-main { height: 48px; padding: 0px 14px; flex: 1; justify-content: center; }
            .btn-nav { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div class="app-container">
        
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="UIEngine.closeSidebar()"></div>

        <nav class="sidebar" id="sidebar" aria-label="Curriculum Navigation">
            <header class="sidebar-header" onclick="location.href='dashboard.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </header>
            <section class="student-profile" id="profile-box">
                <div class="profile-top">
                    <div class="profile-avatar" id="avatar-char">?</div>
                    <div class="profile-info">
                        <span class="profile-name" id="display-name">Guest</span>
                        <span class="profile-role">Global Premium Explorer</span>
                    </div>
                </div>
                <div class="badge-container" id="badge-container"></div>
            </section>
            <section class="nav-list" id="nav-list" aria-label="Weekly Lessons"></section>
        </nav>

        <div class="workspace">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn interactive-hover" onclick="UIEngine.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
                <div class="sync-indicator-container" id="sync-indicator">
                    <i class="fa-solid fa-cloud sync-icon" id="sync-icon"></i><span id="sync-text">Synced</span>
                </div>
            </header>
            
            <div id="error-toast" class="toast-error" role="alert"><i class="fa-solid fa-triangle-exclamation"></i> <span id="error-toast-msg">Error</span></div>

            <main class="stage-wrapper interactive-hover">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img" crossorigin="anonymous" alt="Worksheet">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <footer class="bottom-dock">
                <div class="tool-group" role="group" aria-label="Drawing Tools">
                    <div class="color-preview interactive-hover" id="btn-color" onclick="RGBRingEngine.toggle()"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;" aria-hidden="true" tabindex="-1">
                    
                    <button class="btn-magic active interactive-hover" id="btn-brush-normal" onclick="CanvasEngine.setBrush('normal')">🖍️</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-neon" onclick="CanvasEngine.setBrush('neon')">🌟</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-rainbow" onclick="CanvasEngine.setBrush('rainbow')">🌈</button>
                    
                    <div class="brush-slider-wrapper">
                        <input type="range" class="brush-slider interactive-hover" id="brush-size" min="2" max="35" value="6">
                        <div class="brush-preview-dot" id="brush-preview-dot"></div>
                    </div>
                    
                    <button class="btn-tool interactive-hover" onclick="CanvasEngine.undo()"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn-erase interactive-hover" id="btn-eraser" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-reset-all interactive-hover" onclick="CanvasEngine.promptHardReset()"><i class="fa-solid fa-trash-can"></i> CLEAR</button>
                </div>
                
                <div class="action-group" role="group">
                    <button class="btn-nav interactive-hover" onclick="AppEngine.smoothMove(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="btn-main btn-record interactive-hover" id="btn-record" onclick="AudioEngine.toggle()"><div class="dot"></div><span id="record-text">Voice Log</span></button>
                    <button class="btn-main btn-submit interactive-hover" onclick="AITutor.submit()">Submit ✨</button>
                    <button class="btn-nav interactive-hover" onclick="AppEngine.smoothMove(1)"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </footer>
        </div>

        <aside class="ai-panel" id="ai-panel">
            <header class="ai-header">
                <div class="ai-title">✨ Private Tutor</div>
                <button class="btn-close-ai interactive-hover" onclick="AITutor.close()"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <section class="ai-content" id="ai-content" aria-live="polite"></section>

        const CurriculumEngine = {
            pages(unitId) {
                const data = PAGE_INTELLIGENCE[unitId];
                if (data) {
                    const keys = Object.keys(data).map(Number);
                    return keys.sort((a, b) => a - b);
                }
                return [];
            },
            first(unitId) {
                const pageArray = this.pages(unitId);
                return pageArray.length > 0 ? pageArray[0] : 1;
            },
            last(unitId) {
                const pageArray = this.pages(unitId);
                return pageArray.length > 0 ? pageArray[pageArray.length - 1] : 1;
            },
            clamp(unitId, page) {
                const pageArray = this.pages(unitId);
                if (pageArray.includes(page)) return page;
                return pageArray.length > 0 ? pageArray[0] : 1;
            },
            next(unitId, page, dir) {
                const pageArray = this.pages(unitId);
                let idx = pageArray.indexOf(page);
                if (idx === -1) idx = 0;
                let calcIdx = Math.min(Math.max(idx + dir, 0), pageArray.length - 1);
                return pageArray[calcIdx] || page;
            },
            weekIndex(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                if (idx === -1) return 1;
                return Math.floor(idx / 4) + 1;
            },
            isWeekEnd(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                if (idx !== -1) {
                    if ((idx + 1) % 4 === 0 || idx === pages.length - 1) return true;
                }
                return false;
            }
        };

        const SyncIndicatorEngine = {

            setSaving() {

        /**
         * [5-6. SMART IMAGE LOADER ENGINE (P0 CORS & 404 방어 알고리즘 탑재)]
         */
        const SmartImageLoader = {
            requestToken: 0,

            async findValidWorksheet(unitId, pageNum) {
                this.requestToken = this.requestToken + 1;
                const token = this.requestToken; 
                
                const imgElement = document.getElementById('worksheet-img');
                const boardElement = document.getElementById('drawing-board');
                
                const seriesChar = unitId.charAt(0);
                const t = Date.now(); 

                /* 깃허브 절대 경로 매칭 알고리즘 (패딩 포맷 제외, 정확한 타겟팅만 수행) */
                const basePaths = [
                    `${seriesChar}/${unitId}/${unitId}-${pageNum}`,
                    `${unitId}/${unitId}-${pageNum}`,
                    `${seriesChar}/${unitId}/${pageNum}`,
                    `${unitId}/${pageNum}`
                ];

                const possiblePaths = [];
                basePaths.forEach((base) => {
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.png`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpg`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpeg`);
                });

                const tryLoad = (index) => {
                    if (token !== this.requestToken) return;

                    if (index >= possiblePaths.length) {
                        Logger.error(`Worksheet missing. 404 on ${unitId} Page ${pageNum}`);
                        if (imgElement) imgElement.style.opacity = '1';
                        if (boardElement) boardElement.classList.add('error-state');
                        
                        setTimeout(() => {
                            if (token !== this.requestToken) return;
                            CanvasEngine.resizeCanvas();
                            StorageEngine.loadCanvasLocal();
                        }, 50);
                        return;
                    }

                    const testUrl = `${possiblePaths[index]}?t=${t}`;
                    const tempImg = new Image();
                    
                    // [P0] 캔버스 오염(Tainted)을 막기 위해 서버 측 CORS 설정을 존중하도록 강제 지정
                    tempImg.crossOrigin = "anonymous";

                    tempImg.onload = () => {
                        if (token !== this.requestToken) return;
                        Logger.log("Mounted:", testUrl);
                        if (boardElement) boardElement.classList.remove('error-state');
                        
                        if (imgElement) {
                            // 실제 도화지 이미지에도 crossorigin 속성을 동적으로 주입
                            imgElement.crossOrigin = "anonymous";
                            
                            imgElement.onload = () => {
                                if (token !== this.requestToken) return;
                                imgElement.style.opacity = '1';
                                // DOM Reflow를 충분히 기다린 후 캔버스를 덮습니다.
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(() => {
                                        if (token !== this.requestToken) return;
                                        CanvasEngine.resizeCanvas();
                                        StorageEngine.loadCanvasLocal();
                                    });
                                });
                            };
                            imgElement.src = testUrl;
                        }
                    };

                    tempImg.onerror = () => {
                        tryLoad(index + 1);
                    };
                    
                    tempImg.src = testUrl;
                };

                tryLoad(0);
            }
        };

        /**
         * [5-7. CLOUD FIREBASE STORAGE ENGINE]
         */
        const StorageEngine = {
            cloudSaveTimer: null,

            load() {
                if (!STATE.uid) return;
                try {
                    const rawStorage = localStorage.getItem(`br_data_${STATE.uid}_${STATE.unitId}`);
                    let s = {};
                    if (rawStorage) s = JSON.parse(rawStorage);
                    if (s.name) STATE.studentName = s.name; 
                    if (s.badges) STATE.badges = s.badges;
                    
                    const urlPage = Number(new URLSearchParams(window.location.search).get('page'));
                    if (urlPage) {
                        if (CurriculumEngine.pages(STATE.unitId).includes(urlPage)) {
                            STATE.currentPage = urlPage;
                        }
                    } else if (s.page) {
                        STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, s.page);
                    }
                } catch (e) { 
                    Logger.warn("Metadata local cache failure", e); 
                }
            },
            
            async save() {
                if (!STATE.uid) return;
                try {
                    const data = { name: STATE.studentName, page: STATE.currentPage, badges: STATE.badges || [] };
                    localStorage.setItem(`br_data_${STATE.uid}_${STATE.unitId}`, JSON.stringify(data));
                    await db.collection("students").doc(STATE.uid).set({ 
                        name: data.name, page: data.page, badges: data.badges, 
                        email: STATE.studentEmail, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { merge: true });
                } catch (error) { 
                    Logger.error("Core transaction metadata sync failed.", error); 
                }
            },
            
            createCanvasSnapshot(compressForDatabase = false) {
                if (!CanvasEngine.cvs || !STATE.uid) return null;
                let canvasData = null;
                
                // [P0] 502 에러 방지를 위한 해상도 제한 압축 로직
                if (compressForDatabase) {
                    canvasData = CanvasEngine.captureWorksheetWithDrawing(true, 800); 
                } else {
                    canvasData = CanvasEngine.cvs.toDataURL('image/webp', 0.6); 
                }
                
                if (!compressForDatabase) {
                    try { localStorage.setItem(`br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`, canvasData); } catch(e) {}
                }
                
                return { 
                    uid: STATE.uid, studentEmail: STATE.studentEmail, unitId: STATE.unitId, 
                    page: STATE.currentPage, transcript: STATE.lastTranscript, canvasData: canvasData 
                };
            },
            
            saveCanvasLocal() { 
                return this.createCanvasSnapshot(false); 
            },
            
            scheduleCloudSave() {
                SyncIndicatorEngine.setSaving();
                const snapshot = this.createCanvasSnapshot(true);
                if (this.cloudSaveTimer) clearTimeout(this.cloudSaveTimer);
                this.cloudSaveTimer = setTimeout(() => { this.executeCloudSave(snapshot); }, 1500); 
            },
            
            async executeCloudSave(snapshot = null) {
                let payload = snapshot ? snapshot : this.createCanvasSnapshot(true);
                if (!payload) return;
                try {
                    const firestoreDocId = `${payload.uid}_${payload.unitId}_P${payload.page}`;
                    await db.collection("student_drawings").doc(firestoreDocId).set({ 
                        uid: payload.uid, studentID: payload.studentEmail, unitId: payload.unitId, 
                        page: payload.page, imageUrl: payload.canvasData, transcript: payload.transcript, 
                        timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { merge: true });
                    SyncIndicatorEngine.setSaved();
                } catch (error) { 
                    Logger.warn("Cloud infrastructure save fault.", error); 
                    SyncIndicatorEngine.setError(); 
                }
            },
            
            loadCanvasLocal() {
                try {
                    const cacheKey = `br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`;
                    const localData = localStorage.getItem(cacheKey);
                    if (localData) {
                        const img = new Image();
                        img.onload = () => { 
                            CanvasEngine.ctx.drawImage(img, 0, 0, CanvasEngine.cvs.width / CanvasEngine.dpr, CanvasEngine.cvs.height / CanvasEngine.dpr); 
                            CanvasEngine.saveHistory(); 
                        };
                        img.src = localData;
                    } else { 
                        CanvasEngine.saveHistory(); 
                    }
                } catch (error) { 
                    CanvasEngine.saveHistory(); 
                }
            }
        };

        /**
         * [5-8. INTERACTIVE CANVAS & DRAWING ENGINE]
         */
        const CanvasEngine = {
            isDrawing: false, hasMoved: false, isErasing: false, lastColor: "#363431", 
            dpr: window.devicePixelRatio || 1, historyStack: [], historyIndex: -1,
            
            init() {
                this.cvs = document.getElementById('draw-layer'); 
                if (!this.cvs) return;
                this.ctx = this.cvs.getContext('2d'); 
                this.board = document.getElementById('drawing-board');
