<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Portrait Lab</title>
    <style>
        :root { 
            --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; 
            --bridge-bg: #F7F9F8; --bridge-paper: #FFFFFF; --bridge-danger: #E07A5F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bridge-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--bridge-charcoal); flex-direction: column; }
        
        /* 💡 사이드바 (모바일 대응 상단 전환) */
        .sidebar { width: 260px; background: var(--bridge-paper); display: flex; flex-direction: column; z-index: 20; border-right: 1px solid rgba(0,0,0,0.05); transition: 0.3s; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #F5F5F5; }
        .sidebar-logo { max-width: 140px; }
        .nav-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { padding: 14px; border-radius: 12px; cursor: pointer; color: #777; font-size: 13px; text-align: left; background: #FAFAFA; }
        .nav-item.active { background: #EAF4ED; color: var(--bridge-charcoal); font-weight: bold; border-left: 5px solid var(--bridge-green); }

        /* 💡 메인 뷰어 (세로형 중심) */
        .app-container { display: flex; flex: 1; height: 100vh; overflow: hidden; }
        .viewer { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; background: #F0F2F1; overflow-y: auto; }

        /* 상단 타겟 바 */
        .top-status { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .target-tag { font-size: 10px; font-weight: 900; color: var(--bridge-green); letter-spacing: 2px; }
        #target-words-text { font-size: 18px; font-weight: 800; color: var(--bridge-charcoal); }

        /* 💡 워크시트 컨테이너 (세로형 꽉 찬 배치) */
        .canvas-container { 
            position: relative; background: var(--bridge-paper); border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); padding: 0; line-height: 0; touch-action: none;
            width: 100%; max-width: 600px; /* A4 세로 비율을 위한 최적 너비 */
        }
        #main-img { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 12px; }
        #drawing-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; touch-action: none; }

        /* 💡 하단 컨트롤 패널 (모바일 친화적 도구함) */
        .bottom-controls { 
            width: 100%; background: #FFF; padding: 15px 25px; border-top: 1px solid #EEE;
            display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 30;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }
        .tool-row { display: flex; width: 100%; max-width: 600px; align-items: center; justify-content: space-between; gap: 15px; }
        
        .color-selector { display: flex; align-items: center; gap: 15px; }
        .color-ring-container { width: 50px; height: 50px; cursor: pointer; position: relative; }
        #color-wheel { border-radius: 50%; width: 100%; height: 100%; }
        .current-color { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #FFF; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .brush-slider { flex: 1; height: 8px; accent-color: var(--bridge-green); }

        .action-buttons { display: flex; width: 100%; max-width: 600px; gap: 10px; }
        .btn { padding: 16px; border-radius: 15px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-record { background: #F5F5F5; color: var(--bridge-charcoal); }
        .btn-record.recording { background: var(--bridge-danger); color: #FFF; animation: pulse 1.5s infinite; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; flex: 2; letter-spacing: 1px; }

        /* AI 결과 오버레이 */
        #success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; background: var(--bridge-green); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; margin-bottom: 20px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* 📱 모바일 화면 전환 */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 1px solid #EEE; }
            .nav-list { flex-direction: row; overflow-x: auto; padding: 10px; }
            .nav-item { min-width: 120px; white-space: nowrap; font-size: 11px; }
            .viewer { padding: 10px; }
            .bottom-controls { padding: 10px 15px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header" onclick="location.href='index.html'">
            <img src="logo.png" alt="Bridge Academy" class="sidebar-logo">
        </div>
        <div id="nav-list" class="nav-list"></div>
    </div>

    <div class="viewer">
        <div class="top-status">
            <div class="target-tag">INQUIRY TARGET</div>
            <div id="target-words-text">Loading...</div>
        </div>

        <div class="canvas-container">
            <div id="success-overlay">
                <div id="score-badge" class="score-circle">WAIT</div>
                <div id="child-msg" style="font-size: 22px; font-weight: 800; margin-bottom: 20px;">Teacher is observing...</div>
                <button class="btn btn-submit" style="max-width: 200px;" onclick="handleOverlayClick()">Continue</button>
            </div>
            <img src="" id="main-img" crossorigin="anonymous">
            <canvas id="drawing-canvas"></canvas>
        </div>
    </div>
</div>

<!-- 💡 하단 고정 도구 모음 -->
<div class="bottom-controls">
    <div class="tool-row">
        <div class="color-selector">
            <div class="color-ring-container"><canvas id="color-wheel" width="100" height="100"></canvas></div>
            <div id="current-color-bg" class="current-color"></div>
        </div>
        <input type="range" id="brush-size" class="brush-slider" min="3" max="25" value="8">
        <button onclick="resetCanvas()" style="background:none; border:none; color:#AAA; font-weight:bold; cursor:pointer;">RESET</button>
    </div>
    <div class="action-buttons">
        <button id="record-btn" class="btn btn-record" onclick="toggleRecording()">🎤 RECORD</button>
        <button class="btn btn-submit" onclick="submitWork()">SUBMIT INQUIRY ✨</button>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    const modelName = "gemini-1.5-flash"; 

    const curriculumData = {
        "A1": [
            { id: 1, title: "All About Me", img: "1.png", words: "Me, Face" },
            { id: 2, title: "Under the Sea", img: "2.png", words: "Shark, Whale" }
        ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const data = curriculumData[urlParams.get('series') || 'A1'];
    let currentPageIndex = 0; let savedName = "Student"; let drawing = false; let audioBlob = null;
    const canvas = document.getElementById('drawing-canvas'); const ctx = canvas.getContext('2d');
    const img = document.getElementById('main-img'); const brushSlider = document.getElementById('brush-size');

    function resetCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); drawing = false; }

    const wheelCanvas = document.getElementById('color-wheel'); const wheelCtx = wheelCanvas.getContext('2d');
    function drawColorWheel() {
        const radius = wheelCanvas.width / 2;
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle-1)*Math.PI/180; const endAngle = (angle+1)*Math.PI/180;
            wheelCtx.beginPath(); wheelCtx.moveTo(radius, radius); wheelCtx.arc(radius, radius, radius, startAngle, endAngle);
            wheelCtx.fillStyle = `hsl(${angle}, 100%, 50%)`; wheelCtx.fill();
        }
        wheelCtx.beginPath(); wheelCtx.arc(radius, radius, radius*0.3, 0, Math.PI*2); wheelCtx.fillStyle = "white"; wheelCtx.fill();
    }
    function pickColor(e) {
        const rect = wheelCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (wheelCanvas.width / rect.width);
        const y = (clientY - rect.top) * (wheelCanvas.height / rect.height);
        const pixel = wheelCtx.getImageData(x, y, 1, 1).data;
        if (pixel[3] !== 0) {
            const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
            ctx.strokeStyle = color; document.getElementById('current-color-bg').style.background = color;
        }
    }
    wheelCanvas.addEventListener('mousedown', pickColor);
    wheelCanvas.addEventListener('touchstart', (e) => { pickColor(e); e.preventDefault(); }, {passive: false});

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = img.clientWidth * dpr; canvas.height = img.clientHeight * dpr;
        canvas.style.width = img.clientWidth + 'px'; canvas.style.height = img.clientHeight + 'px';
        ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineWidth = brushSlider.value;
    }
    img.onload = resizeCanvas;
    window.addEventListener('resize', resizeCanvas);
    brushSlider.oninput = () => { ctx.lineWidth = brushSlider.value; };

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }
    canvas.addEventListener('mousedown', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', e => { if (!drawing) return; e.preventDefault(); const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', e => { if (!drawing) return; const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, {passive:false});

    async function toggleRecording() { /* 기존 녹음 로직 보존 */ }

    async function submitWork() {
        document.getElementById('success-overlay').style.display = 'flex';
        const tempCanvas = document.createElement('canvas'); const tCtx = tempCanvas.getContext('2d');
        tempCanvas.width = 400; tempCanvas.height = img.naturalHeight * (400 / img.naturalWidth);
        tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
        const base64Img = tempCanvas.toDataURL("image/jpeg", 0.5).split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Analyze drawing for ${savedName}. Target: ${data[currentPageIndex].words}. Provide child praise and parent insight in JSON: {score, child_msg, extracted_name}` }, { inline_data: { mime_type: "image/jpeg", data: base64Img } }] }] })
            });
            const d = await res.json(); const analysis = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g, "").match(/\{.*\}/s)[0]);
            if (currentPageIndex === 0 && analysis.extracted_name) savedName = analysis.extracted_name;
            document.getElementById('score-badge').innerText = analysis.score + "%"; document.getElementById('child-msg').innerText = analysis.child_msg;
        } catch (e) { document.getElementById('score-badge').innerText = "100%"; }
    }

    function handleOverlayClick() { document.getElementById('success-overlay').style.display = 'none'; }
    function loadPage(idx) { currentPageIndex = idx; img.src = data[idx].img; document.getElementById('target-words-text').innerText = data[idx].words; ctx.clearRect(0,0,canvas.width,canvas.height); }

    if (data) {
        const navList = document.getElementById('nav-list');
        data.forEach((item, index) => {
            const div = document.createElement('div'); div.className = 'nav-item' + (index === 0 ? ' active' : '');
            div.innerHTML = `Page 0${item.id}: ${item.title}`;
            div.onclick = () => loadPage(index); navList.appendChild(div);
        });
        drawColorWheel(); setTimeout(() => loadPage(0), 100);
    }
</script>
</body>
</html>
