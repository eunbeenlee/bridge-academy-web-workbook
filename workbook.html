<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium EdTech Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ======================================================================
         * [Architecture: Bridge Universal System V55.0]
         * Feature: Perfect Fit-to-Screen Layout & Classic Pen Stability
         * ====================================================================== */
        :root {
            --br-green: #89BFA0; --br-gold: #CBAE75; --br-blue: #7CA6C1; --br-charcoal: #363431;
            --br-bg: #FCFBF9; --br-paper: #FFFFFF; --br-text: #2A2825; --br-muted: #8C8985;
            --br-border: #F0EFEB; --br-error: #E74C3C; --br-ai: #F4F8F5;
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            --sidebar-width: 320px;
        }

        /* [Reset] */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--br-bg); color: var(--br-text); font-family: 'Noto Sans KR', sans-serif; touch-action: none; /* 브라우저 스와이프 방지 */ }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }
        
        .app-container { display: flex; width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        
        /* [Sidebar] */
        .sidebar { width: var(--sidebar-width); height: 100vh; background: var(--br-paper); border-right: 1px solid var(--br-border); display: flex; flex-direction: column; z-index: 1000; transition: transform 0.4s var(--ease-lux); flex-shrink: 0; }
        .sidebar-header { padding: 40px 30px 30px; text-align: center; border-bottom: 1px solid var(--br-border); cursor: pointer; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--br-charcoal); }
        .brand-logo span { color: var(--br-green); font-style: italic; }
        
        .student-profile { padding: 20px 30px; border-bottom: 1px solid var(--br-border); display: flex; align-items: center; gap: 15px; background: #FAFAFA; transition: 0.5s; }
        .student-profile.registered { background: #F4F8F5; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--br-border); color: var(--br-muted); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 22px; transition: 0.5s; flex-shrink: 0; }
        .student-profile.registered .profile-avatar { background: var(--br-gold); color: #FFF; box-shadow: 0 10px 20px rgba(203,174,117,0.3); }
        .profile-info { display: flex; flex-direction: column; overflow: hidden; }
        .profile-name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-role { font-size: 11px; color: var(--br-muted); letter-spacing: 1px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-list::-webkit-scrollbar { width: 6px; }
        .nav-list::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 10px; }
        .nav-item { padding: 18px 20px; margin-bottom: 10px; border-radius: 16px; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; cursor: pointer; border: 1px solid transparent; }
        .nav-item.active { background: var(--br-ai); border-left: 6px solid var(--br-green); font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .nav-title { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .nav-badge { font-size: 11px; font-weight: 900; opacity: 0.3; letter-spacing: 1px; flex-shrink: 0; }
        
        /* [Workspace] - V55.0 화면 잘림 완전 방지 구조 */
        .workspace { flex: 1; display: flex; flex-direction: column; background: var(--br-bg); height: 100vh; overflow: hidden; min-width: 0; }
        
        .top-bar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0; z-index: 10; }
        .unit-info { font-size: 13px; font-weight: 900; color: var(--br-gold); letter-spacing: 5px; }
        .page-info { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; color: var(--br-charcoal); line-height: 1; margin-top: 5px; }
        
        .soundscape-ui { display: flex; align-items: center; gap: 8px; background: #FFF; padding: 12px 20px; border-radius: 100px; border: 1px solid var(--br-border); font-size: 12px; font-weight: 900; color: var(--br-muted); cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .soundscape-ui.active { color: var(--br-blue); border-color: var(--br-blue); }

        /* [Fluid Stage] V55.0 min-height: 0 적용으로 완벽한 스케일 다운 유도 */
        .stage-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px 40px 20px; position: relative; overflow: hidden; min-height: 0; }
        
        .canvas-container { position: relative; display: flex; justify-content: center; align-items: center; max-width: 100%; max-height: 100%; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); border: 1px solid var(--br-border); background: var(--br-paper); line-height: 0; }
        
        .canvas-container.drawing-mode { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='%23CBAE75' stroke='%23363431' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'/></svg>") 0 20, crosshair; }
        .canvas-container.erasing-mode { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23FFF' stroke='%23363431' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><line x1='3' y1='9' x2='21' y2='9'/></svg>") 12 12, cell; }
        
        /* 이미지가 무조건 컨테이너를 넘지 않고 비율을 유지하며 축소됨 */
        #worksheet-img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 20px; opacity: 0; transition: opacity 0.5s; object-fit: contain; pointer-events: none; }
        
        #draw-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 20px; z-index: 50; touch-action: none; }

        .scan-line { width: 100%; height: 4px; background: var(--br-green); position: absolute; top: 0; left: 0; box-shadow: 0 0 15px var(--br-green); animation: scan 2s linear infinite; z-index: 100; display: none; border-radius: 4px; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        /* [Bottom Dock] flex-shrink: 0 으로 크기 고정 보장 */
        .bottom-dock { flex-shrink: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); border-top: 1px solid var(--br-border); display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; z-index: 500; }
        
        .tool-group { display: flex; align-items: center; gap: 20px; background: #FAFAFA; padding: 15px 30px; border-radius: 100px; border: 1px solid var(--br-border); }
        .color-preview { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #FFF; cursor: pointer; background: var(--br-charcoal); box-shadow: 0 10px 20px rgba(0,0,0,0.08); transition: transform 0.2s var(--ease-bounce); flex-shrink: 0; }
        .color-preview:active { transform: scale(0.9); }
        .brush-slider { width: 120px; accent-color: var(--br-green); cursor: pointer; height: 8px; }
        
        .btn-erase { font-size: 13px; font-weight: 900; color: var(--br-charcoal); letter-spacing: 1px; padding: 10px 20px; border-radius: 20px; transition: 0.3s; background: #FFF; border: 1px solid var(--br-border); cursor: pointer; }
        .btn-erase.active { background: var(--br-error); color: #FFF; border-color: var(--br-error); }
        .btn-erase-all { font-size: 11px; font-weight: 800; color: var(--br-muted); cursor: pointer; padding: 10px; }
        .btn-erase-all:hover { color: var(--br-error); }
        
        .action-group { display: flex; gap: 15px; align-items: center; }
        .btn-nav { width: 60px; height: 60px; border-radius: 20px; border: 1px solid var(--br-border); font-size: 24px; background: #FFF; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.02); color: var(--br-charcoal); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .btn-nav:active { transform: scale(0.95); background: #F5F5F5; }
        
        .btn-core { height: 60px; padding: 0 25px; border-radius: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; transition: 0.3s; box-shadow: 0 15px 30px rgba(0,0,0,0.04); flex-shrink: 0; }
        .btn-core:active { transform: scale(0.95); }
        
        .btn-record { background: #FFF; color: var(--br-charcoal); border: 1px solid var(--br-border); }
        .btn-record .dot { width: 10px; height: 10px; background: var(--br-error); border-radius: 50%; opacity: 0; transition: 0.3s; }
        .btn-record.recording { background: #FFF0F0; color: var(--br-error); border-color: #FADBD8; }
        .btn-record.recording .dot { opacity: 1; animation: blink 1s infinite; }
        
        .btn-submit { background: var(--br-charcoal); color: #FFF; border: none; }
        .btn-submit:hover { background: var(--br-green); box-shadow: 0 20px 40px rgba(137, 191, 160, 0.3); }

        /* [English AI Teacher Panel] */
        .ai-panel { position: absolute; top: 0; right: -500px; width: 420px; height: 100vh; background: #FFF; box-shadow: -20px 0 50px rgba(0,0,0,0.1); z-index: 2000; transition: right 0.6s var(--ease-bounce); display: flex; flex-direction: column; border-left: 1px solid var(--br-border); }
        .ai-panel.open { right: 0; }
        .ai-header { padding: 30px; background: var(--br-ai); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br-border); flex-shrink: 0; }
        .ai-title { font-size: 18px; font-weight: 900; color: var(--br-green); display: flex; align-items: center; gap: 10px; }
        .ai-title::before { content: '✨'; font-size: 24px; }
        .btn-close-ai { font-size: 32px; color: var(--br-muted); line-height: 1; padding: 0 10px; }
        
        .ai-content { padding: 30px; flex: 1; overflow-y: auto; }
        .transcript-box { background: #F4F8F5; padding: 20px; border-radius: 15px; border-left: 4px solid var(--br-green); margin-bottom: 20px; font-size: 15px; font-style: italic; color: var(--br-charcoal); font-weight: 700; line-height: 1.5; }
        .transcript-empty { background: #FFF9F0; padding: 15px; border-radius: 10px; border: 1px dashed var(--br-gold); margin-bottom: 20px; font-size: 12px; color: var(--br-muted); text-align: center; }

        .analytics-box { background: #FAFAFA; border: 1px solid var(--br-border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        .analytics-title { font-size: 12px; font-weight: 900; color: var(--br-muted); letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .stat-row { margin-bottom: 20px; }
        .stat-label { font-size: 14px; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--br-charcoal); }
        .stat-bar-bg { width: 100%; height: 12px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--br-gold); width: 0%; transition: width 1.5s var(--ease-lux); }
        .visual-intent { font-size: 14px; background: #FFF; padding: 20px; border-radius: 15px; border: 1px dashed var(--br-border); margin-top: 20px; line-height: 1.7; color: var(--br-text); }
        
        .ai-bubble { background: #F8F9FA; padding: 25px; border-radius: 25px; border-bottom-left-radius: 5px; border: 1px solid var(--br-border); font-size: 16px; line-height: 1.8; font-weight: 500; }
        .ai-name-input { width: 100%; padding: 20px; border: 2px dashed var(--br-green); border-radius: 15px; margin-top: 20px; font-size: 18px; text-align: center; font-weight: 800; outline: none; transition: 0.3s; font-family: inherit; -webkit-appearance: none; }
        .ai-name-input:focus { background: #F4F8F5; border-style: solid; }
        .ai-name-btn { width: 100%; background: var(--br-green); color: #fff; padding: 20px; border-radius: 15px; margin-top: 15px; font-weight: 900; cursor: pointer; transition: 0.3s; letter-spacing: 2px; font-size: 16px; }

        .mobile-menu-btn { display: none; font-size: 28px; padding: 10px; color: var(--br-charcoal); z-index: 1500; }

        /* [Responsive Breakpoints] */
        @media (max-width: 1200px) {
            :root { --sidebar-width: 280px; }
            .top-bar { padding: 15px 30px; }
            .stage-wrapper { padding: 10px 30px 20px; }
            .bottom-dock { padding: 20px 30px; }
        }

        @media (max-width: 992px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: absolute; left: calc(var(--sidebar-width) * -1); top: 0; box-shadow: none; }
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            
            .top-bar { padding: 15px 20px; }
            .top-bar-left { display: flex; align-items: center; gap: 15px; }
            .page-info { font-size: 32px; margin-top: 0; }
            
            .stage-wrapper { padding: 10px 20px 20px; }
            
            .bottom-dock { flex-direction: column; padding: 20px; gap: 15px; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
            .tool-group { width: 100%; justify-content: center; padding: 12px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
        }

        @media (max-width: 600px) {
            :root { --sidebar-width: 85vw; }
            .page-info { font-size: 26px; }
            .soundscape-ui { padding: 10px 15px; font-size: 11px; }
            .soundscape-ui span { display: none; }
            
            .tool-group { gap: 10px; }
            .brush-slider { width: 80px; }
            .btn-erase { font-size: 11px; padding: 8px 12px; }
            
            .ai-panel { width: 100vw; height: 90vh; top: auto; bottom: -100vh; right: 0; left: 0; border-left: none; border-top: 1px solid var(--br-border); border-radius: 30px 30px 0 0; transition: bottom 0.5s var(--ease-bounce); }
            .ai-panel.open { bottom: 0; right: 0; }
            .ai-header { padding: 25px; border-radius: 30px 30px 0 0; }
            .ai-content { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header" onclick="location.href='index.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>
            <div class="student-profile" id="profile-box">
                <div class="profile-avatar" id="avatar-char">?</div>
                <div class="profile-info">
                    <span class="profile-name" id="display-student-name">Inquirer</span>
                    <span class="profile-role">Awaiting Name</span>
                </div>
            </div>
            <div class="nav-list" id="nav-list"></div>
        </nav>

        <div class="workspace">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn" onclick="UIEngine.toggleSidebar()">☰</button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
                <button class="soundscape-ui" id="soundscape-btn" onclick="AmbientEngine.toggle()">
                    🎵 <span>Soundscape:</span> OFF
                </button>
            </div>

            <!-- V55.0 화면 잘림이 절대 발생하지 않는 Fluid Stage -->
            <main class="stage-wrapper" id="stage-wrapper">
                <div class="canvas-container drawing-mode" id="canvas-container">
                    <img src="" id="worksheet-img" crossorigin="anonymous">
                    <canvas id="draw-layer"></canvas>
                    <div class="scan-line" id="canvas-scan-line"></div>
                </div>
            </main>

            <div class="bottom-dock">
                <div class="tool-group">
                    <div class="color-preview" id="btn-color"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;">
                    <input type="range" class="brush-slider" id="brush-size" min="2" max="40" value="6">
                    <button class="btn-erase" id="btn-eraser" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-erase-all" onclick="CanvasEngine.clearAll()">[CLEAR ALL]</button>
                </div>
                
                <div class="action-group">
                    <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                    <button class="btn-core btn-record" id="btn-record" onclick="AudioEngine.toggle()">
                        <div class="dot"></div> <span id="record-text">Audio Log</span>
                    </button>
                    <button class="btn-core btn-submit" onclick="AITutor.submitWork()">Submit ✨</button>
                    <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
                </div>
            </div>
        </div>

        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">Bridge AI Tutor</div>
                <button class="btn-close-ai" onclick="AITutor.close()">×</button>
            </div>
            <div class="ai-content" id="ai-content"></div>
        </div>

        <audio id="bgm-ambient" loop crossorigin="anonymous"></audio>
    </div>

    <script>
        const CONFIG = {
            GITHUB_ID: "eunbeenlee", 
            REPO: "bridge-heritage",
            get STORAGE() { return `https://${this.GITHUB_ID}.github.io/${this.REPO}/assets/`; },
            SOUNDSCAPES: {
                "A": "https://cdn.freesound.org/previews/407/407519_5121236-lq.mp3",
                "B": "https://cdn.freesound.org/previews/515/515822_10984905-lq.mp3"
            }
        };

        const STATE = {
            studentName: "",
            isNameRegistered: false,
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1,
            isRecording: false,
            lastTranscript: ""
        };

        const UIEngine = {
            toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); },
            closeSidebarOnMobile() { if(window.innerWidth <= 992) document.getElementById('sidebar').classList.remove('open'); }
        };

        const AI_CONTEXT_DB = {
            "A-1": {
                theme: "All About Me",
                pages: {
                    1: { navTitle: "👑 My Special Name", keywords: ["name", "am", "is", "my", "hello"], intent: "Expressing name and identity", analysis: "The strokes show positive self-perception and confidence.", question: "What makes your name so special and beautiful?" },
                    2: { navTitle: "👀 My Beautiful Face", keywords: ["face", "eyes", "nose", "mouth", "happy", "smile"], intent: "Depicting face and emotions", analysis: "High observation skills shown in facial feature placement.", question: "What is your favorite part of your face, and why?" },
                    3: { navTitle: "🖐️ My Strong Hands", keywords: ["hands", "feet", "touch", "clap", "fingers"], intent: "Exploring body functions", analysis: "Shows a great understanding of body capabilities and motion.", question: "What fun things can you do with your strong hands?" },
                    4: { navTitle: "👨‍👩‍👧 My Family Tree", keywords: ["mom", "dad", "family", "brother", "sister", "love"], intent: "Understanding family connections", analysis: "Clear depiction of family members, showing strong emotional bonds.", question: "Who did you draw here, and what do you love about them?" },
                    5: { navTitle: "🎨 My Favorite Colors", keywords: ["color", "red", "blue", "green", "yellow", "favorite"], intent: "Expressing personal preferences", analysis: "Vibrant color choices reflect a highly energetic and positive mood.", question: "Why did you choose these beautiful colors?" }
                }
            }
        };

        function getPageContext(unitId, pageNum) {
            const unitData = AI_CONTEXT_DB[unitId];
            if (unitData && unitData.pages[pageNum]) return unitData.pages[pageNum];
            return { navTitle: "✨ Inquiry Lab", keywords: ["wow", "beautiful", "look", "this"], intent: "Creative problem-solving", analysis: "Approaches the question from multiple angles, showing critical thinking.", question: "Can you tell me more about the wonderful things you drew here?" };
        }

        const PageEngine = {
            init() {
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                const list = document.getElementById('nav-list');
                for(let i=1; i<=17; i++) {
                    const ctx = getPageContext(STATE.id, i);
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span class="nav-title" title="${ctx.navTitle}">${ctx.navTitle}</span> <span class="nav-badge">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => { this.load(i); UIEngine.closeSidebarOnMobile(); };
                    list.appendChild(item);
                }
                this.load(1);
            },
            load(n) {
                STATE.currentPage = n;
                STATE.lastTranscript = ""; 
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png`;
                
                const img = document.getElementById('worksheet-img');
                img.style.opacity = '0';
                img.src = imgPath;
                img.onload = () => {
                    img.style.opacity = '1';
                    setTimeout(() => CanvasEngine.sync(), 50);
                };

                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${n}`);
                if(activeNav) activeNav.classList.add('active');
                
                CanvasEngine.clearAll();
                AITutor.close();
            },
            move(dir) {
                const t = STATE.currentPage + dir;
                if(t >= 1 && t <= 17) this.load(t);
            }
        };

        /* ======================================================================
         * [V55.0 Classic Canvas Engine - 완벽한 좌표계 복원]
         * ====================================================================== */
        const CanvasEngine = {
            isDrawing: false,
            isErasing: false,
            lastColor: "#363431",
            
            init() {
                this.cvs = document.getElementById('draw-layer');
                this.ctx = this.cvs.getContext('2d', { willReadFrequently: true });
                this.img = document.getElementById('worksheet-img');
                this.container = document.getElementById('canvas-container');
                
                document.getElementById('btn-color').onclick = () => document.getElementById('native-color-picker').click();
                document.getElementById('native-color-picker').onchange = (e) => {
                    this.lastColor = e.target.value;
                    document.getElementById('btn-color').style.background = this.lastColor;
                    if(!this.isErasing) this.ctx.strokeStyle = this.lastColor;
                };
                this.bind();
            },
            
            toggleEraser() {
                const btn = document.getElementById('btn-eraser');
                this.isErasing = !this.isErasing;
                
                if (this.isErasing) {
                    btn.classList.add('active');
                    btn.innerText = "PEN MODE";
                    this.container.classList.remove('drawing-mode');
                    this.container.classList.add('erasing-mode');
                    this.ctx.globalCompositeOperation = 'destination-out';
                    this.ctx.lineWidth = document.getElementById('brush-size').value * 2;
                } else {
                    btn.classList.remove('active');
                    btn.innerText = "ERASER";
                    this.container.classList.remove('erasing-mode');
                    this.container.classList.add('drawing-mode');
                    this.ctx.globalCompositeOperation = 'source-over';
                    this.ctx.strokeStyle = this.lastColor;
                    this.ctx.lineWidth = document.getElementById('brush-size').value;
                }
            },
            
            bind() {
                const getPos = (e) => {
                    const rect = this.cvs.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    // 스케일 계산으로 브라우저 크기에 완벽하게 좌표 매핑
                    const scaleX = this.cvs.width / rect.width;
                    const scaleY = this.cvs.height / rect.height;
                    
                    return { 
                        x: (clientX - rect.left) * scaleX, 
                        y: (clientY - rect.top) * scaleY 
                    };
                };

                const start = (e) => { 
                    e.preventDefault(); 
                    this.isDrawing = true; 
                    const p = getPos(e); 
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y); 
                };
                
                const move = (e) => { 
                    if(!this.isDrawing) return; 
                    e.preventDefault(); 
                    const p = getPos(e); 
                    this.ctx.lineTo(p.x, p.y); 
                    this.ctx.stroke(); 
                };
                
                const stop = (e) => { 
                    if(this.isDrawing) { 
                        this.isDrawing = false; 
                        HapticEngine.trigger('light'); 
                    } 
                };

                this.cvs.addEventListener('mousedown', start, { passive: false });
                this.cvs.addEventListener('mousemove', move, { passive: false });
                window.addEventListener('mouseup', stop);
                window.addEventListener('mouseleave', stop);
                
                this.cvs.addEventListener('touchstart', start, { passive: false });
                this.cvs.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', stop);
                window.addEventListener('touchcancel', stop);
                
                document.getElementById('brush-size').oninput = (e) => { 
                    const multiplier = this.isErasing ? 2 : 1;
                    this.ctx.lineWidth = e.target.value * multiplier; 
                };
            },
            sync() {
                const rect = this.img.getBoundingClientRect();
                if(rect.width === 0) return; 
                
                const tempCvs = document.createElement('canvas');
                tempCvs.width = this.cvs.width; tempCvs.height = this.cvs.height;
                if(this.cvs.width > 0) tempCvs.getContext('2d').drawImage(this.cvs, 0, 0);

                // 캔버스 내부 해상도를 실제 보이는 크기와 일치시킴
                this.cvs.width = rect.width; 
                this.cvs.height = rect.height;
                this.cvs.style.width = '100%'; 
                this.cvs.style.height = '100%';
                
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                this.ctx.globalCompositeOperation = this.isErasing ? 'destination-out' : 'source-over';
                this.ctx.strokeStyle = this.isErasing ? "rgba(0,0,0,1)" : this.lastColor;
                const multiplier = this.isErasing ? 2 : 1;
                this.ctx.lineWidth = document.getElementById('brush-size').value * multiplier;
                
                if(tempCvs.width > 0) { this.ctx.drawImage(tempCvs, 0, 0, tempCvs.width, tempCvs.height, 0, 0, this.cvs.width, this.cvs.height); }
            },
            clearAll() { 
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                this.ctx.beginPath(); 
                HapticEngine.trigger('heavy'); 
                if(this.isErasing) this.toggleEraser();
            }
        };

        const AmbientEngine = {
            isPlaying: false, audio: document.getElementById('bgm-ambient'),
            init() { this.audio.src = CONFIG.SOUNDSCAPES[STATE.id.charAt(0)] || CONFIG.SOUNDSCAPES["A"]; this.audio.volume = 0.2; },
            toggle() {
                const btn = document.getElementById('soundscape-btn');
                if(!this.isPlaying) { this.audio.play().catch(e=>{}); this.isPlaying = true; btn.classList.add('active'); btn.innerHTML = "🎵 <span>Soundscape:</span> ON"; }
                else { this.audio.pause(); this.isPlaying = false; btn.classList.remove('active'); btn.innerHTML = "🎵 <span>Soundscape:</span> OFF"; }
            }
        };
        const HapticEngine = { trigger(type) { if(navigator.vibrate) navigator.vibrate(type === 'light' ? 20 : [30, 50, 30]); } };

        const AudioEngine = {
            recognition: null,
            init() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'en-US';
                    this.recognition.interimResults = false;
                    this.recognition.continuous = false;

                    this.recognition.onresult = (event) => { STATE.lastTranscript = event.results[0][0].transcript; };
                    this.recognition.onend = () => { if (STATE.isRecording) this.toggle(); };
                    this.recognition.onerror = (e) => { if (STATE.isRecording) this.toggle(); };
                }
            },
            toggle() {
                const btn = document.getElementById('btn-record'); const text = document.getElementById('record-text');
                if(!STATE.isRecording) { 
                    STATE.isRecording = true; STATE.lastTranscript = ""; btn.classList.add('recording'); text.innerText = "Listening..."; HapticEngine.trigger('light'); 
                    if(this.recognition) { try { this.recognition.start(); } catch(e) {} }
                } else { 
                    STATE.isRecording = false; btn.classList.remove('recording'); text.innerText = "Audio Log"; HapticEngine.trigger('heavy'); 
                    if(this.recognition) { this.recognition.stop(); }
                }
            }
        };

        const AITutor = {
            submitWork() {
                HapticEngine.trigger('heavy');
                if(STATE.isRecording) AudioEngine.toggle(); 
                if (STATE.currentPage === 1 && !STATE.isNameRegistered) { this.scanHandwritingForName(); return; }
                this.provideFeedback();
            },
            
            scanHandwritingForName() {
                const panel = document.getElementById('ai-panel'); const content = document.getElementById('ai-content'); const scanLine = document.getElementById('canvas-scan-line');
                panel.classList.add('open'); scanLine.style.display = 'block'; 
                
                content.innerHTML = `<div style="text-align:center; padding: 50px 0;"><div style="width:50px; height:50px; border:4px solid #EEE; border-top-color:var(--br-green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div><p style="font-size:13px; color:var(--br-muted); font-weight:900; letter-spacing:3px;">SCANNING HANDWRITING...</p></div>`;

                setTimeout(() => {
                    scanLine.style.display = 'none'; 
                    content.innerHTML = `<div class="ai-bubble"><b>Bridge Visual AI</b><br><br>Great handwriting! Please confirm your name spelling below to start your 1:1 voice tutoring session.<input type="text" id="ai-name-verify" class="ai-name-input" placeholder="e.g. Olivia" autocomplete="off" onkeypress="if(event.key === 'Enter') AITutor.saveName()"><button class="ai-name-btn" onclick="AITutor.saveName()">CONFIRM NAME</button></div>`;
                    setTimeout(() => document.getElementById('ai-name-verify').focus(), 100);
                }, 2000);
            },

            saveName() {
                const nameInput = document.getElementById('ai-name-verify').value.trim();
                if(nameInput) {
                    STATE.studentName = nameInput; STATE.isNameRegistered = true;
                    document.getElementById('profile-box').classList.add('registered'); document.getElementById('display-student-name').innerText = nameInput; document.getElementById('avatar-char').innerText = nameInput.charAt(0).toUpperCase(); document.querySelector('.profile-role').innerText = "Bridge Inquirer";
                    this.provideFeedback(true);
                } else { alert("Please enter your name."); }
            },

            provideFeedback(isFirstGreeting = false) {
                const panel = document.getElementById('ai-panel'); const content = document.getElementById('ai-content'); panel.classList.add('open');
                const contextData = getPageContext(STATE.id, STATE.currentPage); const callName = STATE.studentName ? STATE.studentName : "my friend";
                
                let transcriptHtml = ""; let analysisMod = contextData.analysis; let confidenceLvl = Math.floor(Math.random() * 15) + 65; 
                
                if (STATE.lastTranscript) {
                    transcriptHtml = `<div class="transcript-box">" ${STATE.lastTranscript} "</div>`;
                    const spokenWords = STATE.lastTranscript.toLowerCase(); const hitKeywords = contextData.keywords.filter(kw => spokenWords.includes(kw));
                    
                    if (hitKeywords.length > 0) {
                        confidenceLvl = Math.floor(Math.random() * 5) + 95;
                        analysisMod = `<b style="color:var(--br-green);">Perfect Audio Match!</b> I heard you mention words like '<b>${hitKeywords.join(", ")}</b>'. ${contextData.analysis}`;
                    } else {
                        confidenceLvl = Math.floor(Math.random() * 10) + 85; 
                        analysisMod = `<b>Great Speaking!</b> I heard your voice clearly. ${contextData.analysis}`;
                    }
                } else { transcriptHtml = `<div class="transcript-empty">(No voice log detected. Try using the Audio Log!)</div>`; }
                
                let introText = isFirstGreeting ? `<b>Nice to meet you, ${callName}!</b><br><br>I scanned your beautiful name. Now let's explore together.<br><br>` : `<b>Hello, ${callName}!</b><br><br>I looked at your drawing and listened to your voice.<br><br>`;

                content.innerHTML = `<div class="analytics-box"><div class="analytics-title">Inquiry Analytics</div>${transcriptHtml}<div class="stat-row"><div class="stat-label"><span>Voice Confidence</span> <span>${confidenceLvl}%</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${confidenceLvl}%;"></div></div></div><div class="visual-intent"><b>🎯 Intent Analysis: ${contextData.intent}</b><br><br>${analysisMod}</div></div><div class="ai-bubble">${introText}<b style="font-size:18px; color:var(--br-green);">${contextData.question}</b></div>`;
                
                let speechText = isFirstGreeting ? `Nice to meet you, ${callName}. ${contextData.question}` : `Hello, ${callName}. ${contextData.question}`;
                this.speak(speechText);
            },
            
            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US'; utterance.rate = 0.85; utterance.pitch = 1.2; window.speechSynthesis.speak(utterance);
                }
            },
            
            close() { document.getElementById('ai-panel').classList.remove('open'); if('speechSynthesis' in window) window.speechSynthesis.cancel(); }
        };

        let resizeTimer;
        window.onload = () => {
            PageEngine.init(); CanvasEngine.init(); AmbientEngine.init(); AudioEngine.init(); 
            window.addEventListener('resize', () => { 
                clearTimeout(resizeTimer); 
                resizeTimer = setTimeout(() => { 
                    if(document.getElementById('worksheet-img').style.opacity === '1') {
                        CanvasEngine.sync(); 
                    }
                }, 200); 
            });
        };
    </script>
</body>
</html>
