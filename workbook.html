<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium AI Lab Workbook</title>
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* 핵심 컬러 팔레트 */
        :root {
            --br-green: #91D3B4; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            --br-error: #E74C3C; 
            --br-ai: #F8FAFF;
            --sidebar-width: 320px;
        }

        /* ----------------------------------------------------------------------
           RESET & BASE STYLES
        ---------------------------------------------------------------------- */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body { 
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Pretendard', sans-serif; 
            pointer-events: auto !important; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        button { 
            border: none; 
            background: none; 
            font-family: inherit; 
            cursor: pointer; 
            outline: none; 
        }
        
        .app-container { 
            display: flex; 
            width: 100vw; 
            height: 100dvh; 
            position: relative; 
            pointer-events: auto !important; 
        }
        
        /* ----------------------------------------------------------------------
           SIDEBAR (Curriculum Navigation)
        ---------------------------------------------------------------------- */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            background: var(--br-paper); 
            border-right: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            flex-shrink: 0; 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
        }

        .sidebar-header { 
            padding: 30px; 
            text-align: center; 
            border-bottom: 1px solid var(--br-border); 
            cursor: pointer; 
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 26px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
            font-weight: 700; 
        }
        
        /* ----------------------------------------------------------------------
           STUDENT PROFILE WIDGET
        ---------------------------------------------------------------------- */
        .student-profile { 
            padding: 25px 30px; 
            border-bottom: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #FAFAFA; 
            transition: background-color 0.3s ease; 
        }

        .student-profile.registered { 
            background: var(--br-ai); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .profile-avatar { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            background: var(--br-border); 
            color: #FFF; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 20px; 
            font-family: 'Nunito', sans-serif; 
            transition: all 0.3s ease; 
        }

        .student-profile.registered .profile-avatar { 
            background: var(--br-gold); 
            box-shadow: 0 5px 15px rgba(203,174,117,0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .profile-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 17px; 
            font-weight: 900; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            text-transform: uppercase; 
            color: var(--br-charcoal); 
            letter-spacing: 0.5px; 
        }

        .profile-role { 
            font-family: 'Pretendard', sans-serif; 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--br-muted); 
            letter-spacing: 1px; 
        }
        
        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
        }

        .badge { 
            font-size: 11px; 
            padding: 4px 10px; 
            border-radius: 12px; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* ----------------------------------------------------------------------
           NAVIGATION LIST
        ---------------------------------------------------------------------- */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }

        .nav-list::-webkit-scrollbar { 
            width: 5px; 
        }
        
        .nav-list::-webkit-scrollbar-thumb { 
            background: #E8E6E1; 
            border-radius: 10px; 
        }

        .nav-item { 
            padding: 16px 18px; 
            margin-bottom: 8px; 
            border-radius: 12px; 
            background: #FAFAFA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1); 
            border: 1px solid transparent; 
        }

        .nav-item:hover { 
            background: #FFF; 
            border-color: var(--br-border); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); 
            transform: translateY(-1px); 
        }

        .nav-item.active { 
            background: var(--br-ai); 
            border-left: 5px solid var(--br-green); 
            border-color: transparent; 
            box-shadow: 0 4px 15px rgba(145, 211, 180, 0.1); 
        }

        .nav-title { 
            font-family: 'Pretendard', sans-serif; 
            font-size: 13px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 170px; 
        }

        .nav-item.active .nav-title { 
            font-weight: 900; 
            color: var(--br-green); 
        }

        .nav-badge { 
            font-family: 'Nunito', sans-serif; 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--br-muted); 
            letter-spacing: 0.5px; 
        }
        
        .nav-item.active .nav-badge { 
            color: var(--br-green); 
            opacity: 1; 
        }

        /* ----------------------------------------------------------------------
           MAIN WORKSPACE & STAGE
        ---------------------------------------------------------------------- */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            min-width: 0; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: 80px; 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            flex-shrink: 0; 
            z-index: 10; 
            background: #FFF; 
        }

        .unit-info { 
            font-family: 'Nunito', sans-serif; 
            font-size: 11px; 
            font-weight: 900; 
            color: var(--br-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }

        .page-info { 
            font-family: 'Playfair Display', serif; 
            font-size: 32px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            margin-top: 2px; 
            letter-spacing: -0.5px; 
        }
        
        .stage-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 30px 40px; 
            background: var(--br-bg); 
            perspective: 1000px; 
            pointer-events: auto !important; 
            overflow: hidden; 
        }

        .drawing-board { 
            position: relative; 
            display: inline-flex; 
            line-height: 0; 
            border-radius: 15px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.08); 
            background: #FFF; 
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-origin: center; 
            pointer-events: auto !important; 
        }

        .drawing-board.fade-out { 
            opacity: 0; 
            transform: scale(0.96) translateY(15px); 
            pointer-events: none !important; 
        }

        #worksheet-img { 
            display: block; 
            max-width: 100%; 
            max-height: calc(100dvh - 240px); 
            width: auto; 
            height: auto; 
            border-radius: 15px; 
            pointer-events: none !important; 
            opacity: 0; 
            transition: opacity 0.3s; 
            user-select: none; 
        }

        #draw-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 9999 !important; 
            touch-action: none; 
            pointer-events: auto !important; 
            border-radius: 15px; 
            cursor: crosshair; 
        }

        /* ----------------------------------------------------------------------
           BOTTOM DOCK & TOOLS
        ---------------------------------------------------------------------- */
        .bottom-dock { 
            height: 100px; 
            background: rgba(255, 255, 255, 0.98); 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 40px; 
            flex-shrink: 0; 
            z-index: 500; 
        }

        .tool-group { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: #FAFAFA; 
            padding: 10px 25px; 
            border-radius: 100px; 
            border: 1px solid var(--br-border); 
        }

        .color-preview { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            border: 3px solid #FFF; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: transform 0.2s;
        }

        .color-preview:active {
            transform: scale(0.9);
        }
        
        .btn-magic { 
            font-size: 20px; 
            padding: 5px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            filter: grayscale(100%); 
        }

        .btn-magic.active { 
            filter: grayscale(0%); 
            transform: scale(1.25); 
        }

        .brush-slider { 
            width: 90px; 
            accent-color: var(--br-green); 
            cursor: pointer; 
            height: 6px; 
        }

        .btn-tool { 
            font-size: 16px; 
            font-weight: 900; 
            padding: 8px 12px; 
            color: var(--br-charcoal); 
            cursor: pointer; 
            transition: 0.2s; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            border-radius: 10px; 
        }

        .btn-tool:active { 
            transform: scale(0.9); 
        }

        .btn-erase { 
            font-size: 13px; 
            font-weight: 900; 
            padding: 10px 15px; 
            border-radius: 12px; 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            cursor: pointer; 
            transition: 0.3s; 
            color: var(--br-charcoal); 
        }

        .btn-erase.active { 
            background: var(--br-error); 
            color: #FFF; 
            border-color: var(--br-error); 
        }
        
        /* ----------------------------------------------------------------------
           ACTION BUTTONS
        ---------------------------------------------------------------------- */
        .action-group { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
        }

        .btn-nav { 
            width: 55px; 
            height: 55px; 
            border-radius: 15px; 
            border: 1px solid var(--br-border); 
            background: #FFF; 
            font-size: 22px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            color: var(--br-charcoal); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); 
        }

        .btn-nav:hover {
            background: #FAFAFA;
            border-color: var(--br-charcoal);
        }

        .btn-nav:active { 
            transform: scale(0.9); 
        }

        .btn-main { 
            height: 55px; 
            padding: 0 25px; 
            border-radius: 15px; 
            font-weight: 900; 
            font-size: 14px; 
            letter-spacing: 1px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1); 
            text-transform: uppercase; 
            font-family: 'Nunito', sans-serif; 
        }

        .btn-record { 
            background: #FFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
        }

        .btn-record:hover {
            border-color: var(--br-error);
            color: var(--br-error);
        }

        .btn-record.recording { 
            background: #FFF0F0; 
            color: var(--br-error); 
            border-color: var(--br-error); 
            box-shadow: inset 0 0 0 2px var(--br-error); 
        }

        .btn-record .dot { 
            width: 10px; 
            height: 10px; 
            background: var(--br-error); 
            border-radius: 50%; 
            opacity: 0; 
            transition: 0.3s;
        }

        .btn-record.recording .dot { 
            opacity: 1; 
            animation: blink 1s infinite; 
        }

        .btn-submit { 
            background: var(--br-charcoal); 
            color: #FFF; 
            box-shadow: 0 10px 20px rgba(54,52,49,0.2);
        }

        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px rgba(54,52,49,0.3); 
            background: var(--br-gold);
        }

        .btn-submit:active { 
            transform: scale(0.95); 
        }

        /* ----------------------------------------------------------------------
           AI TUTOR PANEL (Gemini Integration)
        ---------------------------------------------------------------------- */
        .ai-panel { 
            position: absolute; 
            top: 0; 
            right: -450px; 
            width: 450px; 
            height: 100%; 
            background: #FFF; 
            box-shadow: -20px 0 50px rgba(0,0,0,0.15); 
            z-index: 10001; 
            transition: right 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--br-border); 
        }

        .ai-panel.open { 
            right: 0; 
        }

        .ai-header { 
            padding: 25px 30px; 
            background: var(--br-ai); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            flex-shrink: 0; 
        }

        .ai-title { 
            font-family: 'Jua', sans-serif; 
            font-size: 22px; 
            color: var(--br-green); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .btn-close-ai { 
            font-size: 32px; 
            color: var(--br-muted); 
            line-height: 1; 
            cursor: pointer; 
            transition: 0.3s; 
        }

        .btn-close-ai:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }
        
        .ai-content { 
            padding: 25px 30px; 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scroll-behavior: smooth; 
        }
        
        .chat-bubble { 
            max-width: 85%; 
            padding: 18px 22px; 
            border-radius: 20px; 
            font-size: 15px; 
            line-height: 1.6; 
            font-weight: 500; 
            word-break: keep-all; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background: #F8F9FA; 
            border-bottom-left-radius: 5px; 
            border: 1px solid var(--br-border); 
            color: var(--br-text); 
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background: var(--br-green); 
            color: #FFF; 
            border-bottom-right-radius: 5px; 
            box-shadow: 0 5px 15px rgba(137,191,160,0.25); 
        }

        /* ----------------------------------------------------------------------
           AI ANALYTICS CARD
        ---------------------------------------------------------------------- */
        .analytics-card { 
            background: #FAFAFA; 
            border: 1px solid var(--br-border); 
            border-radius: 20px; 
            padding: 25px; 
            align-self: stretch; 
            animation: popIn 0.4s ease; 
            margin-bottom: 5px; 
        }

        .analytics-title { 
            font-family: 'Nunito', sans-serif; 
            color: var(--br-gold); 
            font-size: 13px; 
            margin-bottom: 20px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px dashed var(--br-border); 
            padding-bottom: 10px; 
        }

        .stat-row { 
            margin-bottom: 15px; 
        }

        .stat-label { 
            font-size: 12px; 
            font-weight: 800; 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            color: var(--br-charcoal); 
        }

        .bar-bg { 
            width: 100%; 
            height: 8px; 
            background: #E8E6E1; 
            border-radius: 10px; 
            overflow: hidden; 
        }

        .bar-fill { 
            height: 100%; 
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 10px; 
        }

        .voice-fx-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 25px; 
            justify-content: center; 
            border-top: 1px dashed var(--br-border); 
            padding-top: 20px; 
        }

        .btn-fx { 
            padding: 10px 15px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            border: 1px solid var(--br-border); 
            background: #FFF; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: var(--br-charcoal); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
        }

        .btn-fx:hover { 
            background: var(--br-ai); 
            border-color: var(--br-green); 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(145,211,180,0.2); 
            color: var(--br-green); 
        }

        /* ----------------------------------------------------------------------
           CHAT FOOTER (Input Area)
        ---------------------------------------------------------------------- */
        .chat-footer { 
            padding: 25px 30px; 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #FFF; 
        }

        .btn-reply { 
            width: 100%; 
            height: 60px; 
            background: var(--br-charcoal); 
            color: #FFF; 
            border-radius: 18px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 16px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            font-family: 'Nunito', sans-serif; 
            box-shadow: 0 10px 20px rgba(54,52,49,0.2); 
        }

        .btn-reply:hover { 
            background: var(--br-gold); 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px rgba(203,174,117,0.3); 
        }

        .btn-reply.recording { 
            background: var(--br-error); 
            animation: pulse 1.5s infinite; 
            box-shadow: 0 10px 20px rgba(231,76,60,0.3); 
        }

        .btn-next-page { 
            width: 100%; 
            height: 60px; 
            background: var(--br-blue); 
            color: #FFF; 
            border-radius: 18px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 10px 20px rgba(124,166,193,0.3); 
            font-size: 16px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Nunito', sans-serif; 
        }

        .btn-next-page:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 25px rgba(124,166,193,0.4); 
            filter: brightness(1.1); 
        }

        .btn-next-page:active { 
            transform: scale(0.95); 
        }

        /* ----------------------------------------------------------------------
           MODALS & OVERLAYS
        ---------------------------------------------------------------------- */
        .rgb-modal { 
            position: absolute; 
            bottom: 120px; 
            left: 40px; 
            background: #FFF; 
            border-radius: 25px; 
            padding: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            z-index: 5000; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
            transition: 0.3s ease;

        @keyframes popIn {

        @keyframes blink {

        @keyframes pulse { 
            0% { opacity: 0.8; transform: scale(0.98); } 
            50% { opacity: 1; transform: scale(1.02); }

                const stateData = { 
                    name: STATE.studentName, 
                    reg: STATE.isNameRegistered, 
                    page: STATE.currentPage, 
                    badges: STATE.badges 
                };
                
                try {
                    localStorage.setItem(`br_v105_${STATE.uid}_${STATE.id}`, JSON.stringify(stateData));

                        ...stateData,
                        email: STATE.studentEmail,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.error("Storage Error:", e);
                }
            },
            
            load() {
                if(!STATE.uid) return;
                try {
                    const s = JSON.parse(localStorage.getItem(`br_v105_${STATE.uid}_${STATE.id}`) || "{}");
                    if (s.name) STATE.studentName = s.name; 
                    if (s.reg) STATE.isNameRegistered = s.reg;

                    if (s.badges) STATE.badges = s.badges;
                } catch (e) {
                    console.error("Load Error:", e);
                }
            },
            
            saveCanvas() {
                if (!CanvasEngine.cvs || !STATE.uid) return;

                    const canvasData = CanvasEngine.cvs.toDataURL('image/webp', 0.5);
                    localStorage.setItem(`br_cvs_${STATE.uid}_${STATE.id}_${STATE.currentPage}`, canvasData);

                        unitId: STATE.id,
                        page: STATE.currentPage,
                        image: canvasData,
                        transcript: STATE.lastTranscript || "",
                        confidence: STATE.sttConfidence || 0,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (e) {
                    console.error("Canvas Save Error:", e);

                if(!STATE.uid) return;

                        const img = new Image();
                        img.onload = () => {

                            CanvasEngine.saveHistory();
                        };
                        img.src = localData;
                    } else {
                        CanvasEngine.saveHistory();
                    }

                    console.error("Canvas Load Error:", e);
                    CanvasEngine.saveHistory();
                }
            }

            // [🔥 CORE LLM COMMUNICATION & PROMPT INJECTION]
            // ------------------------------------------------------------------
            async callGeminiAPI(promptText, base64Image = null) {
                if (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                    return "앗! 원장님, 진짜 대화를 위해 코드 하단의 CONFIG에 Gemini API 키를 넣어주세요. 임시 답변: James, you did a great job today!";
                }
                try {
                    let parts = [{ text: promptText }];
                    
                    if (base64Image) {
                        const base64Data = base64Image.split(',')[1];
                        parts.push({
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Data
                            }
                        });
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${CONFIG.GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: parts }],
                            generationConfig: {
                                temperature: 0.7, 
                                maxOutputTokens: 250 
                            }
                        })
                    });
                    
                    const data = await response.json();
                    if (data.candidates && data.candidates.length > 0) {
                        return data.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Invalid format");
                    }
                } catch (error) {
                    console.error("Gemini Error:", error);
                    return "Oh no, 선생님이 잠깐 생각에 잠겼어요. 다시 한번 말해줄래요?";
                }
            },

            async generateFeedback(isFirstGreeting, canvasImageBase64) {
                const content = document.getElementById('ai-content');
                const unitData = PAGE_INTELLIGENCE[STATE.id];
                const context = unitData ? unitData[STATE.currentPage] : { keywords:[], goal:"Explore", question:"Tell me more!" };
                const callName = STATE.studentName || "my friend";
                const transcript = STATE.lastTranscript;
                const scorePronunciation = STATE.sttConfidence || 0;
                
                if (scorePronunciation >= 80 && transcript.length > 0) {
                    setTimeout(() => { 
                        if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); 
                        UIEngine.awardBadge("🗣️ Great Speaker"); 
                    }, 500);
                }

                let transcriptUI = transcript ? `<div style="background:#F4F8F5; padding:15px; border-radius:12px; border-left:4px solid var(--br-green); font-style:italic; font-size:15px; margin-bottom:20px; color:var(--br-charcoal);">"${transcript}"</div>` : "";
                let voiceFxUI = transcript ? `<div class="voice-fx-group"><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('normal')">▶️ Normal</div><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('chipmunk')">🐿️ Chipmunk</div><div class="btn-fx" onclick="AudioEngine.playVoiceEffect('alien')">👽 Alien</div></div>` : "";
                
                let statsHTML = `
                    <div class="analytics-card">
                        <div class="analytics-title">📊 Mission: ${context.goal}</div>
                        ${transcriptUI}
                        <div class="stat-row">
                            <div class="stat-label"><span>Clear Voice</span><span>${scorePronunciation}%</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${scorePronunciation}%; background:var(--br-blue)"></div></div>
                        </div>
                        ${voiceFxUI}
                    </div>
                    <div id="gemini-response-box" class="chat-bubble ai mt-2"><i class="fa-solid fa-circle-notch fa-spin"></i> 선생님이 분석 중이에요...</div>
                `;
                
                content.innerHTML = statsHTML;
                document.getElementById('chat-footer').style.display = "none";

                // ------------------------------------------------------------------
                // [🔥 북미 원어민 교사 프롬프트 (North American ECE Persona)]
                // ------------------------------------------------------------------
                let systemPrompt = "";
                if (isFirstGreeting) {
                    systemPrompt = `You are a highly empathetic, professional, and enthusiastic native English teacher at a premium private early childhood academy in North America (Canada/USA). Your name is Teacher AI.
                    The student's name is ${callName}. They just joined the class. The topic today is "${context.goal}".
                    
                    Instructions:
                    1. Welcome them warmly using common North American classroom phrases (e.g., "Welcome to our class!", "I am so incredibly proud of you!").
                    2. Use the 'Sandwich Feedback' framework: Praise, Observation, Engaging Question.
                    3. Mix Korean and English naturally so the child feels comfortable (e.g., "만나서 정말 반가워요!").
                    4. Keep it exactly 2-3 short sentences. No markdown formatting.`;
                } else {
                    let speechContext = transcript ? `The student just said: "${transcript}".` : "The student hasn't spoken yet.";
                    
                    systemPrompt = `You are a highly empathetic and enthusiastic native English teacher at a premium private academy in North America (Canada/USA). Your name is Teacher AI.
                    - Student Name: ${callName}
                    - Current Lesson Goal: ${context.goal}
                    - Audio Context: ${speechContext}
                    
                    Instructions:
                    1. I have attached the student's drawing (image). You MUST look at the image carefully.
                    2. Provide "Sandwich Feedback" (Praise -> Specific Observation -> Engaging Follow-up Question).
                    3. Mix Korean and English naturally like a bilingual teacher (e.g., "Wow, James! 빨간색을 정말 멋지게 칠했네!").
                    4. ACTIVELY describe WHAT you see in the drawing. Even if it's scribbles, praise the specific colors they used or guess what it is based on the lesson goal. Example: "I love the beautiful blue lines you drew!"
                    5. Respond directly and warmly to what they said in the Audio Context.
                    6. End with a fun follow-up question.
                    7. Keep it under 4 short sentences. Plain text only. No markdown.`;
                }

                const aiResponse = await this.callGeminiAPI(systemPrompt, canvasImageBase64);
                
                STATE.chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });

                document.getElementById('gemini-response-box').innerHTML = aiResponse;
                document.getElementById('chat-footer').style.display = "flex";
                
                this.speak(aiResponse.replace(/<[^>]*>?/gm, ''));
            },

            async processReply() {
                if (!STATE.lastTranscript) return;
                
                const content = document.getElementById('ai-content');
                
                const uBubble = document.createElement('div'); 
                uBubble.className = "chat-bubble user mt-4"; 
                uBubble.innerText = STATE.lastTranscript;
                content.appendChild(uBubble); 
                content.scrollTop = content.scrollHeight;

                const aBubble = document.createElement('div'); 
                aBubble.className = "chat-bubble ai mt-4"; 
                aBubble.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> 선생님이 대답을 생각하고 있어요...`;
                content.appendChild(aBubble); 
                content.scrollTop = content.scrollHeight;

                STATE.chatHistory.push({ role: "user", parts: [{ text: STATE.lastTranscript }] });

                let conversationPrompt = `You are a friendly North American bilingual English teacher. 
                Respond to the student's latest statement: "${STATE.lastTranscript}". 
                
                Instructions:
                1. Keep it extremely short (1-2 sentences).
                2. Be very enthusiastic and encouraging.
                3. Use a mix of easy Korean and simple English.
                4. Ask another fun question to continue the flow. Plain text only.`;
                
                const reply = await this.callGeminiAPI(conversationPrompt);
                
                STATE.chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                aBubble.innerHTML = `<b style="color:var(--br-green); font-weight:700;">${reply}</b>`;
                content.scrollTop = content.scrollHeight;
                
                this.speak(reply);
            },

            speak(t) {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(t); 
                    u.lang = 'ko-KR'; 
                    u.rate = 0.95; 
                    window.speechSynthesis.speak(u);
                }
            },
            
            close() { 
                document.getElementById('ai-panel').classList.remove('open'); 
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel(); 
                }
            }
        };

        /**
         * 10. SYSTEM BOOT
         */
        function SystemBoot() {
            StorageEngine.load();
            UIEngine.renderBadges();
            
            CanvasEngine.init(); 
            RGBRingEngine.init(); 
            PageEngine.init(); 
            AudioEngine.init();
            VisualAI_OCR.init(); 
            VisionAI_Doodle.init();
            
            setTimeout(() => { 
                CanvasEngine.resizeCanvas(); 
                StorageEngine.loadCanvas(); 
            }, 300);
        }
    </script>
</body>
