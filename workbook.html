<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- [V48.0 핵심] 모바일/태블릿 완벽 대응을 위한 Viewport 고정 및 스크롤 바운스 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bridge Academy | Universal EdTech Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ======================================================================
         * [Architecture: Bridge Universal System V48.0]
         * Feature: Omnichannel Responsive Design & Socratic AI
         * ====================================================================== */
        :root {
            --br-green: #89BFA0; --br-gold: #CBAE75; --br-blue: #7CA6C1; --br-charcoal: #363431;
            --br-bg: #FCFBF9; --br-paper: #FFFFFF; --br-text: #2A2825; --br-muted: #8C8985;
            --br-border: #F0EFEB; --br-error: #E74C3C; --br-ai: #F4F8F5;
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            
            --sidebar-width: 320px;
            --dock-height-pc: 130px;
            --dock-height-mobile: 100px;
            
            /* 디바이스 높이에 따른 동적 캔버스 계산 */
            --stage-max-height: calc(100dvh - var(--dock-height-pc) - 100px);
        }

        /* [Reset & Touch Optimization] */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body, html { width: 100%; height: 100dvh; /* dvh 사용으로 모바일 브라우저 주소창 이슈 해결 */ overflow: hidden; background-color: var(--br-bg); color: var(--br-text); font-family: 'Noto Sans KR', sans-serif; overscroll-behavior: none; }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }
        
        .app-container { display: flex; width: 100vw; height: 100dvh; position: relative; }
        
        /* --------------------------------------------------
         * [Responsive Sidebar Navigation]
         * -------------------------------------------------- */
        .sidebar { width: var(--sidebar-width); height: 100dvh; background: var(--br-paper); border-right: 1px solid var(--br-border); display: flex; flex-direction: column; z-index: 1000; transition: transform 0.4s var(--ease-lux); }
        .sidebar-header { padding: 40px 30px 30px; text-align: center; border-bottom: 1px solid var(--br-border); cursor: pointer; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--br-charcoal); }
        .brand-logo span { color: var(--br-green); font-style: italic; }
        
        .student-profile { padding: 20px 30px; border-bottom: 1px solid var(--br-border); display: flex; align-items: center; gap: 15px; background: #FAFAFA; transition: 0.5s; }
        .student-profile.registered { background: #F4F8F5; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--br-border); color: var(--br-muted); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 22px; transition: 0.5s; flex-shrink: 0; }
        .student-profile.registered .profile-avatar { background: var(--br-gold); color: #FFF; box-shadow: 0 10px 20px rgba(203,174,117,0.3); }
        .profile-info { display: flex; flex-direction: column; overflow: hidden; }
        .profile-name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-role { font-size: 11px; color: var(--br-muted); letter-spacing: 1px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-list::-webkit-scrollbar { width: 6px; }
        .nav-list::-webkit-scrollbar-thumb { background: #E0E0E0; border-radius: 10px; }
        .nav-item { padding: 18px 20px; margin-bottom: 10px; border-radius: 16px; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; cursor: pointer; border: 1px solid transparent; }
        .nav-item.active { background: var(--br-ai); border-left: 6px solid var(--br-green); font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        
        /* --------------------------------------------------
         * [Workspace & Fluid Canvas]
         * -------------------------------------------------- */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--br-bg); height: 100dvh; overflow: hidden; }
        .top-bar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10; flex-shrink: 0; }
        .unit-info { font-size: 13px; font-weight: 900; color: var(--br-gold); letter-spacing: 5px; }
        .page-info { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; color: var(--br-charcoal); line-height: 1; margin-top: 5px; }
        
        .soundscape-ui { display: flex; align-items: center; gap: 8px; background: #FFF; padding: 12px 20px; border-radius: 100px; border: 1px solid var(--br-border); font-size: 12px; font-weight: 900; color: var(--br-muted); cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .soundscape-ui.active { color: var(--br-blue); border-color: var(--br-blue); }

        /* V48.0 Stage: Flex를 활용하여 브라우저 크기에 맞춰 캔버스가 우아하게 리사이징됨 */
        .stage-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px 40px 20px; position: relative; overflow: hidden; }
        .canvas-container { position: relative; background: var(--br-paper); border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); border: 1px solid var(--br-border); max-width: 100%; max-height: var(--stage-max-height); display: flex; justify-content: center; align-items: center; }
        
        .canvas-container.drawing-mode { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 24 24' fill='none' stroke='%23363431' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'/></svg>") 0 36, crosshair; }
        
        #worksheet-img { max-width: 100%; max-height: var(--stage-max-height); border-radius: 30px; opacity: 0; transition: opacity 0.5s; user-select: none; -webkit-user-drag: none; display: block; object-fit: contain; }
        #draw-layer { position: absolute; top: 0; left: 0; border-radius: 30px; touch-action: none; z-index: 50; }

        .scan-line { width: 100%; height: 5px; background: var(--br-green); position: absolute; top: 0; left: 0; box-shadow: 0 0 20px var(--br-green); animation: scan 2s linear infinite; z-index: 100; display: none; border-radius: 5px; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        /* --------------------------------------------------
         * [Child-Centric Bottom Dock]
         * -------------------------------------------------- */
        .bottom-dock { height: var(--dock-height-pc); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); border-top: 1px solid var(--br-border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 500; flex-shrink: 0; }
        
        .tool-group { display: flex; align-items: center; gap: 20px; background: #FAFAFA; padding: 15px 30px; border-radius: 100px; border: 1px solid var(--br-border); }
        .color-preview { width: 50px; height: 50px; border-radius: 50%; border: 4px solid #FFF; cursor: pointer; background: var(--br-charcoal); box-shadow: 0 10px 20px rgba(0,0,0,0.08); transition: transform 0.2s var(--ease-bounce); flex-shrink: 0; }
        .color-preview:active { transform: scale(0.9); }
        .brush-slider { width: 150px; accent-color: var(--br-green); cursor: pointer; height: 8px; }
        .btn-erase { font-size: 13px; font-weight: 900; color: var(--br-muted); letter-spacing: 1px; padding: 10px; }
        
        .action-group { display: flex; gap: 15px; align-items: center; }
        .btn-nav { width: 80px; height: 80px; border-radius: 25px; border: 1px solid var(--br-border); font-size: 28px; background: #FFF; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.02); color: var(--br-charcoal); display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .btn-nav:active { transform: scale(0.95); background: #F5F5F5; }
        
        .btn-core { height: 80px; padding: 0 35px; border-radius: 25px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 16px; transition: 0.3s; box-shadow: 0 15px 30px rgba(0,0,0,0.04); flex-shrink: 0; }
        .btn-core:active { transform: scale(0.95); }
        
        .btn-record { background: #FFF; color: var(--br-charcoal); border: 1px solid var(--br-border); }
        .btn-record .dot { width: 12px; height: 12px; background: var(--br-error); border-radius: 50%; opacity: 0; transition: 0.3s; }
        .btn-record.recording { background: #FFF0F0; color: var(--br-error); border-color: #FADBD8; }
        .btn-record.recording .dot { opacity: 1; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .btn-submit { background: var(--br-charcoal); color: #FFF; border: none; }
        .btn-submit:hover { background: var(--br-green); box-shadow: 0 20px 40px rgba(137, 191, 160, 0.3); }

        /* --------------------------------------------------
         * [Universal AI Teacher Panel]
         * -------------------------------------------------- */
        .ai-panel { position: absolute; top: 0; right: -500px; width: 420px; height: 100dvh; background: #FFF; box-shadow: -20px 0 50px rgba(0,0,0,0.1); z-index: 2000; transition: right 0.6s var(--ease-bounce); display: flex; flex-direction: column; border-left: 1px solid var(--br-border); }
        .ai-panel.open { right: 0; }
        .ai-header { padding: 30px; background: var(--br-ai); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br-border); flex-shrink: 0; }
        .ai-title { font-size: 18px; font-weight: 900; color: var(--br-green); display: flex; align-items: center; gap: 10px; }
        .ai-title::before { content: '✨'; font-size: 24px; }
        .btn-close-ai { font-size: 32px; color: var(--br-muted); line-height: 1; padding: 0 10px; }
        
        .ai-content { padding: 30px; flex: 1; overflow-y: auto; }
        .analytics-box { background: #FAFAFA; border: 1px solid var(--br-border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        .analytics-title { font-size: 12px; font-weight: 900; color: var(--br-muted); letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        .stat-row { margin-bottom: 20px; }
        .stat-label { font-size: 14px; font-weight: 900; display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--br-charcoal); }
        .stat-bar-bg { width: 100%; height: 12px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--br-gold); width: 0%; transition: width 1.5s var(--ease-lux); }
        .visual-intent { font-size: 14px; background: #FFF; padding: 20px; border-radius: 15px; border: 1px dashed var(--br-border); margin-top: 20px; line-height: 1.7; color: var(--br-text); }
        
        .ai-bubble { background: #F8F9FA; padding: 25px; border-radius: 25px; border-bottom-left-radius: 5px; border: 1px solid var(--br-border); font-size: 16px; line-height: 1.8; font-weight: 500; }
        .ai-name-input { width: 100%; padding: 20px; border: 2px dashed var(--br-green); border-radius: 15px; margin-top: 20px; font-size: 18px; text-align: center; font-weight: 800; outline: none; transition: 0.3s; font-family: inherit; -webkit-appearance: none; }
        .ai-name-input:focus { background: #F4F8F5; border-style: solid; }
        .ai-name-btn { width: 100%; background: var(--br-green); color: #fff; padding: 20px; border-radius: 15px; margin-top: 15px; font-weight: 900; cursor: pointer; transition: 0.3s; letter-spacing: 2px; font-size: 16px; }

        /* [Mobile Navigation Toggle] */
        .mobile-menu-btn { display: none; font-size: 28px; padding: 10px; color: var(--br-charcoal); z-index: 1500; }

        /* ======================================================================
         * [Responsive Breakpoints]
         * ====================================================================== */
        
        /* [Tablet Landscape & Small PC] */
        @media (max-width: 1200px) {
            :root { --sidebar-width: 280px; }
            .top-bar { padding: 20px; }
            .stage-wrapper { padding: 10px 20px 20px; }
            .bottom-dock { padding: 0 20px; }
            .btn-nav, .btn-core { height: 70px; }
            .btn-nav { width: 70px; font-size: 24px; }
        }

        /* [Tablet Portrait & Large Mobile] */
        @media (max-width: 992px) {
            :root { --stage-max-height: calc(100dvh - 160px - 80px); } /* Dock height increased for wrap */
            
            .mobile-menu-btn { display: block; }
            
            .sidebar { position: absolute; left: calc(var(--sidebar-width) * -1); top: 0; box-shadow: none; }
            .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            
            .top-bar { padding: 15px 20px 10px; }
            .top-bar-left { display: flex; align-items: center; gap: 15px; }
            .page-info { font-size: 32px; margin-top: 0; }
            
            .bottom-dock { height: auto; flex-direction: column; padding: 15px; gap: 15px; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
            .tool-group { width: 100%; justify-content: center; padding: 12px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
            
            .btn-nav, .btn-core { height: 65px; border-radius: 20px; font-size: 14px; }
            .btn-nav { width: 65px; }
            .btn-core { padding: 0 20px; flex: 1; justify-content: center; }
        }

        /* [Mobile Phone - Bottom Sheet AI Panel] */
        @media (max-width: 600px) {
            :root { --sidebar-width: 85vw; --stage-max-height: calc(100dvh - 200px); }
            
            .page-info { font-size: 26px; }
            .soundscape-ui { padding: 10px 15px; font-size: 11px; }
            .soundscape-ui span { display: none; } /* 모바일에서 텍스트 축소 */
            
            .tool-group { gap: 15px; }
            .brush-slider { width: 100px; }
            
            .btn-nav, .btn-core { height: 60px; font-size: 13px; letter-spacing: 1px; }
            .btn-nav { width: 60px; }
            
            /* V48.0 핵심: 모바일에서는 AI 패널이 우측이 아닌 '아래'에서 올라오는 Bottom Sheet 구조 */
            .ai-panel { 
                width: 100vw; height: 90dvh; 
                top: auto; bottom: -100dvh; right: 0; left: 0; 
                border-left: none; border-top: 1px solid var(--br-border);
                border-radius: 30px 30px 0 0;
                transition: bottom 0.5s var(--ease-bounce);
            }
            .ai-panel.open { bottom: 0; right: 0; }
            .ai-header { padding: 25px; border-radius: 30px 30px 0 0; }
            .ai-content { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <!-- V48.0 Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header" onclick="location.href='index.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>
            <div class="student-profile" id="profile-box">
                <div class="profile-avatar" id="avatar-char">?</div>
                <div class="profile-info">
                    <span class="profile-name" id="display-student-name">Inquirer</span>
                    <span class="profile-role">Awaiting Name</span>
                </div>
            </div>
            <div class="nav-list" id="nav-list"></div>
        </nav>

        <!-- V48.0 Workspace -->
        <div class="workspace">
            <div class="top-bar">
                <div class="top-bar-left">
                    <!-- Mobile Hamburger Menu -->
                    <button class="mobile-menu-btn" onclick="UIEngine.toggleSidebar()">☰</button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
                <button class="soundscape-ui" id="soundscape-btn" onclick="AmbientEngine.toggle()">
                    🎵 <span>Soundscape:</span> OFF
                </button>
            </div>

            <!-- V48.0 Fluid Canvas Stage -->
            <main class="stage-wrapper" id="stage-wrapper">
                <div class="canvas-container drawing-mode" id="canvas-container">
                    <img src="" id="worksheet-img" crossorigin="anonymous">
                    <canvas id="draw-layer"></canvas>
                    <div class="scan-line" id="canvas-scan-line"></div>
                </div>
            </main>

            <!-- V48.0 Thumb-Zone Dock -->
            <div class="bottom-dock">
                <div class="tool-group">
                    <div class="color-preview" id="btn-color"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;">
                    <input type="range" class="brush-slider" id="brush-size" min="2" max="40" value="6">
                    <button class="btn-erase" onclick="CanvasEngine.clear()">ERASER</button>
                </div>
                
                <div class="action-group">
                    <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                    <button class="btn-core btn-record" id="btn-record" onclick="AudioEngine.toggle()">
                        <div class="dot"></div> <span id="record-text">Audio Log</span>
                    </button>
                    <button class="btn-core btn-submit" onclick="AITutor.submitWork()">Submit ✨</button>
                    <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
                </div>
            </div>
        </div>

        <!-- V48.0 Responsive AI Panel -->
        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">Bridge AI Tutor</div>
                <button class="btn-close-ai" onclick="AITutor.close()">×</button>
            </div>
            <div class="ai-content" id="ai-content"></div>
        </div>

        <audio id="bgm-ambient" loop crossorigin="anonymous"></audio>
    </div>

    <!-- ======================================================================
         [Enterprise JavaScript Architecture V48.0]
         ====================================================================== -->
    <script>
        /**
         * [System Config]
         */
        const CONFIG = {
            GITHUB_ID: "eunbeenlee", 
            REPO: "bridge-heritage",
            get STORAGE() { return `https://${this.GITHUB_ID}.github.io/${this.REPO}/assets/`; },
            SOUNDSCAPES: {
                "A": "https://cdn.freesound.org/previews/407/407519_5121236-lq.mp3",
                "B": "https://cdn.freesound.org/previews/515/515822_10984905-lq.mp3"
            }
        };

        const STATE = {
            studentName: "",
            isNameRegistered: false,
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1,
            isRecording: false
        };

        /**
         * [V48.0 UI Engine] (Mobile UI Handlers)
         */
        const UIEngine = {
            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('open');
            },
            closeSidebarOnMobile() {
                if(window.innerWidth <= 992) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            }
        };

        /**
         * [Context-Aware AI DB]
         */
        const AI_CONTEXT_DB = {
            "A-1": {
                theme: "All About Me",
                pages: {
                    1: { intent: "자신의 이름과 정체성 표현", analysis: "학생이 캔버스에 자신의 이름을 쓰고 꾸민 형태를 스캔했습니다. 획의 흐름에서 긍정적인 자아 인식이 돋보입니다.", question: "What makes your name so special and beautiful?" },
                    2: { intent: "얼굴 및 감정 묘사", analysis: "얼굴의 주요 특징을 배치한 방식에서 높은 관찰력이 보입니다. 표정을 통해 오늘의 감정을 창의적으로 표현했습니다.", question: "What is your favorite part of your face, and why?" },
                    3: { intent: "신체 부위 기능 탐구", analysis: "손과 발의 움직임을 역동적으로 연결했습니다. 자신의 몸이 할 수 있는 일에 대한 이해도가 높습니다.", question: "What fun things can you do with your strong hands?" }
                }
            }
        };

        function getPageContext(unitId, pageNum) {
            const unitData = AI_CONTEXT_DB[unitId];
            if (unitData && unitData.pages[pageNum]) return unitData.pages[pageNum];
            return { intent: "창의적 문제 해결 과정", analysis: "주어진 질문에 대해 시각적으로 다양한 각도로 접근하며 훌륭한 탐구 능력을 보여주고 있습니다.", question: "Can you tell me more about the wonderful things you drew here?" };
        }

        /**
         * [Page Engine]
         */
        const PageEngine = {
            init() {
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                const list = document.getElementById('nav-list');
                for(let i=1; i<=17; i++) {
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span style="font-size:15px; font-weight:800; letter-spacing:-0.5px;">Inquiry Entry</span> <span style="font-size:12px; opacity:0.4; font-weight:900;">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => { this.load(i); UIEngine.closeSidebarOnMobile(); };
                    list.appendChild(item);
                }
                this.load(1);
            },
            load(n) {
                STATE.currentPage = n;
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png`;
                
                const img = document.getElementById('worksheet-img');
                img.style.opacity = '0';
                img.src = imgPath;
                img.onload = () => {
                    img.style.opacity = '1';
                    CanvasEngine.sync();
                };

                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${n}`);
                if(activeNav) activeNav.classList.add('active');
                
                CanvasEngine.clear();
                AITutor.close();
            },
            move(dir) {
                const t = STATE.currentPage + dir;
                if(t >= 1 && t <= 17) this.load(t);
            }
        };

        /**
         * [V48.0 Fluid Canvas Engine]
         */
        const CanvasEngine = {
            isDrawing: false,
            init() {
                this.cvs = document.getElementById('draw-layer');
                this.ctx = this.cvs.getContext('2d', { willReadFrequently: true });
                this.img = document.getElementById('worksheet-img');
                
                document.getElementById('btn-color').onclick = () => document.getElementById('native-color-picker').click();
                document.getElementById('native-color-picker').onchange = (e) => {
                    document.getElementById('btn-color').style.background = e.target.value;
                    this.ctx.strokeStyle = e.target.value;
                };
                this.bind();
            },
            bind() {
                const getPos = (e) => {
                    const rect = this.cvs.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    // V48.0 핵심: 모바일 브라우저의 리사이징 등에서도 정확한 포인터 위치 계산
                    const scaleX = this.cvs.width / rect.width;
                    const scaleY = this.cvs.height / rect.height;
                    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
                };

                const start = (e) => {
                    this.isDrawing = true;
                    const p = getPos(e);
                    this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y);
                };

                const move = (e) => {
                    if(!this.isDrawing) return;
                    // 모바일 터치 스크롤 방지 (중요)
                    if(e.cancelable && e.touches) e.preventDefault();
                    const p = getPos(e);
                    this.ctx.lineTo(p.x, p.y); this.ctx.stroke();
                };

                const stop = () => { if(this.isDrawing) { this.isDrawing = false; HapticEngine.trigger('light'); } };

                this.cvs.onmousedown = start; this.cvs.onmousemove = move; window.onmouseup = stop;
                this.cvs.ontouchstart = start; this.cvs.ontouchmove = move; window.ontouchend = stop;
                document.getElementById('brush-size').oninput = (e) => this.ctx.lineWidth = e.target.value;
            },
            sync() {
                const rect = this.img.getBoundingClientRect();
                if(rect.width === 0) return; // 이미지 로드 전 방지
                
                // 기존 그림 임시 저장
                const tempCvs = document.createElement('canvas');
                tempCvs.width = this.cvs.width; tempCvs.height = this.cvs.height;
                if(this.cvs.width > 0) tempCvs.getContext('2d').drawImage(this.cvs, 0, 0);

                // 캔버스 크기 재설정
                this.cvs.width = rect.width; 
                this.cvs.height = rect.height;
                
                // 속성 복구
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round';
                this.ctx.strokeStyle = document.getElementById('native-color-picker').value || "#363431";
                this.ctx.lineWidth = document.getElementById('brush-size').value;
                
                // 기존 그림 비율에 맞춰 다시 그리기 (리사이징 복구 로직)
                if(tempCvs.width > 0) {
                    this.ctx.drawImage(tempCvs, 0, 0, tempCvs.width, tempCvs.height, 0, 0, this.cvs.width, this.cvs.height);
                }
            },
            clear() {
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
                this.ctx.beginPath();
                HapticEngine.trigger('light');
            }
        };

        /**
         * [Engines: Ambient, Haptic, Audio]
         */
        const AmbientEngine = {
            isPlaying: false, audio: document.getElementById('bgm-ambient'),
            init() { this.audio.src = CONFIG.SOUNDSCAPES[STATE.id.charAt(0)] || CONFIG.SOUNDSCAPES["A"]; this.audio.volume = 0.2; },
            toggle() {
                const btn = document.getElementById('soundscape-btn');
                if(!this.isPlaying) { this.audio.play().catch(e=>{}); this.isPlaying = true; btn.classList.add('active'); btn.innerHTML = "🎵 <span>Soundscape:</span> ON"; }
                else { this.audio.pause(); this.isPlaying = false; btn.classList.remove('active'); btn.innerHTML = "🎵 <span>Soundscape:</span> OFF"; }
            }
        };
        const HapticEngine = { trigger(type) { if(navigator.vibrate) navigator.vibrate(type === 'light' ? 20 : [30, 50, 30]); } };
        
        const AudioEngine = {
            toggle() {
                const btn = document.getElementById('btn-record'); const text = document.getElementById('record-text');
                if(!STATE.isRecording) { STATE.isRecording = true; btn.classList.add('recording'); text.innerText = "Recording..."; HapticEngine.trigger('light'); }
                else { STATE.isRecording = false; btn.classList.remove('recording'); text.innerText = "Audio Log"; HapticEngine.trigger('heavy'); }
            }
        };

        /**
         * [Socratic AI Tutor]
         */
        const AITutor = {
            submitWork() {
                HapticEngine.trigger('heavy');
                
                if (STATE.currentPage === 1 && !STATE.isNameRegistered) {
                    this.scanHandwritingForName();
                    return;
                }
                this.provideFeedback();
            },
            
            scanHandwritingForName() {
                const panel = document.getElementById('ai-panel');
                const content = document.getElementById('ai-content');
                const scanLine = document.getElementById('canvas-scan-line');
                
                panel.classList.add('open');
                scanLine.style.display = 'block'; 
                
                content.innerHTML = `
                    <div style="text-align:center; padding: 50px 0;">
                        <div style="width:50px; height:50px; border:4px solid #EEE; border-top-color:var(--br-green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px;"></div>
                        <p style="font-size:13px; color:var(--br-muted); font-weight:900; letter-spacing:3px;">SCANNING HANDWRITING...</p>
                    </div>
                `;

                setTimeout(() => {
                    scanLine.style.display = 'none'; 
                    content.innerHTML = `
                        <div class="ai-bubble">
                            <b>Bridge Visual AI</b><br><br>
                            멋진 필체네요! 캔버스에 그린 영어 이름의 철자를 확인해 주세요. 확인이 완료되면 1:1 보이스 튜터링이 시작됩니다.
                            <input type="text" id="ai-name-verify" class="ai-name-input" placeholder="e.g. Olivia" autocomplete="off" onkeypress="if(event.key === 'Enter') AITutor.saveName()">
                            <button class="ai-name-btn" onclick="AITutor.saveName()">CONFIRM NAME</button>
                        </div>
                    `;
                    // 모바일 키보드가 올라오면서 화면이 밀리는 것을 방지하기 위해 setTimeout 적용
                    setTimeout(() => document.getElementById('ai-name-verify').focus(), 100);
                }, 2000);
            },

            saveName() {
                const nameInput = document.getElementById('ai-name-verify').value.trim();
                if(nameInput) {
                    STATE.studentName = nameInput;
                    STATE.isNameRegistered = true;
                    
                    document.getElementById('profile-box').classList.add('registered');
                    document.getElementById('display-student-name').innerText = nameInput;
                    document.getElementById('avatar-char').innerText = nameInput.charAt(0).toUpperCase();
                    document.querySelector('.profile-role').innerText = "Bridge Inquirer";

                    this.provideFeedback(true);
                } else {
                    alert("이름 철자를 입력해 주세요.");
                }
            },

            provideFeedback(isFirstGreeting = false) {
                const panel = document.getElementById('ai-panel');
                const content = document.getElementById('ai-content');
                panel.classList.add('open');
                
                const contextData = getPageContext(STATE.id, STATE.currentPage);
                const confidenceLvl = Math.floor(Math.random() * 15) + 85; 
                const callName = STATE.studentName ? STATE.studentName : "my friend";
                
                let introText = isFirstGreeting 
                    ? `<b>Nice to meet you, ${callName}!</b><br><br>I scanned your beautiful name. Now let's explore together.<br><br>` 
                    : `<b>Hello, ${callName}!</b><br><br>I looked at your drawing and listened to your voice. You did a fantastic job!<br><br>`;

                content.innerHTML = `
                    <div class="analytics-box">
                        <div class="analytics-title">Inquiry Analytics</div>
                        <div class="stat-row">
                            <div class="stat-label"><span>Voice Confidence</span> <span>${confidenceLvl}%</span></div>
                            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${confidenceLvl}%;"></div></div>
                        </div>
                        <div class="visual-intent">
                            <b>🎯 의도 분석: ${contextData.intent}</b><br><br>
                            ${contextData.analysis}
                        </div>
                    </div>
                    <div class="ai-bubble">
                        ${introText}
                        <b style="font-size:18px; color:var(--br-green);">${contextData.question}</b>
                    </div>
                `;
                
                let speechText = isFirstGreeting ? `Nice to meet you, ${callName}. ${contextData.question}` : `Hello, ${callName}. ${contextData.question}`;
                this.speak(speechText);
            },
            
            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85; 
                    utterance.pitch = 1.2;
                    window.speechSynthesis.speak(utterance);
                }
            },
            
            close() {
                document.getElementById('ai-panel').classList.remove('open');
                if('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        };

        // Window Init & Resize Debounce for Fluid Canvas
        let resizeTimer;
        window.onload = () => {
            PageEngine.init();
            CanvasEngine.init();
            AmbientEngine.init();
            
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if(document.getElementById('worksheet-img').style.opacity === '1') {
                        CanvasEngine.sync();
                    }
                }, 200);
            });
        };
    </script>
</body>
</html>
