<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Classroom</title>
    <style>
        :root { 
            --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; --bridge-bg: #F7F9F8; --bridge-paper: #FFFFFF; --bridge-danger: #E07A5F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bridge-bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--bridge-charcoal); }
        
        /* 사이드바 설정 */
        .sidebar { width: 280px; background: var(--bridge-paper); display: flex; flex-direction: column; z-index: 20; border-right: 1px solid #EAEAEA; box-shadow: 2px 0 15px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 30px 20px 20px; text-align: center; border-bottom: 1px solid #F0F0F0; cursor: pointer; transition: 0.2s; }
        .sidebar-header:hover { opacity: 0.8; }
        .sidebar-logo { max-width: 180px; height: auto; margin-bottom: 5px; }
        
        .nav-list { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; background: transparent; border: 1px solid transparent; color: #666; transition: all 0.3s ease; }
        .nav-item.active { background: #EAF4ED; color: var(--bridge-charcoal); font-weight: bold; border-left: 5px solid var(--bridge-green); border-radius: 8px 12px 12px 8px; }
        .nav-text { display: flex; flex-direction: column; font-size: 14px; }
        .nav-text span.page-num { font-size: 11px; opacity: 0.6; margin-bottom: 4px; font-weight: bold; letter-spacing: 0.5px;}

        /* 메인 학습 영역 */
        .viewer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 25px; position: relative; overflow-y: auto; }
        
        /* 타겟 단어 박스 (북미 스타일 교수법 반영) */
        .target-words-box { background: #FFF; padding: 10px 25px; border-radius: 50px; font-weight: 800; color: var(--bridge-charcoal); margin-bottom: 15px; border: 2px solid var(--bridge-green); box-shadow: 0 4px 15px rgba(140, 198, 159, 0.15); display: flex; align-items: center; gap: 10px; }
        .target-words-box span { color: var(--bridge-green); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .canvas-container { position: relative; background: var(--bridge-paper); border-radius: 20px; box-shadow: 0 10px 40px rgba(58, 58, 66, 0.08); padding: 10px; width: 100%; max-width: 850px; line-height: 0; }
        #main-img { width: 100%; max-height: 50vh; display: block; pointer-events: none; object-fit: contain; }
        #drawing-canvas { position: absolute; top: 10px; left: 10px; cursor: crosshair; touch-action: none; }

        /* 컨트롤 및 도구 모음 */
        .controls-wrapper { width: 100%; max-width: 850px; margin-top: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .tool-bar { display: flex; align-items: center; justify-content: center; gap: 20px; background: white; padding: 15px 35px; border-radius: 50px; box-shadow: 0 5px 25px rgba(0,0,0,0.04); width: 100%; flex-wrap: wrap; border: 1px solid #F0F0F0; }
        .brush-control { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: bold; color: var(--bridge-charcoal); }
        input[type=range] { width: 120px; accent-color: var(--bridge-green); }
        
        .color-ring-container { position: relative; width: 45px; height: 45px; cursor: pointer; }
        #color-wheel { border-radius: 50%; width: 100%; height: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .current-color-indicator { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #FFF; box-shadow: 0 2px 6px rgba(0,0,0,0.15); background: #3A3A42; }
        .btn-clear { background: none; border: none; cursor: pointer; color: #888; font-weight: bold; font-size: 14px; }
        
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; justify-content: center; }
        .btn { padding: 15px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; letter-spacing: 0.5px; }
        .btn-nav { background: #F0F2F1; color: var(--bridge-charcoal); min-width: 100px; }
        
        /* 녹음 버튼 애니메이션 */
        .btn-record { background: #F0F2F1; color: var(--bridge-charcoal); flex: 1; max-width: 250px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #EAEAEA; }
        .btn-record.recording { background: var(--bridge-danger); color: #FFF; animation: pulse 1.5s infinite; border: none; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; box-shadow: 0 8px 20px rgba(58, 58, 66, 0.2); flex: 1; max-width: 300px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* AI 분석 팝업 (Seesaw 스타일 오마주) */
        #success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(247, 249, 248, 0.98); backdrop-filter: blur(8px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 20px; text-align: center; padding: 40px; }
        .status-title { font-size: 34px; font-weight: 900; color: var(--bridge-green); margin-bottom: 15px; letter-spacing: 1px; }
        .score-badge { font-size: 50px; color: #FFF; background: var(--bridge-green); padding: 15px 60px; border-radius: 60px; margin-bottom: 25px; font-weight: 900; box-shadow: 0 10px 30px rgba(140, 198, 159, 0.4); }
        .ai-feedback { font-size: 22px; color: var(--bridge-charcoal); max-width: 850px; line-height: 1.6; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .btn-continue { background: var(--bridge-charcoal); color: #FFF; padding: 18px 60px; margin-top: 40px; font-size: 18px; border-radius: 50px; width: auto; box-shadow: 0 8px 20px rgba(58, 58, 66, 0.2); }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 15px; border-right: none; border-bottom: 1px solid #EAEAEA; }
            .sidebar-header { padding: 0; border: none; text-align: left; margin-right: 20px; }
            .sidebar-logo { max-width: 120px; margin-bottom: 0; }
            .nav-list { display: flex; flex-direction: row; overflow-x: auto; padding: 5px 0; margin: 0; gap: 10px; }
            .nav-item { min-width: 130px; margin-bottom: 0; border-left: none; border-bottom: 4px solid transparent; border-radius: 10px; padding: 10px; }
            .nav-item.active { border-left: none; border-bottom: 4px solid var(--bridge-green); border-radius: 10px; }
            .viewer { padding: 15px; }
            #main-img { max-height: 40vh; }
            .nav-buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header" onclick="window.location.href='index.html'">
        <img src="logo.png" alt="Bridge Academy" class="sidebar-logo">
        <div style="font-size: 11px; color: #888; margin-top: 5px;">◀ Back to Lobby</div>
    </div>
    <div id="nav-list" class="nav-list"></div>
</div>

<div class="viewer">
    
    <div class="target-words-box" id="target-words-box">
        <span>Target Words:</span> <div id="target-words-text">Loading...</div>
    </div>

    <div id="success-overlay">
        <div class="status-title" id="status-title">LOOKING & LISTENING... 👀👂</div>
        <div id="score-badge" class="score-badge">WAIT</div>
        <div id="ai-feedback" class="ai-feedback">Milo is checking your drawing and voice...</div>
        <button id="overlay-btn" class="btn btn-continue" onclick="handleOverlayClick()">Continue</button>
    </div>

    <div class="canvas-container" id="canvas-wrapper">
        <img src="" id="main-img" crossorigin="anonymous">
        <canvas id="drawing-canvas"></canvas>
    </div>
    
    <div class="controls-wrapper">
        <div class="tool-bar">
            <div class="brush-control">Pen <input type="range" id="brush-size" min="3" max="25" value="8"></div>
            <div style="width: 1px; height: 25px; background: #EAEAEA; margin: 0 5px;"></div>
            
            <div class="color-ring-container"><canvas id="color-wheel" width="80" height="80"></canvas></div>
            <div class="current-color-indicator" id="current-color-bg"></div>
            
            <button class="btn-clear" onclick="ctx.clearRect(0, 0, canvas.width, canvas.height);">Erase All</button>
        </div>
        <div class="nav-buttons">
            <button id="prev-btn" class="btn btn-nav" onclick="changePage(-1)">◀ Prev</button>
            <button id="record-btn" class="btn btn-record" onclick="toggleRecording()">🎤 Tap to Speak</button>
            <button id="submit-btn" class="btn btn-submit" onclick="submitWork()">Submit to Milo ✨</button>
            <button id="next-btn" class="btn btn-nav" onclick="changePage(1)">Next ▶</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    const modelName = "gemini-1.5-flash"; // 음성 분석 필수 모델

    // 커리큘럼 데이터
    const curriculumData = {
        "A1": [
            { id: 1, title: "All About Me", img: "1.png", words: "Me, Face" },
            { id: 2, title: "Book of the Month", img: "2.png", words: "Like, Myself" },
            { id: 3, title: "Key Words (Body)", img: "3.png", words: "Nose, Ears, Hair, Eyes" },
            { id: 4, title: "Key Words (Review)", img: "4.png", words: "Face, Draw" },
            { id: 5, title: "Key Words (Sensory)", img: "5.png", words: "Smell, Hear, See" },
            { id: 6, title: "Key Sentences", img: "6.png", words: "I like my nose" },
            { id: 7, title: "I Can... (Matching)", img: "7.png", words: "Match, Line" },
            { id: 8, title: "This is My Face", img: "8.png", words: "My face, Happy" }
        ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const data = curriculumData[urlParams.get('series') || 'A1'];
    let currentPageIndex = 0;
    let isSeriesFinished = false;

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('main-img');
    const brushSlider = document.getElementById('brush-size');
    let drawing = false;

    // --- 컬러링 휠 시스템 ---
    const wheelCanvas = document.getElementById('color-wheel');
    const wheelCtx = wheelCanvas.getContext('2d');

    function drawColorWheel() {
        const radius = wheelCanvas.width / 2;
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle - 1) * Math.PI / 180;
            const endAngle = (angle + 1) * Math.PI / 180;
            wheelCtx.beginPath(); wheelCtx.moveTo(radius, radius);
            wheelCtx.arc(radius, radius, radius, startAngle, endAngle);
            wheelCtx.fillStyle = `hsl(${angle}, 100%, 50%)`; wheelCtx.fill();
        }
        wheelCtx.beginPath(); wheelCtx.arc(radius, radius, radius * 0.4, 0, Math.PI * 2);
        wheelCtx.fillStyle = "white"; wheelCtx.fill();
    }
    
    function pickColor(e) {
        const rect = wheelCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (wheelCanvas.width / rect.width);
        const y = (clientY - rect.top) * (wheelCanvas.height / rect.height);
        const pixel = wheelCtx.getImageData(x, y, 1, 1).data;
        if (pixel[3] !== 0) {
            const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
            ctx.strokeStyle = color;
            document.getElementById('current-color-bg').style.background = color;
        }
    }
    wheelCanvas.addEventListener('mousedown', pickColor);
    wheelCanvas.addEventListener('touchstart', (e) => { pickColor(e); e.preventDefault(); }, {passive: false});

    // --- 캔버스 드로잉 로직 ---
    function resizeCanvas() {
        canvas.width = img.clientWidth; canvas.height = img.clientHeight;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = brushSlider.value;
        ctx.strokeStyle = document.getElementById('current-color-bg').style.background || '#3A3A42';
    }
    img.onload = resizeCanvas;
    window.addEventListener('resize', () => {
        if(canvas.width === 0) return;
        const currentData = canvas.toDataURL(); resizeCanvas();
        const tempImg = new Image(); tempImg.onload = () => { ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height); }; tempImg.src = currentData;
    });
    brushSlider.oninput = () => { ctx.lineWidth = brushSlider.value; };

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }
    function startDrawing(e) { drawing = true; const pos = getCoords(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
    function draw(e) {
        if (!drawing) return; e.preventDefault(); const pos = getCoords(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
    }
    function stopDrawing() { drawing = false; ctx.beginPath(); }
    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); }, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false}); canvas.addEventListener('touchend', stopDrawing);

    // --- 오디오 녹음 시스템 (V13.1 보강) ---
    let mediaRecorder; let audioChunks = []; let audioBlob = null; let isRecording = false;

    async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    audioChunks = [];
                    btn.innerHTML = "🎵 Recorded! (Tap to Redo)";
                    btn.style.background = "var(--bridge-green)"; btn.style.color = "#FFF"; btn.classList.remove('recording');
                };
                audioChunks = []; mediaRecorder.start(); isRecording = true;
                btn.innerHTML = "🔴 Recording... Stop"; btn.classList.add('recording');
            } catch (err) { alert("Please allow microphone access!"); }
        } else {
            mediaRecorder.stop(); isRecording = false;
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
        }
    }

    // --- 페이지 로드 로직 ---
    function loadPage(index) {
        if (!data || index >= data.length || index < 0) return; 
        currentPageIndex = index; isSeriesFinished = false; audioBlob = null;
        const btn = document.getElementById('record-btn');
        btn.innerHTML = "🎤 Tap to Speak"; btn.style.background = "#F0F2F1"; btn.style.color = "var(--bridge-charcoal)";
        img.src = data[index].img;
        document.getElementById('target-words-text').innerText = data[index].words;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.nav-item').forEach((el, idx) => el.classList.toggle('active', idx === index));
        document.getElementById('prev-btn').disabled = (index === 0);
        document.getElementById('next-btn').disabled = (index === data.length - 1);
        document.getElementById('overlay-btn').innerText = "Continue"; 
    }
    function changePage(step) { loadPage(currentPageIndex + step); }

    // --- [V13.1] 프리미엄 AI 분석 (멈춤 현상 해결 버전) ---
    async function submitWork() {
        if (isRecording) { alert("Please stop recording first!"); return; }

        const overlay = document.getElementById('success-overlay');
        const statusTitle = document.getElementById('status-title');
        const scoreBadge = document.getElementById('score-badge');
        const feedbackBox = document.getElementById('ai-feedback');

        overlay.style.display = 'flex';
        statusTitle.innerText = "ANALYZING... 🧐";
        scoreBadge.innerText = "WAIT";
        feedbackBox.innerHTML = "Milo is writing a special note for you and your parents...";

        const isLastPage = (currentPageIndex === data.length - 1);
        const currentWords = data[currentPageIndex].words;

        try {
            const MAX_WIDTH = 600; const scale = MAX_WIDTH / img.naturalWidth;
            const tempCanvas = document.createElement('canvas'); const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = MAX_WIDTH; tempCanvas.height = img.naturalHeight * scale;
            tCtx.fillStyle = "#FFFFFF"; tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
            const combinedData = tempCanvas.toDataURL("image/jpeg", 0.7).split(',')[1];

            let promptParts = [
                { text: `[Role]: Expert International School Teacher. [Task]: Analyze drawing and audio. [Target Words]: ${currentWords}. [Output Format]: Strictly JSON { "score": number, "child_msg": "short sentence", "parent_insight": "professional sentence" }` },
                { inline_data: { mime_type: "image/jpeg", data: combinedData } }
            ];

            if (audioBlob) {
                const base64Audio = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(audioBlob);
                });
                promptParts.push({ inline_data: { mime_type: audioBlob.type, data: base64Audio } });
            }

            // 10초 타임아웃 방어 코드
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: promptParts }] }),
                signal: controller.signal
            });

            clearTimeout(timeoutId);
            const result = await response.json();
            const rawText = result.candidates[0].content.parts[0].text;
            
            // JSON 파싱 안정화 로직
            const cleanJson = rawText.replace(/```json|```/g, "").match(/\{.*\}/s)[0];
            const analysis = JSON.parse(cleanJson);
            
            statusTitle.innerText = "EXCELLENT! ⭐";
            scoreBadge.innerText = `${analysis.score}%`;
            feedbackBox.innerHTML = `
                <div style="color: var(--bridge-green); font-size: 26px; font-weight: 800; width: 100%;">"${analysis.child_msg}" 🎈</div>
                <div style="font-size: 15px; color: #666; font-weight: 400; line-height: 1.5; border-top: 1px solid #EAEAEA; padding-top: 15px; width: 100%; text-align: left; background: #FFF; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                    <strong style="color: var(--bridge-charcoal); display: block; margin-bottom: 5px;">[Teacher's Observation]</strong>
                    ${analysis.parent_insight}
                </div>
            `;

            if (isLastPage) { isSeriesFinished = true; document.getElementById('overlay-btn').innerText = "Complete & Go Home"; }

        } catch (e) {
            // 오류 발생 시 무한 대기 방지 처리
            statusTitle.innerText = "GOOD JOB! 👍";
            scoreBadge.innerText = "100%"; 
            feedbackBox.innerHTML = "Wonderful work! Milo is so proud of your creative exploration today. 🌈";
            if (isLastPage) { isSeriesFinished = true; document.getElementById('overlay-btn').innerText = "Complete & Go Home"; }
        }
    }

    function handleOverlayClick() {
        if (isSeriesFinished) { window.location.href = 'index.html'; } 
        else { document.getElementById('success-overlay').style.display = 'none'; }
    }

    if (data) {
        const navList = document.getElementById('nav-list');
        data.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'nav-item' + (index === 0 ? ' active' : '');
            div.innerHTML = `<div class="nav-text"><span class="page-num">PAGE 0${item.id}</span>${item.title}</div>`;
            div.onclick = () => loadPage(index);
            navList.appendChild(div);
        });
        drawColorWheel();
        setTimeout(() => loadPage(0), 100);
    }
</script>
</body>
</html>
