<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta 
        name="mobile-web-app-capable" 
        content="yes"
    >
    <meta 
        name="apple-mobile-web-app-capable" 
        content="yes"
    >
    <meta 
        name="apple-mobile-web-app-status-bar-style" 
        content="black-translucent"
    >
    <meta 
        name="theme-color" 
        content="#FCFBF9"
    >
    
    <title>Bridge Academy | Premium AI Lab V100.60</title>

    <link 
        rel="icon" 
        href="data:;base64,iVBORw0KGgo="
    >
    
    <link 
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" 
        rel="stylesheet"
    >
    <link 
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" 
        rel="stylesheet"
    >
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
    
    <script 
        src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"
    ></script>
    <script 
        src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
    ></script> 
    
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"
    ></script>
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"
    ></script>
    <script 
        src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"
    ></script>

    <style>
        /* ----------------------------------------------------------------------
           [4-1. DESIGN TOKENS & CSS VARIABLES]
        ---------------------------------------------------------------------- */
        :root {
            --br-green: #91D3B4; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-ai-soft: #F8FAFF;
            
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            
            --br-error: #E74C3C; 
            --br-error-light: #FEF2F2;
            --br-error-border: #FCA5A5;
            --br-success: #2ECC71;
            
            --sidebar-width: 320px;
            --topbar-height: 85px;
            --dock-height: 110px;
            
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            --transition-smooth: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --transition-fast: all 0.2s ease-in-out;
            --transition-elastic: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            --shadow-float: 0px 25px 70px rgba(0, 0, 0, 0.07);
            --shadow-button: 0px 10px 20px rgba(0, 0, 0, 0.05);
            --shadow-premium: 0px 30px 60px rgba(54, 52, 49, 0.15);
        }

        /* ----------------------------------------------------------------------
           [4-2. BASE RESET]
        ---------------------------------------------------------------------- */
        * { 
            margin-top: 0px; 
            margin-right: 0px; 
            margin-bottom: 0px; 
            margin-left: 0px; 
            
            padding-top: 0px; 
            padding-right: 0px; 
            padding-bottom: 0px; 
            padding-left: 0px; 
            
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            cursor: none !important;
        }

        html {
            width: 100%; 
            height: 100dvh; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Pretendard', sans-serif; 
            
            pointer-events: auto !important; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            width: 100%; 
            height: 100dvh; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Pretendard', sans-serif; 
            
            pointer-events: auto !important; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        a, button, input, select, textarea { 
            cursor: none !important; 
        }

        button { 
            border-top-width: 0px;
            border-right-width: 0px;
            border-bottom-width: 0px;
            border-left-width: 0px;
            background-color: transparent; 
            font-family: inherit; 
            outline-width: 0px; 
        }

        ul, ol, li { 
            list-style-type: none; 
        }

        @supports not (height: 100dvh) {
            html, body, .app-container { 
                height: 100vh; 
            }
        }

        /* ----------------------------------------------------------------------
           [4-3. PREMIUM CUSTOM CURSOR]
        ---------------------------------------------------------------------- */
        .cursor-dot {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 4px;
            height: 4px;
            background-color: rgba(54, 52, 49, 0.75);
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition-property: width, height, opacity, background-color;
            transition-duration: 0.16s;
            transition-timing-function: ease;
            will-change: transform;
        }

        .cursor-ring {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 22px;
            height: 22px;
            border-top-width: 1px;
            border-right-width: 1px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            border-top-color: rgba(54, 52, 49, 0.28);
            border-right-color: rgba(54, 52, 49, 0.28);
            border-bottom-color: rgba(54, 52, 49, 0.28);
            border-left-color: rgba(54, 52, 49, 0.28);
            border-top-left-radius: 50%;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition-property: width, height, opacity, border-color, background-color;
            transition-duration: 0.15s;
            transition-timing-function: ease;
            will-change: transform;
        }

        .cursor-dot.hovered {
            width: 3px;
            height: 3px;
            background-color: rgba(145, 211, 180, 0.8);
        }

        .cursor-ring.hovered {
            width: 28px;
            height: 28px;
            background-color: rgba(145, 211, 180, 0.05);
            border-top-color: rgba(145, 211, 180, 0.5);
            border-right-color: rgba(145, 211, 180, 0.5);
            border-bottom-color: rgba(145, 211, 180, 0.5);
            border-left-color: rgba(145, 211, 180, 0.5);
        }

        .cursor-dot.hidden, .cursor-ring.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .stage-wrapper, .drawing-board, #draw-layer {
            cursor: crosshair !important;
        }

        @media (pointer: coarse) {
            .cursor-dot, .cursor-ring { 
                display: none !important; 
            }
            html, body, a, button, input, select, textarea, .stage-wrapper, .drawing-board, #draw-layer { 
                cursor: auto !important; 
            }
        }
        
        /* ----------------------------------------------------------------------
           [4-4. APP CONTAINER]
        ---------------------------------------------------------------------- */
        .app-container { 
            display: flex; 
            flex-direction: row;
            width: 100vw; 
            height: 100dvh; 
            position: relative; 
            pointer-events: auto !important; 
        }
        
        /* ----------------------------------------------------------------------
           [4-5. SIDEBAR]
        ---------------------------------------------------------------------- */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            background-color: var(--br-paper); 
            border-right-width: 1px; 
            border-right-style: solid; 
            border-right-color: var(--br-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 2000; 
            flex-shrink: 0; 
            transition-property: transform; 
            transition-duration: 0.4s; 
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); 
            box-shadow: 5px 0px 15px rgba(0, 0, 0, 0.02);
        }

        .sidebar-backdrop {
            position: fixed;
            top: 0px;
            right: 0px;
            bottom: 0px;
            left: 0px;
            background-color: rgba(0, 0, 0, 0.18);
            z-index: 1500; 
            opacity: 0;
            pointer-events: none;
            transition-property: opacity;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            backdrop-filter: blur(3px); 
        }

        .sidebar-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-header { 
            padding-top: 35px;
            padding-right: 30px;
            padding-bottom: 35px;
            padding-left: 30px;
            text-align: center; 
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            transition-property: background-color;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        .sidebar-header:hover {
            background-color: var(--br-bg);
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
        }
        
        /* ----------------------------------------------------------------------
           [4-6. STUDENT PROFILE]
        ---------------------------------------------------------------------- */
        .student-profile { 
            padding-top: 25px;
            padding-right: 30px;
            padding-bottom: 25px;
            padding-left: 30px;
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #FAFAFA; 
            transition-property: background-color; 
            transition-duration: 0.3s; 
            transition-timing-function: ease; 
        }

        .student-profile.registered { 
            background-color: var(--br-ai-soft); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            border-top-left-radius: 50%; 
            border-top-right-radius: 50%; 
            border-bottom-right-radius: 50%; 
            border-bottom-left-radius: 50%; 
            background-color: var(--br-border); 
            color: #FFFFFF; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 22px; 
            font-family: 'Nunito', sans-serif; 
            transition-property: background-color, box-shadow, color;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: inset 0px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .student-profile.registered .profile-avatar { 
            background-color: var(--br-gold); 
            box-shadow: 0px 8px 20px rgba(203, 174, 117, 0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            overflow-y: hidden; 
        }

        .profile-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            text-transform: uppercase; 
            white-space: nowrap; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            text-overflow: ellipsis; 
        }

        .profile-role { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--br-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }

        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            min-height: 24px;
        }

        .badge { 
            font-size: 11px; 
            padding-top: 4px;
            padding-right: 10px;
            padding-bottom: 4px;
            padding-left: 10px;
            border-top-left-radius: 12px; 
            border-top-right-radius: 12px; 
            border-bottom-right-radius: 12px; 
            border-bottom-left-radius: 12px; 
            background-color: #FFFFFF; 
            border-top-width: 1px; 
            border-right-width: 1px; 
            border-bottom-width: 1px; 
            border-left-width: 1px; 
            border-top-style: solid; 
            border-right-style: solid; 
            border-bottom-style: solid; 
            border-left-style: solid; 
            border-top-color: var(--br-border); 
            border-right-color: var(--br-border); 
            border-bottom-color: var(--br-border); 
            border-left-color: var(--br-border); 
            color: var(--br-charcoal); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.02); 
            animation-name: popIn; 
            animation-duration: 0.4s; 
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* ----------------------------------------------------------------------
           [4-7. NAVIGATION LIST]
        ---------------------------------------------------------------------- */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            padding-top: 15px;
            padding-right: 15px;
            padding-bottom: 15px;
            padding-left: 15px;
            scroll-behavior: smooth; 
        }

        .nav-list::-webkit-scrollbar { 
            width: 5px; 
        }

        .nav-list::-webkit-scrollbar-track { 
            background-color: transparent; 
        }

        .nav-list::-webkit-scrollbar-thumb { 
            background-color: #E8E6E1; 
            border-top-left-radius: 10px; 
            border-top-right-radius: 10px; 
            border-bottom-right-radius: 10px; 
            border-bottom-left-radius: 10px; 
        }

        .nav-list::-webkit-scrollbar-thumb:hover { 
            background-color: #D5D3CE; 
        }

        .nav-item { 
            padding-top: 18px;
            padding-right: 20px;
            padding-bottom: 18px;
            padding-left: 20px;
            margin-bottom: 10px; 
            border-top-left-radius: 15px; 
            border-top-right-radius: 15px; 
            border-bottom-right-radius: 15px; 
            border-bottom-left-radius: 15px; 
            background-color: #FAFAFA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition-property: transform, background-color, border-color, box-shadow;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
            border-top-width: 1px; 
            border-right-width: 1px; 
            border-bottom-width: 1px; 
            border-left-width: 1px; 
            border-top-style: solid; 
            border-right-style: solid; 
            border-bottom-style: solid; 
            border-left-style: solid; 
            border-top-color: transparent; 
            border-right-color: transparent; 
            border-bottom-color: transparent; 
            border-left-color: transparent; 
        }

        .nav-item:hover { 
            background-color: #FFFFFF; 
            border-top-color: var(--br-border);
            border-right-color: var(--br-border);
            border-bottom-color: var(--br-border);
            border-left-color: var(--br-border);
            transform: translateY(-2px); 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.02); 
        }

        .nav-item.active { 
            background-color: var(--br-ai-soft); 
            border-left-width: 6px; 
            border-left-style: solid; 
            border-left-color: var(--br-green); 
            border-top-color: transparent; 
            border-right-color: transparent; 
            border-bottom-color: transparent; 
            box-shadow: 0px 10px 25px rgba(145, 211, 180, 0.12); 
        }

        .nav-title { 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            white-space: nowrap; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            text-overflow: ellipsis; 
            max-width: 170px; 
        }

        .nav-item.active .nav-title { 
            font-weight: 900; 
            color: var(--br-green); 
        }

        .nav-badge { 
            font-family: 'Nunito', sans-serif; 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--br-muted); 
        }

        .nav-item.active .nav-badge { 
            color: var(--br-green); 
            opacity: 1; 
        }

        /* ----------------------------------------------------------------------
           [4-8. WORKSPACE & TOP CONTEXT BAR]
        ---------------------------------------------------------------------- */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0px; 
            height: 100%; 
            position: relative; 
            overflow-x: hidden; 
            overflow-y: hidden; 
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: var(--topbar-height); 
            padding-top: 0px;
            padding-right: 45px;
            padding-bottom: 0px;
            padding-left: 45px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom-width: 1px; 
            border-bottom-style: solid; 
            border-bottom-color: var(--br-border); 
            background-color: #FFFFFF; 
            z-index: 10; 
        }

        .top-bar-left { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }

        .mobile-menu-btn { 
            display: none; 
            font-size: 28px; 
            padding-top: 10px; 
            padding-right: 10px; 
            padding-bottom: 10px; 
            padding-left: 10px; 
            color: var(--br-charcoal); 
            z-index: 1500; 
        }

        .unit-info { 
            font-family: 'Nunito', sans-serif; 
            font-size: 13px; 
            font-weight: 900; 
            color: var(--br-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }

        .page-info { 
            font-family: 'Playfair Display', serif; 
            font-size: 34px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
            margin-top: 2px; 
        }

        .sync-indicator-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
            padding-right: 16px;
            padding-bottom: 8px;
            padding-left: 16px;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-right-radius: 50px;
            border-bottom-left-radius: 50px;
            background-color: var(--br-bg);
            border-top-width: 1px;
            border-right-width: 1px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            border-top-color: var(--br-border);
            border-right-color: var(--br-border);
            border-bottom-color: var(--br-border);
            border-left-color: var(--br-border);
            font-size: 12px;
            font-weight: 700;
            color: var(--br-muted);
            transition-property: background-color, color, border-color;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        }

        .sync-indicator-container.saving {
            color: var(--br-blue);
            background-color: #F0F4F8;
            border-top-color: #D9E4EC; 
            border-right-color: #D9E4EC; 
            border-bottom-color: #D9E4EC; 
            border-left-color: #D9E4EC;
        }

        .sync-indicator-container.saved {
            color: var(--br-success);
            background-color: #F0FDF4;
            border-top-color: #DCFCE7; 
            border-right-color: #DCFCE7; 
            border-bottom-color: #DCFCE7; 
            border-left-color: #DCFCE7;
        }

        .sync-icon.spin { 
            animation-name: spin; 
            animation-duration: 1s; 
            animation-timing-function: linear; 
            animation-iteration-count: infinite; 
        }

        .toast-error { 
            display: none; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--br-error); 
            background-color: var(--br-error-light); 
            padding-top: 8px;
            padding-right: 16px;
            padding-bottom: 8px;
            padding-left: 16px;
            border-top-left-radius: 50px; 
            border-top-right-radius: 50px; 
            border-bottom-right-radius: 50px; 
            border-bottom-left-radius: 50px; 
            border-top-width: 1px; 
            border-right-width: 1px; 
            border-bottom-width: 1px; 
            border-left-width: 1px; 
            border-top-style: solid; 
            border-right-style: solid; 
            border-bottom-style: solid; 
            border-left-style: solid; 
            border-top-color: var(--br-error-border); 
            border-right-color: var(--br-error-border); 
            border-bottom-color: var(--br-error-border); 
            border-left-color: var(--br-error-border); 
            animation-name: popIn; 
            animation-duration: 0.3s; 
            animation-timing-function: ease-out; 
            z-index: 5000;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .toast-error.show { 
            display: flex; 
        }
        
        /* ----------------------------------------------------------------------
           [4-9. STAGE & DRAWING BOARD]
        ---------------------------------------------------------------------- */
        .stage-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding-top: 40px;
            padding-right: 40px;
            padding-bottom: 40px;
            padding-left: 40px;
            background-color: var(--br-bg); 
            perspective: 1200px; 
            overflow-x: hidden; 
            overflow-y: hidden; 
        }

        .drawing-board { 
            position: relative; 
            /* [P0 Fix] 내부 교재 크기에 맞춰 쫀득하게 감싸는 Flex 레이아웃 */
            display: inline-flex; 
            border-top-left-radius: 20px;

            transition-duration: 0.3s;
            transition-timing-function: ease;
            font-size: 16px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            font-family: 'Nunito', sans-serif; 
            box-shadow: 0px 10px 20px rgba(54, 52, 49, 0.2); 
        }
        
        .btn-chat-action:hover {

            transform: translateY(-2px);

        .btn-chat-action:active {

        .btn-chat-next {

            font-size: 14px;

        }
        
        .btn-chat-next:hover { 
            color: var(--br-gold); 
        }

        /* ----------------------------------------------------------------------
           [4-13. SUBSYSTEM DIALOG CUSTOM MODALS]
        ---------------------------------------------------------------------- */
        .bridge-modal-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(42, 40, 37, 0.6);
            z-index: 40000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition-property: opacity;
            transition-duration: 0.3s;
            transition-timing-function: ease;
            backdrop-filter: blur(8px);
        }

        .bridge-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bridge-modal-box {
            background-color: var(--br-paper);
            width: 420px;
            max-width: 90%;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border-bottom-right-radius: 24px;
            border-bottom-left-radius: 24px;

            padding-right: 35px;
            padding-bottom: 35px;
            padding-left: 35px;
            text-align: center;
            box-shadow: var(--shadow-premium);
            transform: scale(0.9) translateY(20px);
            transition-property: transform;
            transition-duration: 0.4s;
            transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bridge-modal-overlay.active .bridge-modal-box {
            transform: scale(1) translateY(0px);
        }

        .bridge-modal-icon {
            font-size: 45px;
            color: var(--br-gold);
            margin-bottom: 20px;
            display: block;
        }

            color: var(--br-error);
        }

            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--br-charcoal);
            margin-bottom: 12px;
        }

        .bridge-modal-text {
            font-size: 15px;
            color: var(--br-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .bridge-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .bridge-modal-btn {
            flex: 1;
            padding-top: 15px;
            padding-bottom: 15px;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
            border-bottom-left-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition-property: transform, background-color, box-shadow;
            transition-duration: 0.5s;
            transition-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .bridge-modal-btn:active {
            transform: scale(0.9);
        }

        .bridge-modal-cancel {
            background-color: #F0EFEB;
            color: var(--br-charcoal);
            border-top-width: 1px;
            border-right-width: 1px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            border-top-color: transparent;
            border-right-color: transparent;
            border-bottom-color: transparent;
            border-left-color: transparent;
        }
        
        .bridge-modal-cancel:hover {
            background-color: #E5E4E0;
        }

        .bridge-modal-confirm {
            background-color: var(--br-error);
            color: #FFFFFF;
            border-top-width: 1px;
            border-right-width: 1px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;
            border-top-color: transparent;
            border-right-color: transparent;
            border-bottom-color: transparent;
            border-left-color: transparent;
            box-shadow: 0px 8px 15px rgba(231, 76, 60, 0.2);

        .bridge-modal-confirm:hover {
            background-color: #C0392B;
        }
        
        .bridge-modal-confirm.neutral {
            background-color: var(--br-charcoal);
            box-shadow: 0px 8px 15px rgba(54, 52, 49, 0.2);
        }
        
        .bridge-modal-confirm.neutral:hover {
            background-color: var(--br-gold);
        }

        /* ----------------------------------------------------------------------
           [4-14. COLOR PALETTE & CERTIFICATE OVERLAYS]
        ---------------------------------------------------------------------- */
        .rgb-modal { 
            position: absolute; 
            bottom: 130px; 
            left: 50px; 
            background-color: #FFFFFF; 
            border-top-left-radius: 25px; 
            border-top-right-radius: 25px; 
            border-bottom-right-radius: 25px; 
            border-bottom-left-radius: 25px; 
            padding-top: 25px;
            padding-right: 25px;
            padding-bottom: 25px;
            padding-left: 25px;
            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.15); 
            z-index: 5000; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
            transition-property: opacity, transform; 
            transition-duration: 0.3s; 
            transition-timing-function: ease; 
        }

        .rgb-modal.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0px); 
        }
        
        .rgb-modal-close { 
            text-align: center; 
            font-size: 10px;

            transition-duration: 0.2s;
        }

        .rgb-modal-close:hover { 
            color: var(--br-charcoal); 
        }

        .cert-modal-overlay { 
            position: fixed; 
            top: 0px; 
            right: 0px;
            bottom: 0px;
            left: 0px; 
            width: 100vw; 
            height: 100dvh;

            border-top-right-radius: 25px; 
            border-bottom-right-radius: 25px; 
            border-bottom-left-radius: 25px; 
            padding-top: 50px;
            padding-right: 50px;
            padding-bottom: 50px;
            padding-left: 50px;
            position: relative; 
        }

        .cert-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 50px; 
            color: var(--br-charcoal); 
            font-weight: 900; 
            margin-bottom: 15px; 
        }

        .cert-subtitle { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px;

            font-weight: 900;

            text-transform: uppercase; 
            margin-bottom: 35px; 
        }

        .cert-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 40px; 
            color: var(--br-green); 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-decoration-line: underline; 
            text-decoration-color: var(--br-gold); 
        }

        .cert-img-container { 
            width: 100%; 
            max-width: 450px; 
            height: 280px; 
            margin-top: 0px;
            margin-right: auto;
            margin-bottom: 35px;
            margin-left: auto;
            border-top-left-radius: 18px; 
            border-top-right-radius: 18px; 
            border-bottom-right-radius: 18px; 
            border-bottom-left-radius: 18px; 
            border-top-width: 3px; 
            border-right-width: 3px; 
            border-bottom-width: 3px; 
            border-left-width: 3px; 
            border-top-style: dashed; 
            border-right-style: dashed; 
            border-bottom-style: dashed; 
            border-left-style: dashed; 
            border-top-color: var(--br-border); 
            border-right-color: var(--br-border); 
            border-bottom-color: var(--br-border); 
            border-left-color: var(--br-border); 
            overflow-x: hidden; 
            overflow-y: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--br-bg); 
        }

        .cert-img-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        .cert-msg { 
            font-size: 18px; 
            color: var(--br-text); 
            line-height: 1.6; 
            font-weight: 600; 
            margin-bottom: 35px; 
            font-style: italic; 
        }

        .btn-print { 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            padding-top: 18px;
            padding-right: 45px;
            padding-bottom: 18px;
            padding-left: 45px;
            font-size: 18px; 
            font-weight: 900; 
            border-top-left-radius: 100px; 
            border-top-right-radius: 100px; 
            border-bottom-right-radius: 100px; 
            border-bottom-left-radius: 100px; 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.15); 
            transition-property: transform, box-shadow, background-color;
            transition-duration: 0.5s;
            transition-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-print:hover { 
            transform: translateY(-4px); 
            box-shadow: 0px 20px 35px rgba(203, 174, 117, 0.3); 
            background-color: var(--br-gold); 
        }
        
        .btn-print:active {
            transform: scale(0.95);
        }

        .cert-close { 
            position: absolute; 
            top: 25px; 
            right: 35px; 
            font-size: 35px; 
            color: var(--br-muted); 
            font-weight: 900; 
            transition-property: color, transform; 
            transition-duration: 0.2s; 
            transition-timing-function: ease-in-out;
        }
        
        .cert-close:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }

        /* ----------------------------------------------------------------------
           [4-15. CSS KEYFRAMES ANIMATIONS]
        ---------------------------------------------------------------------- */
        @keyframes popIn { 
            from { 
                opacity: 0; 
                transform: scale(0.92) translateY(15px); 
            } 
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0px); 
            } 
        }
        
        @keyframes blink { 
            0% { 
                opacity: 1; 
            }
            50% { 
                opacity: 0.3; 
            } 
            100% { 
                opacity: 1; 
            }
        }
        
        @keyframes spin {
            0% { 
                transform: rotate(0deg); 
            }
            100% { 
                transform: rotate(360deg); 
            }
        }

        /* ----------------------------------------------------------------------
           [4-16. MOBILE DEVICE RESPONSIVE MEDIA CONSTRAINTS]
        ---------------------------------------------------------------------- */
        
        @media (pointer: coarse) {

                min-width: 44px;

            }

                min-width: 44px;

            }

            }
            
            .tool-group { 
                flex-wrap: wrap;

            .action-group {

            .btn-main { 
                padding-top: 0px; 
                padding-right: 22px;

            }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { 
                display: block; 
            }

                position: fixed; 
                top: 0px;

            }

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div class="app-container">
        
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="UIEngine.closeSidebar()"></div>

        <nav class="sidebar" id="sidebar" aria-label="Curriculum Navigation">

                <div class="brand-logo">Bridge<span>Academy</span></div>
            </header>
            <section class="student-profile" id="profile-box">
                <div class="profile-top">
                    <div class="profile-avatar" id="avatar-char">?</div>

                        <span class="profile-name" id="display-name">Guest</span>
                        <span class="profile-role">Global Premium Explorer</span>
                    </div>
                </div>
                <div class="badge-container" id="badge-container"></div>
            </section>
            <section class="nav-list" id="nav-list" aria-label="Weekly Lessons"></section>
        </nav>

        <div class="workspace">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn interactive-hover" onclick="UIEngine.toggleSidebar()">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>

                </div>
                <div class="sync-indicator-container" id="sync-indicator">

                    <span id="sync-text">Synced</span>
                </div>
            </header>
            
            <div id="error-toast" class="toast-error" role="alert">
                <i class="fa-solid fa-triangle-exclamation"></i> 
                <span id="error-toast-msg">Error Message</span>

            <main class="stage-wrapper interactive-hover">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img" crossorigin="anonymous" alt="Worksheet">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <footer class="bottom-dock">
                <div class="tool-group" role="group" aria-label="Drawing Tools">
                    <div class="color-preview interactive-hover" id="btn-color" onclick="RGBRingEngine.toggle()"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;" aria-hidden="true" tabindex="-1">

        const CurriculumEngine = {
            pages(unitId) {
                const data = PAGE_INTELLIGENCE[unitId];
                if (data) {
                    const keys = Object.keys(data).map(Number);
                    return keys.sort((a, b) => a - b);
                }
                return [];
            },
            first(unitId) {
                const pageArray = this.pages(unitId);
                return pageArray.length > 0 ? pageArray[0] : 1;
            },
            last(unitId) {
                const pageArray = this.pages(unitId);
                return pageArray.length > 0 ? pageArray[pageArray.length - 1] : 1;
            },
            clamp(unitId, page) {
                const pageArray = this.pages(unitId);
                if (pageArray.includes(page)) return page;
                return pageArray.length > 0 ? pageArray[0] : 1;
            },
            next(unitId, page, dir) {
                const pageArray = this.pages(unitId);
                let idx = pageArray.indexOf(page);
                if (idx === -1) idx = 0;
                let calcIdx = Math.min(Math.max(idx + dir, 0), pageArray.length - 1);
                return pageArray[calcIdx] || page;
            },
            weekIndex(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                if (idx === -1) return 1;
                return Math.floor(idx / 4) + 1;
            },
            isWeekEnd(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                if (idx !== -1) {
                    if ((idx + 1) % 4 === 0 || idx === pages.length - 1) return true;
                }
                return false;
            }
        };

        /**
         * [5-6. SMART IMAGE LOADER ENGINE (P0 CORS & 404 방어 알고리즘 탑재)]
         */
        const SmartImageLoader = {
            requestToken: 0,

            async findValidWorksheet(unitId, pageNum) {
                this.requestToken = this.requestToken + 1;
                const token = this.requestToken; 
                
                const imgElement = document.getElementById('worksheet-img');
                const boardElement = document.getElementById('drawing-board');
                
                const seriesChar = unitId.charAt(0);
                const t = Date.now(); 

                /* 깃허브 절대 경로 매칭 알고리즘 */
                const basePaths = [
                    `${seriesChar}/${unitId}/${unitId}-${pageNum}`,
                    `${unitId}/${unitId}-${pageNum}`,
                    `${seriesChar}/${unitId}/${pageNum}`,
                    `${unitId}/${pageNum}`
                ];

                const possiblePaths = [];
                basePaths.forEach((base) => {
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.png`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpg`);
                    possiblePaths.push(`${CONFIG.STORAGE_URL}${base}.jpeg`);
                });

                const tryLoad = (index) => {
                    if (token !== this.requestToken) return;

                    if (index >= possiblePaths.length) {
                        Logger.error(`Worksheet missing. 404 on ${unitId} Page ${pageNum}`);
                        if (imgElement) imgElement.style.opacity = '1';
                        if (boardElement) boardElement.classList.add('error-state');
                        
                        setTimeout(() => {
                            if (token !== this.requestToken) return;
                            CanvasEngine.resizeCanvas();
                            StorageEngine.loadCanvasLocal();
                        }, 50);
                        return;
                    }

                    const testUrl = `${possiblePaths[index]}?t=${t}`;
                    const tempImg = new Image();
                    
                    // [P0] 캔버스 오염(Tainted)을 막기 위해 서버 측 CORS 설정을 존중하도록 강제 지정
                    tempImg.crossOrigin = "anonymous";

                    tempImg.onload = () => {
                        if (token !== this.requestToken) return;
                        Logger.log("Mounted:", testUrl);
                        if (boardElement) boardElement.classList.remove('error-state');
                        
                        if (imgElement) {
                            // 실제 도화지 이미지에도 crossorigin 속성을 동적으로 주입
                            imgElement.crossOrigin = "anonymous";
                            
                            imgElement.onload = () => {
                                if (token !== this.requestToken) return;
                                imgElement.style.opacity = '1';
                                // DOM Reflow를 충분히 기다린 후 캔버스를 덮습니다.
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(() => {
                                        if (token !== this.requestToken) return;
                                        CanvasEngine.resizeCanvas();
                                        StorageEngine.loadCanvasLocal();
                                    });
                                });
                            };
                            imgElement.src = testUrl;
                        }
                    };

                    tempImg.onerror = () => {
                        tryLoad(index + 1);
                    };
                    
                    tempImg.src = testUrl;
                };

                tryLoad(0);
            }
        };

        /**
         * [5-7. CLOUD FIREBASE STORAGE ENGINE]
         */
        const StorageEngine = {
            cloudSaveTimer: null,

            load() {
                if (!STATE.uid) return;
                try {
                    const rawStorage = localStorage.getItem(`br_data_${STATE.uid}_${STATE.unitId}`);
                    let s = {};
                    if (rawStorage) s = JSON.parse(rawStorage);
                    if (s.name) STATE.studentName = s.name; 
                    if (s.badges) STATE.badges = s.badges;
                    
                    const urlPage = Number(new URLSearchParams(window.location.search).get('page'));
                    if (urlPage) {
                        if (CurriculumEngine.pages(STATE.unitId).includes(urlPage)) {
                            STATE.currentPage = urlPage;
                        }
                    } else if (s.page) {
                        STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, s.page);
                    }
                } catch (e) { 
                    Logger.warn("Metadata local cache failure", e); 
                }
            },
            
            async save() {
                if (!STATE.uid) return;
                try {
                    const data = { name: STATE.studentName, page: STATE.currentPage, badges: STATE.badges || [] };
                    localStorage.setItem(`br_data_${STATE.uid}_${STATE.unitId}`, JSON.stringify(data));
                    await db.collection("students").doc(STATE.uid).set({ 
                        name: data.name, page: data.page, badges: data.badges, 
                        email: STATE.studentEmail, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { merge: true });
                } catch (error) { 
                    Logger.error("Core transaction metadata sync failed.", error); 
                }
            },
            
            createCanvasSnapshot(compressForDatabase = false) {
                if (!CanvasEngine.cvs || !STATE.uid) return null;
                let canvasData = null;
                
                // [P0] 502 에러 방지를 위한 해상도 제한 압축 로직
                if (compressForDatabase) {
                    canvasData = CanvasEngine.captureWorksheetWithDrawing(true, 800); 
                } else {
                    canvasData = CanvasEngine.cvs.toDataURL('image/webp', 0.6); 
                }
                
                if (!compressForDatabase) {
                    try { localStorage.setItem(`br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`, canvasData); } catch(e) {}
                }
                
                return { 
                    uid: STATE.uid, studentEmail: STATE.studentEmail, unitId: STATE.unitId, 
                    page: STATE.currentPage, transcript: STATE.lastTranscript, canvasData: canvasData 
                };
            },
            
            saveCanvasLocal() { 
                return this.createCanvasSnapshot(false); 
            },
            
            scheduleCloudSave() {
                SyncIndicatorEngine.setSaving();
                const snapshot = this.createCanvasSnapshot(true);
                if (this.cloudSaveTimer) clearTimeout(this.cloudSaveTimer);
                this.cloudSaveTimer = setTimeout(() => { this.executeCloudSave(snapshot); }, 1500); 
            },
            
            async executeCloudSave(snapshot = null) {
                let payload = snapshot ? snapshot : this.createCanvasSnapshot(true);
                if (!payload) return;
                try {
                    const firestoreDocId = `${payload.uid}_${payload.unitId}_P${payload.page}`;
                    await db.collection("student_drawings").doc(firestoreDocId).set({ 
                        uid: payload.uid, studentID: payload.studentEmail, unitId: payload.unitId, 
                        page: payload.page, imageUrl: payload.canvasData, transcript: payload.transcript, 
                        timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                    }, { merge: true });
                    SyncIndicatorEngine.setSaved();
                } catch (error) { 
                    Logger.warn("Cloud infrastructure save fault.", error); 
                    SyncIndicatorEngine.setError(); 
                }
            },
            
            loadCanvasLocal() {
                try {
                    const cacheKey = `br_cvs_${STATE.uid}_${STATE.unitId}_P${STATE.currentPage}`;
                    const localData = localStorage.getItem(cacheKey);
                    if (localData) {
                        const img = new Image();
                        img.onload = () => { 
                            CanvasEngine.ctx.drawImage(img, 0, 0, CanvasEngine.cvs.width / CanvasEngine.dpr, CanvasEngine.cvs.height / CanvasEngine.dpr); 
                            CanvasEngine.saveHistory(); 
                        };
                        img.src = localData;
                    } else { 
                        CanvasEngine.saveHistory();

                } catch (error) { 
                    CanvasEngine.saveHistory(); 
                }
            }
        };

        /**
         * [5-8. INTERACTIVE CANVAS & DRAWING ENGINE]
         */
        const CanvasEngine = {
            isDrawing: false, hasMoved: false, isErasing: false, lastColor: "#363431", 
            dpr: window.devicePixelRatio || 1, historyStack: [], historyIndex: -1,
            
            init() {
                this.cvs = document.getElementById('draw-layer'); 
                if (!this.cvs) return;
                this.ctx = this.cvs.getContext('2d'); 
                this.board = document.getElementById('drawing-board');
                
                this.setupUI(); 
                this.setupCanvas(); 
                this.bind(); 
                this.updateBrushPreview();
                
                const slider = document.getElementById('brush-size');
                if (slider) slider.addEventListener('input', () => this.updateBrushPreview());
                if (window.ResizeObserver && this.board) { 
                    new ResizeObserver(() => this.resizeCanvas()).observe(this.board); 
                }
            },
            
            updateBrushPreview() {
                const slider = document.getElementById('brush-size'); 
                const dot = document.getElementById('brush-preview-dot');
                if (!slider || !dot) return;
                
                const val = parseInt(slider.value); 
                dot.style.width = `${val}px`; 
                dot.style.height = `${val}px`;
                dot.style.backgroundColor = this.isErasing ? "var(--br-muted)" : this.lastColor;
            },
            
            isCanvasBlank() {
                if (!this.cvs || !this.ctx) return true;
                try {
                    const probe = document.createElement('canvas'); 
                    probe.width = 64; probe.height = 64;
                    const pctx = probe.getContext('2d'); 
                    pctx.drawImage(this.cvs, 0, 0, 64, 64);
                    const pixels = pctx.getImageData(0, 0, 64, 64).data;
                    for (let i = 3; i < pixels.length; i += 4) { 
                        if (pixels[i] !== 0) return false; 
                    }
                    return true;
                } catch(e) { return true; }
            },
            
            /**
             * [P0 Tainted Canvas & 502 Error 방어 Survival Engine]
             */
            captureWorksheetWithDrawing(compressForDatabase = false, initialMaxWidth = 800) {
                const worksheet = document.getElementById('worksheet-img'); 
                const draw = this.cvs;
                if (!draw) return null;
                
                const merged = document.createElement('canvas');
                let scaleRatio = 1.0;
                
                if (compressForDatabase === true) {
                    if (draw.width > initialMaxWidth) scaleRatio = initialMaxWidth / draw.width;
                }
                
                merged.width = Math.floor(draw.width * scaleRatio); 
                merged.height = Math.floor(draw.height * scaleRatio);
                const ctx = merged.getContext('2d'); 
                ctx.fillStyle = '#FFFFFF'; 
                ctx.fillRect(0, 0, merged.width, merged.height);
                
                try {
                    if (worksheet && worksheet.complete && worksheet.naturalWidth > 0) {
                        ctx.drawImage(worksheet, 0, 0, merged.width, merged.height); 
                    }
                    ctx.drawImage(draw, 0, 0, merged.width, merged.height);
                } catch(e) { 
                    /* 캔버스가 오염되어 병합에 실패한 경우, 아이가 그린 '드로잉 영역'만 안전하게 추출하여 전송합니다. */
                    Logger.warn("Security Canvas Taint Detected. Engaging fallback extraction.");
                    const fallbackCanvas = document.createElement('canvas');
                    fallbackCanvas.width = Math.floor(draw.width * scaleRatio);
                    fallbackCanvas.height = Math.floor(draw.height * scaleRatio);
                    const fCtx = fallbackCanvas.getContext('2d');
                    fCtx.fillStyle = '#FFFFFF';
                    fCtx.fillRect(0, 0, fallbackCanvas.width, fallbackCanvas.height);
                    fCtx.drawImage(draw, 0, 0, fallbackCanvas.width, fallbackCanvas.height);
                    ctx.drawImage(fallbackCanvas, 0, 0);
                }

                if (compressForDatabase === true) {
                    let qualityLevel = 0.7;
                    let encodedString = merged.toDataURL('image/jpeg', qualityLevel);
                    
                    // 502 에러 방지를 위한 강력한 While 압축 루프
                    while (encodedString.length > 400000) {
                        if (qualityLevel <= 0.1) break;
                        qualityLevel = qualityLevel - 0.15;
                        encodedString = merged.toDataURL('image/jpeg', qualityLevel);
                    }

                    if (encodedString.length > 400000) {
                        const microCanvas = document.createElement('canvas');
                        microCanvas.width = Math.floor(merged.width / 2);
                        microCanvas.height = Math.floor(merged.height / 2);
                        const microCtx = microCanvas.getContext('2d');
                        microCtx.fillStyle = '#FFFFFF';
                        microCtx.fillRect(0, 0, microCanvas.width, microCanvas.height);
                        microCtx.drawImage(merged, 0, 0, microCanvas.width, microCanvas.height);
                        encodedString = microCanvas.toDataURL('image/jpeg', 0.5);
                    }
                    return encodedString;
                } else {
                    return merged.toDataURL('image/jpeg', 0.8); 
                }
            },
            
            setupCanvas() {
                if (!this.board || !this.cvs) return;
                const rect = this.board.getBoundingClientRect(); 
                if (rect.width === 0) return;
                this.cvs.style.width = rect.width + "px"; 
                this.cvs.style.height = rect.height + "px";
                this.cvs.width = rect.width * this.dpr; 
                this.cvs.height = rect.height * this.dpr;
                this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); 
                this.ctx.lineCap = 'round'; 
                this.ctx.lineJoin = 'round';
            },
            
            resizeCanvas() {
                if (!this.cvs || !this.ctx || !this.board) return;
                const rect = this.board.getBoundingClientRect(); 
                if (rect.width === 0 || rect.height === 0) return;
                
                const temp = document.createElement('canvas'); 
                temp.width = this.cvs.width; 
                temp.height = this.cvs.height;
                
                if (this.cvs.width > 0 && this.cvs.height > 0) {
                    temp.getContext('2d').drawImage(this.cvs, 0, 0);
                }
                
                this.setupCanvas();
                
                if (temp.width > 0 && temp.height > 0) {
                    this.ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, rect.width, rect.height);
                }
            },
            
            bind() {
                const getP = (e) => { 
                    const r = this.cvs.getBoundingClientRect(); 
                    let cx = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0); 
                    let cy = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0); 
                    return { x: cx - r.left, y: cy - r.top }; 
                };
                
                const start = (e) => { 
                    e.preventDefault(); 
                    this.isDrawing = true; 
                    this.hasMoved = false; 
                    const p = getP(e); 
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y); 
                };
                
                const move = (e) => {
                    if (!this.isDrawing) return;
                    e.preventDefault(); 
                    this.hasMoved = true; 
                    const p = getP(e);
                    
                    this.ctx.globalCompositeOperation = this.isErasing ? "destination-out" : "source-over";
                    const sliderVal = document.getElementById('brush-size').value; 
                    this.ctx.lineWidth = this.isErasing ? sliderVal * 3 : sliderVal; 
                    this.ctx.strokeStyle = this.isErasing ? "#FFFFFF" : this.lastColor; 
                    
                    if (STATE.brushType === 'rainbow' && !this.isErasing) {
                        this.ctx.strokeStyle = `hsl(${(Date.now() / 10) % 360}, 100%, 50%)`; 
                    } else if (STATE.brushType === 'neon' && !this.isErasing) { 
                        this.ctx.shadowBlur = parseInt(sliderVal) + 10; 
                        this.ctx.shadowColor = this.lastColor; 
                    } else { 
                        this.ctx.shadowBlur = 0; 
                    }
                    
                    this.ctx.lineTo(p.x, p.y); 
                    this.ctx.stroke(); 
                    this.ctx.beginPath(); 
                    this.ctx.moveTo(p.x, p.y);
                };
                
                const end = () => { 
                    this.isDrawing = false; 
                    this.ctx.shadowBlur = 0; 
                    if (this.hasMoved) { 
                        this.saveHistory(); 
                        StorageEngine.saveCanvasLocal(); 
                        StorageEngine.scheduleCloudSave(); 
                    } 
                };
                
                this.cvs.addEventListener('pointerdown', start); 
                this.cvs.addEventListener('pointermove', move); 
                this.cvs.addEventListener('pointerup', end); 
                this.cvs.addEventListener('pointerleave', end);
            },
            
            saveHistory() { 
                this.historyIndex++; 
                this.historyStack.length = this.historyIndex; 
                this.historyStack.push(this.cvs.toDataURL()); 
                if (this.historyStack.length > 20) { 
                    this.historyStack.shift(); 
                    this.historyIndex--; 
                } 
            },
            
            undo() { 
                if (this.historyIndex > 0) { 
                    this.historyIndex--; 
                    this.restore(); 
                    StorageEngine.saveCanvasLocal(); 
                    StorageEngine.scheduleCloudSave(); 
                } 
            },
            
            restore() { 
                if (!this.ctx || !this.cvs) return;
                const img = new Image(); 
                img.onload = () => { 
                    this.ctx.save(); 
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                    this.ctx.drawImage(img, 0, 0, this.cvs.width, this.cvs.height); 
                    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                    this.ctx.restore(); 
                }; 
                img.src = this.historyStack[this.historyIndex]; 
            },
            
            setBrush(t) { 
                STATE.brushType = t; 
                document.querySelectorAll('.btn-magic').forEach((el) => el.classList.remove('active'));
                const activeBtn = document.getElementById(`btn-brush-${t}`); 
                if (activeBtn) activeBtn.classList.add('active'); 
                if (this.isErasing) this.toggleEraser(); 
            },
            
            toggleEraser() { 
                this.isErasing = !this.isErasing;
                const btn = document.getElementById('btn-eraser'); 
                if (btn) btn.classList.toggle('active'); 
                this.updateBrushPreview(); 
            },
            
            setColor(color) { 
                this.lastColor = color; 
                const preview = document.getElementById('btn-color'); 
                if (preview) preview.style.background = color; 
                if (this.isErasing) this.toggleEraser(); 
                this.updateBrushPreview(); 
            },
            
            setupUI() { 
                const preview = document.getElementById('btn-color'); 
                if (preview) preview.style.background = this.lastColor; 
            },
            
            hardReset() { 
                if (!this.ctx || !this.cvs) return;
                try { 
                    this.ctx.save(); 
                    this.ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height); 
                    this.ctx.restore(); 
                    this.historyStack = []; 
                    this.historyIndex = -1; 
                } catch(e) { Logger.error("Canvas clear error", e); } 
            },
            
            promptHardReset() { 
                CustomModalEngine.confirm("Clear Canvas", "Are you absolutely sure you want to wipe this clean?", () => { 
                    this.hardReset(); 
                    this.saveHistory(); 
                    StorageEngine.saveCanvasLocal(); 
                    StorageEngine.scheduleCloudSave(); 
                }); 
            }
        };

        const RGBRingEngine = {
            init() {
                const c = document.getElementById('color-wheel'); 
                if (!c) return;
                const ctx = c.getContext('2d', { willReadFrequently: true }); 
                
                for (let a = 0; a < 360; a++) { 
                    ctx.beginPath(); 
                    ctx.moveTo(75, 75); 
                    ctx.arc(75, 75, 75, a * Math.PI / 180, (a + 2) * Math.PI / 180); 
                    ctx.fillStyle = `hsl(${a}, 100%, 50%)`; 
                    ctx.fill(); 
                }
                
                c.onclick = (e) => { 
                    const rect = c.getBoundingClientRect(); 
                    const pX = e.clientX - rect.left;
                    const pY = e.clientY - rect.top;
                    const imgData = ctx.getImageData(pX, pY, 1, 1);
                    const rgbStr = `rgb(${imgData.data[0]}, ${imgData.data[1]}, ${imgData.data[2]})`;
                    CanvasEngine.setColor(rgbStr); 
                    this.toggle(); 
                };
            },
            toggle() { 
                const modal = document.getElementById('rgb-modal');
                if (modal) modal.classList.toggle('active'); 
            }
        };

                    const data = await response.json(); 
                    if (data.reply) return data.reply;
                    return "앗, 선생님이 지금 답변을 주기 어려워요.";

            async submit() {
