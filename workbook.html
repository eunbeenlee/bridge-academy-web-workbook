<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FCFBF9">
    
    <title>Bridge Academy | Premium AI Lab V100.53</title>

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ----------------------------------------------------------------------
           [4-1. DESIGN TOKENS]
        ---------------------------------------------------------------------- */
        :root {
            --br-green: #91D3B4; 
            --br-gold: #CBAE75; 
            --br-blue: #7CA6C1; 
            --br-charcoal: #363431;
            
            --br-bg: #FCFBF9; 
            --br-paper: #FFFFFF; 
            --br-ai-soft: #F8FAFF;
            
            --br-text: #2A2825; 
            --br-muted: #8C8985;
            --br-border: #F0EFEB; 
            
            --br-error: #E74C3C; 
            --br-error-light: #FEF2F2;
            --br-error-border: #FCA5A5;
            --br-success: #2ECC71;
            
            --sidebar-width: 320px;
            --topbar-height: 85px;
            --dock-height: 110px;
            
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            --transition-smooth: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            --transition-fast: all 0.2s ease-in-out;
            --transition-elastic: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            --shadow-float: 0px 25px 70px rgba(0, 0, 0, 0.07);
            --shadow-button: 0px 10px 20px rgba(0, 0, 0, 0.05);
            --shadow-premium: 0px 30px 60px rgba(54, 52, 49, 0.15);
        }

        /* ----------------------------------------------------------------------
           [4-2. BASE RESET]
        ---------------------------------------------------------------------- */
        * { 
            margin: 0px; 
            padding: 0px; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            cursor: none !important;
        }

        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: var(--br-bg); 
            color: var(--br-text); 
            font-family: 'Pretendard', sans-serif; 
            pointer-events: auto !important; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }

        a, input, select, textarea, button { 
            cursor: none !important; 
        }

        button { 
            border: none; 
            background-color: transparent; 
            font-family: inherit; 
            outline: none; 
        }

        ul, ol, li { 
            list-style: none; 
        }

        @supports not (height: 100dvh) {
            html, body, .app-container { 
                height: 100vh; 
            }
        }

        /* ----------------------------------------------------------------------
           [4-3. PREMIUM CUSTOM CURSOR]
        ---------------------------------------------------------------------- */
        .cursor-dot {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 4px;
            height: 4px;
            background-color: rgba(54, 52, 49, 0.75);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.16s ease, height 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
        }

        .cursor-ring {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 22px;
            height: 22px;
            border: 1px solid rgba(54, 52, 49, 0.28);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.22s cubic-bezier(0.19, 1, 0.22, 1), 
                        height 0.22s cubic-bezier(0.19, 1, 0.22, 1), 
                        opacity 0.22s cubic-bezier(0.19, 1, 0.22, 1), 
                        border-color 0.22s cubic-bezier(0.19, 1, 0.22, 1), 
                        background-color 0.22s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .cursor-dot.hovered {
            width: 3px;
            height: 3px;
            background-color: rgba(145, 211, 180, 0.8);
        }

        .cursor-ring.hovered {
            width: 28px;
            height: 28px;
            background-color: rgba(145, 211, 180, 0.05);
            border-color: rgba(145, 211, 180, 0.5);
        }

        .cursor-dot.hidden, .cursor-ring.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .stage-wrapper, .drawing-board, #draw-layer {
            cursor: crosshair !important;
        }

        @media (pointer: coarse) {
            .cursor-dot, .cursor-ring { display: none !important; }
            html, body, a, button, input, select, textarea, .stage-wrapper, .drawing-board, #draw-layer { cursor: auto !important; }
        }
        
        /* ----------------------------------------------------------------------
           [4-4. APP CONTAINER]
        ---------------------------------------------------------------------- */
        .app-container { 
            display: flex; 
            flex-direction: row;
            width: 100vw; 
            height: 100dvh; 
            position: relative; 
            pointer-events: auto !important; 
        }
        
        /* ----------------------------------------------------------------------
           [4-5. SIDEBAR]
        ---------------------------------------------------------------------- */
        .sidebar { 
            width: var(--sidebar-width); 
            height: 100%; 
            background-color: var(--br-paper); 
            border-right: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            z-index: 2000; 
            flex-shrink: 0; 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
            box-shadow: 5px 0px 15px rgba(0, 0, 0, 0.02);
        }

        .sidebar-backdrop {
            position: fixed;
            top: 0px;
            right: 0px;
            bottom: 0px;
            left: 0px;
            background-color: rgba(0, 0, 0, 0.18);
            z-index: 1500; 
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(3px); 
        }

        .sidebar-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-header { 
            padding: 35px 30px;
            text-align: center; 
            border-bottom: 1px solid var(--br-border); 
            transition: background-color 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        .sidebar-header:hover {
            background-color: var(--br-bg);
        }

        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
        }

        .brand-logo span { 
            color: var(--br-green); 
            font-style: italic; 
        }
        
        /* ----------------------------------------------------------------------
           [4-6. STUDENT PROFILE]
        ---------------------------------------------------------------------- */
        .student-profile { 
            padding: 25px 30px;
            border-bottom: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #FAFAFA; 
            transition: background-color 0.3s ease; 
        }

        .student-profile.registered { 
            background-color: var(--br-ai-soft); 
        }

        .profile-top { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }

        .profile-avatar { 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            background-color: var(--br-border); 
            color: #FFFFFF; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: 22px; 
            font-family: 'Nunito', sans-serif; 
            transition: background-color 0.4s, box-shadow 0.4s, color 0.4s;
            box-shadow: inset 0px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .student-profile.registered .profile-avatar { 
            background-color: var(--br-gold); 
            box-shadow: 0px 8px 20px rgba(203, 174, 117, 0.3); 
        }

        .profile-info { 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        .profile-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            text-transform: uppercase; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .profile-role { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--br-muted); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }

        .badge-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            min-height: 24px;
        }

        .badge { 
            font-size: 11px; 
            padding: 4px 10px;
            border-radius: 12px; 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.02); 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* ----------------------------------------------------------------------
           [4-7. NAVIGATION LIST]
        ---------------------------------------------------------------------- */
        .nav-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px;
            scroll-behavior: smooth; 
        }

        .nav-list::-webkit-scrollbar { 
            width: 5px; 
        }

        .nav-list::-webkit-scrollbar-track { 
            background-color: transparent; 
        }

        .nav-list::-webkit-scrollbar-thumb { 
            background-color: #E8E6E1; 
            border-radius: 10px; 
        }

        .nav-list::-webkit-scrollbar-thumb:hover { 
            background-color: #D5D3CE; 
        }

        .nav-item { 
            padding: 18px 20px;
            margin-bottom: 10px; 
            border-radius: 15px; 
            background-color: #FAFAFA; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: transform 0.4s, background-color 0.4s, border-color 0.4s, box-shadow 0.4s;
            border: 1px solid transparent; 
        }

        .nav-item:hover { 
            background-color: #FFFFFF; 
            border-color: var(--br-border);
            transform: translateY(-2px); 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.02); 
        }

        .nav-item.active { 
            background-color: var(--br-ai-soft); 
            border-left: 6px solid var(--br-green); 
            border-top-color: transparent; 
            border-right-color: transparent; 
            border-bottom-color: transparent; 
            box-shadow: 0px 10px 25px rgba(145, 211, 180, 0.12); 
        }

        .nav-title { 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--br-charcoal); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 170px; 
        }

        .nav-item.active .nav-title { 
            font-weight: 900; 
            color: var(--br-green); 
        }

        .nav-badge { 
            font-family: 'Nunito', sans-serif; 
            font-size: 10px; 
            font-weight: 900; 
            color: var(--br-muted); 
        }

        .nav-item.active .nav-badge { 
            color: var(--br-green); 
            opacity: 1; 
        }

        /* ----------------------------------------------------------------------
           [4-8. WORKSPACE & TOP CONTEXT BAR]
        ---------------------------------------------------------------------- */
        .workspace { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0px; 
            height: 100%; 
            position: relative; 
            overflow: hidden; 
            pointer-events: auto !important; 
        }

        .top-bar { 
            height: var(--topbar-height); 
            padding: 0px 45px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
            background-color: #FFFFFF; 
            z-index: 10; 
        }

        .top-bar-left { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }

        .mobile-menu-btn { 
            display: none; 
            font-size: 28px; 
            padding: 10px; 
            color: var(--br-charcoal); 
            z-index: 1500; 
        }

        .unit-info { 
            font-family: 'Nunito', sans-serif; 
            font-size: 13px; 
            font-weight: 900; 
            color: var(--br-gold); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }

        .page-info { 
            font-family: 'Playfair Display', serif; 
            font-size: 34px; 
            font-weight: 900; 
            color: var(--br-charcoal); 
            letter-spacing: -0.5px; 
            margin-top: 2px; 
        }

        .sync-indicator-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            background-color: var(--br-bg);
            border: 1px solid var(--br-border);
            font-size: 12px;
            font-weight: 700;
            color: var(--br-muted);
            transition: background-color 0.4s, color 0.4s, border-color 0.4s ease;
        }

        .sync-indicator-container.saving {
            color: var(--br-blue);
            background-color: #F0F4F8;
            border-color: #D9E4EC; 
        }

        .sync-indicator-container.saved {
            color: var(--br-success);
            background-color: #F0FDF4;
            border-color: #DCFCE7; 
        }

        .sync-icon.spin { 
            animation: spin 1s linear infinite; 
        }

        .toast-error { 
            display: none; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--br-error); 
            background-color: var(--br-error-light); 
            padding: 8px 16px;
            border-radius: 50px; 
            border: 1px solid var(--br-error-border); 
            animation: popIn 0.3s ease-out; 
            z-index: 5000;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .toast-error.show { 
            display: flex; 
        }
        
        /* ----------------------------------------------------------------------
           [4-9. STAGE & DRAWING BOARD]
        ---------------------------------------------------------------------- */
        .stage-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px;
            background-color: var(--br-bg); 
            perspective: 1200px; 
            overflow: hidden; 
        }

        .drawing-board { 
            position: relative; 
            display: inline-flex; 
            border-radius: 20px; 
            box-shadow: var(--shadow-premium); 
            background-color: #FFFFFF; 
            transition: opacity 0.4s, transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: center; 
            pointer-events: auto !important; 
            max-width: 100%; 
            max-height: 100%; 
            overflow: hidden;
        }

        .drawing-board::after {
            content: '';
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10000; 
            mix-blend-mode: multiply;
        }

        .drawing-board.fade-out { 
            opacity: 0; 
            transform: scale(0.95) translateY(20px); 
        }

        .drawing-board.error-state { 
            border: 2px dashed var(--br-error); 
            background-color: #FFF0F0; 
        }

        #worksheet-img { 
            display: block; 
            max-width: 100%; 
            max-height: calc(100dvh - 250px); 
            width: auto; 
            height: auto; 
            border-radius: 20px; 
            pointer-events: none !important; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
            user-select: none; 
            object-fit: contain;
            background-color: transparent;
        }

        #draw-layer { 
            position: absolute; 
            top: 0px; 
            left: 0px; 
            width: 100%; 
            height: 100%; 
            z-index: 9999 !important; 
            touch-action: none; 
            border-radius: 20px; 
        }

        /* ----------------------------------------------------------------------
           [4-10. BOTTOM CONTROLS]
        ---------------------------------------------------------------------- */
        .bottom-dock { 
            height: var(--dock-height); 
            background-color: rgba(255, 255, 255, 0.98); 
            border-top: 1px solid var(--br-border); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0px 50px var(--safe-bottom) 50px;
            z-index: 500; 
        }

        .tool-group { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background-color: #F8F9FA; 
            padding: 12px 30px;
            border-radius: 100px; 
            border: 1px solid var(--br-border); 
        }

        .color-preview { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 3px solid #FFFFFF; 
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1); 
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .color-preview:active { 
            transform: scale(0.85); 
        }

        .btn-magic { 
            font-size: 24px; 
            padding: 5px; 
            transition: transform 0.5s, filter 0.5s, opacity 0.5s ease;
            filter: grayscale(100%); 
            opacity: 0.6; 
        }

        .btn-magic:active {
            transform: scale(0.8);
        }

        .btn-magic.active { 
            filter: grayscale(0%); 
            opacity: 1; 
            transform: scale(1.3); 
        }

        .brush-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0px 10px;
        }

        .brush-slider { 
            width: 90px; 
            accent-color: var(--br-green); 
            height: 6px; 
            border-radius: 10px; 
        }

        .brush-preview-dot {
            width: 6px;
            height: 6px;
            background-color: var(--br-charcoal);
            border-radius: 50%;
            transition: width 0.1s, height 0.1s, background-color 0.3s ease;
            display: inline-block;
        }

        .btn-tool { 
            font-size: 18px; 
            font-weight: 900; 
            padding: 10px 14px;
            color: var(--br-charcoal); 
            transition: transform 0.4s, background-color 0.4s, color 0.4s ease;
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            border-radius: 12px; 
        }

        .btn-tool:active { 
            transform: scale(0.85); 
        }

        .btn-erase { 
            font-size: 14px; 
            font-weight: 900; 
            padding: 12px 18px;
            border-radius: 14px; 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.2s ease-in-out;
            color: var(--br-charcoal); 
        }

        .btn-erase:active {
            transform: scale(0.9);
        }

        .btn-erase.active { 
            background-color: var(--br-error); 
            color: #FFFFFF; 
            border-color: var(--br-error);
        }
        
        .btn-reset-all {
            font-size: 14px; 
            font-weight: 900; 
            padding: 12px 18px;
            border-radius: 14px; 
            background-color: #FFF5F5; 
            border: 1px solid #FFEBEB; 
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s ease-in-out;
            color: var(--br-error);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-reset-all:hover {
            background-color: var(--br-error-light);
            border-color: var(--br-error-border);
        }
        
        .btn-reset-all:active {
            transform: scale(0.9);
        }

        /* ----------------------------------------------------------------------
           [4-11. ACTION NAVIGATION MODULES]
        ---------------------------------------------------------------------- */
        .action-group { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }

        .btn-nav { 
            width: 60px; 
            height: 60px; 
            border-radius: 18px; 
            border: 1px solid var(--br-border); 
            background-color: #FFFFFF; 
            font-size: 24px; 
            transition: background-color 0.5s, border-color 0.5s, transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: var(--br-charcoal); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: var(--shadow-button); 
        }

        .btn-nav:hover { 
            background-color: #FAFAFA; 
            border-color: var(--br-charcoal);
        }

        .btn-nav:active { 
            transform: scale(0.85); 
        }

        .btn-main { 
            height: 60px; 
            padding: 0px 35px;
            border-radius: 18px; 
            font-weight: 900; 
            font-size: 15px; 
            letter-spacing: 1px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: background-color 0.5s, color 0.5s, border-color 0.5s, transform 0.5s, box-shadow 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-transform: uppercase; 
            font-family: 'Nunito', sans-serif; 
        }

        .btn-record { 
            background-color: #FFFFFF; 
            border: 1px solid var(--br-border); 
            color: var(--br-charcoal); 
        }

        .btn-record:hover { 
            border-color: var(--br-error);
            color: var(--br-error); 
        }
        
        .btn-record:active {
            transform: scale(0.95);
        }

        .btn-record.recording { 
            background-color: #FFF0F0; 
            color: var(--br-error); 
            border-color: var(--br-error);
            box-shadow: inset 0px 0px 0px 2px var(--br-error); 
        }

        .btn-record .dot { 
            width: 12px; 
            height: 12px; 
            background-color: var(--br-error); 
            border-radius: 50%; 
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        .btn-record.recording .dot { 
            opacity: 1; 
            animation-name: blink; 
            animation-duration: 1s; 
            animation-iteration-count: infinite; 
        }

        .btn-submit { 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            box-shadow: 0px 10px 30px rgba(54, 52, 49, 0.2); 
        }

        .btn-submit:hover { 
            background-color: var(--br-gold); 
            transform: translateY(-3px); 
            box-shadow: 0px 15px 35px rgba(203, 174, 117, 0.4); 
        }

        .btn-submit:active { 
            transform: scale(0.9) translateY(0px); 
        }

        /* ----------------------------------------------------------------------
           [4-12. AI RESPONSIVE SIDE PANEL]
        ---------------------------------------------------------------------- */
        .ai-panel { 
            position: absolute; 
            top: 0px; 
            right: -480px; 
            width: 480px; 
            height: 100%; 
            background-color: #FFFFFF; 
            box-shadow: -25px 0px 60px rgba(0, 0, 0, 0.12); 
            z-index: 10001; 
            transition: right 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--br-border); 
        }

        .ai-panel.open { 
            right: 0px; 
        }

        .ai-header { 
            padding-top: 30px;
            padding-right: 35px;
            padding-bottom: 30px;
            padding-left: 35px;
            background-color: var(--br-ai-soft); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--br-border); 
        }

        .ai-title { 
            font-family: 'Jua', sans-serif; 
            font-size: 24px; 
            color: var(--br-green); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        .btn-close-ai { 
            font-size: 34px; 
            color: var(--br-muted); 
            line-height: 1; 
            transition: color 0.2s, transform 0.2s ease-in-out;
        }

        .btn-close-ai:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }
        
        .ai-content { 
            padding-top: 30px;
            padding-right: 35px;
            padding-bottom: 30px;
            padding-left: 35px;
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth; 
        }
        
        .chat-bubble { 
            max-width: 90%; 
            padding-top: 20px;
            padding-right: 25px;
            padding-bottom: 20px;
            padding-left: 25px;
            border-radius: 22px; 
            font-size: 16px; 
            line-height: 1.7; 
            font-weight: 500; 
            word-break: keep-all; 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .chat-bubble.ai { 
            align-self: flex-start; 
            background-color: #F8F9FA; 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--br-border); 
            color: var(--br-text); 
        }

        .chat-bubble.user { 
            align-self: flex-end; 
            background-color: var(--br-green); 
            color: #FFFFFF; 
            border-bottom-right-radius: 4px; 
            box-shadow: 0px 8px 20px rgba(145, 211, 180, 0.3); 
        }
        
        .ai-loading-container { 
            text-align: center; 
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .ai-loading-icon { 
            font-size: 36px; 
            color: var(--br-green); 
            margin-bottom: 15px; 
        }

        .ai-loading-text { 
            font-weight: 900; 
            color: var(--br-muted); 
            font-family: 'Nunito', sans-serif; 
            font-size: 14px; 
        }

        .analytics-card { 
            background-color: #FAFAFA; 
            border: 1px solid var(--br-border); 
            border-radius: 24px; 
            padding: 25px;
            align-self: stretch; 
            margin-bottom: 10px; 
        }

        .analytics-title { 
            font-family: 'Nunito', sans-serif; 
            color: var(--br-gold); 
            font-size: 14px; 
            margin-bottom: 20px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-bottom: 1px dashed var(--br-border); 
            padding-bottom: 12px; 
        }

        .stat-row { 
            margin-bottom: 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }

        .stat-label { 
            font-size: 13px; 
            font-weight: 800; 
            display: flex; 
            justify-content: space-between; 
            color: var(--br-charcoal); 
        }

        .bar-bg { 
            width: 100%; 
            height: 10px; 
            background-color: #E8E6E1; 
            border-radius: 12px; 
            overflow: hidden; 
        }

        .bar-fill { 
            height: 100%; 
            transition: width 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 12px; 
        }

        .chat-footer { 
            padding-top: 25px;
            padding-right: 35px;
            padding-bottom: 25px;
            padding-left: 35px;
            border-top: 1px solid var(--br-border); 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #FFFFFF; 
        }

        .btn-chat-action { 
            width: 100%; 
            height: 60px; 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            border-radius: 18px; 
            font-weight: 900; 
            transition: background-color 0.3s, transform 0.3s ease;
            font-size: 16px; 
            letter-spacing: 1px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            font-family: 'Nunito', sans-serif; 
            box-shadow: 0px 10px 20px rgba(54, 52, 49, 0.2); 
        }
        
        .btn-chat-action:hover { 
            background-color: var(--br-gold); 
            transform: translateY(-2px); 
        }
        
        .btn-chat-action:active {
            transform: scale(0.95);
        }

        .btn-chat-next { 
            width: 100%; 
            text-align: center; 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--br-blue); 
            margin-top: 15px; 
            transition: color 0.3s ease; 
        }
        
        .btn-chat-next:hover { 
            color: var(--br-gold); 
        }

        /* ----------------------------------------------------------------------
           [4-13. SUBSYSTEM DIALOG CUSTOM MODALS]
        ---------------------------------------------------------------------- */
        .bridge-modal-overlay {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100vw;
            height: 100dvh;
            background-color: rgba(42, 40, 37, 0.6);
            z-index: 40000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .bridge-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bridge-modal-box {
            background-color: var(--br-paper);
            width: 420px;
            max-width: 90%;
            border-radius: 24px;
            padding: 40px 35px 35px 35px;
            text-align: center;
            box-shadow: var(--shadow-premium);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bridge-modal-overlay.active .bridge-modal-box {
            transform: scale(1) translateY(0px);
        }

        .bridge-modal-icon {
            font-size: 45px;
            color: var(--br-gold);
            margin-bottom: 20px;
            display: block;
        }
        
        .bridge-modal-icon.warning {
            color: var(--br-error);
        }

        .bridge-modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--br-charcoal);
            margin-bottom: 12px;
        }

        .bridge-modal-text {
            font-size: 15px;
            color: var(--br-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .bridge-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .bridge-modal-btn {
            flex: 1;
            padding: 15px 0px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.5s, background-color 0.5s, box-shadow 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .bridge-modal-btn:active {
            transform: scale(0.9);
        }

        .bridge-modal-cancel {
            background-color: #F0EFEB;
            color: var(--br-charcoal);
            border: 1px solid transparent;
        }
        
        .bridge-modal-cancel:hover {
            background-color: #E5E4E0;
        }

        .bridge-modal-confirm {
            background-color: var(--br-error);
            color: #FFFFFF;
            border: 1px solid transparent;
            box-shadow: 0px 8px 15px rgba(231, 76, 60, 0.2);
        }
        
        .bridge-modal-confirm:hover {
            background-color: #C0392B;
        }
        
        .bridge-modal-confirm.neutral {
            background-color: var(--br-charcoal);
            box-shadow: 0px 8px 15px rgba(54, 52, 49, 0.2);
        }
        
        .bridge-modal-confirm.neutral:hover {
            background-color: var(--br-gold);
        }

        /* ----------------------------------------------------------------------
           [4-14. COLOR PALETTE & CERTIFICATE OVERLAYS]
        ---------------------------------------------------------------------- */
        .rgb-modal { 
            position: absolute; 
            bottom: 130px; 
            left: 50px; 
            background-color: #FFFFFF; 
            border-radius: 25px; 
            padding: 25px;
            box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.15); 
            z-index: 5000; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
            transition: opacity 0.3s, transform 0.3s ease; 
        }

        .rgb-modal.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0px); 
        }
        
        .rgb-modal-close { 
            text-align: center; 
            font-size: 10px; 
            margin-top: 12px; 
            font-weight: 900; 
            color: var(--br-muted); 
            transition: color 0.2s ease;
        }

        .rgb-modal-close:hover { 
            color: var(--br-charcoal); 
        }

        .cert-modal-overlay { 
            position: fixed; 
            top: 0px; 
            right: 0px;
            bottom: 0px;
            left: 0px; 
            width: 100vw; 
            height: 100dvh; 
            background-color: rgba(0, 0, 0, 0.85); 
            z-index: 30000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.4s ease; 
            backdrop-filter: blur(15px); 
        }

        .cert-modal-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }

        .cert-card { 
            background-color: #FFFFFF; 
            width: 850px; 
            max-width: 90%; 
            border-radius: 35px; 
            padding: 60px;
            text-align: center; 
            position: relative; 
            box-shadow: 0px 40px 80px rgba(0, 0, 0, 0.4); 
            transform: scale(0.85); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .cert-modal-overlay.active .cert-card { 
            transform: scale(1); 
        }

        .cert-border { 
            border: 10px solid var(--br-gold); 
            border-radius: 25px; 
            padding: 50px;
            position: relative; 
        }

        .cert-title { 
            font-family: 'Playfair Display', serif; 
            font-size: 50px; 
            color: var(--br-charcoal); 
            font-weight: 900; 
            margin-bottom: 15px; 
        }

        .cert-subtitle { 
            font-family: 'Nunito', sans-serif; 
            font-size: 18px; 
            color: var(--br-muted); 
            font-weight: 900; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 35px; 
        }

        .cert-name { 
            font-family: 'Nunito', sans-serif; 
            font-size: 40px; 
            color: var(--br-green); 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-decoration: underline; 
            text-decoration-color: var(--br-gold); 
        }

        .cert-img-container { 
            width: 100%; 
            max-width: 450px; 
            height: 280px; 
            margin: 0px auto 35px auto;
            border-radius: 18px; 
            border: 3px dashed var(--br-border); 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--br-bg); 
        }

        .cert-img-container img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        .cert-msg { 
            font-size: 18px; 
            color: var(--br-text); 
            line-height: 1.6; 
            font-weight: 600; 
            margin-bottom: 35px; 
            font-style: italic; 
        }

        .btn-print { 
            background-color: var(--br-charcoal); 
            color: #FFFFFF; 
            padding: 18px 45px;
            font-size: 18px; 
            font-weight: 900; 
            border-radius: 100px; 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.15); 
            transition: transform 0.5s, box-shadow 0.5s, background-color 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
        }

        .btn-print:hover { 
            transform: translateY(-4px); 
            box-shadow: 0px 20px 35px rgba(203, 174, 117, 0.3); 
            background-color: var(--br-gold); 
        }
        
        .btn-print:active {
            transform: scale(0.95);
        }

        .cert-close { 
            position: absolute; 
            top: 25px; 
            right: 35px; 
            font-size: 35px; 
            color: var(--br-muted); 
            font-weight: 900; 
            transition: color 0.2s, transform 0.2s ease-in-out;
        }
        
        .cert-close:hover { 
            color: var(--br-error); 
            transform: rotate(90deg); 
        }

        /* ----------------------------------------------------------------------
           [4-15. CSS KEYFRAMES ANIMATIONS]
        ---------------------------------------------------------------------- */
        @keyframes popIn { 
            from { opacity: 0; transform: scale(0.92) translateY(15px); } 
            to { opacity: 1; transform: scale(1) translateY(0px); } 
        }
        
        @keyframes blink { 
            0% { opacity: 1; }
            50% { opacity: 0.3; } 
            100% { opacity: 1; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----------------------------------------------------------------------
           [4-16. MOBILE DEVICE RESPONSIVE MEDIA CONSTRAINTS]
        ---------------------------------------------------------------------- */
        @media (pointer: coarse) {
            .btn-nav, .btn-main, .btn-tool, .btn-erase, .btn-magic, .color-preview, .btn-reset-all { min-width: 44px; min-height: 44px; }
        }

        @media (min-width: 801px) and (max-width: 1180px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; top: 0px; left: 0px; transform: translateX(-100%); box-shadow: none; }
            .sidebar.open { transform: translateX(0px); box-shadow: 20px 0px 50px rgba(0, 0, 0, 0.18); }
            .workspace { width: 100%; }
            .top-bar { height: 76px; padding: 0px 24px; }
            .stage-wrapper { padding: 20px; }
            .bottom-dock { height: 128px; padding: 14px 24px; gap: 14px; }
            .tool-group { flex-wrap: wrap; justify-content: center; }
            .action-group { flex-wrap: wrap; justify-content: center; }
            .btn-main { padding: 0px 22px; }
        }

        @media (max-width: 800px) {
            .mobile-menu-btn { display: block; }
            .sidebar { position: fixed; top: 0px; left: 0px; transform: translateX(-100%); box-shadow: none; }
            .sidebar.open { transform: translateX(0px); box-shadow: 20px 0px 50px rgba(0, 0, 0, 0.2); }
            .workspace { width: 100%; }
            .stage-wrapper { padding: 12px; }
            #worksheet-img { min-width: 0px; width: 100%; max-width: 100%; max-height: calc(100dvh - 240px); }
            .bottom-dock { height: calc(140px + var(--safe-bottom)); flex-direction: column; justify-content: center; padding: 10px 20px calc(10px + var(--safe-bottom)) 20px; gap: 12px; border-radius: 25px 25px 0px 0px; }
            .tool-group { width: 100%; justify-content: center; padding: 8px 20px; }
            .action-group { width: 100%; justify-content: space-between; }
            .btn-nav { height: 50px; font-size: 13px; }
            .btn-main { height: 50px; font-size: 13px; }
            .ai-panel { width: 100%; right: -100%; border-left: none; }
            .rgb-modal { left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(160px + var(--safe-bottom)); }
            .rgb-modal.active { transform: translateX(-50%) translateY(0px); }
            .cert-card { padding: 30px 20px; }
            .cert-border { padding: 20px; }
            .cert-title { font-size: 30px; }
            .bridge-modal-box { padding: 30px 20px; max-width: 95%; }
        }

        @media (max-width: 560px) {
            .top-bar { height: 68px; padding: 0px 14px; }
            .unit-info { font-size: 10px; letter-spacing: 1.8px; }
            .page-info { font-size: 24px; }
            .ai-header { padding: 0px 20px; }
            .ai-content { padding: 0px 20px; }
            .chat-footer { padding: 0px 20px; }
            .chat-bubble { max-width: 96%; font-size: 15px; }
        }

        @media (max-width: 480px) {
            .bottom-dock { height: calc(170px + var(--safe-bottom)); padding: 10px 12px calc(10px + var(--safe-bottom)) 12px; }
            .tool-group { gap: 6px; padding: 8px; border-radius: 18px; flex-wrap: wrap; }
            .btn-magic { font-size: 20px; }
            .brush-slider { width: 72px; }
            #worksheet-img { max-height: calc(100dvh - 220px); }
            .btn-main { height: 48px; padding: 0px 14px; font-size: 12px; flex: 1; justify-content: center; }
            .btn-nav { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div class="app-container">
        
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="UIEngine.closeSidebar()"></div>

        <nav class="sidebar" id="sidebar">
            <header class="sidebar-header" onclick="location.href='dashboard.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </header>
            <section class="student-profile" id="profile-box">
                <div class="profile-top">
                    <div class="profile-avatar" id="avatar-char">?</div>
                    <div class="profile-info">
                        <span class="profile-name" id="display-name">Guest</span>
                        <span class="profile-role">Global Premium Explorer</span>
                    </div>
                </div>
                <div class="badge-container" id="badge-container"></div>
            </section>
            <section class="nav-list" id="nav-list"></section>
        </nav>

        <div class="workspace">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-btn interactive-hover" onclick="UIEngine.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <div>
                        <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                        <div id="page-info" class="page-info">Inquiry P.01</div>
                    </div>
                </div>
                <div class="sync-indicator-container" id="sync-indicator">
                    <i class="fa-solid fa-cloud sync-icon" id="sync-icon"></i><span id="sync-text">Synced</span>
                </div>
            </header>
            
            <div id="error-toast" class="toast-error" role="alert">
                <i class="fa-solid fa-triangle-exclamation"></i> 
                <span id="error-toast-msg">Error</span>
            </div>

            <main class="stage-wrapper interactive-hover">
                <div class="drawing-board" id="drawing-board">
                    <img src="" id="worksheet-img" alt="Worksheet">
                    <canvas id="draw-layer"></canvas>
                </div>
            </main>

            <footer class="bottom-dock">
                <div class="tool-group" role="group">
                    <div class="color-preview interactive-hover" id="btn-color" onclick="RGBRingEngine.toggle()"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;" tabindex="-1">
                    <button class="btn-magic active interactive-hover" id="btn-brush-normal" onclick="CanvasEngine.setBrush('normal')">🖍️</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-neon" onclick="CanvasEngine.setBrush('neon')">🌟</button>
                    <button class="btn-magic interactive-hover" id="btn-brush-rainbow" onclick="CanvasEngine.setBrush('rainbow')">🌈</button>
                    <div class="brush-slider-wrapper">
                        <input type="range" class="brush-slider interactive-hover" id="brush-size" min="2" max="35" value="6">
                        <div class="brush-preview-dot" id="brush-preview-dot"></div>
                    </div>
                    <button class="btn-tool interactive-hover" onclick="CanvasEngine.undo()"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn-erase interactive-hover" id="btn-eraser" onclick="CanvasEngine.toggleEraser()">ERASER</button>
                    <button class="btn-reset-all interactive-hover" onclick="CanvasEngine.promptHardReset()"><i class="fa-solid fa-trash-can"></i> CLEAR</button>
                </div>
                
                <div class="action-group" role="group">
                    <button class="btn-nav interactive-hover" onclick="AppEngine.smoothMove(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="btn-main btn-record interactive-hover" id="btn-record" onclick="AudioEngine.toggle()"><div class="dot"></div><span id="record-text">Voice Log</span></button>

        const CurriculumEngine = {
            pages(unitId) {
                const data = PAGE_INTELLIGENCE[unitId];
                if (data) {
                    const keys = Object.keys(data);
                    const numKeys = keys.map(Number);
                    return numKeys.sort((a, b) => {
                        return a - b;
                    });
                } else {
                    return [];
                }
            },
            
            first(unitId) {
                const pageArray = this.pages(unitId);
                if (pageArray.length > 0) {
                    return pageArray[0];
                } else {
                    return 1;
                }
            },
            
            last(unitId) {
                const pageArray = this.pages(unitId);
                if (pageArray.length > 0) {
                    return pageArray[pageArray.length - 1];
                } else {
                    return 1;
                }
            },
            
            clamp(unitId, page) {
                const pageArray = this.pages(unitId);
                if (pageArray.includes(page)) {
                    return page;
                } else {
                    if (pageArray.length > 0) {
                        return pageArray[0];
                    } else {
                        return 1;
                    }
                }
            },
            
            next(unitId, page, dir) {
                const pageArray = this.pages(unitId);
                let idx = pageArray.indexOf(page);
                if (idx === -1) {
                    idx = 0;
                }
                
                let calcIdx = Math.min(Math.max(idx + dir, 0), pageArray.length - 1);
                
                if (pageArray[calcIdx]) {
                    return pageArray[calcIdx];
                } else {
                    return page;
                }
            },

            weekIndex(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                if (idx === -1) {
                    return 1;
                } else {
                    return Math.floor(idx / 4) + 1;
                }
            },

            isWeekEnd(unitId, page) {
                const pages = this.pages(unitId);
                const idx = pages.indexOf(page);
                
                if (idx !== -1) {
                    if ((idx + 1) % 4 === 0) {
                        return true;
                    } else if (idx === pages.length - 1) {
                        return true;
                    } else {
                        return false;
                    }
                } else {
                    return false;
                }
            }
        };

        if (!PAGE_INTELLIGENCE[STATE.unitId]) {
            Logger.warn(`Invalid Unit ID: ${STATE.unitId}. Fallback to A-1.`);
            STATE.unitId = "A-1";
        }
        
        const rawPageParam = new URLSearchParams(window.location.search).get('page');
        if (rawPageParam) {
            STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, Number(rawPageParam));
        } else {
            STATE.currentPage = CurriculumEngine.clamp(STATE.unitId, CurriculumEngine.first(STATE.unitId));
