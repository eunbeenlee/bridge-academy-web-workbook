<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Workbook Project</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bridge-green: #7BB891;
            --bridge-gold: #C5A059;
            --bridge-blue: #6A9CBE;
            --bridge-charcoal: #2D2D34;
            --bridge-bg: #F9FAF9;
            --bridge-text-main: #1A1A1E;
            --bridge-text-muted: #888890;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bridge-bg); color: var(--bridge-text-main); line-height: 1.6; overflow-x: hidden; }

        /* [Header] */
        header {
            width: 100%; padding: 30px 6%; background: rgba(255, 255, 255, 0.95); 
            border-bottom: 1px solid rgba(45, 45, 52, 0.06); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
        }
        .text-logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 24px; color: var(--bridge-charcoal); }
        .text-logo span { color: var(--bridge-green); font-style: italic; }
        .campus-badge { font-size: 11px; font-weight: 800; letter-spacing: 5px; background: #EAE6DF; padding: 12px 28px; border-radius: 100px; }

        /* [Hero Section] */
        .hero-stage { padding: 120px 6% 80px; text-align: center; }
        .hero-stage h1 { font-family: 'Playfair Display', serif; font-size: 80px; font-weight: 900; margin-bottom: 20px; color: var(--bridge-charcoal); }
        .hero-stage p { font-size: 20px; color: var(--bridge-text-muted); font-weight: 300; max-width: 800px; margin: 0 auto; }

        /* [Filters] */
        .filter-dock { display: flex; justify-content: center; gap: 16px; margin-bottom: 80px; }
        .filter-btn { padding: 16px 40px; border-radius: 100px; border: 1px solid #E0E0E0; background: #FFF; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--bridge-text-muted); transition: 0.3s; }
        .filter-btn.active { background: var(--bridge-charcoal); color: #FFF; border-color: var(--bridge-charcoal); transform: scale(1.05); }

        /* [Workbook Roadmap] */
        .roadmap-stage { padding: 0 6% 150px; max-width: 1400px; margin: 0 auto; }
        .month-segment { margin-bottom: 150px; }
        .month-anchor { text-align: center; margin-bottom: 60px; }
        .anchor-name { font-family: 'Playfair Display', serif; font-size: 60px; font-weight: 900; color: var(--bridge-charcoal); }

        /* [Absolute Single-Focus Theme Card] - No images, massive clickable area */
        .workbook-card { 
            margin-bottom: 60px; background: #FFFFFF; border-radius: 40px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04); 
            display: flex; cursor: pointer; transition: 0.4s; overflow: hidden; border: 1px solid #F0F0F0; text-decoration: none;
        }
        .workbook-card:hover { transform: translateY(-10px); box-shadow: 0 50px 100px rgba(45, 45, 52, 0.08); }
        
        .card-accent-bar { width: 20px; transition: 0.4s; }
        .workbook-card.series-A .card-accent-bar { background: var(--bridge-green); }
        .workbook-card.series-B .card-accent-bar { background: var(--bridge-gold); }
        .workbook-card.series-C .card-accent-bar { background: var(--bridge-blue); }
        .workbook-card.series-D .card-accent-bar { background: var(--bridge-charcoal); }

        .card-main-focus { flex: 7; padding: 70px 80px; display: flex; flex-direction: column; justify-content: center; }
        .theme-unit-badge { font-size: 12px; font-weight: 900; color: #FFF; background: var(--bridge-charcoal); padding: 8px 16px; border-radius: 6px; display: inline-block; width: max-content; margin-bottom: 20px; }
        .theme-h2-title { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 900; margin-bottom: 20px; color: var(--bridge-text-main); line-height: 1.1; }
        .theme-question-box { font-size: 24px; font-weight: 300; color: var(--bridge-text-muted); font-style: italic; }
        
        .lab-enter-cta { margin-top: 50px; font-size: 13px; font-weight: 800; color: var(--bridge-charcoal); letter-spacing: 2px; }

        .card-reading-side { flex: 3; background: var(--bridge-bg); padding: 70px 60px; border-left: 1px solid #F0F0F0; display: flex; flex-direction: column; justify-content: center; }
        .reading-list-title { font-size: 11px; font-weight: 800; color: var(--bridge-text-muted); letter-spacing: 4px; margin-bottom: 30px; border-bottom: 1px solid #E0E0E0; padding-bottom: 15px; }
        .reading-item-list { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .reading-item-list li { font-size: 18px; font-weight: 500; color: var(--bridge-text-muted); display: flex; gap: 15px; transition: 0.3s; }
        .reading-item-list li span.num { font-size: 11px; font-weight: 900; color: var(--bridge-charcoal); opacity: 0.3; }
        .workbook-card:hover .reading-item-list li { color: var(--bridge-text-main); transform: translateX(5px); }

        @media (max-width: 1024px) {
            .workbook-card { flex-direction: column; }
            .card-reading-side { border-left: none; border-top: 1px solid #F0F0F0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="text-logo">Bridge<span>Academy</span></div>
        <div class="campus-badge">WORKBOOK PROJECT</div>
    </header>

    <main>
        <section class="hero-stage">
            <h1>Inquiry <span>Workbook</span></h1>
            <p>브릿지 아카데미의 24개 핵심 테마. 오직 질문과 주제에 집중하여 17페이지 워크북을 탐구합니다.</p>
        </section>

        <nav class="filter-dock">
            <button id="q-all" class="filter-btn active" onclick="WorkbookUI.filter('ALL')">All Units</button>
            <button id="q-A" class="filter-btn" onclick="WorkbookUI.filter('A')">Series A</button>
            <button id="q-B" class="filter-btn" onclick="WorkbookUI.filter('B')">Series B</button>
            <button id="q-C" class="filter-btn" onclick="WorkbookUI.filter('C')">Series C</button>
            <button id="q-D" class="filter-btn" onclick="WorkbookUI.filter('D')">Series D</button>
        </nav>

        <section id="roadmap-master" class="roadmap-stage"></section>
    </main>

    <script>
        const WORKBOOK_DB = [
            { month: "Jan", unit: "A1", series: "A", theme: "All About Me", question: "나는 누구일까요?", id: "A-1", books: ["I Like Myself!", "The Color Monster", "My Five Senses", "The Family Book", "From Head to Toe"] },
            { month: "Feb", unit: "A2", series: "A", theme: "Little Crawlers", question: "작은 곤충들의 세상은 어떨까?", id: "A-2", books: ["The Very Hungry Caterpillar", "The Very Busy Spider", "The Grouchy Ladybug", "Waiting for Wings", "The Honeybee"] },
            { month: "Jan", unit: "B1", series: "B", theme: "Me on the Map", question: "나는 세상 어디에 살고 있을까?", id: "B-1", books: ["Me on the Map", "This Is How We Do It", "Whoever You Are", "Madeline", "We're All Wonders"] }
            // 원장님 필요에 따라 C-1, D-1 등 계속 추가 가능합니다.
        ];

        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const WorkbookUI = {
            currentFilter: 'ALL',

            init() { this.render(); },

            filter(f) {
                this.currentFilter = f;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(`q-${f}`).classList.add('active');
                this.render();
            },

            render() {
                const roadmap = document.getElementById('roadmap-master');
                roadmap.innerHTML = ""; 

                MONTHS.forEach(mName => {
                    const themes = WORKBOOK_DB.filter(d => d.month === mName);
                    if (themes.length === 0) return;

                    const segment = document.createElement('div');
                    segment.className = 'month-segment';
                    segment.innerHTML = `<div class="month-anchor"><h2 class="anchor-name">${mName.toUpperCase()}</h2></div>`;

                    themes.forEach(t => {
                        if (this.currentFilter !== 'ALL' && t.series !== this.currentFilter) return;
                        segment.appendChild(this.createCard(t));
                    });

                    if (segment.children.length > 1) roadmap.appendChild(segment);
                });
            },

            createCard(t) {
                const card = document.createElement('div');
                card.className = `workbook-card series-${t.series}`;
                
                // 카드 전체 영역 클릭 시 워크북으로 이동
                card.addEventListener('click', () => {
                    window.location.href = `workbook.html?id=${t.id}`;
                });
                
                card.innerHTML = `
                    <div class="card-accent-bar"></div>
                    <div class="card-main-focus">
                        <span class="theme-unit-badge">UNIT ${t.id}</span>
                        <h2 class="theme-h2-title">${t.theme}</h2>
                        <div class="theme-question-box">"${t.question}"</div>
                        <div class="lab-enter-cta">WORKBOOK 시작하기 →</div>
                    </div>
                    <div class="card-reading-side">
                        <span class="reading-list-title">권장 도서 목록</span>
                        <ul class="reading-item-list">
                            ${t.books.map((b, idx) => `<li><span class="num">0${idx+1}</span> ${b}</li>`).join('')}
                        </ul>
                    </div>
                `;
                return card;
            }
        };

        document.addEventListener('DOMContentLoaded', () => WorkbookUI.init());
    </script>
</body>
</html>
