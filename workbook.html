<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bridge Academy | Elite Inquiry Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bridge-green: #8CC69F; --bridge-taupe: #A39B8E; --bridge-charcoal: #3A3A42; 
            --bridge-bg: #F0F2F1; --bridge-paper: #FFFFFF; --bridge-gold: #C5A059; --bridge-danger: #E07A5F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* 프리미엄 엠비언트 배경 */
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: radial-gradient(circle at center, #F7F9F8 0%, #DDE3E0 100%);
            margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--bridge-charcoal); 
        }
        
        /* 사이드바 */
        .sidebar { width: 260px; background: var(--bridge-paper); display: flex; flex-direction: column; z-index: 20; border-right: 1px solid rgba(0,0,0,0.05); box-shadow: 10px 0 30px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #F5F5F5; cursor: pointer; }
        .sidebar-logo { max-width: 150px; }
        .nav-list { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-item { padding: 14px 18px; margin-bottom: 10px; border-radius: 15px; cursor: pointer; color: #888; font-size: 13px; background: #FAFAFA; border: 1px solid transparent; transition: 0.2s; }
        .nav-item.active { background: #EAF4ED; color: var(--bridge-charcoal); font-weight: bold; border-left: 4px solid var(--bridge-green); border-color: #E0EBE3; }

        /* 메인 레이아웃 */
        .app-container { display: flex; flex: 1; height: 100vh; overflow: hidden; flex-direction: column; }
        .viewer { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; position: relative; overflow-y: auto; }

        /* 상단 상태 바 */
        .top-status { width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .target-tag { font-size: 11px; font-weight: 900; color: var(--bridge-green); letter-spacing: 3px; text-transform: uppercase; border-bottom: 2px solid var(--bridge-green); padding-bottom: 4px; }
        #target-words-text { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--bridge-charcoal); }

        /* 💡 워크시트: A4 세로 꽉 찬 화면 유지 */
        .canvas-container { 
            position: relative; background: var(--bridge-paper); border-radius: 8px; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.05); 
            padding: 0; line-height: 0; touch-action: none;
            width: 100%; max-width: 700px; border: 1px solid #EEE; margin-bottom: 20px;
        }
        #main-img { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 8px; }
        #drawing-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; touch-action: none; border-radius: 8px; }

        /* 💡 하단 컨트롤 독(Dock): 길쭉해짐 방지 및 누락 버튼 복구 */
        .bottom-dock { 
            width: 100%; background: rgba(255,255,255,0.95); padding: 20px 30px; border-top: 1px solid #EEE;
            display: flex; flex-direction: column; gap: 15px; align-items: center; justify-content: center; z-index: 30;
            backdrop-filter: blur(15px); box-shadow: 0 -15px 40px rgba(0,0,0,0.03);
            position: sticky; bottom: 0;
        }
        
        .tool-row { 
            display: flex; width: 100%; max-width: 700px; align-items: center; justify-content: space-between; gap: 15px; 
            background: #F7F9F8; padding: 12px 20px; border-radius: 50px; border: 1px solid #EAEAEA;
        }
        
        /* 복구된 네비게이션 버튼 */
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; background: #FFF; border: 1px solid #DDD; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--bridge-charcoal); font-weight: bold; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-icon:hover { background: var(--bridge-green); color: #FFF; border-color: var(--bridge-green); }
        .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; background: #FFF; color: #CCC; border-color: #EEE; }

        .color-selector { display: flex; align-items: center; gap: 12px; }
        .color-ring-container { width: 45px; height: 45px; cursor: pointer; position: relative; }
        #color-wheel { border-radius: 50%; width: 100%; height: 100%; }
        .current-color { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #FFF; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        .brush-control-wrap { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
        .brush-slider { width: 100%; max-width: 150px; height: 6px; accent-color: var(--bridge-green); cursor: pointer; }

        .btn-text { background: none; border: none; color: #888; font-weight: 800; cursor: pointer; font-size: 12px; letter-spacing: 1px; padding: 10px; }

        /* 액션 버튼 (늘어남 방지를 위해 max-width 적용) */
        .action-row { display: flex; width: 100%; max-width: 700px; gap: 15px; justify-content: center; }
        .btn-action { padding: 18px 30px; border-radius: 50px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-record { background: #FFF; color: var(--bridge-charcoal); border: 2px solid #EAEAEA; flex: 1; max-width: 280px; }
        .btn-record.recording { background: var(--bridge-danger); color: #FFF; border-color: var(--bridge-danger); animation: pulse 1.5s infinite; }
        .btn-submit { background: var(--bridge-charcoal); color: #FFF; flex: 1.5; max-width: 400px; box-shadow: 0 10px 25px rgba(58, 58, 66, 0.2); }
        .btn-submit:hover { background: var(--bridge-green); }

        /* 결과 오버레이 */
        #success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(247, 249, 248, 0.98); backdrop-filter: blur(20px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 40px; }
        .score-badge { font-size: 52px; color: #FFF; background: var(--bridge-green); padding: 15px 65px; border-radius: 100px; margin-bottom: 25px; font-weight: 900; }
        .child-msg-box { font-size: 28px; font-weight: 800; color: var(--bridge-charcoal); margin-bottom: 30px; line-height: 1.4; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* 모바일 최적화 */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; }
            .nav-list { flex-direction: row; overflow-x: auto; padding: 10px; gap: 8px; }
            .nav-item { min-width: 140px; font-size: 11px; padding: 12px; margin-bottom: 0; }
            .viewer { padding: 15px 10px; }
            .bottom-dock { padding: 15px 10px; }
            .tool-row { flex-wrap: wrap; justify-content: center; padding: 15px; border-radius: 20px; }
            .btn-action { padding: 15px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div style="display: flex; width: 100%; height: 100vh;">
    <div class="sidebar">
        <div class="sidebar-header" onclick="location.href='index.html'">
            <img src="logo.png" alt="Bridge Academy" class="sidebar-logo">
        </div>
        <div id="nav-list" class="nav-list"></div>
    </div>

    <div class="app-container">
        <div class="viewer">
            <div class="top-status">
                <div class="target-tag">Foundation Series</div>
                <div id="target-words-text">Loading...</div>
            </div>

            <div class="canvas-container">
                <div id="success-overlay">
                    <div id="score-badge" class="score-badge">WAIT</div>
                    <div id="child-msg" class="child-msg-box">Teacher is reviewing...</div>
                    <button class="btn-action btn-submit" style="max-width: 300px;" onclick="handleOverlayClick()">CONTINUE EXPLORATION</button>
                </div>
                <img src="" id="main-img" crossorigin="anonymous">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </div>

        <!-- 💡 늘어남 현상이 완벽히 제어된 하단 독(Dock) -->
        <div class="bottom-dock">
            <div class="tool-row">
                <button id="prev-btn" class="btn-icon" onclick="changePage(-1)">◀</button>
                
                <div class="color-selector">
                    <div class="color-ring-container"><canvas id="color-wheel" width="90" height="90"></canvas></div>
                    <div id="current-color-bg" class="current-color"></div>
                </div>
                
                <div class="brush-control-wrap">
                    <span style="font-size: 10px; font-weight: 900; color: #AAA;">PEN</span>
                    <input type="range" id="brush-size" class="brush-slider" min="3" max="25" value="8">
                </div>
                
                <button onclick="resetCanvas()" class="btn-text">RESET</button>
                <button id="next-btn" class="btn-icon" onclick="changePage(1)">▶</button>
            </div>
            
            <div class="action-row">
                <button id="record-btn" class="btn-action btn-record" onclick="toggleRecording()">🎤 RECORD</button>
                <button class="btn-action btn-submit" onclick="submitWork()">SUBMIT INQUIRY ✨</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyA49lQJey_oVBlgMv6hBN9Ncp1Vo1PbKa4"; 
    const modelName = "gemini-1.5-flash"; 

    const curriculumData = {
        "A1": [
            { id: 1, title: "All About Me", img: "1.png", words: "Me, Face" },
            { id: 2, title: "Under the Sea", img: "2.png", words: "Shark, Whale" }
        ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const data = curriculumData[urlParams.get('series') || 'A1'];
    let currentPageIndex = 0; let savedName = "Student"; let drawing = false; let audioBlob = null;
    const canvas = document.getElementById('drawing-canvas'); const ctx = canvas.getContext('2d');
    const img = document.getElementById('main-img'); const brushSlider = document.getElementById('brush-size');

    function resetCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.beginPath(); drawing = false; }

    const wheelCanvas = document.getElementById('color-wheel'); const wheelCtx = wheelCanvas.getContext('2d');
    function drawColorWheel() {
        const radius = wheelCanvas.width / 2;
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle-1)*Math.PI/180; const endAngle = (angle+1)*Math.PI/180;
            wheelCtx.beginPath(); wheelCtx.moveTo(radius, radius); wheelCtx.arc(radius, radius, radius, startAngle, endAngle);
            wheelCtx.fillStyle = `hsl(${angle}, 100%, 50%)`; wheelCtx.fill();
        }
        wheelCtx.beginPath(); wheelCtx.arc(radius, radius, radius*0.35, 0, Math.PI*2); wheelCtx.fillStyle = "white"; wheelCtx.fill();
    }
    function pickColor(e) {
        const rect = wheelCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) * (wheelCanvas.width / rect.width);
        const y = (clientY - rect.top) * (wheelCanvas.height / rect.height);
        const pixel = wheelCtx.getImageData(x, y, 1, 1).data;
        if (pixel[3] !== 0) {
            const color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
            ctx.strokeStyle = color; document.getElementById('current-color-bg').style.background = color;
        }
    }
    wheelCanvas.addEventListener('mousedown', pickColor);
    wheelCanvas.addEventListener('touchstart', (e) => { pickColor(e); e.preventDefault(); }, {passive: false});

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = img.clientWidth * dpr; canvas.height = img.clientHeight * dpr;
        canvas.style.width = img.clientWidth + 'px'; canvas.style.height = img.clientHeight + 'px';
        ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineWidth = brushSlider.value;
    }
    img.onload = resizeCanvas;
    window.addEventListener('resize', resizeCanvas);
    brushSlider.oninput = () => { ctx.lineWidth = brushSlider.value; };

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }
    canvas.addEventListener('mousedown', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', e => { if (!drawing) return; e.preventDefault(); const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('touchstart', e => { drawing = true; const p = getCoords(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, {passive:false});
    canvas.addEventListener('touchmove', e => { if (!drawing) return; const p = getCoords(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, {passive:false});

    let mediaRecorder; let audioChunks = []; let isRecording = false;
    async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(type => MediaRecorder.isTypeSupported(type));
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: mimeType }); audioChunks = [];
                    btn.innerHTML = "🎵 RECORDED"; btn.style.background = "var(--bridge-green)"; btn.style.color = "#FFF"; btn.style.borderColor = "var(--bridge-green)";
                };
                audioChunks = []; mediaRecorder.start(); isRecording = true;
                btn.innerHTML = "🔴 RECORDING"; btn.classList.add('recording');
            } catch (err) { alert("Mic required."); }
        } else { mediaRecorder.stop(); isRecording = false; mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
    }

    // 💡 누락되었던 네비게이션 로직 전면 복구
    function loadPage(idx) { 
        currentPageIndex = idx; audioBlob = null; 
        
        // 버튼 초기화
        const recordBtn = document.getElementById('record-btn');
        recordBtn.innerHTML = "🎤 RECORD"; recordBtn.style.background = "#FFF"; recordBtn.style.color = "var(--bridge-charcoal)"; recordBtn.style.borderColor = "#EAEAEA";
        
        img.src = data[idx].img; 
        document.getElementById('target-words-text').innerText = data[idx].words; 
        ctx.clearRect(0,0,canvas.width,canvas.height); 
        
        document.querySelectorAll('.nav-item').forEach((el, index) => el.classList.toggle('active', index === idx));
        
        // 이전/다음 버튼 활성화 제어
        document.getElementById('prev-btn').disabled = (idx === 0);
        document.getElementById('next-btn').disabled = (idx === data.length - 1);
    }
    
    function changePage(step) { loadPage(currentPageIndex + step); }

    async function submitWork() {
        document.getElementById('success-overlay').style.display = 'flex';
        const tempCanvas = document.createElement('canvas'); const tCtx = tempCanvas.getContext('2d');
        tempCanvas.width = 400; tempCanvas.height = img.naturalHeight * (400 / img.naturalWidth);
        tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
        tCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, tempCanvas.width, tempCanvas.height);
        const base64Img = tempCanvas.toDataURL("image/jpeg", 0.5).split(',')[1];
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Analyze drawing for ${savedName}. Target: ${data[currentPageIndex].words}. Provide child praise and parent insight in JSON: {score, child_msg, extracted_name}` }, { inline_data: { mime_type: "image/jpeg", data: base64Img } }] }] })
            });
            const d = await res.json(); const analysis = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g, "").match(/\{.*\}/s)[0]);
            if (currentPageIndex === 0 && analysis.extracted_name) savedName = analysis.extracted_name;
            document.getElementById('score-badge').innerText = analysis.score + "%"; document.getElementById('child-msg').innerText = analysis.child_msg;
        } catch (e) { document.getElementById('score-badge').innerText = "100%"; }
    }

    function handleOverlayClick() { document.getElementById('success-overlay').style.display = 'none'; }

    if (data) {
        const navList = document.getElementById('nav-list');
        data.forEach((item, index) => {
            const div = document.createElement('div'); div.className = 'nav-item' + (index === 0 ? ' active' : '');
            div.innerHTML = `<span style="font-size:10px; font-weight:800; opacity:0.5; display:block; margin-bottom:4px;">INQUIRY 0${item.id}</span>${item.title}`;
            div.onclick = () => loadPage(index); navList.appendChild(div);
        });
        drawColorWheel(); setTimeout(() => loadPage(0), 100);
    }
</script>
</body>
</html>
