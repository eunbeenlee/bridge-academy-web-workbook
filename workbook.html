<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy | Premium EdTech Lab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ======================================================================
         * [Architecture: Bridge EdTech System V45.0]
         * ====================================================================== */
        :root {
            --br-green: #89BFA0; --br-gold: #CBAE75; --br-blue: #7CA6C1; --br-charcoal: #363431;
            --br-bg: #FCFBF9; --br-paper: #FFFFFF; --br-text: #2A2825; --br-muted: #8C8985;
            --br-border: #F0EFEB; --br-error: #E74C3C; --br-ai: #F4F8F5;
            --ease-lux: cubic-bezier(0.19, 1, 0.22, 1);
            --sidebar-width: 340px;
            --dock-height: 120px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--br-bg); color: var(--br-text); font-family: 'Noto Sans KR', sans-serif; overscroll-behavior-y: none; }
        button { border: none; background: none; font-family: inherit; cursor: pointer; outline: none; }
        
        /* [Student Login Modal] */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(252, 251, 249, 0.95); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .auth-box { background: #FFF; padding: 60px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.05); text-align: center; border: 1px solid var(--br-border); max-width: 400px; width: 90%; }
        .auth-logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; color: var(--br-charcoal); margin-bottom: 20px; }
        .auth-logo span { color: var(--br-green); font-style: italic; }
        .auth-desc { font-size: 14px; color: var(--br-muted); margin-bottom: 40px; }
        .auth-input { width: 100%; padding: 20px; border-radius: 15px; border: 2px solid var(--br-border); font-size: 18px; text-align: center; margin-bottom: 20px; outline: none; font-family: inherit; font-weight: 700; transition: 0.3s; }
        .auth-input:focus { border-color: var(--br-green); box-shadow: 0 0 15px rgba(137, 191, 160, 0.2); }
        .auth-btn { width: 100%; padding: 20px; border-radius: 15px; background: var(--br-charcoal); color: #FFF; font-weight: 800; letter-spacing: 2px; font-size: 16px; transition: 0.3s; }
        .auth-btn:hover { background: var(--br-green); }

        /* [Main App Layout] */
        .app-container { display: flex; width: 100vw; height: 100vh; position: relative; opacity: 0; transition: opacity 1s ease; }
        
        /* [Sidebar] */
        .sidebar { width: var(--sidebar-width); background: var(--br-paper); border-right: 1px solid var(--br-border); display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 40px 30px; text-align: center; border-bottom: 1px solid var(--br-border); cursor: pointer; }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 900; color: var(--br-charcoal); }
        .brand-logo span { color: var(--br-green); font-style: italic; }
        
        .student-profile { padding: 20px 30px; border-bottom: 1px solid var(--br-border); display: flex; align-items: center; gap: 15px; background: #FAFAFA; }
        .profile-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--br-gold); color: #FFF; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 16px; font-weight: 800; }
        .profile-role { font-size: 11px; color: var(--br-muted); letter-spacing: 1px; }

        .nav-list { flex: 1; overflow-y: auto; padding: 25px; }
        .nav-item { padding: 20px; margin-bottom: 12px; border-radius: 18px; background: #FAFAFA; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; cursor: pointer; border: 1px solid transparent; }
        .nav-item.active { background: var(--br-ai); border-left: 6px solid var(--br-green); font-weight: 700; }
        
        /* [Workspace & Canvas] */
        .workspace { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--br-bg); }
        .top-bar { padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; }
        .unit-info { font-size: 14px; font-weight: 900; color: var(--br-gold); letter-spacing: 5px; }
        .page-info { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; color: var(--br-charcoal); }
        
        .soundscape-ui { display: flex; align-items: center; gap: 10px; background: #FFF; padding: 10px 20px; border-radius: 100px; border: 1px solid var(--br-border); font-size: 12px; font-weight: 700; color: var(--br-muted); cursor: pointer; }
        .soundscape-ui.active { color: var(--br-blue); border-color: var(--br-blue); }

        .stage-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0 50px 30px; position: relative; }
        .canvas-container { position: relative; background: var(--br-paper); border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); width: 100%; max-width: 900px; line-height: 0; border: 1px solid var(--br-border); }
        #worksheet-img { width: 100%; height: auto; border-radius: 30px; opacity: 0; transition: 0.5s; user-select: none; -webkit-user-drag: none; }
        #draw-layer { position: absolute; top: 0; left: 0; border-radius: 30px; cursor: crosshair; touch-action: none; z-index: 50; }

        /* [Dynamic Scaffolding Hint] */
        .scaffolding-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 30px 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 2px dashed var(--br-gold); text-align: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.8s; }
        .scaffolding-hint.show { opacity: 1; }
        .hint-icon { font-size: 40px; margin-bottom: 15px; }
        .hint-text { font-size: 16px; font-weight: 700; color: var(--br-charcoal); }

        /* [Bottom Control Dock] */
        .bottom-dock { height: var(--dock-height); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--br-border); display: flex; align-items: center; justify-content: space-between; padding: 0 50px; z-index: 500; }
        .tool-group { display: flex; align-items: center; gap: 20px; background: #F8FAF9; padding: 15px 30px; border-radius: 100px; border: 1px solid var(--br-border); }
        .color-preview { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #FFF; cursor: pointer; background: var(--br-charcoal); }
        .brush-slider { width: 150px; accent-color: var(--br-green); cursor: pointer; }
        .btn-erase { font-size: 12px; font-weight: 800; color: var(--br-muted); letter-spacing: 2px; }
        
        .action-group { display: flex; gap: 15px; align-items: center; }
        .btn-nav { width: 60px; height: 60px; border-radius: 20px; border: 1px solid var(--br-border); font-size: 20px; background: #FFF; cursor: pointer; }
        .btn-core { height: 60px; padding: 0 35px; border-radius: 20px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
        .btn-record { background: #FFF; color: var(--br-charcoal); border: 1px solid var(--br-border); }
        .btn-record .dot { width: 10px; height: 10px; background: var(--br-error); border-radius: 50%; opacity: 0; }
        .btn-record.recording { background: #FFF0F0; color: var(--br-error); border-color: #FADBD8; }
        .btn-record.recording .dot { opacity: 1; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .btn-submit { background: var(--br-charcoal); color: #FFF; }
        .btn-submit:hover { background: var(--br-green); }

        /* [AI Teacher Panel] */
        .ai-panel { position: absolute; top: 0; right: -450px; width: 420px; height: 100%; background: #FFF; box-shadow: -10px 0 30px rgba(0,0,0,0.05); z-index: 2000; transition: 0.6s var(--ease-lux); display: flex; flex-direction: column; border-left: 1px solid var(--br-border); }
        .ai-panel.open { right: 0; }
        .ai-header { padding: 30px; background: var(--br-ai); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--br-border); }
        .ai-title { font-size: 16px; font-weight: 900; color: var(--br-green); }
        
        .ai-content { padding: 30px; flex: 1; overflow-y: auto; }
        
        /* AI Analytics UI */
        .analytics-box { background: #FAFAFA; border: 1px solid var(--br-border); border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .analytics-title { font-size: 11px; font-weight: 800; color: var(--br-muted); letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        
        .stat-row { margin-bottom: 15px; }
        .stat-label { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-bar-bg { width: 100%; height: 8px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--br-gold); width: 0%; transition: width 1.5s var(--ease-lux); }
        
        .visual-intent { font-size: 13px; background: #FFF; padding: 15px; border-radius: 10px; border: 1px dashed var(--br-border); margin-top: 15px; line-height: 1.6; }

        .ai-bubble { background: #F8F9FA; padding: 25px; border-radius: 20px; border-bottom-left-radius: 5px; border: 1px solid var(--br-border); font-size: 15px; line-height: 1.7; font-weight: 500; }
        
        /* Audio Player hidden */
        audio { display: none; }
    </style>
</head>
<body>

    <!-- 1. Student Auth Modal -->
    <div class="auth-overlay" id="auth-modal">
        <div class="auth-box">
            <div class="auth-logo">Bridge<span>Academy</span></div>
            <div class="auth-desc">프리미엄 탐구 랩에 오신 것을 환영합니다.<br>학생의 영어 이름을 입력해 주세요.</div>
            <input type="text" id="student-name-input" class="auth-input" placeholder="e.g. Olivia" autocomplete="off" onkeypress="if(event.key === 'Enter') AppCore.login()">
            <button class="auth-btn" onclick="AppCore.login()">ENTER LAB</button>
        </div>
    </div>

    <!-- 2. Main App -->
    <div class="app-container" id="main-app">
        
        <nav class="sidebar">
            <div class="sidebar-header" onclick="location.href='index.html'">
                <div class="brand-logo">Bridge<span>Academy</span></div>
            </div>
            <div class="student-profile">
                <div class="profile-avatar" id="avatar-char">S</div>
                <div class="profile-info">
                    <span class="profile-name" id="display-student-name">Student</span>
                    <span class="profile-role">Bridge Inquirer</span>
                </div>
            </div>
            <div class="nav-list" id="nav-list"></div>
        </nav>

        <div class="workspace">
            <div class="top-bar">
                <div>
                    <div id="unit-info" class="unit-info">UNIT LOADING...</div>
                    <div id="page-info" class="page-info">Inquiry P.01</div>
                </div>
                <div class="soundscape-ui" id="soundscape-btn" onclick="AmbientEngine.toggle()">
                    🎵 Soundscape: OFF
                </div>
            </div>

            <main class="stage-wrapper">
                <div class="canvas-container">
                    <img src="" id="worksheet-img" crossorigin="anonymous">
                    <canvas id="draw-layer"></canvas>
                    
                    <!-- Dynamic Hint Overlay -->
                    <div class="scaffolding-hint" id="scaffold-hint">
                        <div class="hint-icon">💡</div>
                        <div class="hint-text" id="hint-text">Let's try drawing your favorite part!</div>
                    </div>
                </div>
            </main>

            <div class="bottom-dock">
                <div class="tool-group">
                    <div class="color-preview" id="btn-color"></div>
                    <input type="color" id="native-color-picker" style="opacity:0; position:absolute; width:1px; height:1px;">
                    <input type="range" class="brush-slider" id="brush-size" min="2" max="30" value="6">
                    <button class="btn-erase" onclick="CanvasEngine.clear()">ERASE ALL</button>
                </div>
                
                <div class="action-group">
                    <button class="btn-nav" onclick="PageEngine.move(-1)">◀</button>
                    <button class="btn-core btn-record" id="btn-record" onclick="AudioEngine.toggle()">
                        <div class="dot"></div> <span id="record-text">Audio Log</span>
                    </button>
                    <button class="btn-core btn-submit" onclick="AITutor.submitWork()">Submit ✨</button>
                    <button class="btn-nav" onclick="PageEngine.move(1)">▶</button>
                </div>
            </div>
        </div>

        <!-- AI Teacher Panel -->
        <div class="ai-panel" id="ai-panel">
            <div class="ai-header">
                <div class="ai-title">Bridge AI Tutor</div>
                <button onclick="AITutor.close()" style="font-size:24px; color:#888;">×</button>
            </div>
            <div class="ai-content" id="ai-content">
                <!-- AI Content Injected Here -->
            </div>
        </div>

        <!-- Ambient Audio Elements -->
        <audio id="bgm-ambient" loop crossorigin="anonymous"></audio>
    </div>

    <!-- ======================================================================
         [Enterprise JavaScript Architecture V45.0]
         ====================================================================== -->
    <script>
        /**
         * [System Core]
         */
        const CONFIG = {
            GITHUB_ID: "eunbeenlee", 
            REPO: "bridge-heritage",
            get STORAGE() { return `https://${this.GITHUB_ID}.github.io/${this.REPO}/assets/`; },
            SOUNDSCAPES: {
                "A": "https://cdn.freesound.org/previews/407/407519_5121236-lq.mp3", // Foundation (Nature/Calm)
                "B": "https://cdn.freesound.org/previews/515/515822_10984905-lq.mp3", // Perspective (Water/Sea)
                "C": "https://cdn.freesound.org/previews/360/360322_5121236-lq.mp3", // Exploration (Jungle)
                "D": "https://cdn.freesound.org/previews/333/333333_5121236-lq.mp3"  // Innovation (Space/Synth) - Placeholders
            }
        };

        const STATE = {
            studentName: "Student",
            id: new URLSearchParams(window.location.search).get('id') || "A-1",
            currentPage: 1,
            isRecording: false,
            scaffoldTimer: null
        };

        /**
         * [App Initializer & Auth]
         */
        const AppCore = {
            login() {
                const nameInput = document.getElementById('student-name-input').value.trim();
                if(nameInput) {
                    STATE.studentName = nameInput;
                    document.getElementById('display-student-name').innerText = nameInput;
                    document.getElementById('avatar-char').innerText = nameInput.charAt(0).toUpperCase();
                    
                    // Hide Modal & Show App
                    document.getElementById('auth-modal').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('auth-modal').style.display = 'none';
                        document.getElementById('main-app').style.opacity = '1';
                        
                        // Initialize Modules
                        PageEngine.init();
                        CanvasEngine.init();
                        AmbientEngine.init();
                    }, 500);
                } else {
                    alert("이름을 입력해 주세요.");
                }
            }
        };

        /**
         * [Page Navigation]
         */
        const PageEngine = {
            init() {
                document.getElementById('unit-info').innerText = `MASTER LAB: ${STATE.id}`;
                const list = document.getElementById('nav-list');
                for(let i=1; i<=17; i++) {
                    const item = document.createElement('div');
                    item.className = 'nav-item'; item.id = `nav-${i}`;
                    item.innerHTML = `<span class="nav-title">Inquiry Entry</span> <span class="nav-badge">P.${String(i).padStart(2,'0')}</span>`;
                    item.onclick = () => this.load(i);
                    list.appendChild(item);
                }
            },
            load(n) {
                STATE.currentPage = n;
                const seriesChar = STATE.id.charAt(0);
                const imgPath = `${CONFIG.STORAGE}${seriesChar}/${STATE.id}/${STATE.id}-${n}.png`;
                
                const img = document.getElementById('worksheet-img');
                img.src = imgPath;
                img.onload = () => {
                    img.style.opacity = '1';
                    CanvasEngine.sync();
                    ScaffoldingEngine.reset(); // 페이지 로드 시 힌트 타이머 시작
                };

                document.getElementById('page-info').innerText = `Inquiry P.${String(n).padStart(2,'0')}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${n}`);
                if(activeNav) activeNav.classList.add('active');
                
                CanvasEngine.clear();
                AITutor.close();
            },
            move(dir) {
                const t = STATE.currentPage + dir;
                if(t >= 1 && t <= 17) this.load(t);
            }
        };

        /**
         * [Precision Canvas Engine & Haptics Fix]
         */
        const CanvasEngine = {
            isDrawing: false,
            init() {
                this.cvs = document.getElementById('draw-layer');
                this.ctx = this.cvs.getContext('2d');
                this.img = document.getElementById('worksheet-img');
                
                // Native Color Picker Link
                document.getElementById('btn-color').onclick = () => document.getElementById('native-color-picker').click();
                document.getElementById('native-color-picker').onchange = (e) => {
                    document.getElementById('btn-color').style.background = e.target.value;
                    this.ctx.strokeStyle = e.target.value;
                };

                this.bind();
            },
            bind() {
                // 핵심 픽스: 좌표계를 캔버스의 실제 해상도와 화면 표시 해상도 비율로 계산
                const getPos = (e) => {
                    const rect = this.cvs.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    // Scale x/y to match actual canvas internal size
                    const scaleX = this.cvs.width / rect.width;
                    const scaleY = this.cvs.height / rect.height;
                    return {
                        x: (clientX - rect.left) * scaleX,
                        y: (clientY - rect.top) * scaleY
                    };
                };

                const start = (e) => {
                    this.isDrawing = true;
                    ScaffoldingEngine.stop(); // 그리기 시작하면 힌트 숨김
                    const p = getPos(e);
                    this.ctx.beginPath();
                    this.ctx.moveTo(p.x, p.y);
                };

                const move = (e) => {
                    if(!this.isDrawing) return;
                    if(e.cancelable) e.preventDefault();
                    const p = getPos(e);
                    this.ctx.lineTo(p.x, p.y);
                    this.ctx.stroke();
                };

                const stop = () => {
                    if(this.isDrawing) {
                        this.isDrawing = false;
                        HapticEngine.trigger('light'); // 그리기 완료 시 가벼운 진동
                    }
                };

                this.cvs.onmousedown = start; this.cvs.onmousemove = move; window.onmouseup = stop;
                this.cvs.ontouchstart = start; this.cvs.ontouchmove = move; window.ontouchend = stop;

                document.getElementById('brush-size').oninput = (e) => this.ctx.lineWidth = e.target.value;
            },
            sync() {
                // 해상도 왜곡 방지를 위해 이미지의 렌더링된 크기 기반 설정
                const rect = this.img.getBoundingClientRect();
                // 캔버스 내부 해상도를 이미지 화면 크기와 1:1로 맞춤 (DPR 제거하여 오차 방지)
                this.cvs.width = rect.width;
                this.cvs.height = rect.height;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.ctx.strokeStyle = document.getElementById('native-color-picker').value || "#363431";
                this.ctx.lineWidth = document.getElementById('brush-size').value;
            },
            clear() {
                this.ctx.clearRect(0, 0, this.cvs.width, this.cvs.height);
                this.ctx.beginPath();
                HapticEngine.trigger('light');
                ScaffoldingEngine.reset();
            }
        };

        /**
         * [Dynamic Scaffolding Engine]
         */
        const ScaffoldingEngine = {
            hintEl: document.getElementById('scaffold-hint'),
            reset() {
                this.stop();
                this.hintEl.classList.remove('show');
                // 15초 동안 캔버스에 액션이 없으면 힌트 표시 (데모용 15초, 실제 60초)
                STATE.scaffoldTimer = setTimeout(() => {
                    this.hintEl.classList.add('show');
                }, 15000); 
            },
            stop() {
                clearTimeout(STATE.scaffoldTimer);
                this.hintEl.classList.remove('show');
            }
        };

        /**
         * [Ambient Soundscape Engine]
         */
        const AmbientEngine = {
            isPlaying: false,
            audio: document.getElementById('bgm-ambient'),
            init() {
                const seriesChar = STATE.id.charAt(0);
                this.audio.src = CONFIG.SOUNDSCAPES[seriesChar] || CONFIG.SOUNDSCAPES["A"];
                this.audio.volume = 0.2;
            },
            toggle() {
                const btn = document.getElementById('soundscape-btn');
                if(!this.isPlaying) {
                    this.audio.play().catch(e => console.log("Audio play blocked by browser"));
                    this.isPlaying = true;
                    btn.classList.add('active');
                    btn.innerText = "🎵 Soundscape: ON";
                } else {
                    this.audio.pause();
                    this.isPlaying = false;
                    btn.classList.remove('active');
                    btn.innerText = "🎵 Soundscape: OFF";
                }
            }
        };

        /**
         * [Haptic Feedback Engine]
         */
        const HapticEngine = {
            trigger(type) {
                if(navigator.vibrate) {
                    if(type === 'light') navigator.vibrate(20);
                    if(type === 'heavy') navigator.vibrate([30, 50, 30]);
                }
            }
        };

        /**
         * [Audio Recording Simulation]
         */
        const AudioEngine = {
            toggle() {
                const btn = document.getElementById('btn-record');
                const text = document.getElementById('record-text');
                if(!STATE.isRecording) {
                    STATE.isRecording = true;
                    btn.classList.add('recording');
                    text.innerText = "Recording...";
                    HapticEngine.trigger('light');
                } else {
                    STATE.isRecording = false;
                    btn.classList.remove('recording');
                    text.innerText = "Audio Log";
                    HapticEngine.trigger('heavy');
                }
            }
        };

        /**
         * [Socratic AI Tutor Engine]
         */
        const AITutor = {
            submitWork() {
                HapticEngine.trigger('heavy');
                ScaffoldingEngine.stop();
                
                const panel = document.getElementById('ai-panel');
                const content = document.getElementById('ai-content');
                panel.classList.add('open');
                
                // Analysis Loading UI
                content.innerHTML = `
                    <div style="text-align:center; padding: 40px 0;">
                        <div class="loader-ring" style="border-top-color:var(--br-gold); width:40px; height:40px; margin: 0 auto 20px;"></div>
                        <p style="font-size:13px; color:var(--br-muted); font-weight:700; letter-spacing:2px;">ANALYZING INQUIRY DATA...</p>
                    </div>
                `;

                // Generate Response after 1.5s
                setTimeout(() => {
                    const confidenceLvl = Math.floor(Math.random() * 20) + 75; // 75~95%
                    const isAudioUsed = document.getElementById('record-text').innerText === "Audio Log" && STATE.isRecording === false; // Simplified check
                    
                    // Socratic Question based on unit
                    let question = `Why do you think the caterpillar was so hungry, ${STATE.studentName}?`;
                    if(STATE.id.startsWith("B")) question = `Where in the world would you like to build your house, ${STATE.studentName}?`;
                    
                    content.innerHTML = `
                        <div class="analytics-box">
                            <div class="analytics-title">Inquiry Analytics</div>
                            <div class="stat-row">
                                <div class="stat-label"><span>Voice Confidence</span> <span>${confidenceLvl}%</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${confidenceLvl}%;"></div></div>
                            </div>
                            <div class="visual-intent">
                                <b>Visual AI Analysis:</b><br>
                                학생이 그린 패턴에서 강한 호기심이 관찰됩니다. 주제와 연관된 상상력 포인트를 훌륭하게 표현했습니다.
                            </div>
                        </div>
                        <div class="ai-bubble">
                            <b>Hello, ${STATE.studentName}!</b><br><br>
                            I looked at your drawing and listened to your voice. You did a fantastic job exploring this topic.<br><br>
                            <b>${question}</b>
                        </div>
                    `;
                    
                    // Trigger TTS (Web Speech API)
                    this.speak(question);
                    
                }, 1500);
            },
            
            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Stop current speech
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9; // Slightly slower for kids
                    utterance.pitch = 1.1; // Friendly pitch
                    window.speechSynthesis.speak(utterance);
                }
            },
            
            close() {
                document.getElementById('ai-panel').classList.remove('open');
                if('speechSynthesis' in window) window.speechSynthesis.cancel();
            }
        };

        // Window Resize Binding
        window.addEventListener('resize', () => {
            if(document.getElementById('worksheet-img').style.opacity === '1') {
                setTimeout(() => CanvasEngine.sync(), 200);
            }
        });
    </script>
</body>
</html>
