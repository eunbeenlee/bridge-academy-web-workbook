<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 스크롤, 줌 완전 차단 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bridge Academy - Canvas Test</title>
    <style>
        /* 절대 스크롤 방지 */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background: #FCFBF9; touch-action: none;
        }
        
        .app-container {
            display: flex; flex-direction: column; height: 100%; width: 100%;
        }

        /* 1. 상단바 고정 */
        .top-bar { height: 80px; background: #FFF; border-bottom: 1px solid #EEE; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }

        /* 2. 중앙 캔버스 영역 (화면 잘림 방지) */
        .stage-wrapper {
            flex: 1; /* 남는 공간 모두 차지 */
            display: flex; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
            position: relative; overflow: hidden; /* 영역 밖으로 나가는 것 숨김 */
        }

        /* 이미지가 들어갈 액자 역할 */
        .drawing-board {
            position: relative;
            max-width: 100%; max-height: 100%;
            display: inline-block; /* 내용물 크기에 맞춤 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 이미지는 보드 안에서 최대 크기를 넘지 않음 */
        #worksheet-img {
            display: block;
            max-width: 100%; max-height: calc(100vh - 220px); /* 상하단바 높이 제외 */
            width: auto; height: auto;
            pointer-events: none; /* 이미지 자체 터치 방지 */
        }

        /* 캔버스는 무조건 이미지와 동일한 크기로 겹침 */
        #draw-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; touch-action: none; cursor: crosshair;
        }

        /* 3. 하단 도구바 고정 */
        .bottom-dock {
            height: 100px; background: #FFF; border-top: 1px solid #EEE;
            display: flex; justify-content: center; align-items: center; gap: 20px; flex-shrink: 0;
        }

        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <h2>Bridge Academy - Pure Canvas Test</h2>
        </div>

        <div class="stage-wrapper">
            <div class="drawing-board">
                <!-- CORS 문제 방지를 위해 crossorigin 속성 제거 -->
                <img id="worksheet-img" src="https://eunbeenlee.github.io/bridge-heritage/A/A-1/A-1-1.png">
                <canvas id="draw-layer"></canvas>
            </div>
        </div>

        <div class="bottom-dock">
            <input type="color" id="color-picker" value="#363431">
            <input type="range" id="brush-size" min="2" max="30" value="5">
            <button onclick="clearCanvas()">CLEAR ALL</button>
        </div>
    </div>

    <script>
        const cvs = document.getElementById('draw-layer');
        const ctx = cvs.getContext('2d');
        const img = document.getElementById('worksheet-img');
        const colorPicker = document.getElementById('color-picker');
        const brushSize = document.getElementById('brush-size');
        
        let isDrawing = false;

        // 1. 캔버스 해상도 맞추기 (가장 중요)
        function resizeCanvas() {
            // CSS로 정해진 실제 렌더링 크기를 가져옴
            const rect = img.getBoundingClientRect();
            if (rect.width === 0) return;

            // 캔버스 내부 픽셀을 실제 렌더링 크기와 일치시킴
            cvs.width = rect.width;
            cvs.height = rect.height;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        // 이미지가 로드되면 캔버스 크기 맞춤
        img.onload = resizeCanvas;
        // 창 크기가 변해도 캔버스 크기 다시 맞춤
        window.addEventListener('resize', resizeCanvas);

        // 2. 터치/마우스 이벤트 (가장 원초적이고 안전한 방식)
        function getPos(e) {
            const rect = cvs.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // 해상도 1:1 매칭이므로 복잡한 계산 없이 바로 사용
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startPosition(e) {
            e.preventDefault(); // 스크롤 방지
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            
            // 그리기 시작할 때마다 색상과 두께 갱신
            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = brushSize.value;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // 스크롤 방지
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endPosition(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
        }

        // 마우스 이벤트
        cvs.addEventListener('mousedown', startPosition, { passive: false });
        cvs.addEventListener('mousemove', draw, { passive: false });
        window.addEventListener('mouseup', endPosition);

        // 터치 이벤트 (패드, 스마트폰)
        cvs.addEventListener('touchstart', startPosition, { passive: false });
        cvs.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', endPosition, { passive: false });

        function clearCanvas() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
        }
    </script>
</body>
</html>
